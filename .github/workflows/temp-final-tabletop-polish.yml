name: Temporary final tabletop polish

on:
  push:
    branches:
      - chatgpt/final-tabletop-rules-20260904
    paths:
      - .github/workflows/temp-final-tabletop-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/final-tabletop-rules-20260904
          fetch-depth: 0

      - name: Polish inserted blocks and verify
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_between(text, start_marker, end_marker, replacement, label):
              start = text.find(start_marker)
              end = text.find(end_marker, start + len(start_marker))
              if start < 0 or end < 0:
                  raise SystemExit(f"{label}: markers not found")
              return text[:start] + replacement + text[end:]

          action_path = Path("action-panel.js")
          action = action_path.read_text(encoding="utf-8")

          catalog = '''  const WARLOCK_CUSTOM_OPTIONS = Object.freeze([
            {
              id: "arcane-recovery",
              mode: "action",
              level: 2,
              label: "等級 2：秘法回流",
              description: "你進行 1 分鐘儀式，回復 1 個已消耗的法術位，長休後恢復。"
            },
            {
              id: "dark-ones-own-luck",
              mode: "action",
              level: 6,
              label: "等級 6：黑暗強運（邪魔子職）",
              description: "當你進行屬性檢定或豁免檢定時，可以使用該特性將1d10加到擲骰結果中。你可以在看到擲骰結果後、結果生效前使用該特性。\\n\\n你可以使用該特性的次數等同於你的魅力調整值（至少一次），但每次擲骰只能使用一次。完成長休時，你恢復所有已消耗的使用次數。"
            }
          ]);

          const WARLOCK_CURATED_FEATURE_LABELS = new Set([
            ...WARLOCK_CUSTOM_OPTIONS.map(option => option.label),
            "秘法回流",
            "黑暗強運",
            "黑暗強運（邪魔子職）"
          ]);

          const WIZARD_CUSTOM_OPTIONS = Object.freeze([
            {
              id: "potent-cantrip",
              mode: "action",
              level: 3,
              label: "等級 3：強力戲法（塑能子職）",
              description: "當你對生物施放會造成傷害的戲法時：\\n\\n- 若攻擊檢定失手，或\\n- 目標在該戲法豁免成功，\\n- 目標仍會受到一半傷害（若該戲法有傷害），但不受其他效果影響。"
            },
            {
              id: "memorize-spell",
              mode: "action",
              level: 5,
              label: "等級 5：記憶法術",
              description: "每次短休後，你可研讀法術書。\\n\\n你可把 1 個由「施法」特性準備中的 1+環法師法術，替換成法術書中的另一個 1+環法師法術。"
            },
            {
              id: "sculpt-spells",
              mode: "action",
              level: 6,
              label: "等級 6：法術塑形（塑能子職）",
              description: "當你施展會影響你所能看見之其他生物的塑能系法術時，可以從中選擇1＋該法術環階名生物。所選生物對抗該法術的豁免檢定自動成功，且不會受到通常在豁免成功時仍會承受的一半傷害。"
            }
          ]);

          const WIZARD_CURATED_FEATURE_LABELS = new Set([
            ...WIZARD_CUSTOM_OPTIONS.map(option => option.label),
            "強力戲法",
            "強力戲法（塑能子職）",
            "記憶法術",
            "法術塑形",
            "法術塑形（塑能子職）"
          ]);

          '''
          action = replace_between(
              action,
              '  const WARLOCK_CUSTOM_OPTIONS = Object.freeze([',
              '  const BARBARIAN_CUSTOM_OPTIONS = Object.freeze([',
              catalog,
              "catalog formatting"
          )

          providers = '''  function getWarlockCustomEntries(mode) {
            if (document.getElementById("class")?.value !== "warlock") return [];
            const level = getCharacterLevel();
            return WARLOCK_CUSTOM_OPTIONS
              .filter(option => option.mode === mode && level >= option.level)
              .map(option => ({
                ...option,
                key: `dynamic-${mode}-warlock-curated-${option.id}`,
                source: FEATURE_SOURCE_LABELS.class,
                dynamic: true
              }));
          }

          function getWizardCustomEntries(mode) {
            if (document.getElementById("class")?.value !== "wizard") return [];
            const level = getCharacterLevel();
            return WIZARD_CUSTOM_OPTIONS
              .filter(option => option.mode === mode && level >= option.level)
              .map(option => ({
                ...option,
                key: `dynamic-${mode}-wizard-curated-${option.id}`,
                source: FEATURE_SOURCE_LABELS.class,
                dynamic: true
              }));
          }

          '''
          action = replace_between(
              action,
              '  function getWarlockCustomEntries(mode) {',
              '  function getBarbarianCustomEntries(mode) {',
              providers,
              "provider formatting"
          )
          action_path.write_text(action, encoding="utf-8")

          mode_path = Path("tabletop-mode.js")
          mode = mode_path.read_text(encoding="utf-8")
          helpers = '''  function getWarlockDarkOnesBlessingOverviewEntry() {
            const selectedClass = document.getElementById("class")?.value || "";
            const characterLevel = Number.parseInt(document.getElementById("level")?.value || "", 10) || 0;
            if (selectedClass !== "warlock" || characterLevel < 3) return null;
            const rawCharisma = String(document.getElementById("cha")?.value || "").trim();
            const charismaModifier = rawCharisma ? globalScope.calculateAbilityModifier?.(rawCharisma) : 0;
            const temporaryHp = Math.max(1, characterLevel + (Number.isFinite(charismaModifier) ? charismaModifier : 0));
            return {
              label: "黑暗之賜",
              detail: `在你 10 呎內的敵對生物生命值降到 0 時，你獲得 ${temporaryHp} 點臨時生命值（至少 1）。`
            };
          }

          function getSorcererElementalAffinitySpellEntry() {
            const selectedClass = document.getElementById("class")?.value || "";
            const characterLevel = Number.parseInt(document.getElementById("level")?.value || "", 10) || 0;
            if (selectedClass !== "sorcerer" || characterLevel < 6) return null;
            const damageTypeSelect = document.getElementById("sorcerer-elemental-affinity-damage-type");
            if (!damageTypeSelect?.value) return null;
            const damageType = String(damageTypeSelect.selectedOptions?.[0]?.textContent || "").trim();
            if (!damageType) return null;
            const rawCharisma = String(document.getElementById("cha")?.value || "").trim();
            const charismaModifier = rawCharisma ? globalScope.calculateAbilityModifier?.(rawCharisma) : 0;
            const bonus = Number.isFinite(charismaModifier) ? charismaModifier : 0;
            const signedBonus = bonus >= 0 ? `+${bonus}` : String(bonus);
            return {
              label: "元素親和",
              detail: `施展${damageType}類型法術時，可 ${signedBonus} 點傷害。`
            };
          }

          '''
          mode = replace_between(
              mode,
              '  function getWarlockDarkOnesBlessingOverviewEntry() {',
              '  function getCharacterDefenseEntries() {',
              helpers,
              "summary helper formatting"
          )
          mode_path.write_text(mode, encoding="utf-8")
          PY

          node --check action-panel.js
          node --check tabletop-mode.js
          git diff --check

          python3 <<'PY'
          from pathlib import Path
          action = Path("action-panel.js").read_text(encoding="utf-8")
          mode = Path("tabletop-mode.js").read_text(encoding="utf-8")
          assertions = {
              "warlock level gate": 'level: 2,\n      label: "等級 2：秘法回流"' in action,
              "warlock luck level gate": 'level: 6,\n      label: "等級 6：黑暗強運（邪魔子職）"' in action,
              "wizard level 3 gate": 'level: 3,\n      label: "等級 3：強力戲法（塑能子職）"' in action,
              "wizard level 5 gate": 'level: 5,\n      label: "等級 5：記憶法術"' in action,
              "wizard level 6 gate": 'level: 6,\n      label: "等級 6：法術塑形（塑能子職）"' in action,
              "paladin skills gate": 'selectedClass === "paladin" && characterLevel >= 6' in mode,
              "warlock temp hp floor": 'Math.max(1, characterLevel + (Number.isFinite(charismaModifier) ? charismaModifier : 0))' in mode,
              "sorcerer select source": 'document.getElementById("sorcerer-elemental-affinity-damage-type")' in mode,
              "sorcerer numeric charisma": 'const signedBonus = bonus >= 0 ? `+${bonus}` : String(bonus);' in mode,
          }
          failed = [name for name, ok in assertions.items() if not ok]
          if failed:
              raise SystemExit("failed assertions: " + ", ".join(failed))
          PY

          if [ "$(git diff --name-only | sort | tr '\n' ' ')" != "action-panel.js tabletop-mode.js " ]; then
            echo "Unexpected changed files:" >&2
            git diff --name-only >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action-panel.js tabletop-mode.js
          git commit -m "Polish final tabletop class rules"
          git push origin HEAD:chatgpt/final-tabletop-rules-20260904
