# 網站上線：push 到 main（或手動執行）時，產生網站需要的檔案並部署 GitHub Pages。
# 回歸測試在本機推送前完成，這裡不重複執行。
# - class-content.generated.js（職業資料）與 twD20-offline.html（離線角色卡）是衍生產物，不在 repo 裡，由這裡產生。
# - 內容檔有錯時 npm run build 會失敗，不會部署，正式站維持上一個版本。
# - 發布內容為此 commit 的 repo 檔案加上產生的檔案，以 GitHub Pages 原本使用的 Jekyll 建置。
name: 網站上線

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 產生網站檔案
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: 安裝套件
        run: npm ci

      - name: 產生職業資料（並更新 index.html 的快取版本）
        run: npm run build -- --stamp-version

      - name: 產生離線角色卡
        shell: pwsh
        run: ./build-offline-nopdf.ps1

      - name: 準備發布內容
        run: |
          mkdir -p _publish
          git archive HEAD | tar -x -C _publish
          cp index.html class-content.generated.js twD20-offline.html _publish/

      - name: Jekyll 建置（與 GitHub Pages 分支發布相同）
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_publish
          destination: ./_site

      - name: 上傳發布內容
        uses: actions/upload-pages-artifact@v4

  deploy:
    name: 部署 GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
