name: Temporary Rogue tabletop verification

on:
  push:
    branches:
      - chatgpt/rogue-tabletop-20260904
    paths:
      - .github/workflows/temp-rogue-tabletop.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/rogue-tabletop-20260904
          fetch-depth: 0

      - name: Polish Rogue helpers and verify behavior
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 anchor, found {count}")
              return text.replace(old, new, 1)

          action_path = Path("action-panel.js")
          action = action_path.read_text(encoding="utf-8")
          old = '''  function getRogueSneakAttackDescription() {
          const level = getCharacterLevel();
          const sneakAttackDice = Math.max(1, Math.ceil(level / 2));
          const base = `你每回合可用靈巧或遠程武器觸發 1 次偷襲，造成額外 ${sneakAttackDice}d6 傷害。

          偷襲必須滿足以下條件其中之一：

          - 這次攻擊有優勢，或
          - 目標 5 呎內有至少 1 名未失能的友方，且你的攻擊沒有劣勢。`;
          if (level < 5) return base;
          const dexterityModifier = getAbilityModifier("dex") ?? 0;
          const saveDc = 8 + getProficiencyBonus() + dexterityModifier;
          return `${base}

          等級 5：靈巧打擊

          當你造成偷襲傷害時，可套用 1 種靈巧打擊效果。

          每種效果都要先放棄部分偷襲傷害骰；若需要豁免，DC = ${saveDc}。

          淬毒（消耗 1d6）：目標體質豁免失敗則中毒 1 分鐘；其每回合結束可再豁免，成功即結束。使用此效果時你需攜帶制毒師工具。
          摔絆（消耗 1d6）：大型或更小目標敏捷豁免失敗則倒地。
          撤步（消耗 1d6）：攻擊後你可立刻移動至多一半速度，且不引發藉機攻擊。`;
        }

          function getBarbarianRageDamageBonus() {'''
          # The prior workflow inserted this helper with its body at column 1; normalize only that exact block.
          if old not in action:
              old = '''  function getRogueSneakAttackDescription() {
          const level = getCharacterLevel();
          const sneakAttackDice = Math.max(1, Math.ceil(level / 2));
          const base = `你每回合可用靈巧或遠程武器觸發 1 次偷襲，造成額外 ${sneakAttackDice}d6 傷害。

          偷襲必須滿足以下條件其中之一：

          - 這次攻擊有優勢，或
          - 目標 5 呎內有至少 1 名未失能的友方，且你的攻擊沒有劣勢。`;
          if (level < 5) return base;
          const dexterityModifier = getAbilityModifier("dex") ?? 0;
          const saveDc = 8 + getProficiencyBonus() + dexterityModifier;
          return `${base}

          等級 5：靈巧打擊

          當你造成偷襲傷害時，可套用 1 種靈巧打擊效果。

          每種效果都要先放棄部分偷襲傷害骰；若需要豁免，DC = ${saveDc}。

          淬毒（消耗 1d6）：目標體質豁免失敗則中毒 1 分鐘；其每回合結束可再豁免，成功即結束。使用此效果時你需攜帶制毒師工具。
          摔絆（消耗 1d6）：大型或更小目標敏捷豁免失敗則倒地。
          撤步（消耗 1d6）：攻擊後你可立刻移動至多一半速度，且不引發藉機攻擊。`;
        }

          function getBarbarianRageDamageBonus() {'''
          # Use brace-delimited extraction instead of relying on whitespace from YAML rendering.
          start = action.index('  function getRogueSneakAttackDescription() {')
          end = action.index('  function getBarbarianRageDamageBonus() {', start)
          polished = '''  function getRogueSneakAttackDescription() {
            const level = getCharacterLevel();
            const sneakAttackDice = Math.max(1, Math.ceil(level / 2));
            const base = `你每回合可用靈巧或遠程武器觸發 1 次偷襲，造成額外 ${sneakAttackDice}d6 傷害。

          偷襲必須滿足以下條件其中之一：

          - 這次攻擊有優勢，或
          - 目標 5 呎內有至少 1 名未失能的友方，且你的攻擊沒有劣勢。`;
            if (level < 5) return base;
            const dexterityModifier = getAbilityModifier("dex") ?? 0;
            const saveDc = 8 + getProficiencyBonus() + dexterityModifier;
            return `${base}

          等級 5：靈巧打擊

          當你造成偷襲傷害時，可套用 1 種靈巧打擊效果。

          每種效果都要先放棄部分偷襲傷害骰；若需要豁免，DC = ${saveDc}。

          淬毒（消耗 1d6）：目標體質豁免失敗則中毒 1 分鐘；其每回合結束可再豁免，成功即結束。使用此效果時你需攜帶制毒師工具。
          摔絆（消耗 1d6）：大型或更小目標敏捷豁免失敗則倒地。
          撤步（消耗 1d6）：攻擊後你可立刻移動至多一半速度，且不引發藉機攻擊。`;
          }

          '''
          action = action[:start] + polished + action[end:]

          start = action.index('  function getRogueCustomEntries(mode) {')
          end = action.index('  function getBarbarianCustomEntries(mode) {', start)
          polished_entries = '''  function getRogueCustomEntries(mode) {
            if (document.getElementById("class")?.value !== "rogue") return [];
            const level = getCharacterLevel();
            return ROGUE_CUSTOM_OPTIONS
              .filter(option => option.mode === mode && level >= option.level)
              .map(option => ({
                ...option,
                key: `dynamic-${mode}-rogue-curated-${option.id}`,
                source: FEATURE_SOURCE_LABELS.class,
                description: typeof option.description === "function" ? option.description() : option.description,
                dynamic: true
              }));
          }

          '''
          action = action[:start] + polished_entries + action[end:]
          action_path.write_text(action, encoding="utf-8")

          mode_path = Path("tabletop-mode.js")
          mode = mode_path.read_text(encoding="utf-8")
          start = mode.index('  function getRogueUncannyDodgeOverviewEntry() {')
          end = mode.index('  function getCharacterDefenseEntries() {', start)
          polished_mode = '''  function getRogueUncannyDodgeOverviewEntry() {
            const selectedClass = document.getElementById("class")?.value || "";
            const characterLevel = Number.parseInt(document.getElementById("level")?.value || "", 10) || 0;
            if (selectedClass !== "rogue" || characterLevel < 5) return null;
            return {
              label: "直覺閃避",
              detail: "當你看見攻擊者命中你時，可用反應讓傷害減半（捨去小數）。"
            };
          }

          function getRogueReliableTalentEntry() {
            const selectedClass = document.getElementById("class")?.value || "";
            const characterLevel = Number.parseInt(document.getElementById("level")?.value || "", 10) || 0;
            if (selectedClass !== "rogue" || characterLevel < 7) return null;
            return {
              label: "可靠才能",
              detail: "當你使用有熟練的技能或工具進行屬性檢定時，可以將d20骰中9或以下的結果視為10。"
            };
          }

          '''
          mode = mode[:start] + polished_mode + mode[end:]
          mode_path.write_text(mode, encoding="utf-8")
          PY

          node --check action-panel.js
          node --check tabletop-mode.js
          git diff --check

          python3 <<'PY'
          from pathlib import Path
          import re

          action = Path("action-panel.js").read_text(encoding="utf-8")
          mode = Path("tabletop-mode.js").read_text(encoding="utf-8")

          # Level matrix for SRD Rogue 1–8.
          expected_dice = {1:1, 2:1, 3:2, 4:2, 5:3, 6:3, 7:4, 8:4}
          for level, dice in expected_dice.items():
              actual = max(1, (level + 1) // 2)
              assert actual == dice, (level, actual, dice)
              assert (level >= 3) == (level in range(3, 9))
              assert (level >= 5) == (level in range(5, 9))
              assert (level >= 7) == (level in range(7, 9))

          # Dynamic Cunning Strike DC examples using the existing project progression.
          def proficiency(level):
              return 3 if level >= 5 else 2
          def modifier(score):
              return (score - 10) // 2
          assert 8 + proficiency(5) + modifier(16) == 14
          assert 8 + proficiency(5) + modifier(18) == 15

          required_action = [
              'label: "等級 1：偷襲"',
              'label: "等級 3：快手"',
              'label: "等級 3：手穩就準"',
              '等級 5：靈巧打擊',
              'const dexterityModifier = getAbilityModifier("dex") ?? 0;',
              'const saveDc = 8 + getProficiencyBonus() + dexterityModifier;',
              '.filter(entry => selectedClass !== "rogue" || !ROGUE_CURATED_FEATURE_LABELS.has(entry.label))',
          ]
          for needle in required_action:
              assert needle in action, needle
          assert action.count('id: "sneak-attack"') == 1
          assert action.count('id: "fast-hands"') == 1
          assert action.count('id: "steady-aim"') == 1
          assert 'mode: "action",\n      level: 1,\n      label: "等級 1：偷襲"' in action
          assert 'mode: "bonus",\n      level: 3,\n      label: "等級 3：快手"' in action
          assert 'mode: "bonus",\n      level: 3,\n      label: "等級 3：手穩就準"' in action

          assert 'label: "直覺閃避"' in mode
          assert 'selectedClass !== "rogue" || characterLevel < 5' in mode
          assert 'label: "可靠才能"' in mode
          assert 'selectedClass !== "rogue" || characterLevel < 7' in mode

          # Parser core declarations remain present; Rogue only adds an entry filter.
          assert action.count('function extractTimedFeatureEntries(raw, mode, source)') == 1
          assert action.count('const timingPattern = mode === "bonus"') == 1
          PY

          if git diff --quiet -- action-panel.js tabletop-mode.js; then
            echo "No formatting changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action-panel.js tabletop-mode.js
          git commit -m "Polish Rogue tabletop helpers"
          git push origin HEAD:chatgpt/rogue-tabletop-20260904
