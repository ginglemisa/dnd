# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: wand-of-magic-missiles
name: 魔法飛彈魔杖
nameEn: "Wand of Magic Missiles"
source: srd
category: wand
rarity: uncommon
attunement: false
use: held
pools:
  - { id: charges, label: 充能, max: 7, recover: dawn, amount: 1d6 + 1 }
text: |-
  這根魔杖有7次充能。手持它時，你可以消耗不超過3次充能，從中施放_魔法飛彈_。消耗1次充能時，你施放該法術的1環版本。每多消耗1次充能，你可以將法術的環階提高1環。

  _恢復充能。_ 魔杖每天黎明恢復1d6 + 1次已消耗的充能。若你消耗魔杖的最後一次充能，擲1d20。擲出1時，魔杖化為灰燼並被摧毀。
