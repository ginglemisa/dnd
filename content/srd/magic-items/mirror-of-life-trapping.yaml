id: mirror-of-life-trapping
name: 攝心魔鏡
nameEn: "Mirror of Life Trapping"
source: srd
category: wondrous
group: tool
rarity: very-rare
attunement: false
weight: 50
text: |-
  當從側面觀看這面高4呎、寬2呎的鏡子時，鏡面會顯現出隱約的生物影像。這面鏡子重50磅，AC 11、HP 10，對毒素與心靈傷害免疫，並對鈍擊傷害易傷。它被降到0生命值時會碎裂並被摧毀。

  若鏡子懸掛在垂直表面上，而你在其5呎內，你可以進行魔法動作並使用命令詞來啟動它。它會持續啟動，直到你進行魔法動作並重複命令詞來關閉它為止。

  除你以外，任何在鏡子30呎內看見自己在已啟動的鏡中倒影的生物，必須成功通過DC 15的魅力豁免，否則連同其穿戴或攜帶的一切，一起被困在鏡子的十二個異次元隔間之一內。知道鏡子本質的生物進行該豁免時具有優勢，構裝生物則自動通過該豁免。

  異次元隔間是一片無盡的空間，充滿使能見度降至10呎的濃霧。被困在鏡中隔間的生物不會老化，也不需要進食、飲水或睡眠。被困在隔間內的生物可以使用允許跨位面旅行的魔法逃脫。否則，該生物會被禁錮在隔間內，直到被釋放為止。

  若鏡子困住了一個生物，但它的十二個異次元隔間都已被佔據，鏡子會隨機釋放一個被困的生物，以容納新的囚犯。被釋放的生物會出現在看得見鏡子的一個未被佔據的空間，且背對著鏡子。若鏡子被打碎，其中所有的生物都會被釋放，並出現在鏡子附近未被佔據的空間。

  在鏡子5呎內時，你可以進行魔法動作，指名一個被困在其中的生物，或喊出某個隔間的編號。被指名的生物或位於被指名隔間內的生物，會以影像的形式出現在鏡面上。你與該生物接著就可以進行溝通。

  以類似的方式，你可以進行魔法動作並使用第二個命令詞，釋放一個被困在鏡中的生物。被釋放的生物連同其財物，會出現在離鏡子最近的未被佔據空間，並背對著鏡子。

  將鏡子放入由_次元袋_、_便攜式次元洞_或類似物品所創造的異次元空間中，會立即摧毀兩件物品，並開啟一道通往星界的通道。該通道的起點就是其中一件物品被放入另一件物品內的位置。任何在通道10呎內且未處於全掩蔽之後的生物，都會被吸進通道，來到星界上的隨機位置。之後通道關閉。該通道只能單向通行，且無法重新開啟。
