# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: sphere-of-annihilation
name: 湮滅法球
nameEn: "Sphere of Annihilation"
source: srd
category: wondrous
group: curio
rarity: legendary
attunement: false
text: |-
  這顆直徑2呎的黑色球體是多元宇宙中的一個洞，懸停在空間中，並由環繞它的魔法力場穩定住。

  球體會抹除它穿過的所有物質，以及穿過它的所有物質。神器是例外。除非神器易受_湮滅法球_的傷害，否則它會毫髮無傷地穿過球體。任何其他接觸球體但未被它完全吞沒並抹除的東西，會受到8d10力場傷害。

  _控制法球。_ _湮滅法球_在有人掌控它之前是靜止不動的。若你在法球60呎內，你可以進行魔法動作，進行一次DC 25的智力（奧秘）檢定。檢定成功時，你控制法球直到你下個回合開始為止；若它原本在另一個生物的控制之下，該生物就失去對法球的控制。檢定失敗時，法球會沿直線朝你移動10呎。

  掌控法球期間，你可以進行附贈動作使它朝你選擇的一個方向移動，距離最多為你智力調整值的5倍呎數（最少5呎）。法球進入其空間的任何生物，必須成功通過DC 19的敏捷豁免，否則會被它觸及，受到8d10力場傷害。因此傷害而降至0點生命值的生物會被抹除，留下它的財物，但沒有其他任何實體遺骸。

  _法球互動。_ 若法球與位面傳送門（例如_異界之門_法術所創造的傳送門）或異次元空間（例如_便攜式次元洞_內的空間）接觸，DM使用下表隨機決定發生什麼事。

  | 1d100 | 結果 |
  | --- | --- |
  | 01–50 | 法球被摧毀。 |
  | 51–85 | 法球穿過傳送門或進入異次元空間。 |
  | 86–00 | 空間裂隙將法球，以及法球180呎內的每個生物與物體，送往一個隨機的位面。 |
