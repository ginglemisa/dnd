actions:
  - { id: haunt, name: 演奏顫慄之曲, type: magic, pool: charges, when: owned, text: 你 30 呎內你選擇的每個生物 DC 15 感知豁免，失敗則恐慌 1 分鐘，每個回合結束時重複豁免；成功的生物 24 小時內免疫。 }
text: |-
  這支笛子有3次充能，每天黎明恢復1d3次已消耗的充能。你可以進行魔法動作演奏它並消耗1次充能，奏出一段詭異而令人著迷的曲調。你選擇的、在你30呎內的每個生物，必須成功通過DC 15的感知豁免，否則陷入恐慌狀態1分鐘。豁免失敗的生物在其每個回合結束時重複進行該豁免，成功則結束其身上的此效果。豁免成功的生物對這支笛子的效果免疫24小時。
