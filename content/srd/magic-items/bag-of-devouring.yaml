id: bag-of-devouring
name: 吞噬袋
nameEn: "Bag of Devouring"
source: srd
category: wondrous
group: container
rarity: very-rare
attunement: false
text: |-
  這個袋子外觀類似_次元袋_，但實際上是一個巨大異次元生物的進食孔口。把袋子內外翻轉可以關閉這個孔口。

  附著在袋子上的異次元生物能感知放入袋中的任何東西。完全放入袋中的動物或植物物質會被吞噬，永遠消失。當活體生物的一部分被放入袋中時（例如有人把手伸進袋裡），該生物有50%的機率被拉進袋中。袋中的生物可以進行一個動作嘗試逃脫，需成功通過DC 15的力量（運動）檢定才能脫身。另一個生物可以進行一個動作，把手伸進袋中將生物拉出來，需成功通過DC 20的力量（運動）檢定，前提是拉人者自己沒有先被拉進袋中。任何在回合開始時身處袋中的生物都會被吞噬，身體被摧毀。

  無生命的物體可以存放在袋中，袋子可以容納1立方呎的此類物質。然而，袋子每天一次會吞下其中所有的物體，並將它們吐到另一個位面。時間與位面由DM決定。

  若袋子被刺穿或撕裂，它就會被摧毀，袋中所有東西會被傳送到星界的隨機地點。
