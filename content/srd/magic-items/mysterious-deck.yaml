  每張牌的效果說明如下。

  _平衡。_ 你可以將你的一項屬性值提高2，上限為22，前提是你同時將另一項屬性值降低2。你無法降低屬性值為5或更低的屬性。或者，你也可以選擇不調整屬性值，此時這張牌沒有效果。

  _彗星。_ 下次你與一個或多個敵對生物進入戰鬥時，你擲先攻時可以選擇其中一個作為你的對頭。若你在該場戰鬥中將你的對頭降到0生命值，你在1年內進行死亡豁免具有優勢。若是其他人將你選定的對頭降到0生命值，或你沒有選擇對頭，這張牌沒有效果。

  _地牢。_ 你消失，並以假死狀態被封禁在一個異次元球體中。你穿戴與攜帶的一切都會隨你消失，唯獨神器除外，神器會留在你消失時所佔據的空間。你會一直被囚禁，直到被人找到並從球體中救出。任何預言魔法都無法定位你，但_祈願術_法術可以揭露你囚牢的位置。你不能再抽牌。

  _歐律阿勒。_ 這張牌上形似梅杜莎的面容詛咒了你。受到這種詛咒期間，你的豁免承受−2懲罰。只有神明或命運牌的魔法能結束這個詛咒。

  _命運。_ 現實的織網鬆開並重新紡織，讓你得以避開或抹除一件事件，彷彿它從未發生。你可以在抽到這張牌時立即使用牌的魔法，或在你死亡之前的任何其他時間使用。

  _烈焰。_ 一名強大的魔鬼成為你的敵人。這名魔鬼謀求你的毀滅並折磨你，在試圖殺死你之前先品味你的痛苦。這種敵對關係會持續到你或這名魔鬼死亡為止。

  _愚者。_ 在接下來的72小時內，你的D20檢定具有劣勢。再抽一張牌；這次抽牌不計入你所宣告的抽牌張數。

  _寶石。_ 二十五件價值各2,000 GP的珠寶，或五十顆價值各1,000 GP的寶石，出現在你的腳邊。

  _弄臣。_ 在接下來的72小時內，你的D20檢定具有優勢，或者你可以在宣告的抽牌張數之外，額外再抽兩張牌。

  _鑰匙。_ 一件你具有熟練的稀有或更高稀有度魔法武器出現在你身上。該武器由DM選擇。

  _騎士。_ 你獲得一名**騎士**的效力，他會神奇地出現在你自身30呎內、由你選擇的一個未被佔據的空間。這名騎士與你陣營相同，並忠誠地為你效力直到死亡，相信你們兩人是被命運牽引到一起的。請與你的DM一同為這名NPC創造名字與背景故事。DM可以依喜好使用不同的數據塊來代表這名騎士。

  _月亮。_ 你獲得施放_祈願術_1d3次的能力。

  _謎題。_ 永久降低你的智力或感知1d4 + 1（最低降到1）。你可以在宣告的抽牌張數之外，額外再抽一張牌。

  _無賴。_ 一名由DM選擇的NPC對你變得敵對。在這名NPC或其他人揭露其身分之前，你不知道他是誰。唯有_祈願術_法術或神明介入，才能結束這名NPC對你的敵意。

  _毀滅。_ 你攜帶或擁有的除魔法物品以外的所有形式財富都會從你身上失去。可攜帶的財產消失。你擁有的商業、建築與土地會以對現實改變最小的方式失去。任何證明你應該擁有被這張牌奪走之物的文件也都會消失。

  _賢者。_ 在抽到這張牌後的一年內，你可以在任何自己選擇的時間，於冥想中提出一個問題，並在心中得到該問題的真實答案。

  _骷髏。_ 一個**死亡化身**（見隨附的數據塊）出現在盡可能靠近你的一個未被佔據的空間。這個化身只以你為攻擊目標，外表是一具身穿破爛黑袍、手持幽靈鐮刀的幽魂骷髏。當化身降到0生命值或你死亡時，化身消失。若你的盟友對化身造成傷害，該盟友就會召喚出另一個**死亡化身**。新的化身出現在盡可能靠近該盟友的一個未被佔據的空間，並只以該盟友為攻擊目標。你與你的盟友每人因這次抽牌只能各召喚一個化身。被化身殺死的生物無法復活。

  _星辰。_ 將你的一項屬性值提高2，上限為24。

  _太陽。_ 一件魔法物品（由DM選擇）出現在你身上。此外，在你死亡之前，你每天黎明獲得10點臨時生命值。

  _利爪。_ 你穿戴或攜帶的每一件魔法物品都會瓦解。你持有的神器則改為消失。

  _王座。_ 你在歷史、洞悉、威嚇或遊說之中，擇一獲得熟練與專精。此外，你合法擁有世界上某處的一座小型城堡。然而，該城堡目前是一個或多個怪物的巢穴，你必須先將它們清除，才能宣告城堡歸你所有。

  _虛空。_ 你的靈魂被從身體中抽離，並被封入DM選擇的某處的一個物體中。一個或多個強大的存在守衛著該處。當你的靈魂以這種方式被困時，你的身體處於無活動狀態、停止老化，且不需要食物、空氣或水。_祈願術_法術無法讓你的靈魂回到身體，但該法術會揭露存放你靈魂之物的位置。你不能再抽牌。

  #### 死亡化身

  _中型不死生物，中立邪惡_

  **AC** 20 **先攻** +3（13）
  **HP** 其召喚者生命值上限的一半
  **速度** 60呎，飛行60呎（懸停）

  |  |  | 調整值 | 豁免 |  |  | 調整值 | 豁免 |  |  | 調整值 | 豁免 |
  | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
  | **力量** | 16 | +3 | +3 | **敏捷** | 16 | +3 | +3 | **體質** | 16 | +3 | +3 |
  | **智力** | 16 | +3 | +3 | **感知** | 16 | +3 | +3 | **魅力** | 16 | +3 | +3 |

  **免疫** 黯蝕、毒素；魅惑、力竭、恐慌、麻痺、石化、中毒、昏迷
  **感官** 真實視覺60呎，被動察覺13
  **語言** 其召喚者所知的所有語言
  **CR** 無（XP 0；PB等同其召喚者的）

  ### 特性

  **_無實體移動。_** 化身可以穿過其他生物與物體，視同穿過困難地形。若它在物體內結束其回合，會受到5（1d10）力場傷害。

  ### 動作

  **_多重攻擊。_** 化身進行的收割鐮刀攻擊次數，等於召喚者熟練加值的一半（無條件進位）。

  **_收割鐮刀。_** _近戰攻擊檢定：_ 自動命中，觸及5呎。 _命中：_ 7（1d8 + 3）揮砍傷害外加4（1d8）黯蝕傷害。
