id: mysterious-deck
name: 神秘牌組
nameEn: "Mysterious Deck"
source: srd
category: wondrous
group: curio
rarity: legendary
attunement: false
text: |-
  這副牌通常存放在盒子或小袋中，內有若干張象牙或羊皮紙製成的牌。這類牌組多數（75%）有十三張牌，但有些有二十二張。隨機決定從牌組中抽到的牌時，使用神秘牌組表中對應的欄位。

  抽牌之前，你必須先宣告打算抽幾張牌，然後隨機抽出。超過這個數量而多抽的牌不會產生效果。除此之外，你一從牌組中抽出一張牌，它的魔法就會生效。你抽每張牌的時間，與前一次抽牌相隔不得超過1小時。若你沒有抽滿所選的張數，剩餘張數的牌會自行從牌組中飛出，並同時生效。

  牌一旦被抽出就會消失。除非那張牌是愚者或弄臣，否則該牌會重新出現在牌組中，因此有可能兩次抽到同一張牌。（愚者或弄臣離開牌組後，若再次抽到該牌，就在表上重擲。）

  **神秘牌組**

  | 1d100（13張牌組） | 1d100（22張牌組） | 牌 |
  | --- | --- | --- |
  | — | 01–05 | 平衡 |
  | — | 06–10 | 彗星 |
  | — | 11–14 | 地牢 |
  | 01–08 | 15–18 | 歐律阿勒 |
  | — | 19–23 | 命運 |
