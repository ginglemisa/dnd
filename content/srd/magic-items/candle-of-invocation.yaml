id: candle-of-invocation
name: 祈神蠟燭
nameEn: "Candle of Invocation"
source: srd
category: wondrous
group: consumable
rarity: very-rare
attunement: true
text: |-
  這根蠟燭的魔法在點燃時啟動，點燃需要進行魔法動作。燃燒4小時後，蠟燭會被摧毀。你可以提前將它熄滅，留待之後使用。以1分鐘為單位，從它的總燃燒時間中扣除已燃燒的時間。

  燃燒期間，蠟燭在半徑30呎內散發微光光照。當你在該光照內時，你在D20檢定上具有優勢。此外，在光照內的牧師或德魯伊可以不消耗法術位，施放其已準備的1環法術。

  或者，當你第一次點燃蠟燭時，可以用它施放_異界之門_。這麼做會摧毀蠟燭。該法術所創造的傳送門連結到由DM選擇或依下表擲骰決定的某個外層位面。

  | 1d100 | 外層位面 | 1d100 | 外層位面 |
  | --- | --- | --- | --- |
  | 01–05 | 深淵 | 55–59 | 葛黑納 |
  | 06–10 | 亞克倫 | 60–64 | 哈迪斯 |
  | 11–17 | 阿堡瑞亞 | 65–69 | 靈薄獄 |
  | 18–25 | 阿卡迪亞 | 70–77 | 機械境 |
  | 26–33 | 獸域 | 78–85 | 天堂山 |
  | 34–41 | 貝托匹亞 | 86–90 | 九層地獄 |
  | 42–46 | 卡塞瑞 | 91–95 | 萬魔殿 |
  | 47–54 | 極樂境 | 96–00 | 伊斯嘉德 |
