# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: helm-of-brilliance
name: 光輝頭盔
nameEn: "Helm of Brilliance"
source: srd
category: wondrous
group: wearable
rarity: very-rare
attunement: true
use: worn
hints:
  - text: 頭盔至少有一顆紅寶石時，火焰傷害抗性。
text: |-
  這頂頭盔鑲有1d10顆鑽石、2d10顆紅寶石、3d10顆火蛋白石與4d10顆蛋白石。從頭盔上撬下的任何寶石都會碎成粉末。當所有寶石都被移除或摧毀時，頭盔失去魔力。

  穿戴頭盔時，你獲得以下益處。

  _鑽石之光。_ 只要頭盔至少有一顆鑽石，頭盔就會散發30呎發散區域。當至少一個不死生物位於該區域內時，該發散區域會充滿微光光照。任何在該區域內開始回合的不死生物受到1d6光耀傷害。

  _火蛋白石烈焰。_ 只要頭盔至少有一顆火蛋白石，你就可以進行魔法動作，使你手持的一件武器爆出火焰。火焰在半徑10呎內散發明亮光照，並再向外10呎散發微光光照。火焰對你與該武器無害。你以這件燃燒的武器攻擊命中時，目標額外受到1d6火焰傷害。火焰持續到你進行附贈動作熄滅它們，或你丟下或收起該武器為止。

  _紅寶石抗性。_ 只要頭盔至少有一顆紅寶石，你就擁有火焰傷害抗性。

  _法術。_ 你可以施放以下其中一個法術（豁免DC 18），並以頭盔上一顆指定種類的寶石作為成分：_晝明術_（蛋白石）、_火球術_（火蛋白石）、_虹光噴射_（鑽石）或_火牆術_（紅寶石）。施放法術時，該寶石會被摧毀並從頭盔上消失。

  _承受火焰傷害。_ 遇到以下情況時擲1d20：你穿戴著頭盔，並且因為對法術的豁免失敗而受到火焰傷害。擲出1時，頭盔從其餘寶石射出光束，隨後被摧毀。以你為源頭的60呎發散區域內的每個生物必須成功通過DC 17的敏捷豁免，否則被光束擊中，受到光耀傷害，傷害等於頭盔內寶石的數量。
