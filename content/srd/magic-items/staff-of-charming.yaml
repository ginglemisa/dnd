id: staff-of-charming
name: 魅惑法杖
nameEn: "Staff of Charming"
source: srd
category: staff
rarity: rare
attunement: "由吟遊詩人、牧師、德魯伊、術士、契術師或法師"
base: { fixed: 長棍 }
pools:
  - { id: charges, label: 充能, max: 10, recover: dawn, amount: 1d8 + 2 }
  - { id: resist, label: 抵抗惑控, max: 1, recover: dawn }
actions:
  - { id: reflect, name: 反射惑控, type: reaction, pool: charges, text: 你對只以你為目標的惑控法術豁免成功時，讓那個法術如同由你施放一般反彈回施法者身上。 }
  - { id: charm-person, spell: charm-person, stats: yours, pool: charges }
  - { id: command, spell: command, stats: yours, pool: charges }
  - { id: comprehend-languages, spell: comprehend-languages, stats: yours, pool: charges }
text: |-
  這根法杖有10次充能。手持法杖時，你可以使用它的任一特性：

  **施放法術。** 你可以消耗法杖的1次充能，使用你的法術豁免DC從法杖施放_魅惑人類_、_命令術_或_通曉語言_。

  **反射惑控。** 若你對僅以你為目標的惑控法術豁免成功，你可以進行反應動作並消耗法杖的1次充能，讓該法術如同由你施放一般反彈回其施法者身上。

  **抵抗惑控。** 若你對僅以你為目標的惑控法術豁免失敗，你可以將失敗的豁免轉為成功。直到下次黎明前，你無法再次使用法杖的這項特性。

  _恢復充能。_ 法杖每天黎明恢復1d8 + 2次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，法杖化為塵土並被摧毀。
