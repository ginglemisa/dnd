equipmentName: 治療藥水
text: |-
  你喝下這瓶藥水時會恢復生命值。恢復的生命值多寡取決於藥水的稀有度，如下表所示。

  不論效力強弱，這瓶藥水的紅色液體在搖晃時都會閃爍光芒。

  | 藥水 | 恢復的生命值 | 稀有度 |
  | --- | --- | --- |
  | 治療藥水 | 2d4 + 2 | 常見 |
  | 治療藥水（高等） | 4d4 + 4 | 非常見 |
  | 治療藥水（強效） | 8d4 + 8 | 稀有 |
  | 治療藥水（極效） | 10d4 + 20 | 極稀有 |
