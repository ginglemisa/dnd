id: potions-of-healing
name: 治療藥水
nameEn: "Potions of Healing"
source: srd
category: potion
rarity: varies
attunement: false
options:
  - id: potency
    label: 等級
    choices:
      - { value: normal, label: 一般, rarity: common, heal: "2d4 + 2", omitInName: true }
      - { value: greater, label: 高等, rarity: uncommon, heal: "4d4 + 4" }
      - { value: superior, label: 強效, rarity: rare, heal: "8d4 + 8" }
      - { value: supreme, label: 極效, rarity: very-rare, heal: "10d4 + 20" }
