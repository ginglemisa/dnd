id: portable-hole
name: 便攜式次元洞
nameEn: "Portable Hole"
source: srd
category: wondrous
group: container
rarity: rare
attunement: false
text: |-
  這塊如絲般柔軟的精緻黑布，被摺成手帕大小。展開後是直徑6呎的圓形布面。

  你可以進行魔法動作，展開_便攜式次元洞_並將它放在堅硬的表面上或靠著堅硬的表面，隨後_便攜式次元洞_會形成一個深10呎的異次元洞。洞內的圓柱形空間存在於另一個位面，因此無法用來創造開放的通道。任何位於開啟的_便攜式次元洞_內的生物，都可以爬出洞外離開。

  你可以進行魔法動作來關閉_便攜式次元洞_，方法是抓住布的邊緣並將它摺起。摺起布會關閉洞口，洞內的任何生物或物體仍留在異次元空間中。不論裡面裝了什麼，這個洞的重量都幾乎為零。

  若洞被摺起，位於洞的異次元空間內的生物可以進行一個動作，做一次DC 10的力量（運動）檢定。檢定成功時，該生物強行脫出，並出現在_便攜式次元洞_5呎內。關閉的_便攜式次元洞_所存的空氣，足夠1小時的呼吸量，並由洞內進行呼吸的生物數量均分。

  將_便攜式次元洞_放入由_次元袋_、_便利袋_或類似物品所創造的異次元空間中，會立即摧毀兩件物品，並開啟一道通往星界的通道。該通道的起點就是其中一件物品被放入另一件物品內的位置。任何在通道10呎內且未處於全掩蔽之後的生物，都會被吸進通道，並被置於星界上的隨機位置。之後通道關閉。該通道只能單向通行，且無法重新開啟。
