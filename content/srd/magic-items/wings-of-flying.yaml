# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: wings-of-flying
name: 飛翼斗篷
nameEn: "Wings of Flying"
source: srd
category: wondrous
group: wearable
rarity: rare
attunement: true
use: worn
pools:
  - { id: cooldown, label: 翅膀, max: 1, recover: cooldown, cooldown: 1d12 小時 }
actions:
  - { id: wings, name: 展開翅膀, type: magic, pool: cooldown, text: 斗篷變成翅膀，獲得 60 呎飛行速度 1 小時，或直到你以魔法動作提前結束；翅膀消失時在空中會墜落，之後 1d12 小時內不能再用。 }
text: |-
  穿戴這件斗篷時，你可以進行魔法動作，把斗篷變成你背上的一對翅膀。翅膀持續1小時，或直到你以魔法動作提前結束此效果。翅膀給你60呎的飛行速度。若翅膀消失時你在空中，你會墜落。翅膀消失後，1d12小時內你無法再次使用它們。
