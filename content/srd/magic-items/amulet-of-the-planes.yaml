# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: amulet-of-the-planes
name: 位面護符
nameEn: "Amulet of the Planes"
source: srd
category: wondrous
group: wearable
rarity: very-rare
attunement: true
use: worn
text: |-
  穿戴這個護符時，你可以進行魔法動作，說出另一個位面上你熟悉的地點。然後進行一次DC 15的智力（奧秘）檢定。檢定成功時，你施放_異界傳送_。檢定失敗時，你以及你15呎內的每個生物與物體，會前往一個隨機的目的地，該目的地由擲1d100並查閱下表決定。

  | 1d100 | 目的地 |
  | --- | --- |
  | 01–60 | 你所說出的位面上的隨機地點 |
  | 61–70 | 內層位面上的隨機地點，由擲1d6決定：擲出1，風元素位面；擲出2，土元素位面；擲出3，火元素位面；擲出4，水元素位面；擲出5，精類荒野；擲出6，暗影界 |
  | 71–80 | 外層位面上的隨機地點，由擲1d8決定：擲出1，阿堡瑞亞；擲出2，阿卡迪亞；擲出3，獸域；擲出4，貝托匹亞；擲出5，極樂境；擲出6，機械境；擲出7，天堂山；擲出8，伊斯嘉德 |
  | 81–90 | 外層位面上的隨機地點，由擲1d8決定：擲出1，深淵；擲出2，亞克倫；擲出3，卡塞瑞；擲出4，葛黑納；擲出5，哈迪斯；擲出6，靈薄獄；擲出7，九層地獄；擲出8，萬魔殿 |
  | 91–00 | 星界上的隨機地點 |
