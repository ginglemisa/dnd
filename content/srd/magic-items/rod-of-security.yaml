id: rod-of-security
name: 庇護權杖
nameEn: "Rod of Security"
source: srd
category: rod
rarity: very-rare
attunement: false
text: |-
  手持這根權杖時，你可以進行魔法動作啟動它。權杖隨即立刻將你以及你看得見的至多199個其他自願生物傳送到一個半位面。半位面呈現的形式由你決定。它可以是寧靜的花園、歡樂的酒館、宏偉的宮殿、熱帶島嶼、奇幻的嘉年華，或你能想像的任何其他地方。無論其性質為何，半位面都含有足夠供其訪客維生的水與食物，且半位面的環境無法傷害其中的居住者。那裡其他可供互動的一切事物都只能存在於那裡。例如，從那裡的花園摘下的花朵，如果被帶到半位面之外就會消失。

  訪客在半位面中每待1小時，就恢復生命值，如同花費了1顆生命骰。此外，生物在那裡不會變老，但時間仍正常流逝。訪客最多可以在那裡停留200天除以在場生物數量的天數（無條件捨去）。

  當時間用盡，或你進行魔法動作結束效果時，所有訪客會重新出現在你啟動權杖時他們所在的位置，或最靠近該位置的未被佔據空間。此特性使用後，要經過10天才能再次使用。
