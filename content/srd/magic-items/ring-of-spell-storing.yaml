id: ring-of-spell-storing
name: 儲法戒指
nameEn: "Ring of Spell Storing"
source: srd
category: ring
rarity: rare
attunement: true
text: |-
  這枚戒指會儲存被施放進其中的法術，並保存它們，直到同調的穿戴者使用它們。這枚戒指一次最多可儲存總計5環的法術。被發現時，它內含由DM選擇、總計1d6 − 1環的已儲存法術。

  任何生物都可以在施放1至5環的法術時，藉由觸碰這枚戒指，將該法術施放進戒指中。該法術除了被儲存進戒指之外沒有其他效果。如果戒指無法容納該法術，法術會被消耗而沒有任何效果。用來施放該法術的法術位環階，決定它佔用多少空間。

  穿戴這枚戒指時，你可以施放其中儲存的任何法術。該法術使用原施法者的法術位環階、法術豁免DC、法術攻擊加值與施法屬性，但在其他方面視同由你施放該法術。從戒指施放出的法術不再儲存於其中，騰出空間。
