id: instant-fortress
name: 瞬間要塞
nameEn: "Instant Fortress"
source: srd
category: wondrous
group: tool
rarity: rare
attunement: true
text: |-
  作為魔法動作，你可以把這座1吋高的精金塑像放在地上，並以命令詞使其迅速長成一座方形的精金塔。重複說出命令詞會使塔變回塑像形態，這只有在塔內是空的時候才有效。塔出現區域內的每個生物都會被推到塔外但緊鄰塔的未被佔據空間。該區域內未被穿戴或攜帶的物體也會被推離塔。

  塔每邊長20呎、高30呎，四面都有箭孔，頂端有城垛。塔內分成兩層樓，由梯子、階梯或斜坡（由你選擇）連接。這個梯子、階梯或斜坡的盡頭是一道通往屋頂的活板門。創造出來時，塔在朝向你的那一面地面層有一扇門。門只會在你的命令下開啟，你可以用附贈動作下達這個命令。它免疫_敲擊術_法術與類似魔法。

  魔法使塔不會被推倒。屋頂、門與牆壁各自擁有AC 20；HP 100；免疫鈍擊、穿刺與揮砍傷害，但攻城器械造成的傷害除外；並對所有其他傷害具有抗性。

  把塔縮回塑像形態不會修復塔受到的損傷。只有_祈願術_法術能修復這座塔（此法術的這種用法視為複製8環或更低環的法術）。每次施放_祈願術_都會使塔恢復所有生命值。
