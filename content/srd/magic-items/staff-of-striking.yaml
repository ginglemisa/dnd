# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: staff-of-striking
name: 強襲法杖
nameEn: "Staff of Striking"
source: srd
category: staff
rarity: very-rare
attunement: true
base: { fixed: 長棍 }
effects: { attack: 3, damage: 3 }
hints:
  - panel: weapon
    text: 近戰命中時可花最多 3 次充能，每次額外造成 1d6 力場傷害。
text: |-
  這根法杖可以當作魔法長棍揮舞，使用它進行的攻擊檢定與傷害擲骰獲得+3加值。

  法杖有10次充能。當你使用它進行近戰攻擊命中時，你可以消耗最多3次充能。你每消耗1次充能，目標就額外受到1d6力場傷害。

  _恢復充能。_ 法杖每天黎明恢復1d6 + 4次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，法杖變成非魔法長棍。
