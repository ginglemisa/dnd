# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: robe-of-useful-items
name: 雜貨法袍
nameEn: "Robe of Useful Items"
source: srd
category: wondrous
group: wearable
rarity: uncommon
attunement: false
text: |-
  這件法袍上覆蓋著各種形狀與顏色的布片。穿戴法袍時，你可以進行魔法動作，撕下其中一塊布片，使它變成它所代表的物體或生物。一旦最後一塊布片被撕下，法袍就會變成一件普通衣物。

  法袍上有下列布片，每種各兩塊：

  - 牛眼提燈（已裝滿燈油並點燃）
  - 匕首
  - 鏡子
  - 長桿
  - 繩索（已盤好）
  - 麻袋

  此外，法袍上還有4d4塊其他布片。這些布片由DM選擇，或擲下表來隨機決定。

  | 1d100 | 布片 |
  | --- | --- |
  | 01–08 | 裝有100 GP的袋子 |
  | 09–15 | 價值500 GP的銀製小箱（長1呎，寬與深6吋） |
  | 16–22 | 鐵門（寬最多10呎、高最多10呎，在你選擇的一側有門閂），你可以將它放在你伸手可及的開口處；它會變形以貼合開口，自行固定並裝上鉸鏈 |
  | 23–30 | 10顆寶石，每顆價值100 GP |
  | 31–44 | 木梯（長24呎） |
  | 45–51 | 配騎乘鞍的馱用馬 |
  | 52–59 | 開放的坑洞（10呎立方體），你可以將它放在你自身10呎內的地面上 |
  | 60–68 | 4瓶治療藥水 |
  | 69–75 | 划艇（長12呎） |
  | 76–83 | 法術卷軸，內含一個1環、2環或3環的法術（由你選擇） |
  | 84–90 | 2隻獒犬 |
  | 91–96 | 窗戶（2呎乘4呎，深度最多2呎），你可以將它放在你伸手可及的垂直表面上 |
  | 97–00 | 便攜式攻城錘 |
