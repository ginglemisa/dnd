id: wand-of-magic-detection
name: 偵測魔法魔杖
nameEn: "Wand of Magic Detection"
source: srd
category: wand
rarity: uncommon
attunement: false
use: held
pools:
  - { id: charges, label: 充能, max: 3, recover: dawn, amount: 1d3 }
