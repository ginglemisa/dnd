name: 叢林法杖
nameEn: "Staff of the Woodlands"
source: srd
category: staff
rarity: rare
attunement: 由德魯伊
base: { fixed: 長棍 }
effects: { attack: 2, damage: 2, spellAttack: 2, condition: held }
pools:
  - { id: charges, label: 充能, max: 6, recover: dawn, amount: 1d6 }
actions:
  - { id: tree, name: 樹形, type: magic, pool: charges, text: 把法杖一端插入泥土，變成一棵高 60 呎、樹冠半徑 20 呎的樹；觸碰樹並進行魔法動作讓它變回法杖。 }
  - { id: animal-friendship, spell: animal-friendship, stats: yours, pool: charges }
  - { id: awaken, spell: awaken, stats: yours, pool: charges, cost: 5 }
  - { id: barkskin, spell: barkskin, stats: yours, pool: charges, cost: 2 }
  - { id: locate-animals-or-plants, spell: locate-animals-or-plants, stats: yours, pool: charges, cost: 2 }
  - { id: pass-without-trace, spell: pass-without-trace, stats: yours, pool: charges, cost: 2 }
  - { id: speak-with-animals, spell: speak-with-animals, stats: yours, pool: charges }
  - { id: speak-with-plants, spell: speak-with-plants, stats: yours, pool: charges, cost: 3 }
  - { id: wall-of-thorns, spell: wall-of-thorns, stats: yours, pool: charges, cost: 6 }
text: |-
  這根法杖有6次充能，可以當作魔法長棍揮舞，使用它進行的攻擊檢定與傷害擲骰獲得+2加值。手持它時，你的法術攻擊檢定獲得+2加值。

  _法術。_ 手持法杖時，你可以使用你的法術豁免DC，從法杖施放下表中的一個法術。表格列出施放各法術需要消耗的充能次數。

  | 法術 | 充能消耗 |
  | --- | --- |
  | *化獸為友* | 1 |
  | *啟蒙術* | 5 |
  | *樹膚術* | 2 |
  | *動植物定位術* | 2 |
  | *行動無蹤* | 2 |
  | *動物交談* | 1 |
  | *植物交談* | 3 |
  | *棘牆術* | 6 |

  _樹形。_ 你可以進行魔法動作，將法杖的一端插入未被佔據的空間中的泥土裡，並消耗1次充能，將法杖轉變為一棵健康的樹。這棵樹高60呎，樹幹直徑5呎，頂端的樹枝向外展開半徑20呎。這棵樹看起來很普通，但散發出微弱的變化魔法靈光，可以用_偵測魔法_法術辨識出來。觸碰這棵樹並進行魔法動作時，你將法杖恢復為原本的形態。當樹恢復為法杖時，樹上的任何生物都會掉落。

  _恢復充能。_ 法杖每天黎明恢復1d6次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，法杖失去其特性，變成非魔法長棍。
