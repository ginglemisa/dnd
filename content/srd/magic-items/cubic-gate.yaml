# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: cubic-gate
name: 異界之門魔方
nameEn: "Cubic Gate"
source: srd
category: wondrous
group: tool
rarity: legendary
attunement: false
pools:
  - { id: charges, label: 充能, max: 3, recover: dawn, amount: 1d3 }
actions:
  - { id: gate, spell: gate, pool: charges, when: owned, note: 開啟一道通往按下那一面所對應位面的傳送門。 }
  - { id: plane-shift, spell: plane-shift, pool: charges, when: owned, note: 連按同一面兩次，把目標傳送到那一面所對應的位面。 }
text: |-
  這個方塊寬3吋，散發著可察覺的魔法能量。方塊的六個面各自對應一個不同的位面，其中一個是物質位面。其他面連結到由DM決定的位面。

  魔方有3次充能，每天黎明恢復1d3次已消耗的充能。作為魔法動作，你可以消耗魔方的1次充能，用魔方施放下列其中一個法術。

  _異界之門。_ 按下魔方的一面，你施放_異界之門_，開啟一道通往該面所對應位面的傳送門。

  _異界傳送。_ 連按魔方的一面兩次，你施放_異界傳送_，將目標傳送到該面所對應的位面。
