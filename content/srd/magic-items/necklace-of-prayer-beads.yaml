# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: necklace-of-prayer-beads
name: 念珠項鍊
nameEn: "Necklace of Prayer Beads"
source: srd
category: wondrous
group: wearable
rarity: rare
attunement: "由牧師、德魯伊或聖騎士"
use: worn
pools:
  - { id: beads, label: 可用的魔法珠子, max: 6, recover: dawn }
actions:
  - { id: bless, spell: bless, pool: beads, castingTime: bonus-action, stats: yours }
  - { id: cure-wounds, spell: cure-wounds, pool: beads, castingTime: bonus-action, stats: yours, level: 2 }
  - { id: greater-restoration, spell: greater-restoration, pool: beads, castingTime: bonus-action, stats: yours }
  - { id: guardian-of-faith, spell: guardian-of-faith, pool: beads, castingTime: bonus-action, stats: yours }
  - { id: wind-walk, spell: wind-walk, pool: beads, castingTime: bonus-action, stats: yours }
  - { id: shining-smite, spell: shining-smite, pool: beads, stats: yours }
text: |-
  這條項鍊有1d4 + 2顆以海藍寶、黑珍珠或黃玉製成的魔法珠子。它還有許多以琥珀、血石、黃水晶、珊瑚、玉、珍珠或石英等石材製成的非魔法珠子。若將魔法珠子從項鍊上取下，該珠子就會失去魔力。

  魔法珠子共有六種。DM決定項鍊上每顆珠子的種類，或在下表上擲骰隨機決定。一條項鍊可以有不只一顆相同種類的珠子。要使用珠子，你必須穿戴著這條項鍊。每顆珠子都蘊含一個法術，你可以作為附贈動作從中施放（若需要豁免，則使用你的法術豁免DC）。魔法珠子的法術一旦施放，該珠子直到下次黎明前都無法再次使用。

  | 1d20 | 珠子 | 法術 |
  | --- | --- | --- |
  | 1–6 | 祝福念珠 | 祝福術 |
  | 7–12 | 治療念珠 | 療傷術（2環版本） |
  | 13–16 | 恩惠念珠 | 高等復原術 |
  | 17–18 | 懲擊念珠 | 閃耀斬 |
  | 19 | 召喚念珠 | 信仰守衛 |
  | 20 | 御風念珠 | 御風而行 |
