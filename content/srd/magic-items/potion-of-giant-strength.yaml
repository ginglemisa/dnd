# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: potion-of-giant-strength
name: 巨人之力藥水
nameEn: "Potion of Giant Strength"
source: srd
category: potion
rarity: varies
attunement: false
options:
  - id: giant
    label: 巨人種類
    choices:
      - { value: hill, label: 山丘, rarity: uncommon, score: 21 }
      - { value: frost-stone, label: 霜或石, rarity: rare, score: 23 }
      - { value: fire, label: 火, rarity: rare, score: 25 }
      - { value: cloud, label: 雲, rarity: very-rare, score: 27 }
      - { value: storm, label: 風暴, rarity: legendary, score: 29 }
consumable: true
manualEffect: true
text: |-
  喝下這瓶藥水時，你的力量值會改變，持續1小時。巨人的類型決定該力量值（見下表）。若你的力量等於或高於該力量值，藥水對你沒有效果。

  這瓶藥水的透明液體中漂浮著一絲光芒，形似巨人的指甲。

  | 藥水 | 力量 | 稀有度 |
  | --- | --- | --- |
  | 巨人之力藥水（山丘） | 21 | 非常見 |
  | 巨人之力藥水（霜或石） | 23 | 稀有 |
  | 巨人之力藥水（火） | 25 | 稀有 |
  | 巨人之力藥水（雲） | 27 | 極稀有 |
  | 巨人之力藥水（風暴） | 29 | 傳說 |
