# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: staff-of-fire
name: 火焰法杖
nameEn: "Staff of Fire"
source: srd
category: staff
rarity: very-rare
attunement: "由德魯伊、術士、契術師或法師"
base: { fixed: 長棍 }
hints:
  - resistances: [ fire ]
pools:
  - { id: charges, label: 充能, max: 10, recover: dawn, amount: 1d6 + 4 }
actions:
  - { id: burning-hands, spell: burning-hands, stats: yours, pool: charges }
  - { id: fireball, spell: fireball, stats: yours, pool: charges, cost: 3 }
  - { id: wall-of-fire, spell: wall-of-fire, stats: yours, pool: charges, cost: 4 }
text: |-
  手持這根法杖時，你對火焰傷害具有抗性。

  _法術。_ 法杖有10次充能。手持法杖時，你可以使用你的法術豁免DC，從法杖施放下表中的一個法術。表格列出施放各法術需要消耗的充能次數。

  | 法術 | 充能消耗 | 法術 | 充能消耗 |
  | --- | --- | --- | --- |
  | *燃燒之手* | 1 | *火牆術* | 4 |
  | *火球術* | 3 |  |  |

  _恢復充能。_ 法杖每天黎明恢復1d6 + 4次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，法杖化為餘燼並被摧毀。
