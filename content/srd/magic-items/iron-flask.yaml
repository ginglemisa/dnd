# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: iron-flask
name: 收妖瓶
nameEn: "Iron Flask"
source: srd
category: wondrous
group: container
rarity: legendary
attunement: false
use: held
text: |-
  手持這個以黃銅瓶塞封口的鐵瓶時，你可以進行魔法動作，以你60呎內你看得見的一個生物為目標。若瓶子是空的，且目標原生於你所在位面以外的其他位面，目標必須成功通過DC 17的感知豁免，否則被困在瓶中。若目標先前曾被這個瓶子困住過，它在豁免上具有優勢。一旦被困，生物會留在瓶中，直到被釋放為止。瓶子一次只能容納一個生物。被困在瓶中的生物不會老化，也不需要呼吸、飲食。

  你可以進行魔法動作拔掉瓶塞，釋放瓶中的生物。該生物隨後服從你的命令1小時，即使不懂下達命令所用的語言，也聽得懂這些命令。若你不下達命令，或給予該生物可能導致其死亡或被囚禁的命令，它會自衛，但除此之外不採取任何行動。持續時間結束時，該生物依其一般的性情與陣營行動。

  _鑑定術_法術能揭示瓶中是否有生物，但要判定生物的種類，唯一的方法就是打開瓶子。新發現的_收妖瓶_可能已經含有一個由DM選擇的生物。
