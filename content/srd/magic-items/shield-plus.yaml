id: shield-plus
name: "盾牌+1／+2／+3"
nameEn: "Shield, +1, +2, or +3"
source: srd
category: armor
rarity: varies
rarityText: "非常見（+1）、稀有（+2）或極稀有（+3）"
attunement: false
base: { fixed: 盾牌 }
options:
  - id: bonus
    label: 加值
    choices:
      - { value: 1, label: "+1", rarity: uncommon }
      - { value: 2, label: "+2", rarity: rare }
      - { value: 3, label: "+3", rarity: very-rare }
