actions:
  - { id: blast, name: 吹響號角, type: magic, when: owned, text: 30 呎錐形區域內每個生物 DC 15 體質豁免，失敗受到 5d8 雷鳴傷害並耳聾 1 分鐘，成功減半；區域內玻璃或水晶物體受到 10d8 雷鳴傷害。每次使用有 20% 機率爆炸，你受到 10d6 力場傷害、號角被摧毀。 }
text: |-
  你可以進行魔法動作吹響這支號角，發出一聲30呎錐形區域內的雷鳴巨響，在600呎外都聽得見。錐形區域內的每個生物進行一次DC 15的體質豁免。豁免失敗者受到5d8雷鳴傷害並陷入耳聾狀態1分鐘。豁免成功者只受到一半傷害。錐形區域內未被穿戴或攜帶的玻璃或水晶物體受到10d8雷鳴傷害。

  每次使用號角的魔法都有20%的機率使號角爆炸。爆炸對使用者造成10d6力場傷害並摧毀號角。
