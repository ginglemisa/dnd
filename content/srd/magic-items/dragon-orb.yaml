attunement: true
pools:
  - { id: charges, label: 充能, max: 7, recover: dawn, amount: 1d4 + 3 }
  - { id: call-dragons, label: 召喚龍類, max: 1, recover: cooldown, cooldown: 1 小時 }
actions:
  - { id: call-dragons, name: 召喚龍類, type: magic, pool: call-dragons, when: owned, text: 控制法球時發出心靈感應召喚，40 英里內的繽紛龍被迫盡快前來法球所在之處，可能對你懷有敵意。 }
text: |-
  法球是一顆刻有紋路的水晶球，直徑約10吋。使用時，它會增大到直徑約20吋，內部有霧氣旋繞。

  與法球同調期間，你可以進行魔法動作，凝視法球深處。你接著必須進行一次DC 15的魅力豁免。豁免成功時，只要你仍與它同調，你就控制該法球。豁免失敗時，只要你仍與它同調，法球就使你陷入魅惑狀態。

  當你受到法球魅惑時，你無法自願結束與它的同調，且法球會隨意對你施放_暗示術_（豁免DC 18），促使你為它所渴望的邪惡目的努力。法球內的龍之精華可能想要許多事物：毀滅某個特定社會或組織、脫離法球的束縛、在世間散播苦難、推廣對提亞瑪特的崇拜，或是DM決定的其他事物。

  _法術。_ 法球有7次充能，每天黎明恢復1d4 + 3次已消耗的充能。若你控制法球，可以從中施放下表所列法術之一。表格列出施放各法術需要消耗的充能次數。

  | 法術 | 充能消耗 |
  | --- | --- |
  | 療傷術（9環版本） | 4 |
  | 晝明術 | 1 |
  | 防死結界 | 2 |
  | 偵測魔法 | 0 |
  | 探知術（豁免DC 18） | 3 |

  _召喚龍類。_ 當你控制法球時，你可以進行魔法動作，讓法球發出一道心靈感應召喚，向四面八方延伸40英里。範圍內的繽紛龍會感到被迫要以最直接的路線盡快前來法球所在之處。像提亞瑪特這樣的龍類神祇不受此召喚影響。被吸引到法球處的繽紛龍，可能因為被迫違背自己的意願而對你抱持敵對態度。此特性使用後，1小時內無法再次使用。

  _摧毀法球。_ _龍族法球_的AC為20，若受到_武器+3_或_解離術_法術的傷害就會被摧毀。其他任何事物都無法傷害它。
