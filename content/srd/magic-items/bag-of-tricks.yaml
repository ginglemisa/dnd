id: bag-of-tricks
name: 魔術袋
nameEn: "Bag of Tricks"
source: srd
category: wondrous
group: container
rarity: uncommon
attunement: false
options:
  - id: color
    label: 顏色
    choices:
      - { value: gray, label: 灰色 }
      - { value: rust, label: 鏽紅色 }
      - { value: tan, label: 棕褐色 }
pools:
  - { id: tricks, label: 毛茸茸的東西, max: 3, recover: dawn }
actions:
  - { id: pull, name: 拉出生物, type: magic, pool: tricks, when: owned, text: 從袋中拉出一個毛茸茸的東西並投擲至多 20 呎，落地後變成依袋子顏色擲骰決定的友善生物，在你之後行動，下次黎明或生命值降到 0 時消失。附贈動作命令它。 }
text: |-
  這個以灰色、鏽紅色或棕褐色布料製成的袋子看起來是空的。然而，把手伸進袋中，會發現裡面有一個毛茸茸的小東西。

  你可以進行魔法動作，從袋中拉出這個毛茸茸的東西，並將它投擲至多20呎。當這個東西落地時，會變成一個你透過擲骰決定的生物，擲骰查閱與袋子顏色對應的表格。該生物的數據塊見「怪物」章節。該生物會在下次黎明消失，或在其生命值降為0時消失。

  該生物對你和你的盟友是友善的，並在你的先攻順位上緊接在你之後行動。你可以進行附贈動作，命令該生物如何移動，以及在它的下個回合採取什麼動作，例如攻擊敵人。若沒有這類命令，該生物會依其本性做出合適的行動。

  一旦從袋中拉出3個毛茸茸的東西，袋子在下次黎明前都無法再次使用。

  **灰色魔術袋**

  | 1d8 | 生物 | 1d8 | 生物 |
  | --- | --- | --- | --- |
  | 1 | 鼬 | 5 | 黑豹 |
  | 2 | 巨鼠 | 6 | 巨獾 |
  | 3 | 獾 | 7 | 恐狼 |
  | 4 | 野豬 | 8 | 巨麋鹿 |

  **鏽紅色魔術袋**

