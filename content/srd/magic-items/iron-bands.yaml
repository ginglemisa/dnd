text: |-
  這顆生鏽的鐵球直徑3吋、重1磅。你可以進行魔法動作，將這顆球擲向你60呎內你看得見的一個巨型或更小的生物。球在空中移動時，會展開成一團纏結的金屬環帶。

  進行一次遠程攻擊檢定，攻擊加值等於你的敏捷調整值加上你的熟練加值。命中時，目標陷入束縛狀態，直到你進行附贈動作下達釋放它的命令為止。這樣做，或攻擊未命中，都會使鐵索收縮，再度變回球形。

  能碰觸到鐵索的生物，包括被束縛的那個，可以進行一個動作，進行一次DC 20的力量（運動）檢定來扯斷鐵索。檢定成功時，物品被摧毀，被束縛的生物獲釋。檢定失敗時，該生物之後的任何嘗試都會自動失敗，直到經過24小時為止。

  鐵索使用後，直到下次黎明前，都無法再次使用。
