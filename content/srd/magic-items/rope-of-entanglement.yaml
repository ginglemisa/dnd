# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: rope-of-entanglement
name: 糾纏繩
nameEn: "Rope of Entanglement"
source: srd
category: wondrous
group: tool
rarity: rare
attunement: false
use: held
actions:
  - { id: entangle, name: 纏住, type: magic, text: 繩索纏住 20 呎內你看得見的一個生物，DC 15 敏捷豁免，失敗則束縛；目標可用動作進行 DC 15 力量（運動）或敏捷（體操）檢定脫身。 }
  - { id: release, name: 收回繩索, type: bonus, text: 重複命令讓繩索在你手中盤起，釋放目標。 }
text: |-
  這條繩索長30呎。手持繩索一端時，你可以進行魔法動作，命令另一端向前竄出，纏住你20呎內一個你能看見的生物。目標必須成功通過DC 15的敏捷豁免，否則陷入束縛狀態。你可以藉由放開你這一端的繩索（使繩索在目標的空間內盤起），或進行附贈動作重複下達命令（使繩索在你手中盤起），來釋放目標。

  被繩索束縛的目標可以進行一個動作，自行選擇進行DC 15的力量（運動）或敏捷（體操）檢定。檢定成功時，目標不再被繩索束縛。若目標脫離繩索時你仍握著繩索，你可以進行反應動作，命令繩索在你手中盤起；否則，繩索在目標的空間內盤起。

  繩索的AC為20、HP為20，並對毒素與心靈傷害免疫。只要至少剩餘1點生命值，它每5分鐘恢復1點生命值。若繩索降至0點生命值，它就會被摧毀。
