# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: quarterstaff-of-the-acrobat
name: 特技師長棍
nameEn: "Quarterstaff of the Acrobat"
source: srd
category: weapon
rarity: very-rare
attunement: true
base: { fixed: 長棍 }
effects: { attack: 2, damage: 2 }
manualEffect: true
text: |-
  使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+2加值。

  手持這件武器時，你可以讓它發出綠色微光光照，範圍至10呎，可以作為附贈動作或在你擲先攻之後發出，你也可以作為附贈動作熄滅這道光。

  手持這件武器時，你可以進行附贈動作來改變它的形態，將它變成6吋短桿（方便收納）或10呎長桿，或將它變回長棍；武器只會延長到周圍空間允許的程度。

  在特定形態下，這件武器具有下列額外特性。

  _特技輔助（僅限長棍與10呎長桿形態）。_ 手持這件武器時，你在敏捷（體操）檢定上具有優勢。

  _攻擊偏轉（僅限長棍形態）。_ 當你手持這件武器並被攻擊命中時，你可以進行反應動作，讓武器在你身周旋轉，使你對觸發此動作的那次攻擊獲得+5的護甲等級加值，有可能使該攻擊落空。你完成一次短休或長休之前，無法再次使用此特性。

  _遠程武器（僅限長棍形態）。_ 這件武器具有投擲屬性，一般射程為30呎，遠射程為120呎。你用這件武器進行遠程攻擊後，它會立即飛回你的手中。
