actions:
  - { id: gust-of-wind, spell: gust-of-wind, saveDc: 13, note: 下次黎明前每再用一次，扇子累積 20% 機率撕裂損毀（見說明）。 }
text: |-
  手持這把扇子時，你可以從中施放_造風術_（豁免DC 13）。在下次黎明前，每次再度使用這把扇子時，它都有累積20%的機率失效；若扇子失效，它會撕裂成無用的非魔法碎片。
