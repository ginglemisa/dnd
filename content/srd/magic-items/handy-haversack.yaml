id: handy-haversack
name: 便利袋
nameEn: "Handy Haversack"
source: srd
category: wondrous
group: container
rarity: rare
attunement: false
container:
  extradimensional: true
weight: 5
text: |-
  這個背包有一個中央袋與兩個側袋，每個都是異次元空間。每個側袋最多可容納200磅物資，體積不超過25立方呎。中央袋最多可容納500磅物資，體積不超過64立方呎。無論內容物為何，便利袋的重量永遠是5磅。

  從便利袋中取出物品需要進行使用物件動作或附贈動作（由你選擇）。當你伸手進便利袋中取特定物品時，該物品總是神奇地位於最上面。

  若任何一個袋子過載、被刺穿或被撕裂，便利袋就會破裂並被摧毀。若便利袋被摧毀，其內容物將永遠遺失，不過神器一定會在某處再度出現。若便利袋被內外翻轉，其內容物會完好無損地散出，而便利袋必須先翻回原狀才能再次使用。

  便利袋的每個袋子裝有足夠呼吸10分鐘的空氣，再除以袋內呼吸的生物數量。

  把便利袋放進_次元袋_、_便攜式次元洞_或類似物品創造的異次元空間內，會立即摧毀兩件物品，並開啟一道通往星界的通道。通道出現在其中一件物品被放進另一件物品內的位置。通道10呎內且不在全掩蔽之後的任何生物都會被吸進通道，並被安置在星界的隨機位置。通道隨後關閉。通道只能單向通行，且無法重新開啟。
