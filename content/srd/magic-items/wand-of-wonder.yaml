# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: wand-of-wonder
name: 驚奇魔杖
nameEn: "Wand of Wonder"
source: srd
category: wand
rarity: rare
attunement: true
text: |-
  這根魔杖有7次充能。手持它時，你可以進行魔法動作，消耗1次充能，並選擇你自身120呎內的一個點。該位置成為一個法術或其他魔法效果的起始點，該法術或效果由在驚奇魔杖效果表上擲骰決定。從魔杖施放的法術，豁免DC為15。若某法術的最大射程通常小於120呎，則從魔杖施放時變為120呎。若某效果有多個可能的對象，由DM隨機決定其中哪些受到影響。

  _恢復充能。_ 魔杖每天黎明恢復1d6 + 1次已消耗的充能。若你消耗魔杖的最後一次充能，擲1d20。擲出1時，魔杖化為塵土並被摧毀。

  **驚奇魔杖效果表**

  | 1d100 | 效果 |
  | --- | --- |
  | 01–20 | 你施放一個以所選的點為起始點的法術。擲1d10決定法術：擲出1–2時為黑暗術；3–4時為妖火；5–6時為火球術；7–8時為緩慢術；9–10時為臭雲術。 |
  | 21–25 | 所選的起始點什麼也沒有發生。你改為陷入震懾狀態，持續到你下個回合開始，並以為剛剛發生了某件驚人的事。 |
  | 26–30 | 你施放造風術。該法術產生的直線區域從你延伸到所選的起始點。 |
  | 31–35 | 所選的起始點什麼也沒有發生。你改為受到1d6心靈傷害。 |
  | 36–40 | 大雨在以所選起始點為中心、高120呎、半徑60呎的圓柱形區域內下1分鐘。在此期間，該效果區域為輕度遮蔽。 |
  | 41–45 | 一群600隻超大蝴蝶充滿以所選起始點為中心、高60呎、半徑30呎的圓柱形區域。蝴蝶停留10分鐘，在此期間，該效果區域為重度遮蔽。 |
  | 46–50 | 你施放閃電束。該法術產生的直線區域從你延伸到所選的起始點。 |
  | 51–55 | 離所選起始點最近的生物變大，如同你對其施放了變巨術/縮小術。若目標不是你，且無法受該法術影響，則你改為成為目標。 |
  | 56–60 | 一隻由魔法形成的生物出現在盡可能靠近所選起始點的未被佔據的空間。該生物不受你控制，照常行動，並在1小時後或降到0生命值時消失。擲1d4決定出現哪種生物。擲出1時，出現犀牛；2時，出現大象；3–4時，出現老鼠。 |
  | 61–64 | 青草覆蓋半徑60呎的圓形地面，該圓的中心盡可能靠近所選起始點。原本就在那裡的青草長到正常大小的十倍，並維持瘋長狀態1分鐘。 |

  | 1d100 | 效果 |
  | --- | --- |
  | 65–68 | 由DM選擇的一個物體消失並進入以太位面。該物體必須未被穿戴或攜帶、位於所選起始點120呎內，且任一維度都不超過10呎。若射程內沒有這樣的物體，則什麼也沒有發生。 |
  | 69–72 | 所選的起始點什麼也沒有發生。你改為縮小，如同你對自己施放了變巨術/縮小術，並維持該狀態1分鐘。 |
  | 73–77 | 離所選起始點最近的生物身上長出葉子。除非被摘掉，否則葉子會在24小時後變成棕色並掉落。 |
  | 78–82 | 所選的起始點什麼也沒有發生。你改為從自身向外迸發一陣色彩繽紛、閃爍的光芒，形成30呎發散區域。區域內的每個生物都必須成功通過DC 15的體質豁免，否則陷入失明狀態1分鐘。生物在其每個回合結束時重複進行該豁免，成功則結束其身上的此效果。 |
  | 83–87 | 所選的起始點什麼也沒有發生。你改為對自己施放隱形術。 |
  | 88–92 | 所選的起始點什麼也沒有發生。你改為從魔杖的杖尖朝所選起始點射出一道由1d4 × 10顆寶石組成的寶石流，每顆價值1 GP，形成長30呎、寬5呎的直線區域。每顆寶石造成1點鈍擊傷害，寶石的總傷害平均分配給直線區域內的所有生物。 |
  | 93–97 | 你施放變形術，以離所選起始點最近的生物為目標。擲1d4決定目標的新形態。擲出1時，新形態為黑熊；2時，新形態為巨蜂；3–4時，新形態為青蛙。 |
  | 98–00 | 離所選起始點最近的生物進行一次DC 15的體質豁免。豁免失敗時，該生物陷入束縛狀態並開始變成石頭。在以這種方式受到束縛期間，該生物在其下個回合結束時重複進行該豁免。豁免成功時，效果結束。豁免失敗時，該生物改為陷入石化狀態，不再處於束縛狀態。石化持續到該生物被高等復原術或類似魔法解救為止。 |
