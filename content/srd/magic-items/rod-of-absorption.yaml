id: rod-of-absorption
name: 吸收權杖
nameEn: "Rod of Absorption"
source: srd
category: rod
rarity: very-rare
attunement: true
use: held
text: |-
  手持這根權杖時，你可以進行反應動作，吸收一個只以你為目標、且沒有創造效果區域的法術。被吸收法術的效果會被取消，法術的能量（而非法術本身）會被儲存在權杖中。該能量的環數與法術被施放時的環數相同。被取消的法術會消散而沒有任何效果，用來施放它的任何資源都會被浪費。權杖在其存在期間，最多可以吸收並儲存50環的能量。一旦權杖吸收了50環的能量，就無法再吸收更多。如果你成為權杖無法儲存的法術的目標，權杖對該法術沒有效果。

  當你與權杖同調時，你會知道權杖在其存在期間總共吸收了多少環的能量，以及它目前儲存了多少環的法術能量。

  如果你是手持權杖的施法者，你可以把儲存在其中的能量轉換為法術位，來施放你已準備或已知的法術。你只能創造環階等於或低於你自己法術位的法術位，最高為5環。你使用儲存的環數來取代你的法術位，但在其他方面照常施放法術。例如，你可以把權杖中儲存的3環能量當作一個3環法術位使用。

  新發現的權杖通常儲存有1d10環的法術能量。無法再吸收法術能量且沒有剩餘能量的權杖會變成非魔法物品。
