# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: rope-of-climbing
name: 攀爬繩
nameEn: "Rope of Climbing"
source: srd
category: wondrous
group: tool
rarity: uncommon
attunement: false
use: held
text: |-
  這條60呎長的繩子最多可承受3,000磅。握住繩子一端時，你可以進行魔法動作，命令繩子的另一端活動，並朝你選擇的目的地移動，距離不超過繩子的長度。該端在你第一次下令的回合移動10呎，並在你之後每個回合開始時移動10呎，直到抵達目的地或你叫它停止為止。你也可以叫繩子牢固地綁在某個物體上或解開，打結或解結，或自行盤起以便攜帶。

  如果你叫繩子打結，繩子上每隔1呎就會出現大型繩結。打結時，繩子會縮短為50呎長，並使利用繩子攀爬所進行的屬性檢定具有優勢。

  這條繩子的AC為20，HP為20，並對毒素與心靈傷害免疫。只要它至少有1點生命值，每5分鐘就恢復1點生命值。如果繩子的生命值降至0，它就會被摧毀。
