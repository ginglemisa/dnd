id: marvelous-pigments
name: 驚奇顏料
nameEn: "Marvelous Pigments"
source: srd
category: wondrous
group: consumable
rarity: very-rare
attunement: false
consumable: true
weight: 1
text: |-
  這個精緻的木盒內裝有1d4罐顏料與一支畫筆（合計重1磅）。

  使用畫筆並消耗1罐顏料，你可以繪製任意數量的立體物體與地形特徵（例如牆壁、門、樹木、花朵、武器、蛛網與坑洞），前提是這些元素全都限制在一個20呎立方體內。這項作業需時10分鐘（不論你創造的元素有多少），期間你必須留在該立方體內，並且需要專注。若你的專注中斷，或在作業完成前離開該立方體，所有繪製的元素都會消失，那罐顏料也就浪費了。

  作業完成時，所有繪製的物體與地形特徵都會成真。因此，在牆上畫一扇門會創造出一扇真正的門，可以打開通往門後的任何地方。繪製一個坑洞會創造出一個真正的坑洞，其整個深度都必須位於該20呎立方體內。

  一罐顏料所創造的物體，價值不可超過25 GP，且一罐顏料所創造的所有物體總價值不可超過500 GP。若你繪製價值更高的物體（例如一大堆黃金），它們看起來很逼真，但仔細檢查就會發現它們是由漿糊、餅乾或其他毫無價值的材料製成。

  若你繪製火焰或閃電等形式的能量，該能量會在你完成繪製的那一刻消散，不造成任何傷害。
