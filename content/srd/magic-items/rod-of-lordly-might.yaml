text: |-
  這根權杖有凸緣狀的頂端，並且作為一把魔法硬頭錘，使用它進行的攻擊檢定與傷害擲骰獲得+3加值。權杖具有六個與按鈕相關的特性，這些按鈕沿著權杖的柄排成一列。它還有另外三項特性，詳述如下。

  _按鈕。_ 你可以進行附贈動作按下下列按鈕之一；按鈕的效果持續到你按下另一個按鈕，或再次按下同一個按鈕為止，後者會使權杖恢復原本的形態：

  **按鈕1。** 權杖凸緣狀頂端的另一端會長出一把火焰之刃。火焰在半徑40呎內散發明亮光照，並再向外40呎散發微光光照，這把刃作為一把魔法長劍或短劍（由你選擇），命中時額外造成2d6火焰傷害。

  **按鈕2。** 權杖的凸緣狀頂端向下摺起，並彈出兩片新月形的刃，使權杖變成一把魔法戰斧，使用它進行的攻擊檢定與傷害擲骰獲得+3加值。

  **按鈕3。** 權杖的凸緣狀頂端向下摺起，權杖的尖端彈出一個矛尖，權杖的握柄延長為6呎長的柄，使權杖變成一把魔法短矛，使用它進行的攻擊檢定與傷害擲骰獲得+3加值。

  **按鈕4。** 權杖變成最長50呎的攀爬桿（長度由你指定），但權杖的按鈕仍會留在你伸手可及之處。在像花崗岩那樣堅硬的表面上，底部的尖釘和頂端的三個鉤子會固定住這根桿子。3吋長的水平橫桿會從兩側摺出，彼此相距1呎，形成一道梯子。這根桿子最多可承受4,000磅。更大的重量或缺乏穩固的固定，會使權杖恢復原本的形態。

  **按鈕5。** 權杖變成一支手持式攻城錘，並讓其使用者在為了突破門、路障及其他障礙而進行的力量（運動）檢定上獲得+10加值。

  **按鈕6。** 權杖呈現或維持原本的形態，並指出磁北方向。（如果在沒有磁北的地點使用權杖的這項功能，則什麼也不會發生。）權杖還會讓你得知你在地面下的大致深度，或在地面上的大致高度。

  _汲取生命。_ 當你用權杖進行近戰攻擊命中一個生物時，你可以迫使目標進行一次DC 17的體質豁免。豁免失敗時，目標額外受到4d6黯蝕傷害，且你恢復等同於該黯蝕傷害一半的生命值。此特性使用後，直到下次黎明前都無法再次使用。

  _麻痺。_ 當你用權杖進行近戰攻擊命中一個生物時，你可以迫使目標進行一次DC 17的體質豁免。豁免失敗時，目標陷入麻痺狀態1分鐘。目標在其每個回合結束時重複進行該豁免，成功則結束效果。此特性使用後，直到下次黎明前都無法再次使用。

  _恐嚇。_ 手持權杖時，你可以進行魔法動作，迫使你自身30呎內你看得見的每個生物進行一次DC 17的感知豁免。豁免失敗時，目標陷入恐慌狀態1分鐘。陷入恐慌狀態的目標在其每個回合結束時重複進行該豁免，成功則結束其身上的效果。此特性使用後，直到下次黎明前都無法再次使用。
