id: wand-of-secrets
name: 探秘魔杖
nameEn: "Wand of Secrets"
source: srd
category: wand
rarity: uncommon
attunement: false
use: held
pools:
  - { id: charges, label: 充能, max: 3, recover: dawn, amount: 1d3 }
actions:
  - { id: secrets, name: 探秘, type: magic, pool: charges, text: 60 呎內有暗門或陷阱時，魔杖脈動並指向離你最近的那一個。 }
text: |-
  這根魔杖有3次充能，每天黎明恢復1d3次已消耗的充能。手持它時，你可以進行魔法動作，消耗1次充能；若你60呎內有暗門或陷阱，魔杖會脈動並指向離你最近的那一個。
