id: feather-token
name: 羽符
nameEn: "Feather Token"
source: srd
category: wondrous
group: consumable
rarity: varies
attunement: false
options:
  - id: kind
    label: 種類
    choices:
      - { value: anchor, label: 錨, rarity: uncommon }
      - { value: bird, label: 鳥, rarity: rare }
      - { value: fan, label: 扇, rarity: uncommon }
      - { value: swan-boat, label: 天鵝船, rarity: rare }
      - { value: tree, label: 樹, rarity: uncommon }
      - { value: whip, label: 鞭, rarity: rare }
consumable: true
text: |-
  這件物體看起來像一根羽毛。羽符有不同的種類，各有不同的一次性效果。DM選擇羽符的種類，或在「羽符」表擲骰隨機決定。羽符的種類決定其稀有度。

  _錨（非常見）。_ 你可以進行魔法動作，將羽符觸碰到一艘小船或大船上。接下來24小時內，該船隻無法以任何方式移動。再次將羽符觸碰到該船隻上則結束此效果。效果結束時，羽符消失。

  _鳥（稀有）。_ 你可以進行魔法動作，將羽符拋向5呎高的空中。羽符消失，取而代之的是一隻巨大的彩色鳥。這隻鳥擁有**大鵬**的數據，但無法攻擊。它服從你的簡單命令，並能以最大速度飛行時承載最多500磅（每小時16英里，每天最多144英里，每飛行3小時須休息1小時），或以一半速度承載1,000磅。這隻鳥在一天內飛完最大距離後，或降到0生命值時消失。你可以進行魔法動作遣散這隻鳥。

  _扇（非常見）。_ 若你在小船或大船上，可以進行魔法動作，將羽符拋向最高10呎的空中。羽符消失，取而代之的是一把拍動的巨大扇子。扇子漂浮並產生強風。這陣風可以灌滿一艘船的船帆，使其速度在8小時內增加每小時5英里。你可以進行魔法動作遣散這把扇子。

  _天鵝船（稀有）。_ 你可以進行魔法動作，將羽符觸碰到一片直徑至少60呎的水域。羽符消失，取而代之的是一艘長50呎、寬20呎、形如天鵝的船。這艘船能自行推進，以每小時6英里的速度在水面上移動。你在船上時可以進行魔法動作，命令它移動或轉向最多90度。這艘船存在24小時後消失。你可以進行魔法動作遣散這艘船。

  _樹（非常見）。_ 你必須身處戶外才能使用這個羽符。你可以進行魔法動作，將它觸碰到地面上一個未被佔據的空間。羽符消失，原處長出一棵非魔法的橡樹。這棵樹高60呎，樹幹直徑5呎，頂端的樹枝向外展開成半徑20呎的範圍。

  _鞭（稀有）。_ 你可以進行魔法動作，將羽符擲向距離你10呎內的一點。羽符消失，取而代之的是一條漂浮的鞭子。你接著可以進行附贈動作，對鞭子10呎內的一個生物進行近戰法術攻擊，攻擊加值為+9。命中時，目標受到1d6 + 5力場傷害。

  作為附贈動作，你可以指揮鞭子飛行最多20呎，並對鞭子10呎內的一個生物重複進行攻擊。鞭子會在1小時後、你進行魔法動作遣散它時，或你死亡或陷入失能狀態時消失。

  **羽符**

  | 1d100 | 羽符 | 稀有度 |
  | --- | --- | --- |
  | 01–20 | 錨 | 非常見 |
  | 21–35 | 鳥 | 稀有 |
  | 36–50 | 扇 | 非常見 |
  | 51–65 | 天鵝船 | 稀有 |
  | 66–90 | 樹 | 非常見 |
  | 91–00 | 鞭 | 稀有 |
