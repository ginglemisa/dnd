# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: boots-of-striding-and-springing
name: 跑跳之靴
nameEn: "Boots of Striding and Springing"
source: srd
category: wondrous
group: wearable
rarity: uncommon
attunement: true
use: worn
effects: { movement: { minimum: 30, ignoreArmorStrength: true } }
hints:
  - text: 每回合一次，只花 10 呎移動力就能跳躍至多 30 呎。
text: |-
  穿戴這雙靴子時，你的速度變為30呎（除非你的速度原本更高），且你的速度不會因為你攜帶超過負重能力的重量或穿戴重甲而降低。

  在你的每個回合中，你可以有一次只花費10呎移動力就跳躍至多30呎。
