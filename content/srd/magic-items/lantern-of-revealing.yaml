id: lantern-of-revealing
name: 顯像提燈
nameEn: "Lantern of Revealing"
source: srd
category: wondrous
group: tool
rarity: uncommon
attunement: false
text: |-
  點燃時，這盞有罩的提燈用1品脫的油可燃燒6小時，在半徑30呎內散發明亮光照，並再向外30呎散發微光光照。隱形的生物與物體只要在提燈的明亮光照內就看得見。你可以進行使用動作降下燈罩，將提燈的光線降為半徑5呎的微光光照。
