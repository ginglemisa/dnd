text: |-
  這本書包含直覺與洞察練習，其文字充滿魔力。如果你在6天或更短的期間內花費48小時研讀書中內容並實踐其指引，你的感知提高2點，最高為30。這本書隨後失去魔力，但會在一個世紀後重新獲得。
