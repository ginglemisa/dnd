# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: armor-of-resistance
name: 抗性護甲
nameEn: "Armor of Resistance"
source: srd
category: armor
rarity: rare
attunement: true
base: { any: [ light-armor, medium-armor, heavy-armor ], label: "任意輕甲、中甲或重甲" }
options:
  - id: damageType
    label: 傷害類型
    choices:
      - { value: acid, label: 強酸, hints: [ { resistances: [ acid ] } ] }
      - { value: cold, label: 冷凍, hints: [ { resistances: [ cold ] } ] }
      - { value: fire, label: 火焰, hints: [ { resistances: [ fire ] } ] }
      - { value: force, label: 力場, hints: [ { resistances: [ force ] } ] }
      - { value: lightning, label: 閃電, hints: [ { resistances: [ lightning ] } ] }
      - { value: necrotic, label: 黯蝕, hints: [ { resistances: [ necrotic ] } ] }
      - { value: poison, label: 毒素, hints: [ { resistances: [ poison ] } ] }
      - { value: psychic, label: 心靈, hints: [ { resistances: [ psychic ] } ] }
      - { value: radiant, label: 光耀, hints: [ { resistances: [ radiant ] } ] }
      - { value: thunder, label: 雷鳴, hints: [ { resistances: [ thunder ] } ] }
text: |-
  穿戴這件護甲時，你對一種傷害類型具有抗性。該類型由DM選擇，或由DM在下表上擲骰隨機決定。

  | 1d10 | 傷害類型 | 1d10 | 傷害類型 |
  | --- | --- | --- | --- |
  | 1 | 強酸 | 6 | 黯蝕 |
  | 2 | 冷凍 | 7 | 毒素 |
  | 3 | 火焰 | 8 | 心靈 |
  | 4 | 力場 | 9 | 光耀 |
  | 5 | 閃電 | 10 | 雷鳴 |
