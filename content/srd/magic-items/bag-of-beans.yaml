id: bag-of-beans
name: 魔豆之袋
nameEn: "Bag of Beans"
source: srd
category: wondrous
group: container
rarity: rare
attunement: false
weight: 0.5
text: |-
  這個沉重的布袋被發現時裝有3d4顆乾豆。無論袋中有多少豆子，布袋都重半磅；當袋中不再有任何豆子時，它就成為非魔法物品。

  若你把一顆或多顆豆子倒出袋外，它們會在以豆子為中心、半徑10呎的球形區域內爆炸。所有倒出的豆子都在爆炸中被摧毀，球形區域內的每個生物（包括你）都進行一次DC 15的敏捷豁免，失敗者受到5d4力場傷害，成功者受到一半傷害。

  若你從袋中取出一顆豆子，將它種在泥土或沙中，然後澆水，這顆豆子會消失，並在1分鐘後於其被種下之處的地面產生一種效果。DM可以從下表選擇一種效果，或隨機決定。

  | 1d100 | 效果 |
  | --- | --- |
  | 01 | 長出5d4株毒菇。若有生物吃下毒菇，擲任意一顆骰子。擲出奇數時，食用者必須成功通過DC 15的體質豁免，否則受到5d6毒素傷害並陷入中毒狀態1小時。擲出偶數時，食用者獲得5d6臨時生命值，持續1小時。 |
  | 02–10 | 一道間歇泉噴發，向空中噴出水、啤酒、美乃滋、茶、醋、葡萄酒或油（由DM選擇）30呎高，持續1d4分鐘。 |
  | 11–20 | 長出一棵樹人。擲任意一顆骰子。擲出奇數時，這棵樹人是混亂邪惡。擲出偶數時，這棵樹人是混亂善良。 |
  | 21–30 | 一尊與你外貌相同、有生命但無法移動的石像升起，並對你口出威脅。若你離開它而其他人靠近，它會把你說成最邪惡的惡棍，並指示來者找到你並攻擊你。若你與石像處於同一個位面，它知道你在哪裡。24小時後，石像變為無生命。 |
  | 31–40 | 一堆燃著綠色火焰的營火冒出，燃燒24小時，或直到被撲滅為止。 |
  | 41–50 | 長出3株尖叫蕈。 |
  | 51–60 | 1d4 + 4隻亮粉紅色的蟾蜍爬出。每當有人觸碰一隻蟾蜍，它就會變成一隻由DM選擇的大型或更小的怪物，並依其陣營與本性行動。該怪物停留1分鐘，然後在一縷亮粉紅色的煙霧中消失。 |
  | 61–70 | 一隻飢餓的掘地獸從地下鑽出並發動攻擊。 |
  | 71–80 | 長出一棵果樹。樹上有1d10 + 20顆果實，其中1d8顆的作用如同隨機決定的藥水。這棵樹在1小時後消失。已摘下的果實會保留下來，並保留其魔法30天。 |
  | 81–90 | 冒出一窩1d4 + 3顆彩虹色的蛋。吃下蛋的生物進行一次DC 20的體質豁免。豁免成功時，該生物永久將其最低的屬性值提高1點；若有多個屬性值同為最低，隨機選擇其中一個。豁免失敗時，該生物因體內爆炸受到10d6力場傷害。 |
  | 91–95 | 一座底面為邊長60呎正方形的金字塔向上衝破地面。內部是一間墓室，裡面有一隻木乃伊、一隻木乃伊領主，或由DM選擇的其他不死生物。其石棺中有由DM選擇的寶藏。 |
  | 96–00 | 長出一株巨大的豆莖，高度由DM選擇。頂端通往DM選擇的地方，例如絕佳的景色、雲巨人的城堡，或另一個位面。 |
