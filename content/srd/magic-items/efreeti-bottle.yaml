# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: efreeti-bottle
name: 火巨靈囚瓶
nameEn: "Efreeti Bottle"
source: srd
category: wondrous
group: container
rarity: very-rare
attunement: false
text: |-
  當你進行魔法動作拔開這個彩繪黃銅瓶的瓶塞時，一團濃煙會從中湧出。在你的回合結束時，煙霧伴隨一道無害的火焰閃光消失，一個**火巨靈**出現在距離你30呎內一個未被佔據的空間。

  瓶子第一次被打開時，DM在下表擲骰以決定會發生什麼事。

  | 1d10 | 效果 |
  | --- | --- |
  | 1 | 火巨靈攻擊你。戰鬥5輪後，火巨靈消失，瓶子失去魔力。 |
  | 2–9 | 火巨靈聽得懂你的語言，並服從你的命令1小時，之後它回到瓶中，並有一個新的瓶塞將它封住。瓶塞在24小時內無法拔開。接下來瓶子被打開的兩次，都會發生相同的效果。若瓶子被打開第四次，火巨靈便會逃脫並消失，瓶子失去魔力。 |
  | 10 | 火巨靈聽得懂你的語言，並可以為你施放一次祈願術。它在實現願望後或1小時後消失，瓶子失去魔力。 |
