id: deck-of-illusions
name: 幻象牌組
nameEn: "Deck of Illusions"
source: srd
category: wondrous
group: curio
rarity: uncommon
attunement: false
actions:
  - { id: draw, name: 抽牌, type: magic, when: owned, text: 隨機抽一張牌扔到 30 呎內的一點，牌上出現幻象生物（依說明的表擲骰），持續到被解除；幻象無法造成傷害，DC 15 智力（調查）檢定可以識破。 }
  - { id: move, name: 移動幻象, type: magic, when: owned, text: 你在幻象 120 呎內且看得見它時，把它移動到它的牌 30 呎內的任何位置。 }
text: |-
  這個盒子裡裝著一組牌。完整的牌組有34張牌：32張繪有特定生物，2張為鏡面。作為寶藏被發現的牌組通常缺少1d20 − 1張牌。

  牌組的魔法只有在隨機抽牌時才會運作。你可以進行魔法動作，從牌組中隨機抽出一張牌，並將它扔到你30呎內某一點的地上。一個生物的幻象會在被扔出的牌上方形成，並持續到被解除為止，該生物依「幻象牌組」表擲骰決定。這張牌創造的幻象生物，外觀與行為都如同該種類的真實生物，只是無法造成任何傷害。當你在幻象生物120呎內且能看見它時，你可以進行魔法動作，將它移動到其牌30呎內的任何位置。

  任何與幻象生物的實體互動都會揭露它是假的，因為物體會穿過它。生物可以進行研究動作以視覺檢查幻象生物，成功通過DC 15的智力（調查）檢定即可識破它是幻象。幻象會持續到其牌被移動，或幻象被解除（使用_解除魔法_法術或類似效果）為止。當幻象結束時，牌上的圖像消失，該牌無法再次使用。

