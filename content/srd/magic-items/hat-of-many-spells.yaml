# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: hat-of-many-spells
name: 萬法帽
nameEn: "Hat of Many Spells"
source: srd
category: wondrous
group: wearable
rarity: very-rare
attunement: 由法師
use: held
text: |-
  這頂尖帽具有以下特性。

  _施法法器。_ 手持這頂帽子時，你可以將它當作施放法師法術的施法法器。你使用帽子施放的任何法術都會獲得一個特殊的姿勢成分：你必須把手伸進帽中，將法術「拉」出來。
  _未知法術。_ 手持這頂帽子時，你可以嘗試施放一個你不知道的1環以上法術。該法術必須在法師法術列表上，必須是你能施放的環階，且不能有價值超過1,000 GP的材料成分。決定法術後，你必須消耗一個該法術環階的法術位。接著，為判定你是否成功施放法術，進行一次智力（奧秘）檢定（DC為10加上法術的環階）。檢定成功時，你以法術的一般施放時間施放該法術，且在你完成一次短休或長休之前，不能再使用此特性。檢定失敗時，你無法施放該法術，而會發生一個隨機效果，由擲下表決定。

  你從帽子施放的任何法術都使用你的法術豁免DC與法術攻擊加值。

  | 1d100 | 效果 |
  | --- | --- |
  | 01–50 | 你施放一個隨機法術，擲1d10決定：擲出**1**：*變巨術/縮小術*（變巨效果）；擲出**2**：*變巨術/縮小術*（縮小效果）；擲出**3**：*妖火*；擲出**4**：*火球術*；擲出**5**：*造風術*；擲出**6**：*隱形術*（對你自己施放）；擲出**7**：*閃電束*；擲出**8**：*魅影之力*；擲出**9**：*變形術*；擲出**10**：*臭雲術*。 |
  | 51–55 | 你陷入震懾狀態，持續到你的下個回合結束，因為你以為剛才發生了什麼驚天動地的事。 |
  | 56–60 | 一群無害的蝴蝶充滿你30呎內的一個10呎立方體。蝶群在1分鐘後散去。 |
  | 61–65 | 你從帽中拉出一個非魔法物體。擲1d4決定物體：擲出**1**：一瓶強酸；擲出**2**：一瓶煉金火焰；擲出**3**：一根撬棍；擲出**4**：一支點燃的火把。 |
  | 66–70 | 你突發魔法病，陷入中毒狀態1小時。 |
  | 71–75 | 你陷入石化狀態，持續到你的下個回合結束。 |
  | 76–80 | 你從帽中拉出一個非魔法物體。擲1d4決定物體：擲出**1**：一把匕首；擲出**2**：一條一端綁著抓鉤的繩索；擲出**3**：一袋鐵蒺藜；擲出**4**：一顆價值50 GP的寶石。 |
  | 81–85 | 一個生物出現在盡可能靠近你的未被佔據的空間。該生物不受你控制，並如常行動，在1小時後或生命值降至0時消失。擲1d4決定生物：擲出**1**：**駱駝**；擲出**2**：**蟒蛇**；擲出**3**：**大象**；擲出**4**：**騾子**。 |
  | 86–90 | 一個敵對的**蝙蝠群**從帽中飛出，佔據你的空間並攻擊你。 |
  | 91–95 | 一道垂直的、直徑10呎的雙向傳送門在你30呎內一個未被佔據的空間開啟，通往另一個位面，並保持開啟直到你的下個回合結束。DM決定它通往何處。 |
  | 96–00 | 你從帽中拉出一件魔法物品。擲1d6決定物品的稀有度：擲出**1–3**：常見；擲出**4–5**：非常見；擲出**6**：稀有。DM選擇該物品，若它在1小時內沒有被消耗或摧毀，就會消失。 |
