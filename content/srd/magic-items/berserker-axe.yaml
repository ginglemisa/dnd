id: berserker-axe
name: 狂戰斧
nameEn: "Berserker Axe"
source: srd
category: weapon
rarity: rare
attunement: true
base: { from: [ 戰斧, 巨斧, 長戟 ] }
effects: { attack: 1, damage: 1 }
hints:
  - when: owned
    text: 用這件武器以外的武器攻擊有劣勢；持有期間受到傷害時須通過 DC 15 感知豁免，否則陷入狂暴。
  - panel: weapon
    text: 狂暴期間把最近的生物視為敵人並攻擊它（見說明）。
manualEffect: true
text: |-
  使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值。此外，當你與這件武器同調時，你已達到的每一個等級都使你的生命值上限增加1。

  _詛咒。_ 這件武器受到詛咒，與它同調會使詛咒延伸到你身上。只要你仍受到詛咒，你就不願與這件武器分離，隨時將它放在伸手可及之處。你使用這件武器以外的武器進行攻擊檢定時也具有劣勢。

  在你持有這件武器期間，每當有其他生物對你造成傷害，你必須成功通過DC 15的感知豁免，否則陷入狂暴。當你的回合開始時，若60呎內沒有你能看見或聽見的生物，這個狂暴狀態就會結束。

  狂暴期間，你把離你最近、你能看見或聽見的生物視為敵人。若有多個符合的生物，隨機選擇其中一個。在你的每個回合，你必須盡可能移動到靠近該生物的位置，並進行攻擊動作，以該生物為目標。若你無法靠近到能用這件武器攻擊該生物的距離，則在你用盡所有可用的移動力後，你的回合結束。若該生物死亡或你再也無法看見或聽見它，則你能看見或聽見的下一個最近的生物成為你的新目標。
