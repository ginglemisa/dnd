# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: ring-of-animal-influence
name: 支配動物戒指
nameEn: "Ring of Animal Influence"
source: srd
category: ring
rarity: rare
attunement: false
text: |-
  這枚戒指有3次充能，每天黎明恢復1d3次已消耗的充能。穿戴這枚戒指時，你可以消耗1次充能，從戒指施放下列法術之一（豁免DC 13）：

  - _化獸為友_
  - _恐懼術_（僅影響野獸）
  - _動物交談_
