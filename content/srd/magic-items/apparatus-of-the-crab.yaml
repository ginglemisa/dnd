id: apparatus-of-the-crab
name: 螃蟹裝置
nameEn: "Apparatus of the Crab"
source: srd
category: wondrous
group: tool
rarity: legendary
attunement: false
weight: 500
text: |-
  這件物品起初看起來是一個重500磅的密封鐵桶。桶上有一個隱藏的卡榫，成功通過DC 20的智力（調查）檢定可以發現。放開卡榫會打開桶子一端的艙門，讓兩個中型或更小的生物爬進去。十根控制桿排成一列設在遠端，每根都處於中立位置，可以上推或下拉。使用特定的控制桿時，裝置會變形為類似巨大龍蝦的樣子。

  _螃蟹裝置_是大型物體，具有以下數值：AC 20；HP 200；速度30呎，游泳速度30呎（若腿部未伸出，兩者皆為0呎）；免疫毒素傷害與心靈傷害。

  作為載具使用時，裝置需要一名駕駛。裝置的艙門關閉時，艙室是氣密且防水的。艙室內的空氣足夠呼吸10小時，再除以其中呼吸的生物數量。

  裝置會浮在水面上。它也可以潛入水下至900呎的深度。再往下，載具每分鐘因水壓受到2d6鈍擊傷害。

  艙室內的生物可以進行使用物件動作，將裝置的至多兩根控制桿上推或下拉。每次使用後，控制桿會回到中立位置。從左到右，每根控制桿的功能如「螃蟹裝置控制桿」表所示。

  **螃蟹裝置控制桿**

  | 控制桿 | 上推 | 下拉 |
  | --- | --- | --- |
  | 1 | 腿部伸出，讓裝置能夠行走與游泳。 | 腿部收回，使裝置的速度與游泳速度降為0，並使其無法從速度加值中獲益。 |
  | 2 | 前方窗板打開。 | 前方窗板關閉。 |
  | 3 | 側面窗板打開（每側兩片）。 | 側面窗板關閉（每側兩片）。 |
  | 4 | 兩隻螯從裝置的前側伸出。 | 螯收回。 |
  | 5 | 每隻伸出的螯進行以下近戰攻擊：命中+8，觸及5呎。命中：7（2d6）鈍擊傷害。 | 每隻伸出的螯進行以下近戰攻擊：命中+8，觸及5呎。命中：目標陷入擒抱狀態（脫離DC 15）。 |
  | 6 | 只要腿部已伸出，裝置就向前行走或游泳。 | 只要腿部已伸出，裝置就向後行走或游泳。 |
  | 7 | 只要腿部已伸出，裝置就逆時針轉90度。 | 只要腿部已伸出，裝置就順時針轉90度。 |
  | 8 | 形似眼睛的裝置在半徑30呎內散發明亮光照，並再向外30呎散發微光光照。 | 燈光關閉。 |
  | 9 | 若裝置在液體中，則下沉至多20呎。 | 若裝置在液體中，則上浮至多20呎。 |
  | 10 | 後方艙門解除密封並打開。 | 後方艙門關閉並密封。 |
