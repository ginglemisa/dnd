# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: energy-bow
name: 能量弓
nameEn: "Energy Bow"
source: srd
category: weapon
rarity: very-rare
attunement: true
base: { from: [ 長弓, 短弓 ] }
effects: { attack: 1, damage: 1, damageType: force }
hints:
  - panel: weapon
    text: 束縛之箭：可改為束縛目標（DC 15 力量豁免，見說明）。
actions:
  - { id: transport-arrow, name: 傳送之箭, type: magic, text: 射向 60 呎內你看得見的一個自願中型以下生物，或可放進 5 呎立方體、未被穿戴或攜帶的物體，把它傳送到你 10 呎內你看得見的未佔據空間。 }
  - { id: arrow-ladder, name: 能量階梯, type: magic, text: 朝 60 呎內的一面牆射出能量箭矢，形成最長 60 呎的魔法階梯，持續 1 分鐘。 }
text: |-
  使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值，這件武器沒有弓弦。每次你以射擊的姿勢拉開手臂時，一支由金色能量構成的魔法箭矢便會出現，已搭好並準備發射。這件武器產生的箭矢命中時造成力場傷害而非穿刺傷害，並在命中或未命中目標之後消失。在消失之前，這支箭矢在半徑20呎內散發明亮光照，並再向外20呎散發微光光照。

  這件武器具有以下額外特性。

  _束縛之箭。_ 每當你以這件武器對生物進行遠程攻擊時，你可以嘗試束縛目標，而非對其造成傷害。若箭矢命中，目標必須成功通過DC 15的力量豁免，否則陷入束縛狀態1分鐘。被箭矢束縛的生物可以作為動作進行一次DC 20的力量（運動）檢定，嘗試掙脫束縛；檢定成功則結束其身上的此效果。

  _傳送之箭。_ 作為魔法動作，你可以從這件武器射出一支能量箭矢，射向你周圍60呎內你能看見的一個目標。目標可以是一個自願的中型或更小的生物，或是一個未被穿戴或攜帶的物體，且該物體必須小到能放進邊長5呎的立方體內。箭矢會將目標傳送到距離你10呎內、你能看見的一個未被佔據的空間。

  _能量階梯。_ 作為魔法動作，你可以從這件武器朝距離你最遠60呎的一面牆壁射出一陣能量箭矢。這些箭矢會變成從牆上突出的發光梯級，在牆上形成一道最長60呎的魔法階梯。這道階梯持續1分鐘後消失。
