# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: robe-of-scintillating-colors
name: 虹光法袍
nameEn: "Robe of Scintillating Colors"
source: srd
category: wondrous
group: wearable
rarity: very-rare
attunement: true
use: worn
pools:
  - { id: charges, label: 充能, max: 3, recover: dawn, amount: 1d3 }
actions:
  - { id: dazzle, name: 炫目色彩, type: magic, pool: charges, text: 到你下個回合結束前，法袍散發半徑 30 呎明亮光照、再向外 30 呎微光光照，看得見你的生物攻擊你有劣勢；明亮光照內看得見你的生物 DC 15 感知豁免，失敗則震懾到效果結束。 }
text: |-
  這件法袍有3次充能，每天黎明恢復1d3次已消耗的充能。你穿戴它時，可以進行魔法動作並消耗1次充能，使這件衣物顯現出變幻不定的炫目色彩圖樣，直到你下個回合結束。在此期間，法袍在半徑30呎內散發明亮光照，並再向外30呎散發微光光照，且能看見你的生物對你的攻擊檢定具有劣勢。當法袍的力量被啟動時，處於明亮光照內且能看見你的任何生物，必須成功通過DC 15的感知豁免，否則陷入震懾狀態，直到效果結束。
