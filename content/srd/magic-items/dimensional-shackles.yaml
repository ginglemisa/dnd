actions:
  - { id: shackle, name: 銬上鐐銬, type: action, when: owned, text: 把鐐銬銬在失能的小型至大型生物身上，它無法傳送或前往其他位面；每 30 天可以 DC 30 力量（運動）檢定掙脫。這是使用物件動作。 }
text: |-
  你可以進行使用物件動作，將這副鐐銬銬在處於失能狀態的生物身上。鐐銬會調整大小，以適應小型至大型體型的生物。被鐐銬束縛的生物無法使用任何異次元移動的方式，包括傳送或前往不同位面。鐐銬不會阻止該生物穿過跨次元傳送門。

  你，以及你在使用鐐銬時指定的任何生物，可以進行使用物件動作來解開鐐銬。每30天一次，被束縛的生物可以進行一次DC 30的力量（運動）檢定。檢定成功時，該生物掙脫束縛並摧毀鐐銬。
