# yaml-language-server: $schema=../../schema/magic-item.schema.json
id: staff-of-healing
name: 治癒法杖
nameEn: "Staff of Healing"
source: srd
category: staff
rarity: rare
attunement: "由吟遊詩人、牧師或德魯伊"
base: { fixed: 長棍 }
text: |-
  這根法杖有10次充能。手持法杖時，你可以使用你的施法屬性調整值，從法杖施放下表中的一個法術。表格列出施放各法術需要消耗的充能次數。

  | 法術 | 充能消耗 |
  | --- | --- |
  | *療傷術* | 每環1次充能（4環法術最多4次） |
  | *次級復原術* | 2 |
  | *群體療傷術* | 5 |

  _恢復充能。_ 法杖每天黎明恢復1d6 + 4次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，法杖在一閃光芒中消失，永遠遺失。
