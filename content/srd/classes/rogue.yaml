# yaml-language-server: $schema=../../schema/class.schema.json
id: rogue
name: 盜賊
maxLevel: 8
subclassLevel: 3
defaultSubclass: thief
tagline: 盜賊以技巧、機動與偷襲抓住破綻，是各種難題的專家。
quote: 「夜色籠罩城市屋頂，她在瓦片間無聲移動。下方的守衛正交談著，她早已記住巡邏節奏。從貧民窟長大的她，學會用影子隱藏自己。當她輕巧落地，鎖扣發出微不可聞的聲響，寶箱緩緩開啟。遠方鐘聲響起，她已消失在巷弄深處。」
primaryAbility:
  all: [敏捷]
spellcasting:
  progression: none
hitDie: 8
saves: [智力, 敏捷]
skills:
  choose: 4
  from: [體操, 運動, 欺瞞, 洞悉, 威嚇, 調查, 察覺, 遊說, 巧手, 隱匿]
weapons: 簡易武器和具有靈巧或輕型屬性的軍用武器
tools: 盜賊工具
armor: 輕甲
proficiencies:
  weapons: { categories: [simple], martialWithProperty: [靈巧, 輕型] }
  armor: [light]
  tools: { fixed: 盜賊工具, field: rogue-fixed-tool-proficiency }
equipment:
  A:
    items: [皮甲, 匕首 ×2, 短劍, 短弓, 箭矢 ×20, 箭袋, 盜賊工具, 竊賊套組]
    gold: 8
  B: { gold: 100 }
progression:
  sneakAttackDice:
    label: 偷襲
    byLevel: {1: 1, 3: 2, 5: 3, 7: 4}
    format: "{}d6"
values:
  cunningStrikeDc: 8 + {proficiencyBonus} + {dexModifier}
features:
  - id: rogue-expertise-1
    level: 1
    name: 專精
    pdfMerge: true
    picks:
      - { kind: expertise, count: 2, from: proficient }
    text: |
      選擇 2 項**已熟練**的技能，獲得專精。\
      建議選擇：[[巧手]]、[[隱匿]]。
  - id: rogue-sneak-attack
    level: 1
    name: 偷襲
    pdfMerge: true
    actions:
      - mode: action
        key: dynamic-action-rogue-curated-sneak-attack
        append: [rogue-cunning-strike]
    tabletop: |
      **每回合 1 次**，以靈巧武器或遠程武器命中時，若符合下列任一條件，可額外造成 {sneakAttackDice|1d6} 傷害（與武器傷害類型相同）。

      - **具有優勢：**這次攻擊檢定具有優勢。
      - **友方在旁：**目標 5 呎內有至少 1 名未[[失能]]的友方，且這次攻擊檢定沒有劣勢。
    text: |
      **每回合 1 次**，以靈巧武器或遠程武器命中時，若符合下列任一條件，可額外造成 {sneakAttackDice|1d6} 傷害（與武器傷害類型相同）。

      - **具有優勢：**這次攻擊檢定具有優勢。
      - **友方在旁：**目標 5 呎內有至少 1 名未[[失能]]的友方，且這次攻擊檢定沒有劣勢。

      偷襲傷害骰隨盜賊等級增加，見「盜賊特性」表的「偷襲」欄。
  - id: rogue-thieves-cant
    level: 1
    name: 盜賊黑話
    grants:
      languages: [{ id: thieves-cant, field: language-extra-1 }]
    picks:
      - { kind: language, count: 1, from: any, exclude: [thieves-cant], fields: [language-extra-2] }
    text: |
      你學會盜賊黑話，並額外學會 1 種語言。
  - id: rogue-weapon-mastery
    level: 1
    name: 武器精通
    pdfMerge: true
    picks:
      - { kind: weaponMastery, count: 2, from: proficient, changeOn: longRest }
    text: |
      從你熟練的武器中選擇 2 種，取得其精通屬性，例如匕首、短弓。

      - **改選時機：**每次長休後可改選。
  - id: rogue-cunning-action
    level: 2
    name: 靈巧動作
    actions:
      - mode: bonus
        key: dynamic-bonus-class-1vms7ce
    text: |
      在你的回合中，可用**附贈**執行下列其中一項：疾走、撤離、躲藏。
  - id: rogue-subclass
    level: 3
    name: 盜賊子職
    type: subclass
    text: |
      選擇一個盜賊子職，並隨等級提升獲得子職能力。基本規則僅提供「妙手」。
  - id: rogue-steady-aim
    level: 3
    name: 手穩就準
    actions:
      - mode: bonus
        key: dynamic-bonus-rogue-curated-steady-aim
        legacyKeys: [dynamic-bonus-class-kwgie8]
    text: |
      以**附贈**啟動，你本回合的下一次攻擊檢定具有優勢。

      - **使用條件：**你本回合尚未移動。
      - **代價：**啟動後，你的速度變為 0，直到回合結束。
  - id: rogue-ability-score-improvement-4
    level: 4
    name: 屬性值提升
    feat: level
    text: |
      選擇 1 個符合條件的專長，也可以選擇「屬性值提升」。
  - id: rogue-cunning-strike
    level: 5
    name: 靈巧打擊
    pdfMerge: true
    text: |
      造成偷襲傷害時，可放棄部分偷襲傷害骰，套用 1 種靈巧打擊效果。

      - **豁免 DC：**效果需要豁免時，DC＝{cunningStrikeDc|8＋熟練加值＋敏捷調整值}。

      #### 靈巧打擊效果

      - **淬毒（消耗 1d6）：**目標進行體質豁免，失敗時[[中毒]] 1 分鐘；它可在每個回合結束時重新豁免，成功即結束。使用此效果時，你必須攜帶製毒師工具。
      - **摔絆（消耗 1d6）：**大型或更小的目標進行敏捷豁免，失敗時[[倒地]]。
      - **撤步（消耗 1d6）：**攻擊後，你可立刻移動最多一半速度，且不引發[[藉機攻擊]]。
  - id: rogue-uncanny-dodge
    level: 5
    name: 直覺閃避
    hint: {panels: [overview]}
    pdfMerge: true
    actions:
      - mode: reaction
        key: dynamic-reaction-class-5f9k5x
    text: |
      當你看得見的攻擊者以攻擊命中你時，你可用**反應**讓該次攻擊的傷害減半（無條件捨去）。
  - id: rogue-expertise-6
    level: 6
    name: 專精
    picks:
      - { kind: expertise, count: 2, from: proficient }
    text: |
      再選擇 2 項**已熟練**的技能，獲得專精。
  - id: rogue-evasion
    level: 7
    name: 反射閃避
    hint: {panels: [skills], hideWhenIncapacitated: true}
    summary: 敏捷豁免原可使傷害減半時，成功則不受傷害，失敗則傷害減半。
    pdfMerge: true
    text: |
      受到允許進行**敏捷豁免以使傷害減半**的效應影響時：

      - **豁免成功：**不受傷害。
      - **豁免失敗：**只受一半傷害。
      - **使用限制：**你處於[[失能]]狀態時無法使用。
  - id: rogue-reliable-talent
    level: 7
    name: 可靠才能
    hint: {panels: [skills]}
    summary: 當你使用有熟練的技能或工具進行屬性檢定時，可以將d20骰中9或以下的結果視為10。
    pdfMerge: true
    text: |
      使用**有熟練的技能或工具**進行屬性檢定時，可將 d20 擲出 9 或以下的結果視為 10。
  - id: rogue-ability-score-improvement-8
    level: 8
    name: 屬性值提升
    feat: level
    text: |
      選擇 1 個符合條件的專長，也可以選擇「屬性值提升」。
srd:
  overview: |
    **盜賊核心特質**

    | --- | --- |
    | 關鍵屬性 | 敏捷 |
    | 生命骰 | 每個盜賊等級一顆 D8 |
    | 豁免熟練項 | 敏捷與智力 |
    | 技能熟練項 | 選擇 4 項：體操、運動、欺瞞、洞悉、威嚇、調查、察覺、遊說、巧手或隱匿 |
    | 武器熟練項 | 簡易武器與具有靈巧或輕型屬性的軍用武器 |
    | 工具熟練項 | 盜賊工具 |
    | 護甲訓練 | 輕甲 |
    | 初始裝備 | 選擇 A 或 B：（A）皮甲、2 把匕首、短劍、短弓、20 支箭矢、箭袋、盜賊工具、竊賊套組與 8 GP；或（B）100 GP |

    ### 成為盜賊……

    #### 作為 1 級角色

    - 獲得「盜賊核心特質」表中的所有特質。
    - 獲得盜賊的 1 級特性，這些特性列在「盜賊特性」表中。

    #### 作為兼職角色

    - 獲得「盜賊核心特質」表中的下列特質：生命骰、盜賊技能列表中一項自選技能的熟練、盜賊工具熟練，以及輕甲訓練。
    - 獲得盜賊的 1 級特性，這些特性列在「盜賊特性」表中。

    ### 盜賊職業特性

    身為盜賊，你的盜賊等級達到指定等級時，會獲得下列職業特性。這些特性都列在「盜賊特性」表中。

    **盜賊特性**

    | 等級 | 熟練加值 | 職業特性 | 偷襲 |
    | --- | --- | --- | --- |
    | 1 | +2 | 專精、偷襲、盜賊黑話、武器精通 | 1d6 |
    | 2 | +2 | 靈巧動作 | 1d6 |
    | 3 | +2 | 盜賊子職、手穩就準 | 2d6 |
    | 4 | +2 | 屬性值提升 | 2d6 |
    | 5 | +3 | 靈巧打擊、直覺閃避 | 3d6 |
    | 6 | +3 | 專精 | 3d6 |
    | 7 | +3 | 反射閃避、可靠才能 | 4d6 |
    | 8 | +3 | 屬性值提升 | 4d6 |
    | 9 | +4 | 子職特性 | 5d6 |
    | 10 | +4 | 屬性值提升 | 5d6 |
    | 11 | +4 | 強化靈巧打擊 | 6d6 |
    | 12 | +4 | 屬性值提升 | 6d6 |
    | 13 | +5 | 子職特性 | 7d6 |
    | 14 | +5 | 詭詐打擊 | 7d6 |
    | 15 | +5 | 滑溜心智 | 8d6 |
    | 16 | +5 | 屬性值提升 | 8d6 |
    | 17 | +6 | 子職特性 | 9d6 |
    | 18 | +6 | 飄忽不定 | 9d6 |
    | 19 | +6 | 傳奇恩惠 | 10d6 |
    | 20 | +6 | 逢凶化吉 | 10d6 |
  features:
    - level: 1
      name: "專精 Expertise"
      text: |
        你從自己已熟練的技能中選擇兩項，獲得專精。如果你熟練巧手與隱匿，建議選擇這兩項。

        盜賊 6 級時，你再從已熟練的技能中選擇兩項，獲得專精。
    - level: 1
      name: "偷襲 Sneak Attack"
      text: |
        你懂得不著痕跡地出手，也懂得利用敵人分心的時機。每回合一次，你以攻擊檢定命中一個生物時，如果這次檢定具有優勢，而且這次攻擊使用的是靈巧武器或遠程武器，你可以對這個生物額外造成 1d6 傷害。額外傷害的類型與武器的傷害類型相同。

        如果你至少有一名盟友在目標 5 呎內，這名盟友沒有陷入失能狀態，而且你這次攻擊檢定沒有劣勢，這次攻擊檢定就不需要具有優勢。額外傷害會隨你的盜賊等級提升而增加，見「盜賊特性」表的「偷襲」欄。
    - level: 1
      name: "盜賊黑話 Thieves' Cant"
      text: |
        你在各個社群裡施展盜賊本領時，順道學會了各種語言。你懂盜賊黑話，另外還懂一種自選的語言，這種語言從「創建角色」的各語言表中選擇。
    - level: 1
      name: "武器精通 Weapon Mastery"
      text: |
        你受過武器訓練，可以使用兩種武器的精通屬性，種類由你從自己熟練的武器中選擇，例如匕首與短弓。

        每次完成長休時，你都可以更換你所選的武器種類。例如，你可以改成使用彎刀與短劍的精通屬性。
    - level: 2
      name: "靈巧動作 Cunning Action"
      text: |
        你腦筋轉得快，身手又靈活，因此能迅速移動與行動。在你的回合中，你可以用附贈動作執行下列其中一個動作：疾走、撤離或躲藏。
    - level: 3
      name: "盜賊子職 Rogue Subclass"
      text: |
        你獲得一個自選的盜賊子職。妙手子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的盜賊等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的盜賊等級，你就會獲得該特性。
    - level: 3
      name: "手穩就準 Steady Aim"
      text: |
        你用附贈動作，讓自己在當前回合的下一次攻擊檢定具有優勢。只有這個回合還沒移動過，你才能使用這項特性；使用之後，你的速度為 0，直到當前回合結束為止。
    - level: 4
      name: "屬性值提升 Ability Score Improvement"
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。盜賊 8、10、12 與 16 級時，你會再次獲得這項特性。
    - level: 5
      name: "靈巧打擊 Cunning Strike"
      text: |
        你琢磨出運用偷襲的各種巧妙手法。你造成偷襲傷害時，可以加入下列其中一個靈巧打擊效果。每個效果都有消耗骰數，也就是你為了加入這個效果必須放棄的偷襲傷害骰數量。你要在擲骰之前移除這些骰子，效果則在這次攻擊造成傷害之後立即發生。例如，如果你加入淬毒效果，就要在擲骰之前從偷襲傷害中移除 1d6。

        如果靈巧打擊效果需要進行豁免，豁免 DC 等於 8 加上你的敏捷調整值與熟練加值。

        _淬毒 Poison（消耗：1d6）。_ 你在這一擊裡下毒，迫使目標進行體質豁免。豁免失敗時，目標陷入中毒狀態 1 分鐘。陷入中毒的目標在它自己的每個回合結束時重複這次豁免，成功就結束它身上的這個效果。

        要使用這個效果，你必須隨身帶著製毒師工具。

        _摔絆 Trip（消耗：1d6）。_ 如果目標的體型是大型或更小，它必須成功通過敏捷豁免，否則陷入倒地狀態。

        _撤步 Withdraw（消耗：1d6）。_ 這次攻擊之後，你立即移動，距離最多為你速度的一半，而且這次移動不會引發藉機攻擊。
    - level: 5
      name: "直覺閃避 Uncanny Dodge"
      text: |
        當一個你看得見的攻擊者以攻擊檢定命中你時，你可以用反應動作，把這次攻擊對你造成的傷害減半（無條件捨去）。
    - level: 7
      name: "反射閃避 Evasion"
      text: |
        你能身手靈活地躲開某些危險。當你受到某個效果影響，而這個效果允許你用敏捷豁免把傷害減為一半時，你改為在豁免成功時不受傷害，豁免失敗時只受一半傷害。如果你陷入失能狀態，就無法使用這項特性。
    - level: 7
      name: "可靠才能 Reliable Talent"
      text: |
        每當你進行屬性檢定，而且這次檢定用到你熟練的技能或工具時，如果 d20 擲出 9 或更低，你可以把擲出的點數視為 10。
    - level: 11
      name: "強化靈巧打擊 Improved Cunning Strike"
      text: |
        你造成偷襲傷害時，最多可以使用兩種靈巧打擊效果，並為每種效果支付消耗骰數。
    - level: 14
      name: "詭詐打擊 Devious Strikes"
      text: |
        你練就了詭詐地運用偷襲的新手法。下列效果現在納入你的靈巧打擊選項。

        _恍神 Daze（消耗：2d6）。_ 目標必須成功通過體質豁免，否則它在自己的下個回合只能做下列其中一件事：移動、執行一個動作，或執行一個附贈動作。

        _悶棍 Knock Out（消耗：6d6）。_ 目標必須成功通過體質豁免，否則陷入昏迷狀態，持續 1 分鐘，或直到它受到任何傷害為止。陷入昏迷的目標在它自己的每個回合結束時重複這次豁免，成功就結束它身上的這個效果。

        _障目 Obscure（消耗：3d6）。_ 目標必須成功通過敏捷豁免，否則陷入失明狀態，直到它自己的下個回合結束。
    - level: 15
      name: "滑溜心智 Slippery Mind"
      text: |
        你心思機巧，格外難以操控。你獲得感知豁免與魅力豁免的熟練。
    - level: 18
      name: "飄忽不定 Elusive"
      text: |
        你太善於躲避，攻擊者很少能佔到你的上風。除非你陷入失能狀態，否則任何對你進行的攻擊檢定都無法具有優勢。
    - level: 19
      name: "傳奇恩惠 Epic Boon"
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇暗夜精魂恩惠。
    - level: 20
      name: "逢凶化吉 Stroke of Luck"
      text: |
        你有一種奇妙的本事，能在需要的時候成功。你的 D20 檢定失敗時，可以把這次擲骰結果變成 20。

        使用這項特性後，你必須完成短休或長休才能再次使用。
