# yaml-language-server: $schema=../../schema/class.schema.json
id: fighter
name: 戰士
maxLevel: 8
subclassLevel: 3
defaultSubclass: champion
tagline: 戰士精通武器與戰技，能適應各種戰鬥方式。
quote: 「鋼鐵碰撞聲在城牆上回響，他穩穩握住長劍，步伐不亂。無論敵人是盜匪還是訓練有素的士兵，他總能找到破綻。年輕時在軍團中摸爬滾打的他，早已習慣命令與混亂並存的戰場。當新兵在他身後顫抖，他只是簡短地說了一句：站穩，菜鳥，準備戰鬥。」
primaryAbility:
  any: [力量, 敏捷]
spellcasting:
  progression: none
hitDie: 10
saves: [力量, 體質]
skills:
  choose: 2
  from: [體操, 馴獸, 運動, 歷史, 洞悉, 威嚇, 遊說, 察覺, 求生]
weapons: 簡易武器和軍用武器
tools: 無
armor: 輕甲、中甲、重甲和盾牌
proficiencies:
  weapons: { categories: [simple, martial] }
  armor: [light, medium, heavy, shield]
equipment:
  A:
    options:
      - id: strength-default
        label: 力量型
        items: [鎖子甲, 巨劍, 連枷, 標槍 ×8, 地城套組]
        gold: 4
      - id: dexterity-default
        label: 敏捷型
        items: [鑲釘皮甲, 彎刀, 短劍, 長弓, 箭矢 ×20, 箭袋, 地城套組]
        gold: 11
  B: { gold: 155 }
progression:
  secondWindUses:
    label: 回氣
    byLevel: {1: 2, 4: 3}
  weaponMastery:
    label: 武器精通
    byLevel: {1: 3, 4: 4}
values:
  secondWindHealing: 1d10 + {level}
  secondWindUsesText: {formula: "{secondWindUses}", format: "{} 次"}
features:
  - id: fighter-fighting-style
    level: 1
    name: 戰鬥風格
    feat: style
    text: |
      你磨練戰鬥技藝，獲得 1 個自選的「戰鬥風格」專長。推薦：防禦。

      - **升級替換：**每提升 1 級戰士，可將此專長換成另一個「戰鬥風格」專長。
  - id: fighter-second-wind
    level: 1
    name: 回氣
    pdfMerge: true
    resource:
      key: fighter-second-wind
      uses: secondWindUses
      recover: {short: 1, long: all}
    actions:
      - mode: bonus
        key: dynamic-bonus-fighter-qmmfue
        legacyKeys: [dynamic-bonus-class-fj2om2]
        resource: fighter-second-wind
        append: [fighter-tactical-shift]
    text: |
      你的身心儲有底力，可在關鍵時刻以**附贈**恢復「{secondWindHealing|1d10 + 戰士等級}」的生命值。

      - **使用次數：**{secondWindUsesText|起始 2 次，之後依「戰士特性」表的「回氣」欄增加}。**短休後恢復 1 次**，長休後全部恢復。
  - id: fighter-weapon-mastery
    level: 1
    name: 武器精通
    pdfMerge: true
    picks:
      - { kind: weaponMastery, count: weaponMastery, from: proficient, changeOn: longRest }
    text: |
      任選 3 種簡易或軍用武器，取得其精通屬性。

      - **改選時機：**每次長休後，可透過武器練習替換其中 1 種。
      - **數量提升：**可選數量隨戰士等級增加，見「戰士特性」表的「武器精通」欄。
  - id: fighter-action-surge
    level: 2
    name: 動作如潮
    pdfMerge: true
    tableName: 動作如潮（一次使用）
    resource:
      key: fighter-action-surge
      uses: 1
      recover: {short: all, long: all}
    actions:
      - mode: action
        key: dynamic-action-fighter-1870147
        legacyKeys: [dynamic-action-class-action-surge]
        resource: fighter-action-surge
    text: |
      你可以短暫突破極限，在自己的回合中執行 1 個**額外動作**，但不能用於魔法動作。

      - **使用次數：**1 次，**短休或長休後恢復**。
  - id: fighter-tactical-mind
    level: 2
    name: 戰術思維
    hint: {panels: [overview, skills]}
    summary: 屬性檢定失敗時，可消耗 1 次回氣，在該檢定加上 1d10；若仍失敗，不消耗回氣。
    pdfMerge: true
    text: |
      你在戰場內外都具有卓越的戰術思維。**屬性檢定失敗**時，可消耗 1 次回氣使用次數，改為擲 1d10 加入該次檢定，而非恢復生命值，使結果可能變為成功。

      - **仍然失敗：**若檢定依舊失敗，不會消耗回氣使用次數。
  - id: fighter-subclass
    level: 3
    name: 戰士子職
    type: subclass
    text: |
      選擇一個戰士子職，並隨等級提升獲得子職能力。基本規則僅提供「勇士」。
  - id: fighter-ability-score-improvement-4
    level: 4
    name: 屬性值提升
    feat: level
    text: |
      選擇 1 個符合條件的專長，也可以選擇「屬性值提升」。
  - level: 4
    text: |
      **回氣補充：**戰士達到 4 級時，回氣使用次數提升為 3 次，詳見「戰士特性」表。
  - level: 4
    text: |
      **武器精通補充：**戰士達到 4 級時，武器精通可選數量提升為 4 種，詳見「戰士特性」表。
  - id: fighter-extra-attack
    level: 5
    name: 額外攻擊
    pdfMerge: true
    actions:
      - mode: action
        key: dynamic-action-fighter-113ebtz
    text: |
      你在自己的回合執行**攻擊動作**時，可以攻擊 2 次。
  - id: fighter-tactical-shift
    level: 5
    name: 戰術轉移
    pdfMerge: true
    actions:
      - mode: movement
        key: dynamic-movement-fighter-1liysqo
    text: |
      以**附贈**使用回氣時，你可以移動至多等同於你速度一半的距離，且不會引發[[藉機攻擊]]。
  - id: fighter-ability-score-improvement-6
    level: 6
    name: 屬性值提升
    feat: level
    text: |
      選擇 1 個符合條件的專長，也可以選擇「屬性值提升」。
  - id: fighter-ability-score-improvement-8
    level: 8
    name: 屬性值提升
    feat: level
    text: |
      選擇 1 個符合條件的專長，也可以選擇「屬性值提升」。
srd:
  overview: |
    **戰士核心特質**

    | --- | --- |
    | 關鍵屬性 | 力量或敏捷 |
    | 生命骰 | 每個戰士等級一顆 D10 |
    | 豁免熟練項 | 力量與體質 |
    | 技能熟練項 | 選擇 2 項：體操、馴獸、運動、歷史、洞悉、威嚇、遊說、察覺或求生 |
    | 武器熟練項 | 簡易武器與軍用武器 |
    | 護甲訓練 | 輕甲、中甲、重甲與盾牌 |
    | 初始裝備 | 選擇 A、B 或 C：（A）鎖子甲、巨劍、連枷、8 支標槍、地城套組與 4 GP；（B）鑲釘皮甲、彎刀、短劍、長弓、20 支箭矢、箭袋、地城套組與 11 GP；或（C）155 GP |

    ### 成為戰士……

    #### 作為 1 級角色

    - 獲得「戰士核心特質」表中的所有特質。
    - 獲得戰士的 1 級特性，這些特性列在「戰士特性」表中。

    #### 作為兼職角色

    - 獲得「戰士核心特質」表中的下列特質：生命骰、軍用武器熟練，以及輕甲、中甲與盾牌訓練。
    - 獲得戰士的 1 級特性，這些特性列在「戰士特性」表中。

    ### 戰士職業特性

    身為戰士，你的戰士等級達到指定等級時，會獲得下列職業特性。這些特性都列在「戰士特性」表中。

    **戰士特性**

    | 等級 | 熟練加值 | 職業特性 | 回氣 | 武器精通 |
    | --- | --- | --- | --- | --- |
    | 1 | +2 | 戰鬥風格、回氣、武器精通 | 2 | 3 |
    | 2 | +2 | 動作如潮（一次使用）、戰術思維 | 2 | 3 |
    | 3 | +2 | 戰士子職 | 2 | 3 |
    | 4 | +2 | 屬性值提升 | 3 | 4 |
    | 5 | +3 | 額外攻擊、戰術轉移 | 3 | 4 |
    | 6 | +3 | 屬性值提升 | 3 | 4 |
    | 7 | +3 | 子職特性 | 3 | 4 |
    | 8 | +3 | 屬性值提升 | 3 | 4 |
    | 9 | +4 | 不屈（一次使用）、戰術大師 | 3 | 4 |
    | 10 | +4 | 子職特性 | 4 | 5 |
    | 11 | +4 | 兩次額外攻擊 | 4 | 5 |
    | 12 | +4 | 屬性值提升 | 4 | 5 |
    | 13 | +5 | 不屈（兩次使用）、鑽研攻擊 | 4 | 5 |
    | 14 | +5 | 屬性值提升 | 4 | 5 |
    | 15 | +5 | 子職特性 | 4 | 5 |
    | 16 | +5 | 屬性值提升 | 4 | 6 |
    | 17 | +6 | 動作如潮（兩次使用）、不屈（三次使用） | 4 | 6 |
    | 18 | +6 | 子職特性 | 4 | 6 |
    | 19 | +6 | 傳奇恩惠 | 4 | 6 |
    | 20 | +6 | 三次額外攻擊 | 4 | 6 |
  features:
    - level: 1
      name: 戰鬥風格
      text: |
        你磨練了自己的戰鬥技藝，獲得一個自選的「戰鬥風格」專長（見「專長」）。推薦選擇「防禦」。

        每當你獲得一個戰士等級，都可以把你選的專長換成另一個「戰鬥風格」專長。
    - level: 1
      name: 回氣
      text: |
        你有一股有限的身心耐力可以汲取。你可以用附贈動作動用這股耐力，恢復生命值，數量等於 1d10 加上你的戰士等級。

        你可以使用這項特性兩次。你完成短休時，恢復 1 次已消耗的使用次數；完成長休時，恢復所有已消耗的使用次數。

        你的戰士等級達到特定等級時，會獲得這項特性的更多使用次數，見「戰士特性」表的「回氣」欄。
    - level: 1
      name: 武器精通
      text: |
        你受過武器訓練，可以使用三種簡易武器或軍用武器的精通屬性，種類由你選擇。每次完成長休時，你都可以進行武器操練，把其中一種選擇換成另一種武器。

        當你的戰士等級達到特定等級，你能使用精通屬性的武器種類會增加，見「戰士特性」表的「武器精通」欄。
    - level: 2
      name: 動作如潮
      text: |
        你能在片刻之間逼自己突破平常的極限。在你的回合中，你可以多執行一個動作，但這個動作不能是魔法動作。

        使用這項特性後，你必須完成短休或長休才能再次使用。從 17 級開始，你在每次休息之前可以使用兩次，但每個回合只能使用一次。
    - level: 2
      name: 戰術思維
      text: |
        不論在戰場上或戰場外，你都有戰術頭腦。你的屬性檢定失敗時，可以消耗 1 次回氣使用次數，逼自己朝成功邁進：這次你不恢復生命值，而是擲 1d10，把擲出的數字加到這次屬性檢定上，有可能讓檢定轉為成功。如果檢定仍然失敗，這次回氣使用次數不會被消耗。
    - level: 3
      name: 戰士子職
      text: |
        你獲得一個自選的戰士子職。勇士子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的戰士等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的戰士等級，你就會獲得該特性。
    - level: 4
      name: 屬性值提升
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。戰士 6、8、12、14 與 16 級時，你會再次獲得這項特性。
    - level: 5
      name: 額外攻擊
      text: |
        每當你在自己的回合執行攻擊動作，你可以攻擊兩次，而不是一次。
    - level: 5
      name: 戰術轉移
      text: |
        每當你用附贈動作啟動回氣，都可以移動最多為你速度一半的距離，而且這次移動不會引發藉機攻擊。
    - level: 9
      name: 不屈
      text: |
        你豁免失敗時，可以重擲這次豁免，重擲獲得等於你戰士等級的加值。你必須採用新的擲骰結果。使用這項特性後，你必須完成長休才能再次使用。

        從 13 級開始，你在完成長休前可以使用這項特性兩次；從 17 級開始，則可以使用三次。
    - level: 9
      name: 戰術大師
      text: |
        你用武器攻擊時，如果你能使用這把武器的精通屬性，就可以在這次攻擊中把這個屬性換成「推離」、「削弱」或「緩速」。
    - level: 11
      name: 兩次額外攻擊
      text: |
        每當你在自己的回合執行攻擊動作，你可以攻擊三次，而不是一次。
    - level: 13
      name: 鑽研攻擊
      text: |
        你會揣摩對手，從自己的每一次攻擊中學習。你對某個生物進行攻擊檢定卻未命中時，在你的下個回合結束前，你對那個生物進行的下一次攻擊檢定具有優勢。
    - level: 19
      name: 傳奇恩惠
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇戰鬥造詣恩惠。
    - level: 20
      name: 三次額外攻擊
      text: |
        每當你在自己的回合執行攻擊動作，你可以攻擊四次，而不是一次。
