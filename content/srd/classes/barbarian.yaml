# yaml-language-server: $schema=../../schema/class.schema.json
id: barbarian
name: 野蠻人
maxLevel: 8
subclassLevel: 3
defaultSubclass: berserker
tagline: 野蠻人以狂暴強化力量與韌性，是勇猛的前線戰士。
quote: 「戰場邊緣的風帶著血腥味，他赤著上身踏入泥濘，胸口刻著古老圖紋。敵軍的長矛手還來不及列陣，他已怒吼著衝入人群，像暴風撕裂隊形。曾在部族被焚毀的夜裡失去一切的他，如今只信任手中的巨斧與心中翻騰的怒火。遠處的弓手艾琳顫聲呼喊他的名字，他卻已聽不見，只剩戰鬥的鼓動在血液裡轟鳴。」
primaryAbility:
  all: [力量]
spellcasting:
  progression: none
hitDie: 12
saves: [力量, 體質]
skills:
  choose: 2
  from: [馴獸, 運動, 威嚇, 自然, 察覺, 求生]
weapons: 簡易、軍用武器
tools: 無
armor: 輕甲、中甲、盾牌
proficiencies:
  weapons: { categories: [simple, martial] }
  armor: [light, medium, shield]
equipment:
  A:
    items: [巨斧, 手斧 ×4, 探索套組]
    gold: 15
  B: { gold: 75 }
progression:
  rageUses:
    label: 狂暴次數
    byLevel: {1: 2, 3: 3, 6: 4}
  rageDamage:
    label: 狂暴傷害
    byLevel: {1: 2}
    format: +{}
  weaponMastery:
    label: 武器精通
    byLevel: {1: 2, 4: 3}
values:
  rageUsesText: {formula: "{rageUses}", format: "{} 次"}
  rageDamageText: {formula: "{rageDamage}", format: "目前 +{}"}
  frenzyDice: "{rageDamage}d6"
features:
  - id: barbarian-rage
    level: 1
    name: 狂暴
    pdfMerge: true
    resource:
      key: barbarian-rage
      uses: rageUses
      recover: {short: 1, long: all}
    actions:
      - mode: bonus
        key: dynamic-bonus-barbarian-3te1cj
        resource: barbarian-rage
        append: [barbarian-instinctive-pounce]
    text: |
      你**未穿重甲**時，可以用**附贈**進入狂暴。

      - **使用次數：**{rageUsesText|見「野蠻人特性」表的「狂暴次數」欄}。**短休後恢復 1 次**，**長休後全部恢復**。

      #### 狂暴期間

      - **抗性：**你對鈍擊、穿刺、揮砍傷害具有[[抗性]]。
      - **狂暴傷害：**你用力量造成的傷害可加上狂暴傷害，{rageDamageText|數值見「野蠻人特性」表}。
      - **力量優勢：**你的力量檢定與力量豁免具有**優勢**。
      - **施法限制：**你不能施法，也不能維持專注。

      #### 持續與延長

      狂暴持續到你的下個回合結束。若要延長，每回合至少做到下列一項：

      - **攻擊：**對敵人進行攻擊檢定。
      - **迫使豁免：**讓敵人進行豁免。
      - **附贈：**再用一次**附贈**延長狂暴。

      **結束條件：**你穿上重甲、陷入[[失能]]，或狂暴超過 10 分鐘時，狂暴結束。
  - id: barbarian-unarmored-defense
    level: 1
    name: 無甲防禦
    pdfMerge: true
    text: |
      你沒穿護甲時，AC = 10 + 敏捷調整值 + 體質調整值。

      - **盾牌：**使用此特性時仍可持盾。
  - id: barbarian-weapon-mastery
    level: 1
    name: 武器精通
    picks:
      - { kind: weaponMastery, count: weaponMastery, from: proficient, weapons: melee, changeOn: longRest }
    text: |
      從你熟練的近戰武器中選擇 2 種，取得其精通屬性，例如巨斧、手斧。

      - **改選時機：**每次長休後可替換其中 1 種。
      - **數量提升：**可選數量隨野蠻人等級增加，見「野蠻人特性」表的「武器精通」欄。
  - id: barbarian-danger-sense
    level: 2
    name: 險境感知
    hint: {panels: [skills], hideWhenIncapacitated: true}
    summary: 你的敏捷豁免有優勢。
    pdfMerge: true
    text: |
      只要你未陷入[[失能]]狀態，你的敏捷豁免就具有**優勢**。
  - id: barbarian-reckless-attack
    level: 2
    name: 魯莽攻擊
    pdfMerge: true
    actions:
      - mode: action
        key: dynamic-action-class-8jjnkp
        label: 魯莽
    text: |
      在你的回合中，第一次用力量攻擊前可以宣告魯莽攻擊。

      - **好處：**本回合你的力量攻擊具有**優勢**。
      - **代價：**直到你的下個回合開始前，攻擊你的檢定也具有**優勢**。
  - id: barbarian-subclass
    level: 3
    name: 野蠻人子職
    type: subclass
    text: |
      選擇一個野蠻人子職，並隨等級提升獲得子職能力。基本規則僅提供「狂戰士道途」。
  - id: barbarian-primal-knowledge
    level: 3
    name: 先祖學識
    picks:
      - { kind: skill, count: 1, from: class }
    hint: {panels: [skills]}
    summary: 狂暴時你可用力量做以下技能檢定，體操、威嚇、察覺、隱匿、求生。
    text: |
      你額外獲得 1 項技能熟練，並能在狂暴時以力量進行部分技能檢定。

      - **額外熟練：**從野蠻人初始技能列表中選擇 1 項技能，獲得熟練。
      - **狂暴期間：**你可用力量進行[[體操]]、[[威嚇]]、[[察覺]]、[[隱匿]]、[[求生]]檢定。
  - level: 3
    text: |
      **狂暴補充：**野蠻人達到 3 級時，狂暴次數提升為 3 次，詳見「野蠻人特性」表。
  - id: barbarian-ability-score-improvement-4
    level: 4
    name: 屬性值提升
    feat: level
    text: |
      選擇 1 個符合條件的專長，也可以選擇「屬性值提升」。
  - level: 4
    text: |
      **武器精通補充：**野蠻人達到 4 級時，武器精通可選數量提升為 3 種，詳見「野蠻人特性」表。
  - id: barbarian-extra-attack
    level: 5
    name: 額外攻擊
    pdfMerge: true
    actions:
      - mode: action
        key: dynamic-action-barbarian-113ebtz
    text: |
      你在自己的回合執行**攻擊動作**時，可以攻擊 2 次。
  - id: barbarian-fast-movement
    level: 5
    name: 快速移動
    hint: {panels: [overview]}
    pdfMerge: true
    actions:
      - mode: movement
        key: dynamic-movement-barbarian-18h2p2v
    text: |
      你**未穿重甲**時，速度增加 10 呎。
  - level: 6
    text: |
      **狂暴補充：**野蠻人達到 6 級時，狂暴次數提升為 4 次，詳見「野蠻人特性」表。
  - id: barbarian-feral-instinct
    level: 7
    name: 野性直覺
    hint: {panels: [overview]}
    summary: 你的先攻擲骰有優勢。
    pdfMerge: true
    text: |
      你的先攻擲骰具有**優勢**。
  - id: barbarian-instinctive-pounce
    level: 7
    name: 本能飛撲
    pdfMerge: true
    actions:
      - mode: movement
        key: dynamic-movement-barbarian-1iw4zkg
        tabletopHidden: true
      - mode: bonus
        key: dynamic-bonus-barbarian-1iw4zkg
        tabletopHidden: true
    text: |
      你以**附贈**進入狂暴時，可以同時移動，距離至多為你速度的一半。
  - id: barbarian-ability-score-improvement-8
    level: 8
    name: 屬性值提升
    feat: level
    text: |
      選擇 1 個符合條件的專長，也可以選擇「屬性值提升」。
srd:
  overview: |
    **野蠻人核心特質**

    | --- | --- |
    | 關鍵屬性 | 力量 |
    | 生命骰 | 每個野蠻人等級一顆 D12 |
    | 豁免熟練項 | 力量與體質 |
    | 技能熟練項 | 選擇 2 項：馴獸、運動、威嚇、自然、察覺或求生 |
    | 武器熟練項 | 簡易武器與軍用武器 |
    | 護甲訓練 | 輕甲、中甲與盾牌 |
    | 初始裝備 | 選擇 A 或 B：（A）巨斧、4 把手斧、探索套組與 15 GP；或（B）75 GP |

    ### 成為野蠻人……

    #### 作為 1 級角色

    - 獲得「野蠻人核心特質」表中的所有特質。
    - 獲得野蠻人的 1 級特性，這些特性列在「野蠻人特性」表中。

    #### 作為兼職角色

    - 獲得「野蠻人核心特質」表中的下列特質：生命骰、軍用武器熟練與盾牌訓練。
    - 獲得野蠻人的 1 級特性，這些特性列在「野蠻人特性」表中。

    ### 野蠻人職業特性

    身為野蠻人，你的野蠻人等級達到指定等級時，會獲得下列職業特性。這些特性都列在「野蠻人特性」表中。

    **野蠻人特性**

    | 等級 | 熟練加值 | 職業特性 | 狂暴次數 | 狂暴傷害 | 武器精通 |
    | --- | --- | --- | --- | --- | --- |
    | 1 | +2 | 狂暴、無甲防禦、武器精通 | 2 | +2 | 2 |
    | 2 | +2 | 險境感知、魯莽攻擊 | 2 | +2 | 2 |
    | 3 | +2 | 野蠻人子職、先祖學識 | 3 | +2 | 2 |
    | 4 | +2 | 屬性值提升 | 3 | +2 | 3 |
    | 5 | +3 | 額外攻擊、快速移動 | 3 | +2 | 3 |
    | 6 | +3 | 子職特性 | 4 | +2 | 3 |
    | 7 | +3 | 野性直覺、本能飛撲 | 4 | +2 | 3 |
    | 8 | +3 | 屬性值提升 | 4 | +2 | 3 |
    | 9 | +4 | 殘暴打擊 | 4 | +3 | 3 |
    | 10 | +4 | 子職特性 | 4 | +3 | 4 |
    | 11 | +4 | 頑強狂暴 | 4 | +3 | 4 |
    | 12 | +4 | 屬性值提升 | 5 | +3 | 4 |
    | 13 | +5 | 強化殘暴打擊 | 5 | +3 | 4 |
    | 14 | +5 | 子職特性 | 5 | +3 | 4 |
    | 15 | +5 | 持久狂暴 | 5 | +3 | 4 |
    | 16 | +5 | 屬性值提升 | 5 | +4 | 4 |
    | 17 | +6 | 強化殘暴打擊 | 6 | +4 | 4 |
    | 18 | +6 | 不屈之力 | 6 | +4 | 4 |
    | 19 | +6 | 傳奇恩惠 | 6 | +4 | 4 |
    | 20 | +6 | 原初勇者 | 6 | +4 | 4 |
  features:
    - level: 1
      name: "狂暴 Rage"
      text: |
        你能讓一股名為「狂暴」的原初力量灌注全身，這股力量賦予你非凡的威力與韌性。如果你沒穿重甲，就可以用附贈動作進入狂暴。

        你能進入狂暴的次數取決於野蠻人等級，見「野蠻人特性」表的「狂暴次數」欄。你完成短休時，恢復 1 次已用掉的次數；完成長休時，恢復全部已用掉的次數。

        狂暴生效期間，適用下列規則。

        _傷害抗性 Damage Resistance。_ 你對鈍擊、穿刺與揮砍傷害具有抗性。

        _狂暴傷害 Rage Damage。_ 你用力量進行攻擊（武器或徒手打擊皆可）並對目標造成傷害時，這次傷害可以加上一項加值。加值會隨你的野蠻人等級提升而增加，見「野蠻人特性」表的「狂暴傷害」欄。

        _力量優勢 Strength Advantage。_ 你的力量檢定與力量豁免具有優勢。

        _不能專注或施法 No Concentration or Spells。_ 你不能維持專注，也不能施放法術。

        _持續時間 Duration。_ 狂暴持續到你的下個回合結束為止；如果你穿上重甲或陷入失能狀態，狂暴會提早結束。如果到了你的下個回合，狂暴仍在生效，你可以做下列其中一件事，讓狂暴再延長一輪：

        - 對一名敵人進行攻擊檢定。
        - 迫使一名敵人進行豁免。
        - 用附贈動作延長狂暴。

        每次延長，狂暴都會持續到你的下個回合結束為止。一次狂暴最多可以維持 10 分鐘。
    - level: 1
      name: "無甲防禦 Unarmored Defense"
      text: |
        你沒穿任何護甲時，基礎護甲等級（AC）等於 10 加上你的敏捷調整值與體質調整值。你使用盾牌時，仍能獲得這項好處。
    - level: 1
      name: "武器精通 Weapon Mastery"
      text: |
        你受過武器訓練，可以使用兩種簡易近戰武器或軍用近戰武器的精通屬性，種類由你選擇，例如巨斧與手斧。每次完成長休時，你都可以進行武器操練，把其中一種選擇換成另一種武器。

        當你的野蠻人等級達到特定等級，你能使用精通屬性的武器種類會增加，見「野蠻人特性」表的「武器精通」欄。
    - level: 2
      name: "險境感知 Danger Sense"
      text: |
        你能不可思議地察覺事態何時不對勁，讓你在躲避危險時佔得先機。除非你陷入失能狀態，否則你的敏捷豁免具有優勢。
    - level: 2
      name: "魯莽攻擊 Reckless Attack"
      text: |
        你可以拋開一切防禦上的顧慮，以更加兇猛的方式攻擊。在你的回合中，你進行第一次攻擊檢定時，可以決定魯莽地攻擊。這麼做的話，直到你的下個回合開始前，你用力量進行的攻擊檢定具有優勢；但在這段期間，對你進行的攻擊檢定也具有優勢。
    - level: 3
      name: "野蠻人子職 Barbarian Subclass"
      text: |
        你獲得一個自選的野蠻人子職。狂戰士道途子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的野蠻人等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的野蠻人等級，你就會獲得該特性。
    - level: 3
      name: "先祖學識 Primal Knowledge"
      text: |
        你從野蠻人 1 級可選的技能清單中，再選擇一項技能，獲得該技能的熟練。

        此外，狂暴生效期間，你在嘗試某些任務時可以引導原初力量：每當你用下列其中一項技能進行屬性檢定，即使這項檢定平常使用其他屬性，你也可以改用力量檢定進行：體操、威嚇、察覺、隱匿或求生。使用這項能力時，你的力量代表原初力量在你體內奔流，磨練你的身手、氣勢與感官。
    - level: 4
      name: "屬性值提升 Ability Score Improvement"
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。野蠻人 8、12 與 16 級時，你會再次獲得這項特性。
    - level: 5
      name: "額外攻擊 Extra Attack"
      text: |
        每當你在自己的回合執行攻擊動作，你可以攻擊兩次，而不是一次。
    - level: 5
      name: "快速移動 Fast Movement"
      text: |
        你沒穿重甲時，速度增加 10 呎。
    - level: 7
      name: "野性直覺 Feral Instinct"
      text: |
        你的直覺極為敏銳，因此你的先攻擲骰具有優勢。
    - level: 7
      name: "本能飛撲 Instinctive Pounce"
      text: |
        你用附贈動作進入狂暴時，可以在同一個附贈動作中移動，距離最多為你速度的一半。
    - level: 9
      name: "殘暴打擊 Brutal Strike"
      text: |
        若你使用了魯莽攻擊，可以在自己的回合中挑選一次用力量進行的攻擊檢定，放棄這次檢定的任何優勢。所選的這次攻擊檢定不能具有劣勢。若這次攻擊命中，目標額外受到 1d10 傷害，傷害類型與該武器或徒手打擊所造成的相同，你還可以造成一種自選的殘暴打擊效果。可選的效果如下。

        _猛力一擊 Forceful Blow。_ 目標被往遠離你的方向直線推開 15 呎。接著你可以朝目標直線移動，距離最多為你速度的一半，且不會引發藉機攻擊。

        _斷筋一擊 Hamstring Blow。_ 直到你的下個回合開始前，目標的速度減少 15 呎。同一個目標一次只會受到一個斷筋一擊影響，以最近的那一次為準。
    - level: 11
      name: "頑強狂暴 Relentless Rage"
      text: |
        即使身受重傷，你的狂暴也能讓你繼續戰鬥。若你在狂暴期間生命值降到 0，但沒有當場死亡，可以進行一次 DC 10 體質豁免。豁免成功時，你的生命值改為等同你野蠻人等級兩倍的數值。

        第一次之後，你每次使用這項特性，DC 就提高 5。你完成短休或長休時，DC 重設為 10。
    - level: 13
      name: "強化殘暴打擊 Improved Brutal Strike"
      text: |
        你磨練出猛烈攻擊的新招式。下列效果現在也加入你的殘暴打擊可選效果。

        _踉蹌一擊 Staggering Blow。_ 目標進行的下一次豁免具有劣勢；此外，直到你的下個回合開始前，目標都無法進行藉機攻擊。

        _破甲一擊 Sundering Blow。_ 在你的下個回合開始前，除你以外的生物對目標進行的下一次攻擊檢定獲得 +5 加值。一次攻擊檢定只能獲得一次破甲一擊的加值。
    - level: 15
      name: "持久狂暴 Persistent Rage"
      text: |
        你擲先攻時，可以恢復所有已消耗的狂暴次數。以這種方式恢復狂暴次數後，你必須完成一次長休，才能再這麼做。

        此外，你的狂暴猛烈至極，現在不需要你每輪做任何事來延長，就能持續 10 分鐘。若你陷入昏迷狀態（只陷入失能狀態則不會）或穿上重甲，狂暴會提前結束。
    - level: 17
      name: "強化殘暴打擊 Improved Brutal Strike"
      text: |
        你的殘暴打擊額外傷害提高為 2d10。此外，每當你使用殘暴打擊特性時，可以使用兩種不同的殘暴打擊效果。
    - level: 18
      name: "不屈之力 Indomitable Might"
      text: |
        若你力量檢定或力量豁免的總值低於你的力量值，你可以用力量值取代該總值。
    - level: 19
      name: "傳奇恩惠 Epic Boon"
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇勢不可擋恩惠。
    - level: 20
      name: "原初勇者 Primal Champion"
      text: |
        你是原初力量的化身。你的力量值與體質值各提高 4，最高為 25。
