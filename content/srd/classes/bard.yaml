    | 豁免熟練項 | 敏捷與魅力 |
    | 技能熟練項 | 任選 3 項技能（見「進行遊戲」） |
    | 武器熟練項 | 簡易武器 |
    | 工具熟練項 | 選擇 3 種樂器（見「裝備」） |
    | 護甲訓練 | 輕甲 |
    | 初始裝備 | 選擇 A 或 B：（A）皮甲、2 把匕首、一件自選樂器、藝人套組與 19 GP；或（B）90 GP |

    ### 成為吟遊詩人……

    #### 作為 1 級角色

    - 獲得「吟遊詩人核心特質」表中的所有特質。
    - 獲得吟遊詩人的 1 級特性，這些特性列在「吟遊詩人特性」表中。

    #### 作為兼職角色

    - 獲得「吟遊詩人核心特質」表中的下列特質：生命骰、一項自選技能的熟練、一種自選樂器的熟練，以及輕甲訓練。
    - 獲得吟遊詩人的 1 級特性，這些特性列在「吟遊詩人特性」表中。你可用的法術位請依「創建角色」中的兼職規則決定。

