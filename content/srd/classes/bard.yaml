# yaml-language-server: $schema=../../schema/class.schema.json
id: bard
name: 吟遊詩人
maxLevel: 8
subclassLevel: 3
defaultSubclass: lore
tagline: 吟遊詩人能施法、激勵同伴，又善於交涉，是隊伍裡的萬金油。
quote: 「酒館燭火搖曳，他撥動魯特琴的弦，旋律在空氣中流轉。原本劍拔弩張的傭兵們漸漸放下武器，連門口的守衛都露出微笑。沒有人知道，他在歌聲中悄悄改變了人心。曾在王城流浪的他，靠著故事與音樂換得一席之地。當一名神秘女子遞來密信，他的笑容不變，卻已準備踏入另一場未知的冒險。」
primaryAbility:
  all: [魅力]
spellcasting:
  progression: full
hitDie: 8
saves: [敏捷, 魅力]
skills:
  choose: 3
  from: any
weapons: 簡易武器
tools: 任選三種樂器
armor: 輕甲
equipment:
  A: |-
    皮甲、匕首 ×2、藝人套組、19 金幣\
    自選一個樂器（風笛、鼓、揚琴、長笛、角號、魯特琴、里拉琴、排簫、蘆笛、提琴）
  B: 90 金幣
  note: "**藝人套組：**背包、睡袋、鈴鐺、牛眼提燈、戲服 ×3、鏡子、油瓶 ×8、單日口糧 ×9、火絨盒、水袋。"
progression:
  inspirationDie:
    label: 激勵骰
    byLevel: {1: 6, 5: 8}
    format: D{}
  cantrips:
    label: 戲法
    byLevel: {1: 2, 4: 3}
  preparedSpells:
    label: 準備法術
    byLevel: {1: 4, 2: 5, 3: 6, 4: 7, 5: 9, 6: 10, 7: 11, 8: 12}
  spellSlots1:
    label: １環
    byLevel: {1: 2, 2: 3, 3: 4}
  spellSlots2:
    label: ２環
    byLevel: {1: null, 3: 2, 4: 3}
  spellSlots3:
    label: ３環
    byLevel: {1: null, 5: 2, 6: 3}
  spellSlots4:
    label: ４環
    byLevel: {1: null, 7: 1, 8: 2}
values:
  inspirationUses: max(1, {chaModifier})
  inspirationRecovery:
    byLevel: {5: 短休或長休後全部恢復}
features:
  - id: bard-inspiration
    level: 1
    name: 吟遊詩人激勵
    resource:
      key: bard-inspiration
      uses: inspirationUses
      recover: {long: all}
      recoverByLevel: {5: {short: all, long: all}}
    actions:
      - mode: bonus
        key: dynamic-bonus-class-r7asqs
        resource: bard-inspiration
        append: [bard-font-of-inspiration]
    text: |
      你可以用話語、音樂或表演鼓舞同伴，給予對方 1 顆激勵骰。

      - **使用方式：**以**附贈**指定你 60 呎內聽得到或看得到你的 1 個生物。同一生物同時只能持有 1 顆你的激勵骰。
      - **效果：**激勵骰持續 1 小時。目標在 **d20 檢定失敗**後，可擲這顆激勵骰並加到結果上；擲出後骰子消耗。
      - **激勵骰：**{inspirationDie|起始為 d6，之後依「吟遊詩人特性」表提升}。
      - **使用次數：**等同魅力調整值（至少 1 次），**{inspirationRecovery|長休後全部恢復}**。
  - id: bard-spellcasting
    level: 1
    name: 施法
    text: |
      你使用**魅力**施展「吟遊詩人法術列表」中的法術，並可用樂器作為施法法器。

      - **戲法：**起始學會 2 個吟遊詩人戲法。每提升 1 級吟遊詩人，可將 1 個戲法換成另一個吟遊詩人戲法。\
        推薦：舞光術、惡言相加。
      - **準備法術：**起始準備 4 個 1 環吟遊詩人法術，之後依「吟遊詩人特性」表增加。數量提高時，從吟遊詩人法術列表補選至表列數量；只能準備你有對應環階法術位的法術。\
        推薦：魅惑人類、七彩噴射、不諧低語、治癒真言。
      - **升級替換：**每提升 1 級吟遊詩人，可將 1 個已準備法術換成另一個你可施放的吟遊詩人法術。
      - **法術位：**數量見「吟遊詩人特性」表，長休後全部恢復。
      - **額外法術：**其他特性給予的額外準備法術不計入上限。

      例如 3 級吟遊詩人可準備共 6 個 1～2 環法術。
  - id: bard-expertise
    level: 2
    name: 專精
    text: |
      選擇 2 項你已熟練的技能改為**專精**，這些技能的熟練加值加倍。
  - id: bard-jack-of-all-trades
    level: 2
    name: 萬事通
    text: |
      進行**未熟練**的能力檢定時，額外加上熟練加值的一半（無條件捨去）。
  - id: bard-subclass
    level: 3
    name: 吟遊詩人子職
    type: subclass
    text: |
      選擇一個吟遊詩人子職，並隨等級提升獲得子職能力。基本規則僅提供「逸聞學院」。
  - id: bard-ability-score-improvement-4
    level: 4
    name: 屬性值提升
    text: |
      選擇 1 個符合條件的專長，也可以選擇「屬性值提升」。
    afterFeatChoice: |
      **施法補充：**吟遊詩人達到 4 級時，你也會透過「施法」特性額外學會 1 個吟遊詩人戲法。
  - id: bard-font-of-inspiration
    level: 5
    name: 激勵之源
    tabletop: |
      吟遊詩人激勵的恢復變得更快，也能用法術位換回使用次數。

      - **法術位轉換：**可消耗 1 個法術位恢復 1 次激勵使用次數，**不需動作**。
    text: |
      吟遊詩人激勵的恢復變得更快，也能用法術位換回使用次數。

      - **恢復時機：****短休或長休後**恢復所有已消耗的激勵使用次數。
      - **法術位轉換：**可消耗 1 個法術位恢復 1 次激勵使用次數，**不需動作**。
  - level: 5
    text: |
      **吟遊詩人激勵補充：**吟遊詩人達到 5 級時，激勵骰提升為 d8，詳見「吟遊詩人特性」表。
  - id: bard-countercharm
    level: 7
    name: 反迷惑
    actions:
      - mode: reaction
        key: dynamic-reaction-class-ul9dq
    text: |
      你或你 30 呎內的 1 個生物在對抗[[魅惑]]或[[恐慌]]狀態的豁免檢定中失敗時，你可以使失敗者重新進行該豁免。

      - **使用：**反應。
      - **重新豁免：**新的檢定具有**優勢**。
  - id: bard-ability-score-improvement-8
    level: 8
    name: 屬性值提升
    text: |
      選擇 1 個符合條件的專長，也可以選擇「屬性值提升」。
