  features:
    - level: 1
      name: 吟遊詩人激勵
      text: |
        你能透過話語、音樂或舞蹈，以超自然的方式激勵他人。這份激勵以你的吟遊詩人激勵骰表示，這顆骰子是 d6。

        _使用吟遊詩人激勵。_ 你可以用附贈動作，激勵你 60 呎內另一個看得到或聽得到你的生物。這個生物獲得一顆你的吟遊詩人激勵骰。一個生物同一時間只能持有一顆吟遊詩人激勵骰。

        在接下來的 1 小時內，這個生物有一次機會：它的 D20 檢定失敗時，可以擲這顆吟遊詩人激勵骰，把擲出的數字加到 d20 的結果上，有可能因此轉敗為勝。吟遊詩人激勵骰擲出後就會消耗。

        _使用次數。_ 你能給出吟遊詩人激勵骰的次數等於你的魅力調整值（至少 1 次）；完成長休時，你恢復所有已消耗的使用次數。

        _更高等級。_ 你的吟遊詩人等級達到特定等級時，吟遊詩人激勵骰會改變，見「吟遊詩人特性」表的「激勵骰」欄。這顆骰子在 5 級時變成 d8，10 級時變成 d10，15 級時變成 d12。
    - level: 1
      name: 施法
      text: |
        你透過吟遊詩人的技藝學會了施展法術。施法規則見「法術」。下文說明你如何把這些規則套用在吟遊詩人法術上；吟遊詩人法術列在本職業說明後面的吟遊詩人法術列表中。

        _戲法。_ 你從吟遊詩人法術列表中自選兩個戲法並學會。建議選擇_舞光術_與_惡言相加_。

        每當你提升一個吟遊詩人等級，可以把你的一個戲法換成吟遊詩人法術列表中另一個自選的戲法。

        你的吟遊詩人等級達到 4 級與 10 級時，會從吟遊詩人法術列表中再學會一個自選戲法，見「吟遊詩人特性」表的「戲法」欄。

        _法術位。_ 「吟遊詩人特性」表列出你有多少法術位可以施放 1 環以上的法術。完成長休時，你恢復所有已消耗的法術位。

        _1 環以上的準備法術。_ 你要準備一份清單，列出能用這項特性施放的 1 環以上法術。一開始，從吟遊詩人法術列表中選擇四個 1 環法術。建議選擇_魅惑人類_、_七彩噴射_、_不諧低語_與_治癒真言_。

        清單上的法術數量會隨你的吟遊詩人等級提升而增加，見「吟遊詩人特性」表的「準備法術」欄。每當這個數字增加，就從吟遊詩人法術列表中選擇更多法術，直到清單上的法術數量與表中的數字相同。所選法術的環階，必須是你有法術位的環階。例如，如果你是 3 級吟遊詩人，你的準備法術清單可以有六個法術，1 環與 2 環任意搭配。

        如果其他吟遊詩人特性讓你始終準備某些法術，這些法術不計入你能用這項特性準備的法術數量；除此之外，這些法術對你來說都算是吟遊詩人法術。

        _更換準備法術。_ 每當你提升一個吟遊詩人等級，可以把清單上的一個法術換成另一個吟遊詩人法術，換上的法術必須是你有法術位的環階。

        _施法屬性。_ 你的吟遊詩人法術以魅力作為施法屬性。

        _施法法器。_ 你可以用一件樂器作為吟遊詩人法術的施法法器。
    - level: 2
      name: 專精
      text: |
        你從自己已熟練的技能中選擇兩項，獲得專精（見「規則詞彙表」）。如果你熟練表演與說服，建議選擇這兩項。

        吟遊詩人 9 級時，你再從已熟練的技能中選擇兩項，獲得專精。
    - level: 2
      name: 萬事通
      text: |
        你進行屬性檢定時，如果這次檢定使用的技能你沒有熟練，而且沒有因為其他原因加上熟練加值，你可以加上熟練加值的一半（無條件捨去）。

        例如，你進行力量（運動）檢定，但沒有運動熟練，就可以在這次檢定加上熟練加值的一半。
    - level: 3
      name: 吟遊詩人子職
      text: |
        你獲得一個自選的吟遊詩人子職。逸聞學院子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的吟遊詩人等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的吟遊詩人等級，你就會獲得該特性。
    - level: 4
      name: 屬性值提升
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。吟遊詩人 8、12 與 16 級時，你會再次獲得這項特性。
    - level: 5
      name: 激勵之源
      text: |
        現在你完成短休或長休時，都會恢復所有已消耗的吟遊詩人激勵使用次數。

        此外，你可以消耗一個法術位（不需要動作），恢復 1 次已消耗的吟遊詩人激勵使用次數。
    - level: 7
      name: 反迷惑
      text: |
        你能用音符或威能之語，擾亂影響心智的效果。如果你或你 30 呎內的一個生物，對抗會施加魅惑或恐慌狀態的效果時豁免失敗，你可以用反應動作讓這次豁免重擲，重擲具有優勢。
    - level: 10
      name: 魔法奧祕
      text: |
        你從各式各樣的魔法傳統中習得了奧祕。每當你升到一個吟遊詩人等級（包括這一級），且「吟遊詩人特性」表的「準備法術」數字增加時，新增的準備法術都可以從吟遊詩人、牧師、德魯伊與法師法術列表中挑選。所選法術對你而言視為吟遊詩人法術（各職業的法術列表見該職業的章節）。此外，每當你替換一個為這個職業準備的法術時，也可以換成上述列表中的法術。
    - level: 18
      name: 卓越激勵
      text: |
        你擲先攻時，若吟遊詩人激勵的剩餘次數少於 2 次，就恢復已消耗的次數，直到剩餘 2 次為止。
    - level: 19
      name: 傳奇恩惠
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇法術回憶恩惠。
    - level: 20
      name: 創世之言
      text: |
        你已掌握兩句創世之言：生之言與死之言。因此，你始終準備著_律令醫療_與_律令死亡_這兩個法術。你施展其中任一法術時，可以再指定第二個生物為目標，條件是該生物位於第一個目標 10 呎內。
