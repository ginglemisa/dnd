  appendix:
    - name: 魔能祈喚選項
      text: |
        魔能祈喚選項依英文名稱的字母順序排列。

        #### 苦痛魔爆 Agonizing Blast

        _先決條件：2 級以上契術師、一個能造成傷害的契術師戲法_

        從你學會的契術師戲法中，選擇一個能造成傷害的戲法。你可以把你的魅力調整值加到這個法術的傷害擲骰上。

        _可重複 Repeatable。_ 你可以多次獲得這個祈喚。每次獲得時，選擇另一個符合條件的戲法。

        #### 幽影護甲 Armor of Shadows

        你可以不消耗法術位對自己施放_法師護甲_。

        #### 星移步法 Ascendant Step

        _先決條件：5 級以上契術師_

        你可以不消耗法術位對自己施放_浮空術_。

        #### 魔鬼視界 Devil's Sight

        _先決條件：2 級以上契術師_

        在你 120 呎內的微光光照與黑暗中，不論是魔法還是非魔法的，你都能正常視物。

        #### 饕餮魔刃 Devouring Blade

        _先決條件：12 級以上契術師、「饑渴魔刃」祈喚_

        你的「饑渴魔刃」祈喚帶來的額外攻擊特性，給你的是兩次額外的攻擊，而不是一次。

        #### 魔能意志 Eldritch Mind

        你為了維持專注而進行的體質豁免具有優勢。

        #### 魔能斬擊 Eldritch Smite

        _先決條件：5 級以上契術師、「刃之魔契」祈喚_

        每回合一次，你用契約武器命中一個生物時，可以消耗一個契約魔法法術位，對目標額外造成 1d8 力場傷害，這個法術位每一環階再加 1d8；如果目標的體型是巨型或更小，你還可以讓它陷入倒地狀態。

        #### 魔能長槍 Eldritch Spear

        _先決條件：2 級以上契術師、一個能造成傷害的契術師戲法_

        從你學會的契術師戲法中，選擇一個能造成傷害、而且射程為 10 呎以上的戲法。你施放這個法術時，它的射程會增加，增加的呎數等於你的契術師等級乘以 30。

        _可重複 Repeatable。_ 你可以多次獲得這個祈喚。每次獲得時，選擇另一個符合條件的戲法。

        #### 邪魔活力 Fiendish Vigor

        _先決條件：2 級以上契術師_

        你可以不消耗法術位對自己施放_虛假生命_。用這項特性施放這個法術時，你不用為臨時生命值擲骰，而是自動取得這顆骰子的最大點數。

        #### 共視感官 Gaze of Two Minds

        _先決條件：5 級以上契術師_

        你可以用附贈動作觸碰一個自願的生物，並透過它的感官來感知，直到你的下個回合結束。只要這個生物和你位於同一個位面，你就可以在之後的回合用附贈動作維持這道連結，把持續時間延長到你的下個回合結束。如果你沒有這樣維持，連結就會結束。

        透過另一個生物的感官感知期間，你能享有這個生物擁有的任何特殊感官；如果你們兩個相距 60 呎內，你還可以像身在自己的空間或對方的空間那樣施放法術。

        #### 深海饋贈 Gift of the Depths

        _先決條件：5 級以上契術師_

        你能在水下呼吸，並獲得等於你速度的游泳速度。

        你也可以不消耗法術位施放_水下呼吸_一次。完成長休時，你恢復這樣施放的能力。

        #### 庇佑饋贈 Gift of the Protectors

        _先決條件：9 級以上契術師、「書之魔契」祈喚_

        你召喚_影之書_時，書中會出現新的一頁。經你允許，一個生物可以用一個動作把自己的名字寫在這一頁上。這一頁能容納的名字數量等於你的魅力調整值（至少一個名字）。

        名字在這一頁上的任何生物，生命值降到 0 但沒有當場死亡時，會藉由魔法改為降到 1 點生命值。這道魔法觸發一次後，在你完成長休之前，沒有任何生物能再從中受益。

        你可以用魔法動作觸碰這一頁上的一個名字，把它擦掉。

        #### 鏈主賦能 Investment of the Chain Master

        _先決條件：5 級以上契術師、「鏈之魔契」祈喚_

        你施放_獲得魔寵_時，會把你的一部分魔能力量注入召喚出的魔寵，賦予這個生物下列好處。

        _翔空或潛淵 Aerial or Aquatic。_ 魔寵獲得 40 呎的飛行速度或游泳速度（由你選擇）。

        _快速攻擊 Quick Attack。_ 你可以用附贈動作命令魔寵執行攻擊動作。

        _黯蝕或光耀傷害 Necrotic or Radiant Damage。_ 每當魔寵造成鈍擊、穿刺或揮砍傷害，你可以讓它改為造成黯蝕或光耀傷害。

        _你的豁免 DC Your Save DC。_ 如果魔寵迫使一個生物進行豁免，就使用你的法術豁免 DC。

        _抗性 Resistance。_ 魔寵受到傷害時，你可以用反應動作，賦予它對這次傷害的抗性。

        #### 遠古者的教誨 Lessons of the First Ones

        _先決條件：2 級以上契術師_

        你從多元宇宙的一個古老存在那裡得到了知識，因此可以獲得一個自選的起源專長（見「專長」）。

        _可重複 Repeatable。_ 你可以多次獲得這個祈喚。每次獲得時，選擇另一個起源專長。

        #### 啜飲生機 Lifedrinker

        _先決條件：9 級以上契術師、「刃之魔契」祈喚_

        每回合一次，你用契約武器命中一個生物時，可以對這個生物額外造成 1d6 黯蝕、心靈或光耀傷害（由你選擇）；你還可以消耗自己的一顆生命骰並擲這顆骰子，恢復的生命值等於擲骰結果加上你的體質調整值（至少恢復 1 點生命值）。

        #### 千面之臉 Mask of Many Faces

        _先決條件：2 級以上契術師_

        你可以不消耗法術位施放_易容術_。

        #### 萬形之主 Master of Myriad Forms

        _先決條件：5 級以上契術師_

        你可以不消耗法術位施放_變造自身_。

        #### 幻象迷蹤 Misty Visions

        _先決條件：2 級以上契術師_

        你可以不消耗法術位施放_無聲幻影_。

        #### 融身入影 One with Shadows

        _先決條件：5 級以上契術師_

        你位於微光光照或黑暗的區域內時，可以不消耗法術位對自己施放_隱形術_。

        #### 超凡跳躍 Otherworldly Leap

        _先決條件：2 級以上契術師_

        你可以不消耗法術位對自己施放_跳躍術_。

        #### 刃之魔契 Pact of the Blade

        你可以用附贈動作在手中召喚一把契約武器，也就是一把自選並與你聯結的簡易近戰武器或軍用近戰武器；或者，你可以和你觸碰的一把魔法武器建立聯結。如果有別人正與一把魔法武器同調，或有另一個契術師已與它聯結，你就不能和這把武器聯結。在聯結結束之前，你熟練這把武器，並且可以把它當作施法法器。

        每當你用聯結的武器攻擊，攻擊檢定與傷害擲骰都可以用你的魅力調整值代替力量或敏捷調整值；你還可以讓這把武器造成黯蝕、心靈或光耀傷害，或是它原本的傷害類型。

        出現下列任一情況時，你與這把武器的聯結就會結束：你再次使用這項特性的附贈動作、這把武器離你超過 5 呎達 1 分鐘或更久，或是你死亡。聯結結束時，召喚出來的武器會消失。

        #### 鏈之魔契 Pact of the Chain

        你學會_獲得魔寵_法術，並且可以不消耗法術位、用魔法動作施放它。

        你施放這個法術時，從魔寵原本可選的形態中選擇一種，或從下列特殊形態中選擇一種：**小魔鬼、偽龍、誇賽魔、骷髏、神奇斯芬克斯、小妖精**或**毒蛇**（魔寵的數據塊見「怪物」）。

        此外，你執行攻擊動作時，可以放棄自己的一次攻擊，讓你的魔寵用它的反應動作進行一次它自己的攻擊。

        #### 書之魔契 Pact of the Tome

        短休或長休結束時，你把一縷縷陰影縫合起來，在手中召喚出一本書。這本_影之書_（外觀由你決定）蘊含只有你能取用的魔能魔法，賦予你下列好處。如果你用這項特性召喚另一本書，或是你死亡，這本書就會消失。

        _戲法與儀式 Cantrips and Rituals。_ 書出現時，選擇三個戲法，並選擇兩個具有「儀式」標籤的 1 環法術。這些法術可以來自任何職業的法術列表，而且必須是你還沒準備的法術。你隨身帶著這本書期間，準備著所選的法術，而且這些法術對你而言都當作契術師法術運作。

        _施法法器 Spellcasting Focus。_ 你可以把這本書當作施法法器。

        #### 斥力魔爆 Repelling Blast

        _先決條件：2 級以上契術師、一個透過攻擊檢定造成傷害的契術師戲法_

        從你學會的契術師戲法中，選擇一個需要攻擊檢定的戲法。你用這個戲法命中一個大型或更小的生物時，可以把這個生物往遠離你的方向直線推開最多 10 呎。

        _可重複 Repeatable。_ 你可以多次獲得這個祈喚。每次獲得時，選擇另一個符合條件的戲法。

        #### 饑渴魔刃 Thirsting Blade

        _先決條件：5 級以上契術師、「刃之魔契」祈喚_

        你獲得額外攻擊特性，但只適用於你的契約武器。有了這項特性，你在自己的回合執行攻擊動作時，可以用這把武器攻擊兩次，而不是一次。

        #### 神遊遠域 Visions of Distant Realms

        _先決條件：9 級以上契術師_

        你可以不消耗法術位施放_秘法眼_。

        #### 墳墓低語 Whispers of the Grave

        _先決條件：7 級以上契術師_

        你可以不消耗法術位施放_死者交談_。

        #### 洞幽燭微 Witch Sight

        _先決條件：15 級以上契術師_

        你擁有範圍 30 呎的真實視覺。
  features:
    - level: 1
      name: "魔能祈喚 Eldritch Invocations"
      text: |
        你發掘出了魔能祈喚：這些禁忌知識的片段，會賦予你一項恆久的魔法能力，或帶給你其他教誨。你獲得一個自選的祈喚，例如「書之魔契」。各個祈喚的說明見本職業說明後面的「魔能祈喚選項」一節。

        _先決條件 Prerequisites。_ 如果一個祈喚有先決條件，你必須符合條件才能學會這個祈喚。例如，如果一個祈喚要求你是 5 級以上契術師，你的契術師等級達到 5 級後，就可以選擇這個祈喚。

        _替換與獲得祈喚 Replacing and Gaining Invocations。_ 每當你提升一個契術師等級，可以把你的一個祈喚換成另一個你符合條件的祈喚。如果一個祈喚是你擁有的另一個祈喚的先決條件，就不能把它換掉。

        你的契術師等級達到特定等級時，會獲得更多自選的祈喚，見「契術師特性」表的「魔能祈喚」欄。

        除非祈喚的說明另有規定，否則同一個祈喚你不能選擇超過一次。
    - level: 1
      name: "契約魔法 Pact Magic"
      text: |
        你透過玄秘儀式，與一個謎樣的存在訂下契約，藉此獲得魔法力量。這個存在是陰影中的一個聲音，身分不明，但它給你的恩惠卻很實在：施展法術的能力。施法規則見「法術」。下文說明你如何把這些規則套用在契術師法術上；契術師法術列在本職業說明後面的契術師法術列表中。

        _戲法 Cantrips。_ 你自選兩個契術師戲法並學會。建議選擇_魔能爆_與_魔法伎倆_。每當你提升一個契術師等級，可以把你透過這項特性學會的一個戲法換成另一個自選的契術師戲法。

        你的契術師等級達到 4 級與 10 級時，會再學會一個自選的契術師戲法，見「契術師特性」表的「戲法」欄。

        _法術位 Spell Slots。_ 「契術師特性」表列出你有多少法術位可以施放 1 到 5 環的契術師法術。表中也列出這些法術位的環階；它們全都是同一個環階。完成短休或長休時，你恢復所有已消耗的契約魔法法術位。

        例如，你是 5 級契術師時，有兩個 3 環法術位。要施放 1 環法術_魅惑人類_，你必須消耗其中一個法術位，而且會把它當作 3 環法術施放。

        _1 環以上的準備法術 Prepared Spells of Level 1+。_ 你要準備一份清單，列出能用這項特性施放的 1 環以上法術。一開始，選擇兩個 1 環契術師法術。建議選擇_魅惑人類_與_脆弱詛咒_。

        清單上的法術數量會隨你的契術師等級提升而增加，見「契術師特性」表的「準備法術」欄。每當這個數字增加，就選擇更多契術師法術，直到清單上的法術數量與表中的數字相同。所選法術的環階，不能高於表中「法術位環階」欄裡你的等級對應的數字。例如，你達到 6 級時，會學會一個新的契術師法術，這個法術可以是 1 到 3 環。

        如果其他契術師特性讓你始終準備某些法術，這些法術不計入你能用這項特性準備的法術數量；除此之外，這些法術對你來說都算是契術師法術。

        _更換準備法術 Changing Your Prepared Spells。_ 每當你提升一個契術師等級，可以把清單上的一個法術換成另一個契術師法術，換上的法術必須是符合條件的環階。

        _施法屬性 Spellcasting Ability。_ 你的契術師法術以魅力作為施法屬性。

        _施法法器 Spellcasting Focus。_ 你可以用奧術法器作為契術師法術的施法法器。
    - level: 2
      name: "秘法回流 Magical Cunning"
      text: |
        你可以進行 1 分鐘的神秘儀式。儀式結束時，你恢復已消耗的契約魔法法術位，但恢復的數量不能超過你的契約魔法法術位上限的一半（無條件進位）。使用這項特性後，你必須完成長休才能再次使用。
    - level: 3
      name: "契術師子職 Warlock Subclass"
      text: |
        你獲得一個自選的契術師子職。邪魔宗主子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的契術師等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的契術師等級，你就會獲得該特性。
    - level: 4
      name: "屬性值提升 Ability Score Improvement"
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。契術師 8、12 與 16 級時，你會再次獲得這項特性。
    - level: 9
      name: "直謁宗主 Contact Patron"
      text: |
        過去，你通常透過中介者聯絡你的宗主。現在你可以直接和宗主溝通；你始終準備_異界探知_法術。透過這項特性，你可以不消耗法術位施放這個法術來聯絡你的宗主，而且你進行這個法術的豁免時自動成功。

        用這項特性施放這個法術後，你必須完成長休，才能再次這樣施放。
    - level: 11
      name: "幽玄秘傳 Mystic Arcanum"
      text: |
        你的宗主賜予你一項魔法秘密，稱為「秘傳」。選擇一個 6 環契術師法術作為這項秘傳。

        你可以不消耗法術位施放你的秘傳法術一次，之後必須完成長休，才能再次這樣施放。

        你的契術師等級達到 13 級（7 環法術）、15 級（8 環法術）與 17 級（9 環法術）時，會再獲得一個可以這樣施放的自選契術師法術，見「契術師特性」表。完成長休時，你恢復幽玄秘傳的所有使用次數。

        每當你提升一個契術師等級，可以把你的一個秘傳法術換成另一個同環階的契術師法術。
    - level: 19
      name: "傳奇恩惠 Epic Boon"
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇命運恩惠。
    - level: 20
      name: "魔能大成 Eldritch Master"
      text: |
        你使用秘法回流特性時，恢復你所有已消耗的契約魔法法術位。
