  appendix:
    - name: 超魔法選項
      text: |
        你的超魔法特性可以選用下列選項。選項依英文名稱的字母順序排列。

        #### 謹慎法術 Careful Spell

        _消耗：1 點術法點_

        你施放會迫使其他生物進行豁免的法術時，可以保護其中一些生物，讓它們不必承受法術的全部威力。要這麼做，就消耗 1 點術法點，並從這些生物中選擇若干個，數量最多等於你的魅力調整值（至少一個生物）。被選中的生物對抗這個法術的豁免自動成功，而且如果它原本在豁免成功時會受到一半傷害，就不受傷害。

        #### 遠程法術 Distant Spell

        _消耗：1 點術法點_

        你施放射程至少 5 呎的法術時，可以消耗 1 點術法點，讓這個法術的射程加倍。或者，你施放射程為觸及的法術時，可以消耗 1 點術法點，讓這個法術的射程變成 30 呎。

        #### 強效法術 Empowered Spell

        _消耗：1 點術法點_

        你為法術擲傷害時，可以消耗 1 點術法點重擲若干顆傷害骰，數量最多等於你的魅力調整值（至少一顆），而且必須採用新的擲骰結果。

        即使你在施放這個法術的過程中已經使用了另一個超魔法選項，仍然可以使用強效法術。

        #### 延效法術 Extended Spell

        _消耗：1 點術法點_

        你施放持續時間為 1 分鐘或更長的法術時，可以消耗 1 點術法點，讓它的持續時間加倍，最長 24 小時。

        如果受影響的法術需要專注，你為了維持這次專注而進行的任何豁免都具有優勢。

        #### 升階法術 Heightened Spell

        _消耗：2 點術法點_

        你施放會迫使生物進行豁免的法術時，可以消耗 2 點術法點，讓法術的一個目標對抗這個法術的豁免都具有劣勢。

        #### 瞬發法術 Quickened Spell

        _消耗：2 點術法點_

        你施放法術時，如果這個法術的施法時間是一個動作，可以消耗 2 點術法點，把這次施放的施法時間改為一個附贈動作。如果你在當前回合已經施放過 1 環以上的法術，就不能這樣修改法術；這樣修改法術之後，你在這個回合也不能施放 1 環以上的法術。

        #### 追蹤法術 Seeking Spell

        _消耗：1 點術法點_

        如果你為法術進行攻擊檢定卻未命中，可以消耗 1 點術法點重擲 d20，而且必須採用新的擲骰結果。

        即使你在施放這個法術的過程中已經使用了另一個超魔法選項，仍然可以使用追蹤法術。

        #### 精妙法術 Subtle Spell

        _消耗：1 點術法點_

        你施放法術時，可以消耗 1 點術法點，讓這次施放不需要任何言語、姿勢或材料成分；但會被法術消耗的材料成分，以及法術中標明價格的材料成分除外。

        #### 轉化法術 Transmuted Spell

        _消耗：1 點術法點_

        你施放會造成下列其中一種類型傷害的法術時，可以消耗 1 點術法點，把這種傷害類型改成下列類型中的另一種：強酸、冷凍、火焰、閃電、毒素、雷鳴。

        #### 孿生法術 Twinned Spell

        _消耗：1 點術法點_

        如果某個法術（例如_魅惑人類_）用更高環階的法術位施放時可以多以一個生物為目標，你施放這個法術時，可以消耗 1 點術法點，讓它的生效環階提高 1 環。
  features:
    - level: 1
      name: "施法 Spellcasting"
      text: |
        你能汲取天生的魔力來施展法術。施法規則見「法術」。下文說明你如何把這些規則套用在術士法術上；術士法術列在本職業說明後面的術士法術列表中。

        _戲法 Cantrips。_ 你自選四個術士戲法並學會。建議選擇_光亮術_、_魔法伎倆_、_電爪_與_術法衝擊_。每當你提升一個術士等級，可以把你透過這項特性學會的一個戲法換成另一個自選的術士戲法。

        你的術士等級達到 4 級與 10 級時，會再學會一個自選的術士戲法，見「術士特性」表的「戲法」欄。

        _法術位 Spell Slots。_ 「術士特性」表列出你有多少法術位可以施放 1 環以上的法術。完成長休時，你恢復所有已消耗的法術位。

        _1 環以上的準備法術 Prepared Spells of Level 1+。_ 你要準備一份清單，列出能用這項特性施放的 1 環以上法術。一開始，選擇兩個 1 環術士法術。建議選擇_燃燒之手_與_偵測魔法_。

        清單上的法術數量會隨你的術士等級提升而增加，見「術士特性」表的「準備法術」欄。每當這個數字增加，就選擇更多術士法術，直到清單上的法術數量與「術士特性」表中的數字相同。所選法術的環階，必須是你有法術位的環階。例如，如果你是 3 級術士，你的準備法術清單可以有六個術士法術，1 環或 2 環任意搭配。

        如果其他術士特性讓你始終準備某些法術，這些法術不計入你能用這項特性準備的法術數量；除此之外，這些法術對你來說都算是術士法術。

        _更換準備法術 Changing Your Prepared Spells。_ 每當你提升一個術士等級，可以把清單上的一個法術換成另一個術士法術，換上的法術必須是你有法術位的環階。

        _施法屬性 Spellcasting Ability。_ 你的術士法術以魅力作為施法屬性。

        _施法法器 Spellcasting Focus。_ 你可以用奧術法器作為術士法術的施法法器。
    - level: 1
      name: "天生術法 Innate Sorcery"
      text: |
        你過去經歷的某個事件在你身上留下了無法抹滅的印記，為你注入暗自翻騰的魔力。你可以用附贈動作釋放這股魔力，持續 1 分鐘；在這段期間，你獲得下列好處：

        - 你的術士法術的法術豁免 DC 增加 1。
        - 你施放的術士法術的攻擊檢定具有優勢。

        你可以使用這項特性兩次；完成長休時，你恢復所有已消耗的使用次數。
    - level: 2
      name: "魔力泉湧 Font of Magic"
      text: |
        你能汲取自己體內的魔力源泉。這道源泉以術法點表示，你可以用術法點創造各種魔法效果。

        你有 2 點術法點，等級提高後會獲得更多，見「術士特性」表的「術法點」欄。你持有的術法點不能超過表中你的等級對應的數字。完成長休時，你恢復所有已消耗的術法點。

        你可以用術法點驅動下列選項，以及其他會使用術法點的特性，例如超魔法。

        _法術位轉為術法點 Converting Spell Slots to Sorcery Points。_ 你可以消耗一個法術位來獲得術法點，獲得的點數等於這個法術位的環階（不需要動作）。

        _生成法術位 Creating Spell Slots。_ 你可以用附贈動作，把未消耗的術法點轉換成一個法術位。「生成法術位」表列出生成指定環階法術位的消耗，也列出生成該法術位所需的最低術士等級。你最高只能生成 5 環法術位。

        你用這項特性生成的法術位，都會在你完成長休時消失。

        **生成法術位 Creating Spell Slots**

        | 法術位環階 | 術法點消耗 | 最低術士等級 |
        | --- | --- | --- |
        | 1 | 2 | 2 |
        | 2 | 3 | 3 |
        | 3 | 5 | 5 |
        | 4 | 6 | 7 |
        | 5 | 7 | 9 |
    - level: 2
      name: "超魔法 Metamagic"
      text: |
        你的魔力源自體內，因此你能依自己的需要改變法術：你從本職業說明後面的「超魔法選項」中自選兩個超魔法選項獲得。你用所選的選項暫時修改你施放的法術。要使用一個選項，你必須消耗該選項所需數量的術法點。

        除非某個選項另有說明，否則你施放一個法術時，只能對它使用一個超魔法選項。

        每當你提升一個術士等級，可以把你的一個超魔法選項換成一個你還不會的選項。術士 10 級時，你再獲得兩個選項；術士 17 級時，又再獲得兩個。
    - level: 3
      name: "術士子職 Sorcerer Subclass"
      text: |
        你獲得一個自選的術士子職。龍族術法子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的術士等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的術士等級，你就會獲得該特性。
    - level: 4
      name: "屬性值提升 Ability Score Improvement"
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。術士 8、12 與 16 級時，你會再次獲得這項特性。
    - level: 5
      name: "術法復甦 Sorcerous Restoration"
      text: |
        你完成短休時，可以恢復已消耗的術法點，但恢復的數量不能超過你術士等級的一半（無條件捨去）。使用這項特性後，你必須完成長休才能再次使用。
    - level: 7
      name: "術法化身 Sorcery Incarnate"
      text: |
        如果你的天生術法沒有剩餘使用次數，只要你在用附贈動作啟動它時消耗 2 點術法點，就可以使用它。

        此外，你的天生術法特性生效期間，你施放的每個法術最多可以使用你的兩個超魔法選項。
    - level: 19
      name: "傳奇恩惠 Epic Boon"
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇次元旅行恩惠。
    - level: 20
      name: "奧術昇華 Arcane Apotheosis"
      text: |
        你的天生術法特性生效期間，你在自己的每個回合可以使用一個超魔法選項，而不必為它消耗術法點。
