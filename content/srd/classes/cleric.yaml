  features:
    - level: 1
      name: "施法 Spellcasting"
      text: |
        你透過祈禱與冥想學會了施展法術。施法規則見「法術」。下文說明你如何把這些規則套用在牧師法術上；牧師法術列在本職業說明後面的牧師法術列表中。

        _戲法 Cantrips。_ 你從牧師法術列表中自選三個戲法並學會。建議選擇_神導術_、_聖火術_與_奇術_。

        每當你提升一個牧師等級，可以把你的一個戲法換成牧師法術列表中另一個自選的戲法。

        你的牧師等級達到 4 級與 10 級時，會從牧師法術列表中再學會一個自選戲法，見「牧師特性」表的「戲法」欄。

        _法術位 Spell Slots。_ 「牧師特性」表列出你有多少法術位可以施放 1 環以上的法術。完成長休時，你恢復所有已消耗的法術位。

        _1 環以上的準備法術 Prepared Spells of Level 1+。_ 你要準備一份清單，列出能用這項特性施放的 1 環以上法術。一開始，從牧師法術列表中選擇四個 1 環法術。建議選擇_祝福術_、_療傷術_、_光導箭_與_虔誠護盾_。

        清單上的法術數量會隨你的牧師等級提升而增加，見「牧師特性」表的「準備法術」欄。每當這個數字增加，就從牧師法術列表中選擇更多法術，直到清單上的法術數量與表中的數字相同。所選法術的環階，必須是你有法術位的環階。例如，如果你是 3 級牧師，你的準備法術清單可以有六個法術，1 環與 2 環任意搭配。

        如果其他牧師特性讓你始終準備某些法術，這些法術不計入你能用這項特性準備的法術數量；除此之外，這些法術對你來說都算是牧師法術。

        _更換準備法術 Changing Your Prepared Spells。_ 每當你完成長休，可以更換準備法術清單：清單上的任何法術都可以換成其他牧師法術，換上的法術必須是你有法術位的環階。

        _施法屬性 Spellcasting Ability。_ 你的牧師法術以感知作為施法屬性。

        _施法法器 Spellcasting Focus。_ 你可以用聖徽作為牧師法術的施法法器。
    - level: 1
      name: "神聖使命 Divine Order"
      text: |
        你已獻身於下列一種自選的神聖職責。

        _守護者 Protector。_ 你受過戰鬥訓練，獲得軍用武器熟練與重甲訓練。

        _魔術使 Thaumaturge。_ 你從牧師法術列表中額外學會一個戲法。此外，你與神性之間的神祕連結，讓你進行智力（奧秘或宗教）檢定時獲得加值。加值等於你的感知調整值（至少 +1）。
    - level: 2
      name: "引導神力 Channel Divinity"
      text: |
        你能直接從外層位面引導神聖能量，驅動魔法效果。一開始你有兩種這類效果：神聖火花與驅散不死生物，說明見下文。每次使用本職業的引導神力時，從本職業的引導神力效果中選擇一種產生。你的牧師等級提高後，會獲得更多效果選項。

        本職業的引導神力可以使用兩次。你完成短休時，恢復 1 次已消耗的使用次數；完成長休時，恢復所有已消耗的使用次數。你的牧師等級達到特定等級時，會獲得更多使用次數，見「牧師特性」表的「引導神力」欄。

        如果引導神力效果需要豁免，DC 等於本職業「施法」特性的法術豁免 DC。

        _神聖火花 Divine Spark。_ 你用魔法動作，將聖徽指向你 30 呎內另一個你看得見的生物，把神聖能量集中在它身上。擲 1d8，加上你的感知調整值。你從兩者擇一：讓這個生物恢復等於總值的生命值，或強迫它進行體質豁免。豁免失敗時，它受到等於總值的黯蝕或光耀傷害（由你選擇）；豁免成功時，傷害減半（無條件捨去）。

        你的牧師等級達到 7 級（2d8）、13 級（3d8）與 18 級（4d8）時，各多擲一顆 d8。

        _驅散不死生物 Turn Undead。_ 你用魔法動作亮出聖徽，譴責不死生物。你 30 呎內每個由你選擇的不死生物都必須進行感知豁免。豁免失敗的生物陷入恐慌與失能狀態，持續 1 分鐘。在這段期間，它會在自己的回合中設法移動，盡可能遠離你。如果這個生物受到任何傷害、你陷入失能狀態，或你死亡，它身上的這個效果就會提早結束。
    - level: 3
      name: "牧師子職 Cleric Subclass"
      text: |
        你獲得一個自選的牧師子職。生命領域子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的牧師等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的牧師等級，你就會獲得該特性。
    - level: 4
      name: "屬性值提升 Ability Score Improvement"
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。牧師 8、12 與 16 級時，你會再次獲得這項特性。
    - level: 5
      name: "焚燒不死生物 Sear Undead"
      text: |
        每當你使用驅散不死生物，可以擲數顆 d8，數量等於你的感知調整值（至少 1d8），並把擲出的點數加總。在這次驅散不死生物中豁免失敗的每個不死生物，都會受到等於總和的光耀傷害。這次傷害不會結束驅散效果。
    - level: 7
      name: "神佑打擊 Blessed Strikes"
      text: |
        戰鬥中，神聖力量灌注你全身。你從下列選項中自選一項獲得（如果你從舊版書籍的牧師子職獲得其中任一選項，只使用你為這項特性選擇的那一項）。

        _神聖打擊 Divine Strike。_ 你在自己的每個回合中有一次機會：用武器進行的攻擊檢定命中生物時，可以讓目標額外受到 1d8 黯蝕或光耀傷害（由你選擇）。

        _強力施法 Potent Spellcasting。_ 你用任何牧師戲法造成傷害時，把感知調整值加到傷害上。
    - level: 10
      name: "神聖干預 Divine Intervention"
      text: |
        你可以呼求你的神祇或神系為你干預。你用魔法動作選擇任一個 5 環或更低環階、施放時不需要反應動作的牧師法術，並在同一個動作中施放這個法術，不消耗法術位，也不需要材料成分。你必須完成長休，才能再次使用這項特性。
    - level: 14
      name: "強化神佑打擊 Improved Blessed Strikes"
      text: |
        你在神佑打擊選擇的選項變得更加強大。

        _神聖打擊 Divine Strike。_ 你的神聖打擊造成的額外傷害提高到 2d8。

        _強力施法 Potent Spellcasting。_ 你施放牧師戲法並用它對生物造成傷害時，可以為自己或你 60 呎內的另一個生物注入活力，給予等於你感知調整值兩倍的臨時生命值。
    - level: 19
      name: "傳奇恩惠 Epic Boon"
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇命運恩惠。
    - level: 20
      name: "高等神聖干預 Greater Divine Intervention"
      text: |
        你可以呼求更加強大的神聖干預。你使用神聖干預特性選擇法術時，可以選擇_祈願術_。如果這麼做，你必須完成 2d4 次長休，才能再次使用神聖干預。
