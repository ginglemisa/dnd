  features:
    - level: 1
      name: 施法
      text: |
        你學會了引導自然的魔法精髓來施展法術。施法規則見「法術」。下文說明你如何把這些規則套用在遊俠法術上；遊俠法術列在本職業說明後面的遊俠法術列表中。

        _法術位。_ 「遊俠特性」表列出你有多少法術位可以施放 1 環以上的法術。完成長休時，你恢復所有已消耗的法術位。

        _1 環以上的準備法術。_ 你要準備一份清單，列出能用這項特性施放的 1 環以上法術。一開始，選擇兩個 1 環遊俠法術。建議選擇_療傷術_與_誘捕打擊_。

        清單上的法術數量會隨你的遊俠等級提升而增加，見「遊俠特性」表的「準備法術」欄。每當這個數字增加，就選擇更多遊俠法術，直到清單上的法術數量與「遊俠特性」表中的數字相同。所選法術的環階，必須是你有法術位的環階。例如，如果你是 5 級遊俠，你的準備法術清單可以有六個遊俠法術，1 環或 2 環任意搭配。

        如果其他遊俠特性讓你始終準備某些法術，這些法術不計入你能用這項特性準備的法術數量；除此之外，這些法術對你來說都算是遊俠法術。

        _更換準備法術。_ 每當你完成長休，可以把清單上的一個法術換成另一個遊俠法術，換上的法術必須是你有法術位的環階。

        _施法屬性。_ 你的遊俠法術以感知作為施法屬性。

        _施法法器。_ 你可以用德魯伊法器作為遊俠法術的施法法器。
    - level: 1
      name: 宿敵
      text: |
        你始終準備_獵人印記_法術。你可以不消耗法術位施放這個法術兩次；完成長休時，你恢復這項能力所有已消耗的使用次數。

        你的遊俠等級達到特定等級時，你能不用法術位施放這個法術的次數會增加，見「遊俠特性」表的「宿敵」欄。
    - level: 1
      name: 武器精通
      text: |
        你受過武器訓練，可以使用兩種武器的精通屬性，種類由你從自己熟練的武器中選擇，例如長弓與短劍。

        每次完成長休時，你都可以更換你所選的武器種類。例如，你可以改成使用彎刀與長劍的精通屬性。
    - level: 2
      name: 熟練探險家
      text: |
        你的遊歷讓你獲得下列好處。

        _專精。_ 你從自己已熟練、但還沒有專精的技能中選擇一項，獲得這項技能的專精。

        _語言。_ 你懂兩種自選的語言，從「創建角色」的各語言表中選擇。
    - level: 2
      name: 戰鬥風格
      text: |
        你獲得一個自選的「戰鬥風格」專長（見「專長」）。你也可以不選這類專長，改選下方的選項。

        _德魯伊教戰士。_ 你學會兩個自選的德魯伊戲法（德魯伊法術列表見德魯伊職業的章節）。建議選擇_神導術_與_流光閃靈_。所選戲法對你而言視為遊俠法術，並以感知作為施法屬性。每當你提升一個遊俠等級，可以把其中一個戲法換成另一個德魯伊戲法。
    - level: 3
      name: 遊俠子職
      text: |
        你獲得一個自選的遊俠子職。獵人子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的遊俠等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的遊俠等級，你就會獲得該特性。
    - level: 4
      name: 屬性值提升
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。遊俠 8、12 與 16 級時，你會再次獲得這項特性。
    - level: 5
      name: 額外攻擊
      text: |
        每當你在自己的回合執行攻擊動作，你可以攻擊兩次，而不是一次。
    - level: 6
      name: 越野
      text: |
        你沒穿重甲時，速度增加 10 呎。此外，你還有攀爬速度與游泳速度，兩者都等於你的速度。
    - level: 9
      name: 專精
      text: |
        你從自己已熟練、但還沒有專精的技能中選擇兩項，獲得這兩項技能的專精。
    - level: 10
      name: 不知疲倦
      text: |
        現在，原初力量會在旅途中幫你補充精力，讓你獲得下列好處。

        _臨時生命值。_ 你可以用魔法動作給自己臨時生命值，數量等於 1d8 加上你的感知調整值（至少為 1）。你可以使用這個動作的次數等於你的感知調整值（至少 1 次）；完成長休時，你恢復所有已消耗的使用次數。

        _減少力竭。_ 每當你完成短休，你的力竭等級（如果有）就減少 1。
    - level: 13
      name: 頑強追獵
      text: |
        受到傷害不會中斷你對_獵人印記_的專注。
    - level: 14
      name: 自然帷幕
      text: |
        你呼喚自然精魂，用魔法把自己藏起來。你可以用附贈動作讓自己陷入隱形狀態，直到你的下個回合結束。你可以使用這項特性的次數等於你的感知調整值（至少 1 次）；完成長休時，你恢復所有已消耗的使用次數。
    - level: 17
      name: 精準追獵
      text: |
        你對目前被你的_獵人印記_標記的生物進行攻擊檢定時，具有優勢。
    - level: 18
      name: 野性知覺
      text: |
        你與自然的力量之間的連結，賦予你範圍 30 呎的盲視。
    - level: 19
      name: 傳奇恩惠
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇次元旅行恩惠。
    - level: 20
      name: 宿敵剋星
      text: |
        你的_獵人印記_的傷害骰是 d10，而不是 d6。
