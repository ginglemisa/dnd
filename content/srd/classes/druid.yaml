    | 9 | +4 | — | 3 | 3 | 14 | 4 | 3 | 3 | 3 | 1 | — | — | — | — |
    | 10 | +4 | 子職特性 | 3 | 4 | 15 | 4 | 3 | 3 | 3 | 2 | — | — | — | — |
