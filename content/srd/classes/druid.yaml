    ### 德魯伊法術列表

    本節列出德魯伊法術列表。法術先依環階分組，同一環階內再依英文名稱的字母順序排列，並標出每個法術所屬的魔法學派。「特殊」欄中，_C_ 表示法術需要專注，_R_ 表示法術是儀式，_M_ 表示法術需要特定的材料成分。

    #### 戲法（0 環德魯伊法術）

    | 法術 | 學派 | 特殊 |
    | --- | --- | --- |
    | 德魯伊伎倆 | 變化 | — |
    | 元素伎倆 | 變化 | — |
