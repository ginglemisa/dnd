  features:
    - level: 1
      name: "施法 Spellcasting"
      text: |
        你透過鑽研自然的神祕力量學會了施展法術。施法規則見「法術」。下文說明你如何把這些規則套用在德魯伊法術上；德魯伊法術列在本職業說明後面的德魯伊法術列表中。

        _戲法 Cantrips。_ 你從德魯伊法術列表中自選兩個戲法並學會。建議選擇_德魯伊伎倆_與_燃火術_。

        每當你提升一個德魯伊等級，可以把你的一個戲法換成德魯伊法術列表中另一個自選的戲法。

        你的德魯伊等級達到 4 級與 10 級時，會從德魯伊法術列表中再學會一個自選戲法，見「德魯伊特性」表的「戲法」欄。

        _法術位 Spell Slots。_ 「德魯伊特性」表列出你有多少法術位可以施放 1 環以上的法術。完成長休時，你恢復所有已消耗的法術位。

        _1 環以上的準備法術 Prepared Spells of Level 1+。_ 你要準備一份清單，列出能用這項特性施放的 1 環以上法術。一開始，從德魯伊法術列表中選擇四個 1 環法術。建議選擇_化獸為友_、_療傷術_、_妖火_與_雷鳴波_。

        清單上的法術數量會隨你的德魯伊等級提升而增加，見「德魯伊特性」表的「準備法術」欄。每當這個數字增加，就從德魯伊法術列表中選擇更多法術，直到清單上的法術數量與表中的數字相同。所選法術的環階，必須是你有法術位的環階。例如，如果你是 3 級德魯伊，你的準備法術清單可以有六個法術，1 環與 2 環任意搭配。

        如果其他德魯伊特性讓你始終準備某些法術，這些法術不計入你能用這項特性準備的法術數量；除此之外，這些法術對你來說都算是德魯伊法術。

        _更換準備法術 Changing Your Prepared Spells。_ 每當你完成長休，可以更換準備法術清單：清單上的任何法術都可以換成其他德魯伊法術，換上的法術必須是你有法術位的環階。

        _施法屬性 Spellcasting Ability。_ 你的德魯伊法術以感知作為施法屬性。

        _施法法器 Spellcasting Focus。_ 你可以用德魯伊法器作為德魯伊法術的施法法器。
    - level: 1
      name: "德魯伊語 Druidic"
      text: |
        你懂德魯伊語，這是德魯伊的祕密語言。學習這門古老語言時，你也解開了與動物溝通的魔法：你始終準備_動物交談_法術。

        你可以用德魯伊語留下隱藏的訊息。你和其他懂德魯伊語的人會自動發現這類訊息。其他人進行 DC 15 智力（調查）檢定並成功時，能察覺訊息的存在，但不靠魔法就無法解讀。
    - level: 1
      name: "原初使命 Primal Order"
      text: |
        你已獻身於下列一種自選的神聖職責。

        _巫祝 Magician。_ 你從德魯伊法術列表中額外學會一個戲法。此外，你與自然之間的神祕連結，讓你進行智力（奧秘或自然）檢定時獲得加值。加值等於你的感知調整值（至少 +1）。

        _哨衛 Warden。_ 你受過戰鬥訓練，獲得軍用武器熟練與中甲訓練。
    - level: 2
      name: "荒野形態 Wild Shape"
      text: |
        自然的力量讓你能化身為動物。你用附贈動作，變形成一種你透過這項特性學會的野獸形態（見下文「已知形態」）。你會維持這個形態，時數等於你德魯伊等級的一半；期間如果你再次使用荒野形態、陷入失能狀態或死亡，這個形態也會結束。你也可以用附贈動作提早脫離這個形態。

        _使用次數 Number of Uses。_ 你可以使用荒野形態兩次。你完成短休時，恢復 1 次已消耗的使用次數；完成長休時，恢復所有已消耗的使用次數。

        你的德魯伊等級達到特定等級時，會獲得更多使用次數，見「德魯伊特性」表的「荒野形態」欄。

        _已知形態 Known Forms。_ 你透過這項特性知道四種野獸形態，從挑戰等級最高 1/4、而且沒有飛行速度的野獸數據塊中選擇（可選的數據塊見「怪物」中的「動物」）。建議選擇**老鼠**、**騎乘馬**、**蜘蛛**與**狼**。每當你完成長休，可以把一種已知形態換成另一種符合條件的形態。

        你的德魯伊等級達到特定等級時，已知形態的數量與這些形態的最大挑戰等級都會提高，見「野獸形態」表。此外，從 8 級開始，你可以選用有飛行速度的形態。

        選擇已知形態時，如果 DM 允許，你可以從其他資料來源尋找符合條件的野獸。

        **野獸形態 Beast Shapes**

        | 德魯伊等級 | 已知形態 | 最大挑戰等級 | 飛行速度 |
        | --- | --- | --- | --- |
        | 2 | 4 | 1/4 | 無 |
        | 4 | 6 | 1/2 | 無 |
        | 8 | 8 | 1 | 有 |

        **變形規則 Rules While Shape-Shifted。** 你處於變形後的形態時，保有自己的個性、記憶與說話能力，並適用下列規則：

        **臨時生命值 Temporary Hit Points。** 你用荒野形態變形時，獲得臨時生命值，數量等於你的德魯伊等級。

        **遊戲數值 Game Statistics。** 你的遊戲數值會換成野獸數據塊上的數值，但你保留自己的生物類型、生命值、生命骰、職業特性、語言與專長，以及智力、感知與魅力屬性值。你也保留自己的技能熟練與豁免熟練，這些熟練使用你的熟練加值；此外，你還會獲得這種野獸的熟練項目。如果野獸數據塊上某項技能或豁免的調整值比你的高，就使用數據塊上的調整值。

        **不能施法 No Spellcasting。** 你無法施放法術，但變形不會中斷你的專注，也不會以其他方式干擾你已經施放的法術。

        **物體 Objects。** 你操作物體的能力取決於這個形態的肢體，而不是你自己的肢體。此外，你的裝備要掉落在你的空間中、融入新形態，或由新形態穿戴，由你選擇。穿戴的裝備照常運作，但新形態適不適合穿戴某件裝備，由 DM 依這種生物的體型與形狀決定。你的裝備不會改變大小或形狀來配合新形態；新形態無法穿戴的裝備，都必須掉到地上或融入新形態。融入形態的裝備，在你處於這個形態期間沒有效果。
    - level: 2
      name: "荒野夥伴 Wild Companion"
      text: |
        你可以召喚一個化為動物形態的自然精魂來協助你。你可以用魔法動作，消耗一個法術位或 1 次荒野形態使用次數，施放_獲得魔寵_法術，不需要材料成分。

        你用這種方式施放這個法術時，魔寵屬於精類，並會在你完成長休時消失。
    - level: 3
      name: "德魯伊子職 Druid Subclass"
      text: |
        你獲得一個自選的德魯伊子職。大地結社子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的德魯伊等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的德魯伊等級，你就會獲得該特性。
    - level: 4
      name: "屬性值提升 Ability Score Improvement"
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。德魯伊 8、12 與 16 級時，你會再次獲得這項特性。
    - level: 5
      name: "野性復甦 Wild Resurgence"
      text: |
        你在自己的每個回合中有一次機會：如果你已經沒有荒野形態的使用次數，可以消耗一個法術位，讓自己獲得 1 次使用次數（不需要動作）。

        此外，你可以消耗 1 次荒野形態使用次數（不需要動作），讓自己獲得一個 1 環法術位；這麼做之後，你必須完成長休才能再次這麼做。
    - level: 7
      name: "元素狂怒 Elemental Fury"
      text: |
        元素的威力在你體內奔流。你從下列選項中自選一項獲得。

        _強力施法 Potent Spellcasting。_ 你用任何德魯伊戲法造成傷害時，把感知調整值加到傷害上。

        _原初打擊 Primal Strike。_ 你在自己的每個回合中有一次機會：用武器或荒野形態中野獸形態的攻擊進行攻擊檢定並命中生物時，可以讓目標額外受到 1d8 冷凍、火焰、閃電或雷鳴傷害（命中時選擇類型）。
    - level: 15
      name: "強化元素狂怒 Improved Elemental Fury"
      text: |
        你在元素狂怒選擇的選項變得更加強大，如下所述。

        _強力施法 Potent Spellcasting。_ 你施放射程 10 呎或以上的德魯伊戲法時，這個戲法的射程增加 300 呎。

        _原初打擊 Primal Strike。_ 你的原初打擊造成的額外傷害提高到 2d8。
    - level: 18
      name: "獸形施法 Beast Spells"
      text: |
        你使用荒野形態期間，可以在野獸形態下施放法術。不過，材料成分標明價格的法術，以及會消耗材料成分的法術，都不能這樣施放。
    - level: 19
      name: "傳奇恩惠 Epic Boon"
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇[[次元旅行恩惠]]。
    - level: 20
      name: "大德魯伊 Archdruid"
      text: |
        自然的生命力始終在你體內綻放，讓你獲得下列好處。

        _常青荒野形態 Evergreen Wild Shape。_ 每當你擲先攻時，如果荒野形態已經沒有剩餘使用次數，你就恢復 1 次已消耗的使用次數。

        _自然術者 Nature Magician。_ 你可以把荒野形態使用次數轉換成一個法術位（不需要動作）：從尚未消耗的荒野形態使用次數中選擇若干次，合併轉換成單一一個法術位，每 1 次折合 2 個法術環階。例如轉換 2 次荒野形態，就會得到一個 4 環法術位。使用這項好處後，你必須完成長休才能再次使用。

        _長壽 Longevity。_ 你掌握的原初魔法讓你老化得比較慢。每經過 10 年，你的身體只老化 1 年。
