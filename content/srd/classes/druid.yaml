    | 修復術 | 變化 | — |
    | 傳訊術 | 變化 | — |
    | 毒氣噴濺 | 死靈 | — |
    | 燃火術 | 咒法 | — |
    | 提升抗性 | 防護 | C |
    | 橡棍術 | 變化 | — |
    | 維生術 | 死靈 | — |
    | 流光閃靈 | 塑能 | — |

