  features:
    - level: 1
      name: "施法 Spellcasting"
      text: |
        身為奧術魔法的研習者，你學會了施展法術。施法規則見「法術」。下文說明你如何把這些規則套用在法師法術上；法師法術列在本職業說明後面的法師法術列表中。

        _戲法 Cantrips。_ 你自選三個法師戲法並學會。建議選擇_光亮術_、_法師之手_與_冷凍射線_。每當你完成長休，可以把你透過這項特性學會的一個戲法換成另一個自選的法師戲法。

        你的法師等級達到 4 級與 10 級時，會再學會一個自選的法師戲法，見「法師特性」表的「戲法」欄。

        _法術書 Spellbook。_ 你的法師學徒生涯，最後以製作出一本獨一無二的書作結，這本書就是你的法術書。它是一件微型物體，重 3 磅，共 100 頁，只有你或施放_鑑定術_的人才能閱讀。這本書的外觀與材質由你決定，例如一部書邊燙金的典籍，或是一疊用細繩綁起來的犢皮紙。

        這本書收錄你會的 1 環以上法術。一開始，書中有六個你自選的 1 環法師法術。建議選擇_偵測魔法_、_羽落術_、_法師護甲_、_魔法飛彈_、_睡眠術_與_雷鳴波_。

        法師 1 級之後，每當你提升一個法師等級，就把兩個自選的法師法術加入法術書。這兩個法術的環階，都必須是你有法術位的環階，見「法師特性」表。這些法術是你平日例行研究奧術的成果。

        _法術位 Spell Slots。_ 「法師特性」表列出你有多少法術位可以施放 1 環以上的法術。完成長休時，你恢復所有已消耗的法術位。

        _1 環以上的準備法術 Prepared Spells of Level 1+。_ 你要準備一份清單，列出能用這項特性施放的 1 環以上法術。做法是從你的法術書中選擇四個法術。所選法術的環階，必須是你有法術位的環階。

        清單上的法術數量會隨你的法師等級提升而增加，見「法師特性」表的「準備法術」欄。每當這個數字增加，就選擇更多法師法術，直到清單上的法術數量與表中的數字相同。所選法術的環階，必須是你有法術位的環階。例如，如果你是 3 級法師，你的準備法術清單可以有六個法術，1 環與 2 環任意搭配，都從你的法術書中選出。

        如果其他法師特性讓你始終準備某些法術，這些法術不計入你能用這項特性準備的法術數量；除此之外，這些法術對你來說都算是法師法術。

        _更換準備法術 Changing Your Prepared Spells。_ 每當你完成長休，可以更換準備法術清單：清單上的任何法術都可以換成你法術書中的法術。

        _施法屬性 Spellcasting Ability。_ 你的法師法術以智力作為施法屬性。

        _施法法器 Spellcasting Focus。_ 你可以用奧術法器或你的法術書作為法師法術的施法法器。
    - level: 1
      name: "儀式精通 Ritual Adept"
      text: |
        任何法術只要具有「儀式」標籤，而且在你的法術書裡，你就能以儀式施放這個法術。你不必準備這個法術，但要這樣施放法術，就必須閱讀這本書。
    - level: 1
      name: "奧術回想 Arcane Recovery"
      text: |
        你可以藉由研讀法術書，恢復一部分魔法能量。你完成短休時，可以選擇要恢復的已消耗法術位。這些法術位的環階總和不能超過你法師等級的一半（無條件進位），而且其中任何一個都不能是 6 環或更高環階。例如，如果你是 4 級法師，你最多可以恢復總共兩環的法術位：可以是一個 2 環法術位，或是兩個 1 環法術位。

        使用這項特性後，你必須完成長休才能再次使用。
    - level: 2
      name: "學者 Scholar"
      text: |
        你研習魔法的同時，也專攻了另一個學問領域。從下列技能中選擇一項你已熟練的技能：奧秘、歷史、調查、醫藥、自然或宗教。你具有所選技能的專精。
    - level: 3
      name: "法師子職 Wizard Subclass"
      text: |
        你獲得一個自選的法師子職。塑能師子職的內容寫在本職業說明之後。子職是一種專精方向，會在特定的法師等級賦予你特性。在往後的冒險生涯中，只要子職特性的等級等於或低於你的法師等級，你就會獲得該特性。

        > ### 擴充與替換法術書 Expanding and Replacing a Spellbook
        >
        > 你隨等級提升加入法術書的法術，反映的是你持續進行的魔法研究；不過你在冒險途中也可能找到其他法術，可以加入這本書。例如，你可能在一張_法術卷軸_上發現一個法師法術，然後把它抄錄進你的法術書。
        >
        > _抄錄入冊 Copying a Spell into the Book。_ 你找到一個 1 環以上的法師法術時，如果它是你能準備的環階，而且你有時間抄錄，就可以把它抄錄進你的法術書。法術每有一環，抄錄就要花 2 小時與 50 GP。抄錄完成後，你可以像準備法術書裡的其他法術一樣準備這個法術。
        >
        > _抄錄副本 Copying the Book。_ 你可以把自己法術書裡的法術抄錄到另一本書上。這就像把新法術抄錄進你的法術書，但速度更快，因為你已經知道怎麼施放這個法術。所抄錄的法術每有一環，你只需要花 1 小時與 10 GP。
        >
        > 如果你遺失了法術書，可以用同樣的程序，把你準備著的法師法術抄錄進一本新的法術書。要補齊新書其餘的內容，你得另外找到新的法術。因此，許多法師都會留一本備用的法術書。
    - level: 4
      name: "屬性值提升 Ability Score Improvement"
      text: |
        你獲得「屬性值提升」專長（見「專長」），或另選一個你符合條件的專長。法師 8、12 與 16 級時，你會再次獲得這項特性。
    - level: 5
      name: "記憶法術 Memorize Spell"
      text: |
        每當你完成短休，可以研讀法術書，把你為施法特性準備的一個 1 環以上法師法術，換成書中另一個 1 環以上的法術。
    - level: 18
      name: "爐火純青 Spell Mastery"
      text: |
        你對某些法術的掌握已經到了可以隨意施放的程度。從你的法術書中選擇一個 1 環法術與一個 2 環法術，兩個法術的施法時間都必須是一個動作。你始終準備著這兩個法術，並且可以不消耗法術位、以最低環階施放它們。要以更高環階施放其中任一法術，你必須消耗一個法術位。

        每當你完成長休，可以研讀法術書，把這兩個法術的其中一個換成書中一個同環階且符合條件的法術。
    - level: 19
      name: "傳奇恩惠 Epic Boon"
      text: |
        你獲得一個傳奇恩惠專長（見「專長」），或另選一個你符合條件的專長。建議選擇[[法術回憶恩惠]]。
    - level: 20
      name: "成名法術 Signature Spells"
      text: |
        從你的法術書中選擇兩個 3 環法術，作為你的成名法術。你始終準備著這兩個法術，並且可以不消耗法術位、以 3 環各施放一次。這樣施放後，你必須完成短休或長休，才能再次這樣施放它們。要以更高環階施放其中任一法術，你必須消耗一個法術位。
