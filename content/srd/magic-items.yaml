      _法術吸收。_ 手持法杖時，你對法術的豁免具有優勢。此外，當另一個生物施放僅以你為目標的法術時，你可以進行反應動作。若你這麼做，法杖會吸收該法術的魔力，取消其效果，並獲得等同於被吸收法術環階的充能次數。然而，若這麼做使法杖的充能總數超過50，法杖就會爆炸，如同你啟動了它的報復打擊（見下方）。

      _法術。_ 手持法杖時，你可以使用你的法術豁免DC，從法杖施放下表中的一個法術。表格列出施放各法術需要消耗的充能次數。

      | 法術 | 充能消耗 |
      | --- | --- |
      | *秘法鎖* | 0 |
      | *元素召喚術* | 7 |
      | *偵測魔法* | 0 |
      | *解除魔法* | 3 |
      | *變巨術/縮小術* | 0 |
      | *火球術*（7環版本） | 7 |
      | *熾焰法球* | 2 |
      | *冰風暴* | 4 |
      | *隱形術* | 2 |
      | *敲擊術* | 2 |
      | *光亮術* | 0 |
      | *閃電束*（7環版本） | 7 |
      | *穿牆術* | 5 |
      | *異界傳送* | 7 |
      | *防護善惡* | 0 |
      | *心靈遙控* | 5 |
      | *火牆術* | 4 |
      | *蛛網術* | 2 |

      _恢復充能。_ 法杖每天黎明恢復4d6 + 2次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出20時，法杖恢復1d12 + 1次充能。

      _報復打擊。_ 你可以進行魔法動作，將法杖在膝蓋上或堅硬的表面上折斷。法杖被摧毀，並以爆炸的形式釋放其魔力，爆炸填滿一個以法杖自身為起點的30呎發散區域。你有50%的機率立即前往一個隨機的位面，避開爆炸。若你未能避開該效果，你受到等同於法杖內充能次數16倍的力場傷害。區域內每個其他生物進行一次DC 17的敏捷豁免。豁免失敗時，生物受到等同於法杖內充能次數6倍的力場傷害。豁免成功時，生物受到一半傷害。
  - id: staff-of-the-python
    name: 巨蟒法杖
    nameEn: "Staff of the Python"
    source: srd
    category: staff
    rarity: uncommon
    attunement: true
    base: { fixed: 長棍 }
    text: |-
      作為魔法動作，你可以投擲這根法杖，使其落在你10呎內一個未被佔據的空間，讓法杖在該空間變成一條**巨蟒**。這條蛇受你控制，與你共用先攻順位，並在你的回合之後立即進行它的回合。

      在你的回合中，若蛇在你60呎內且你沒有陷入失能狀態，你可以用意念命令牠（不需動作）。你決定蛇在牠的回合採取什麼動作以及如何移動，或者你可以對牠下達一般性的命令，例如攻擊你的敵人或守衛某個地點。沒有你的命令時，蛇會自衛。

      作為附贈動作，你可以命令蛇在牠目前所在的空間恢復成法杖形態，且你在1小時內無法再次使用法杖的特性。若蛇降至0點生命值，牠會死亡並恢復成法杖形態；法杖隨後碎裂並被摧毀。若蛇在失去所有生命值之前就恢復成法杖形態，牠會恢復所有生命值。
  - id: staff-of-the-woodlands
