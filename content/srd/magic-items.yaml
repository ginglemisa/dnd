    rarity: uncommon
    attunement: true
    base: { fixed: 三叉戟 }
    text: |-
      這件魔法武器有3次充能，每天黎明恢復1d3次已消耗的充能。你攜帶它時，可以消耗1次充能，從中對一隻具有游泳速度的野獸施放_支配野獸_（豁免DC 15）。
  - id: universal-solvent
    name: 萬溶劑
    nameEn: "Universal Solvent"
    source: srd
    category: wondrous
    group: consumable
    rarity: legendary
    attunement: false
    consumable: true
    text: |-
      這個管子裝著散發強烈酒精氣味的乳白色液體。被發現時，管中含有1d6 + 1盎司。

      你可以進行使用動作，將管中1盎司或更多的溶劑倒在伸手可及之處的一個表面上。每盎司會立即溶解它所接觸的最多1平方呎黏著物，包括_至尊膠_。
  - id: vicious-weapon
    name: 惡毒武器
    nameEn: "Vicious Weapon"
    source: srd
    category: weapon
    rarity: rare
    attunement: false
    base: { any: [ simple-weapon, martial-weapon ], label: 任意簡易或軍用武器 }
    text: |-
      這件魔法武器對其擊中的任何生物造成額外2d6傷害。此額外傷害的類型與武器的一般傷害類型相同。
  - id: vorpal-sword
    name: 斬首之劍
    nameEn: "Vorpal Sword"
    source: srd
    category: weapon
    rarity: legendary
    attunement: true
    base: { from: [ 長柄刀, 巨劍, 長劍, 彎刀 ] }
    effects: { attack: 3, damage: 3 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+3加值。此外，此武器無視對揮砍傷害的抗性。

      當你使用此武器攻擊至少有一個頭的生物，且攻擊檢定的d20擲出20時，你會斬下該生物的一個頭。若該生物失去那顆頭就無法存活，則該生物死亡。若生物對揮砍傷害具有免疫、沒有頭或不需要頭，或DM判定該生物體型太大，無法用此武器斬下其頭，則該生物免疫此效果。這類生物改為因這次命中受到額外30點揮砍傷害。若該生物具有傳奇抗性，它可以消耗該特性的一次每日使用次數來避免失去頭，改為受到額外傷害。
  - id: wand-of-binding
    name: 定身魔杖
    nameEn: "Wand of Binding"
    source: srd
    category: wand
    rarity: rare
    attunement: true
    text: |-
      這根魔杖有7次充能。

      _法術。_ 手持魔杖時，你可以從中施放下表中的一個法術（豁免DC 17）。表格列出施放各法術需要消耗的充能次數。

      | 法術 | 充能消耗 |
      | --- | --- |
      | *怪物定身術* | 5 |
      | *人類定身術* | 2 |

      _恢復充能。_ 魔杖每天黎明恢復1d6 + 1次已消耗的充能。若你消耗魔杖的最後一次充能，擲1d20。擲出1時，魔杖化為灰燼並被摧毀。
  - id: wand-of-enemy-detection
