    source: srd
    category: wondrous
    group: tool
    rarity: legendary
    attunement: false
    text: |-
      這塊質地細緻、如絲綢般柔軟的黑布，被摺疊成手帕大小。它可以展開成直徑6呎的圓形布面。

      你可以進行魔法動作，展開_諸界之井_並將它放在堅硬的表面上，隨即它會形成一道通往另一個世界或位面的雙向、直徑6呎的圓形傳送門。每次此物品開啟傳送門時，由DM決定它通往何處。傳送門保持開啟，直到其5呎內的一個生物進行魔法動作，抓住布的邊緣將它摺起來以關閉。

      _諸界之井_開啟一次傳送門後，1d8小時內無法再次這麼做。
  - id: wind-fan
    name: 造風之扇
    nameEn: "Wind Fan"
    source: srd
    category: wondrous
    group: tool
    rarity: uncommon
    attunement: false
    text: |-
      手持這把扇子時，你可以從中施放_造風術_（豁免DC 13）。在下次黎明前，每次再度使用這把扇子時，它都有累積20%的機率失效；若扇子失效，它會撕裂成無用的非魔法碎片。
  - id: winged-boots
    name: 飛翼之靴
    nameEn: "Winged Boots"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      這雙靴子有4次充能，每天黎明恢復1d4次已消耗的充能。穿戴靴子時，你可以進行魔法動作，消耗1次充能，獲得30呎的飛行速度，持續1小時。若持續時間到期時你正在飛行，你以每輪30呎的速度下降，直到著地。
  - id: wings-of-flying
    name: 飛翼斗篷
    nameEn: "Wings of Flying"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      穿戴這件斗篷時，你可以進行魔法動作，把斗篷變成你背上的一對翅膀。翅膀持續1小時，或直到你以魔法動作提前結束此效果。翅膀給你60呎的飛行速度。若翅膀消失時你在空中，你會墜落。翅膀消失後，1d12小時內你無法再次使用它們。
