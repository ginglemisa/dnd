      法杖有10次充能。當你使用它進行近戰攻擊命中時，你可以消耗最多3次充能。你每消耗1次充能，目標就額外受到1d6力場傷害。

      _恢復充能。_ 法杖每天黎明恢復1d6 + 4次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，法杖變成非魔法長棍。
  - id: staff-of-swarming-insects
    name: 蟲群法杖
    nameEn: "Staff of Swarming Insects"
    source: srd
    category: staff
    rarity: rare
    attunement: "由吟遊詩人、牧師、德魯伊、術士、契術師或法師"
    base: { fixed: 長棍 }
    text: |-
      這根法杖有10次充能。

      _蟲雲。_ 手持法杖時，你可以進行魔法動作並消耗1次充能，使一群無害的飛行昆蟲充滿一個以你為起點的30呎發散區域。昆蟲停留10分鐘，使該區域對你以外的生物而言為重度遮蔽。強風（例如_造風術_所創造的風）會驅散蟲群並結束此效果。

      _法術。_ 手持法杖時，你可以使用你的法術豁免DC與法術攻擊調整值，從法杖施放下表中的一個法術。表格列出施放各法術需要消耗的充能次數。

      | 法術 | 充能消耗 |
      | --- | --- |
      | *巨蟲術* | 4 |
      | *疫病蟲群* | 5 |

      _恢復充能。_ 法杖每天黎明恢復1d6 + 4次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，一群昆蟲吞噬並摧毀法杖，然後散去。
  - id: staff-of-the-magi
    name: 賢者法杖
    nameEn: "Staff of the Magi"
