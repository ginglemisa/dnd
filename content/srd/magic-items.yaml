  - id: talisman-of-pure-good
    name: 純善護符
    nameEn: "Talisman of Pure Good"
    source: srd
    category: wondrous
    group: wearable
    rarity: legendary
    attunement: 由牧師或聖騎士
    text: |-
      這個護符是善良的強大象徵。觸碰護符的邪魔或不死生物會受到8d6光耀傷害，且每次在其回合結束時仍握著或攜帶護符，就再次受到該傷害。

      _聖徽。_ 你可以把護符當作聖徽使用。你穿戴或手持它時，法術攻擊檢定獲得+2加值。

      _純粹斥責。_ 護符有7次充能。穿戴或手持護符時，你可以進行魔法動作並消耗1次充能，以你120呎內一個你能看見、位於地面上的生物為目標。目標腳下裂開一道燃燒的裂隙，目標進行一次DC 20的敏捷豁免。若目標是邪魔或不死生物，它的豁免具有劣勢。豁免失敗時，目標墜入裂隙並被摧毀，不留遺骸。豁免成功時，目標不會被投入裂隙，但會因這番折磨受到4d6心靈傷害。無論哪種情況，裂隙隨後都會閉合，不留下任何存在過的痕跡。當你消耗最後一次充能時，護符化為金色光點四散並被摧毀。
  - id: talisman-of-the-sphere
    name: 法球護符
    nameEn: "Talisman of the Sphere"
    source: srd
    category: wondrous
    group: wearable
    rarity: legendary
    attunement: true
    text: |-
      手持或穿戴這個護符時，你為控制_湮滅法球_而進行的任何智力（奧秘）檢定都具有優勢。此外，當你在控制_湮滅法球_的狀態下開始你的回合時，你可以進行魔法動作，將其移動10呎，再加上等同於你智力調整值10倍的額外呎數。這個移動不必沿直線進行。
  - id: talisman-of-ultimate-evil
    name: 至惡護符
    nameEn: "Talisman of Ultimate Evil"
    source: srd
    category: wondrous
    group: wearable
    rarity: legendary
    attunement: true
    text: |-
      這件物品象徵不知悔改的邪惡。不是邪魔也不是不死生物的生物接觸護符時，受到8d6黯蝕傷害，之後每次在其握著或攜帶護符的情況下結束回合時，再次受到同樣的傷害。

      _聖徽。_ 你可以把護符當作聖徽使用。你穿戴或手持它時，法術攻擊檢定獲得+2加值。

      _終極終結。_ 護符有6次充能。穿戴或手持護符時，你可以進行魔法動作，消耗1次充能，並以你自身120呎內一個你能看見、位於地面上的生物為目標。目標腳下裂開一道燃燒的裂隙，且目標進行一次DC 20的敏捷豁免。若目標是天界生物，則該豁免具有劣勢。豁免失敗時，目標墜入裂隙並被摧毀，不留遺骸。豁免成功時，目標不會被投入裂隙，但因這番折磨而受到4d6心靈傷害。無論哪種情況，裂隙隨後都會閉合，不留下任何存在過的痕跡。當你消耗最後一次充能時，護符會溶解成惡臭的黏液並被摧毀。
  - id: thunderous-greatclub
    name: 雷鳴巨棒
    nameEn: "Thunderous Greatclub"
    source: srd
    category: weapon
    rarity: very-rare
    attunement: true
    base: { fixed: 巨棒 }
    text: |-
      當你與這件魔法武器同調時，你的力量為20，除非你的力量原本就等於或高於該數值。此武器對其擊中的任何生物造成額外1d8雷鳴傷害，並對其擊中、未被穿戴或攜帶的物體造成額外3d8雷鳴傷害。

      此武器具有以下額外特性。

      _雷鳴巨響。_ 作為魔法動作，你可以用武器敲擊堅硬的表面，發出300呎外都聽得見的巨大雷鳴聲。你同時製造一個30呎的雷鳴能量錐形區域。錐形區域內的每個生物都必須成功通過DC 15的力量豁免，否則陷入倒地狀態。錐形區域內未被穿戴或攜帶的非魔法物體受到3d8雷鳴傷害。

      _地震。_ 作為魔法動作，你可以用武器敲擊地面，在以撞擊點為中心、半徑50呎的圓形區域內製造劇烈的地面震動。該區域內與地面接觸的結構受到50點鈍擊傷害，該區域內位於地面上的每個生物都必須成功通過DC 20的敏捷豁免，否則陷入倒地狀態。若該生物同時正在專注，則必須成功通過DC 20的體質豁免，否則專注中斷。此外，你可以讓該區域內任一處的地面裂開一道深30呎、寬10呎的裂隙。位於裂隙裂開之處的任何生物都必須進行一次DC 20的敏捷豁免，失敗者墜入裂隙，成功者則隨裂隙邊緣移動。位於裂隙裂開之處的任何結構都會崩塌並落入裂隙。你使用此特性後，直到下次黎明前都無法再次使用。
  - id: tome-of-clear-thought
    name: 靜思卷冊
    nameEn: "Tome of Clear Thought"
    source: srd
    category: wondrous
    group: book
    rarity: very-rare
    attunement: false
    text: |-
