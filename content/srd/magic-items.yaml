# yaml-language-server: $schema=../schema/magic-item.schema.json
# 魔法物品：SRD 5.2.1「魔法物品 A–Z」的繁中譯文（CC BY 4.0）與結構化資料。寫法見 content/README.md 的「魔法物品」。
items:
  - id: adamantine-armor
    name: 精金護甲
    nameEn: "Adamantine Armor"
    source: srd
    category: armor
    rarity: uncommon
    attunement: false
    base: { any: [ medium-armor, heavy-armor ], except: [ 獸皮甲 ], label: "任意中甲或重甲，獸皮甲除外" }
    text: |-
      這套護甲以精金強化，精金是世上最堅硬的物質之一。當你穿戴著它時，任何對你的重擊都會變成普通命中。
  - id: ammunition-plus
    name: "彈藥+1／+2／+3"
    nameEn: "Ammunition, +1, +2, or +3"
    source: srd
    category: weapon
    rarity: varies
    rarityText: "非常見（+1）、稀有（+2）或極稀有（+3）"
    attunement: false
    base: { any: [ ammunition ], label: 任意彈藥 }
    options:
      - id: bonus
        label: 加值
        choices:
          - { value: 1, label: "+1", rarity: uncommon }
          - { value: 2, label: "+2", rarity: rare }
          - { value: 3, label: "+3", rarity: very-rare }
    effects: { attack: bonus, damage: bonus }
    displayName: "{base}{bonus}"
    consumable: true
    text: |-
      使用這件魔法彈藥進行的攻擊檢定與傷害擲骰，你獲得加值。加值由彈藥的稀有度決定。彈藥一旦擊中目標，就不再具有魔法。

      這種彈藥通常以十枚或二十枚為單位被發現或出售。十枚這種彈藥的價值，等同於相同稀有度的一瓶藥水。
  - id: ammunition-of-slaying
    name: 屠殺彈藥
    nameEn: "Ammunition of Slaying"
    source: srd
    category: weapon
    rarity: very-rare
    attunement: false
    base: { any: [ ammunition ], label: 任意彈藥 }
    options:
      - id: creatureType
        label: 生物類型
        choices:
          - { value: aberration, label: 異怪 }
          - { value: beast, label: 野獸 }
          - { value: celestial, label: 天界生物 }
          - { value: construct, label: 構裝生物 }
          - { value: dragon, label: 龍類 }
          - { value: elemental, label: 元素生物 }
          - { value: humanoid, label: 人型生物 }
          - { value: fey, label: 精類 }
          - { value: fiend, label: 邪魔 }
          - { value: giant, label: 巨人 }
          - { value: monstrosity, label: 怪獸 }
          - { value: ooze, label: 軟泥怪 }
          - { value: plant, label: 植物 }
          - { value: undead, label: 不死生物 }
    consumable: true
    text: |-
      這種魔法彈藥專門用來屠殺特定類型的生物，該類型由DM選擇，或由DM在下表上擲骰隨機決定。若該類型的生物受到這種彈藥的傷害，該生物進行一次DC 17的體質豁免，失敗者額外受到6d10力場傷害，成功者額外傷害減半。

      對生物造成其額外傷害後，這枚彈藥就變成非魔法的。

      | 1d100 | 生物類型 | 1d100 | 生物類型 |
      | --- | --- | --- | --- |
      | 01–10 | 異怪 | 51–60 | 精類 |
      | 11–15 | 野獸 | 61–70 | 邪魔 |
      | 16–20 | 天界生物 | 71–75 | 巨人 |
      | 21–25 | 構裝生物 | 76–80 | 怪獸 |
      | 26–35 | 龍類 | 81–85 | 軟泥怪 |
      | 36–45 | 元素生物 | 86–90 | 植物 |
      | 46–50 | 人型生物 | 91–00 | 不死生物 |
  - id: amulet-of-health
    name: 健康護符
    nameEn: "Amulet of Health"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      你穿戴這個護符時，你的體質為19。若你不穿戴它時體質已有19或更高，它對你沒有效果。
  - id: amulet-of-proof-against-detection-and-location
    name: 反偵測定位護符
    nameEn: "Amulet of Proof against Detection and Location"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這個護符時，除非你允許，否則你無法成為預言法術的目標，也無法被魔法探知感應器感知。
  - id: amulet-of-the-planes
    name: 位面護符
    nameEn: "Amulet of the Planes"
    source: srd
    category: wondrous
    group: wearable
    rarity: very-rare
    attunement: true
    text: |-
      穿戴這個護符時，你可以進行魔法動作，說出另一個位面上你熟悉的地點。然後進行一次DC 15的智力（奧秘）檢定。檢定成功時，你施放_異界傳送_。檢定失敗時，你以及你15呎內的每個生物與物體，會前往一個隨機的目的地，該目的地由擲1d100並查閱下表決定。

      | 1d100 | 目的地 |
      | --- | --- |
      | 01–60 | 你所說出的位面上的隨機地點 |
      | 61–70 | 內層位面上的隨機地點，由擲1d6決定：擲出1，風元素位面；擲出2，土元素位面；擲出3，火元素位面；擲出4，水元素位面；擲出5，精類荒野；擲出6，暗影界 |
      | 71–80 | 外層位面上的隨機地點，由擲1d8決定：擲出1，阿堡瑞亞；擲出2，阿卡迪亞；擲出3，獸域；擲出4，貝托匹亞；擲出5，極樂境；擲出6，機械境；擲出7，天堂山；擲出8，伊斯嘉德 |
      | 81–90 | 外層位面上的隨機地點，由擲1d8決定：擲出1，深淵；擲出2，亞克倫；擲出3，卡塞瑞；擲出4，葛黑納；擲出5，哈迪斯；擲出6，靈薄獄；擲出7，九層地獄；擲出8，萬魔殿 |
      | 91–00 | 星界上的隨機地點 |
  - id: animated-shield
    name: 活化盾
    nameEn: "Animated Shield"
    source: srd
    category: armor
    rarity: very-rare
    attunement: true
    base: { fixed: 盾牌 }
    text: |-
      手持這面盾牌時，你可以進行附贈動作使其活化。盾牌會躍入空中，並懸停在你的空間中保護你，如同你正在持用它一般，讓你的雙手空出來。盾牌會保持活化1分鐘，直到你進行附贈動作結束此效果，或直到你死亡或陷入失能狀態為止，屆時盾牌會落到地上，若你有一隻手空著則落入你手中。
  - id: apparatus-of-the-crab
    name: 螃蟹裝置
    nameEn: "Apparatus of the Crab"
    source: srd
    category: wondrous
    group: tool
    rarity: legendary
    attunement: false
    weight: 500
    text: |-
      這件物品起初看起來是一個重500磅的密封鐵桶。桶上有一個隱藏的卡榫，成功通過DC 20的智力（調查）檢定可以發現。放開卡榫會打開桶子一端的艙門，讓兩個中型或更小的生物爬進去。十根控制桿排成一列設在遠端，每根都處於中立位置，可以上推或下拉。使用特定的控制桿時，裝置會變形為類似巨大龍蝦的樣子。

      _螃蟹裝置_是大型物體，具有以下數值：AC 20；HP 200；速度30呎，游泳速度30呎（若腿部未伸出，兩者皆為0呎）；免疫毒素傷害與心靈傷害。

      作為載具使用時，裝置需要一名駕駛。裝置的艙門關閉時，艙室是氣密且防水的。艙室內的空氣足夠呼吸10小時，再除以其中呼吸的生物數量。

      裝置會浮在水面上。它也可以潛入水下至900呎的深度。再往下，載具每分鐘因水壓受到2d6鈍擊傷害。

      艙室內的生物可以進行使用動作，將裝置的至多兩根控制桿上推或下拉。每次使用後，控制桿會回到中立位置。從左到右，每根控制桿的功能如「螃蟹裝置控制桿」表所示。

      **螃蟹裝置控制桿**

      | 控制桿 | 上推 | 下拉 |
      | --- | --- | --- |
      | 1 | 腿部伸出，讓裝置能夠行走與游泳。 | 腿部收回，使裝置的速度與游泳速度降為0，並使其無法從速度加值中獲益。 |
      | 2 | 前方窗板打開。 | 前方窗板關閉。 |
      | 3 | 側面窗板打開（每側兩片）。 | 側面窗板關閉（每側兩片）。 |
      | 4 | 兩隻螯從裝置的前側伸出。 | 螯收回。 |
      | 5 | 每隻伸出的螯進行以下近戰攻擊：命中+8，觸及5呎。命中：7（2d6）鈍擊傷害。 | 每隻伸出的螯進行以下近戰攻擊：命中+8，觸及5呎。命中：目標陷入擒抱狀態（脫離DC 15）。 |
      | 6 | 只要腿部已伸出，裝置就向前行走或游泳。 | 只要腿部已伸出，裝置就向後行走或游泳。 |
      | 7 | 只要腿部已伸出，裝置就逆時針轉90度。 | 只要腿部已伸出，裝置就順時針轉90度。 |
      | 8 | 形似眼睛的裝置在半徑30呎內散發明亮光照，並再向外30呎散發微光光照。 | 燈光關閉。 |
      | 9 | 若裝置在液體中，則下沉至多20呎。 | 若裝置在液體中，則上浮至多20呎。 |
      | 10 | 後方艙門解除密封並打開。 | 後方艙門關閉並密封。 |
  - id: armor-plus
    name: "護甲+1／+2／+3"
    nameEn: "Armor, +1, +2, or +3"
    source: srd
    category: armor
    rarity: varies
    rarityText: "稀有（+1）、極稀有（+2）或傳說（+3）"
    attunement: false
    base: { any: [ light-armor, medium-armor, heavy-armor ], label: "任意輕甲、中甲或重甲" }
    options:
      - id: bonus
        label: 加值
        choices:
          - { value: 1, label: "+1", rarity: rare }
          - { value: 2, label: "+2", rarity: very-rare }
          - { value: 3, label: "+3", rarity: legendary }
    effects: { ac: bonus }
    displayName: "{base}{bonus}"
    text: |-
      穿戴這件護甲時，你的護甲等級獲得加值。加值由其稀有度決定。
  - id: armor-of-invulnerability
    name: 堅不可摧護甲
    nameEn: "Armor of Invulnerability"
    source: srd
    category: armor
    rarity: legendary
    attunement: true
    base: { fixed: 全身板甲 }
    text: |-
      穿戴這件護甲時，你具有鈍擊、穿刺與揮砍傷害的抗性。

      **_金屬外殼。_** 你可以進行魔法動作，使自己對鈍擊、穿刺與揮砍傷害具有免疫，持續10分鐘，或直到你不再穿戴這件護甲為止。此特性使用後，直到下次黎明前都無法再次使用。
  - id: armor-of-resistance
    name: 抗性護甲
    nameEn: "Armor of Resistance"
    source: srd
    category: armor
    rarity: rare
    attunement: true
    base: { any: [ light-armor, medium-armor, heavy-armor ], label: "任意輕甲、中甲或重甲" }
    options:
      - id: damageType
        label: 傷害類型
        choices:
          - { value: acid, label: 強酸 }
          - { value: cold, label: 冷凍 }
          - { value: fire, label: 火焰 }
          - { value: force, label: 力場 }
          - { value: lightning, label: 閃電 }
          - { value: necrotic, label: 黯蝕 }
          - { value: poison, label: 毒素 }
          - { value: psychic, label: 心靈 }
          - { value: radiant, label: 光耀 }
          - { value: thunder, label: 雷鳴 }
    text: |-
      穿戴這件護甲時，你對一種傷害類型具有抗性。該類型由DM選擇，或由DM在下表上擲骰隨機決定。

      | 1d10 | 傷害類型 | 1d10 | 傷害類型 |
      | --- | --- | --- | --- |
      | 1 | 強酸 | 6 | 黯蝕 |
      | 2 | 冷凍 | 7 | 毒素 |
      | 3 | 火焰 | 8 | 心靈 |
      | 4 | 力場 | 9 | 光耀 |
      | 5 | 閃電 | 10 | 雷鳴 |
  - id: armor-of-vulnerability
    name: 易傷護甲
    nameEn: "Armor of Vulnerability"
    source: srd
    category: armor
    rarity: rare
    attunement: true
    base: { any: [ light-armor, medium-armor, heavy-armor ], label: "任意輕甲、中甲或重甲" }
    text: |-
      穿戴這件護甲時，你對下列傷害類型之一具有抗性：鈍擊、穿刺或揮砍。該類型由DM選擇或隨機決定。

      _詛咒。_ 這件護甲受到詛咒，這個事實只有在對護甲施放_鑑定術_法術或你與它同調時才會揭露。與這件護甲同調會使你受到詛咒，直到你成為_移除詛咒_法術或類似魔法的目標為止；脫下護甲無法結束詛咒。受詛咒期間，你對與這件護甲相關的三種傷害類型中的兩種具有易傷（不包括它賦予抗性的那一種）。
  - id: arrow-catching-shield
    name: 補箭盾
    nameEn: "Arrow-Catching Shield"
    source: srd
    category: armor
    rarity: rare
    attunement: true
    base: { fixed: 盾牌 }
    text: |-
      當你持用這面盾牌時，你對遠程攻擊檢定的護甲等級獲得+2加值。此加值與盾牌原有的AC加值疊加。

      每當攻擊者對你5呎內的目標進行遠程攻擊檢定時，你可以進行反應動作，改為成為該次攻擊的目標。
  - id: bag-of-beans
    name: 魔豆之袋
    nameEn: "Bag of Beans"
    source: srd
    category: wondrous
    group: container
    rarity: rare
    attunement: false
    weight: 0.5
    text: |-
      這個沉重的布袋被發現時裝有3d4顆乾豆。無論袋中有多少豆子，布袋都重半磅；當袋中不再有任何豆子時，它就成為非魔法物品。

      若你把一顆或多顆豆子倒出袋外，它們會在以豆子為中心、半徑10呎的球形區域內爆炸。所有倒出的豆子都在爆炸中被摧毀，球形區域內的每個生物（包括你）都進行一次DC 15的敏捷豁免，失敗者受到5d4力場傷害，成功者受到一半傷害。

      若你從袋中取出一顆豆子，將它種在泥土或沙中，然後澆水，這顆豆子會消失，並在1分鐘後於其被種下之處的地面產生一種效果。DM可以從下表選擇一種效果，或隨機決定。

      | 1d100 | 效果 |
      | --- | --- |
      | 01 | 長出5d4株毒菇。若有生物吃下毒菇，擲任意一顆骰子。擲出奇數時，食用者必須成功通過DC 15的體質豁免，否則受到5d6毒素傷害並陷入中毒狀態1小時。擲出偶數時，食用者獲得5d6臨時生命值，持續1小時。 |
      | 02–10 | 一道間歇泉噴發，向空中噴出水、啤酒、美乃滋、茶、醋、葡萄酒或油（由DM選擇）30呎高，持續1d4分鐘。 |
      | 11–20 | 長出一棵樹人。擲任意一顆骰子。擲出奇數時，這棵樹人是混亂邪惡。擲出偶數時，這棵樹人是混亂善良。 |
      | 21–30 | 一尊與你外貌相同、有生命但無法移動的石像升起，並對你口出威脅。若你離開它而其他人靠近，它會把你說成最邪惡的惡棍，並指示來者找到你並攻擊你。若你與石像處於同一個位面，它知道你在哪裡。24小時後，石像變為無生命。 |
      | 31–40 | 一堆燃著綠色火焰的營火冒出，燃燒24小時，或直到被撲滅為止。 |
      | 41–50 | 長出3株尖叫蕈。 |
      | 51–60 | 1d4 + 4隻亮粉紅色的蟾蜍爬出。每當有人觸碰一隻蟾蜍，它就會變成一隻由DM選擇的大型或更小的怪物，並依其陣營與本性行動。該怪物停留1分鐘，然後在一縷亮粉紅色的煙霧中消失。 |
      | 61–70 | 一隻飢餓的掘地獸從地下鑽出並發動攻擊。 |
      | 71–80 | 長出一棵果樹。樹上有1d10 + 20顆果實，其中1d8顆的作用如同隨機決定的藥水。這棵樹在1小時後消失。已摘下的果實會保留下來，並保留其魔法30天。 |
      | 81–90 | 冒出一窩1d4 + 3顆彩虹色的蛋。吃下蛋的生物進行一次DC 20的體質豁免。豁免成功時，該生物永久將其最低的屬性值提高1點；若有多個屬性值同為最低，隨機選擇其中一個。豁免失敗時，該生物因體內爆炸受到10d6力場傷害。 |
      | 91–95 | 一座底面為邊長60呎正方形的金字塔向上衝破地面。內部是一間墓室，裡面有一隻木乃伊、一隻木乃伊領主，或由DM選擇的其他不死生物。其石棺中有由DM選擇的寶藏。 |
      | 96–00 | 長出一株巨大的豆莖，高度由DM選擇。頂端通往DM選擇的地方，例如絕佳的景色、雲巨人的城堡，或另一個位面。 |
  - id: bag-of-devouring
    name: 吞噬袋
    nameEn: "Bag of Devouring"
    source: srd
    category: wondrous
    group: container
    rarity: very-rare
    attunement: false
    text: |-
      這個袋子外觀類似_次元袋_，但實際上是一個巨大異次元生物的進食孔口。把袋子內外翻轉可以關閉這個孔口。

      附著在袋子上的異次元生物能感知放入袋中的任何東西。完全放入袋中的動物或植物物質會被吞噬，永遠消失。當活體生物的一部分被放入袋中時（例如有人把手伸進袋裡），該生物有50%的機率被拉進袋中。袋中的生物可以進行一個動作嘗試逃脫，需成功通過DC 15的力量（運動）檢定才能脫身。另一個生物可以進行一個動作，把手伸進袋中將生物拉出來，需成功通過DC 20的力量（運動）檢定，前提是拉人者自己沒有先被拉進袋中。任何在回合開始時身處袋中的生物都會被吞噬，身體被摧毀。

      無生命的物體可以存放在袋中，袋子可以容納1立方呎的此類物質。然而，袋子每天一次會吞下其中所有的物體，並將它們吐到另一個位面。時間與位面由DM決定。

      若袋子被刺穿或撕裂，它就會被摧毀，袋中所有東西會被傳送到星界的隨機地點。
  - id: bag-of-holding
    name: 次元袋
    nameEn: "Bag of Holding"
    source: srd
    category: wondrous
    group: container
    rarity: uncommon
    attunement: false
    weight: 5
    text: |-
      這個袋子的內部空間遠大於其外部尺寸，內部約2呎見方、4呎深。袋子最多可容納500磅，體積不得超過64立方呎。無論袋中裝了什麼，袋子都重5磅。從袋中取出物品需要進行使用動作。

      若袋子超載、被刺穿或撕裂，它就會被摧毀，內容物散落在星界中。若袋子被內外翻轉，內容物會毫髮無傷地掉出來，但必須先把袋子翻回原狀才能再次使用。袋中的空氣足夠呼吸10分鐘，再除以袋中呼吸的生物數量。

      把_次元袋_放入由_便利袋_、_便攜式次元洞_或類似物品所創造的異次元空間中，會立即摧毀兩件物品，並開啟一條通往星界的通道。通道的起點在其中一件物品被放入另一件物品的位置。任何位於以通道為中心、半徑10呎的球形區域內的生物，都會被吸入通道，到達星界的隨機地點。之後通道關閉。通道是單向的，無法重新開啟。
  - id: bag-of-tricks
    name: 魔術袋
    nameEn: "Bag of Tricks"
    source: srd
    category: wondrous
    group: container
    rarity: uncommon
    attunement: false
    options:
      - id: color
        label: 顏色
        choices:
          - { value: gray, label: 灰色 }
          - { value: rust, label: 鏽紅色 }
          - { value: tan, label: 棕褐色 }
    text: |-
      這個以灰色、鏽紅色或棕褐色布料製成的袋子看起來是空的。然而，把手伸進袋中，會發現裡面有一個毛茸茸的小東西。

      你可以進行魔法動作，從袋中拉出這個毛茸茸的東西，並將它投擲至多20呎。當這個東西落地時，會變成一個你透過擲骰決定的生物，擲骰查閱與袋子顏色對應的表格。該生物的數據塊見「怪物」章節。該生物會在下次黎明消失，或在其生命值降為0時消失。

      該生物對你和你的盟友是友善的，並在你的先攻順位上緊接在你之後行動。你可以進行附贈動作，命令該生物如何移動，以及在它的下個回合採取什麼動作，例如攻擊敵人。若沒有這類命令，該生物會依其本性做出合適的行動。

      一旦從袋中拉出3個毛茸茸的東西，袋子在下次黎明前都無法再次使用。

      **灰色魔術袋**

      | 1d8 | 生物 | 1d8 | 生物 |
      | --- | --- | --- | --- |
      | 1 | 鼬 | 5 | 黑豹 |
      | 2 | 巨鼠 | 6 | 巨獾 |
      | 3 | 獾 | 7 | 恐狼 |
      | 4 | 野豬 | 8 | 巨麋鹿 |

      **鏽紅色魔術袋**

      | 1d8 | 生物 | 1d8 | 生物 |
      | --- | --- | --- | --- |
      | 1 | 老鼠 | 5 | 巨山羊 |
      | 2 | 貓頭鷹 | 6 | 巨野豬 |
      | 3 | 獒犬 | 7 | 獅子 |
      | 4 | 山羊 | 8 | 棕熊 |

      **棕褐色魔術袋**

      | 1d8 | 生物 | 1d8 | 生物 |
      | --- | --- | --- | --- |
      | 1 | 胡狼 | 5 | 黑熊 |
      | 2 | 猿猴 | 6 | 巨鼬 |
      | 3 | 狒狒 | 7 | 巨鬣狗 |
      | 4 | 斧喙鳥 | 8 | 老虎 |
  - id: bead-of-force
    name: 力場珠
    nameEn: "Bead of Force"
    source: srd
    category: wondrous
    group: consumable
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      這顆黑色小圓球直徑3/4吋，重1盎司。通常會有1d4 + 4顆_力場珠_一起被發現。

      你可以進行魔法動作，將珠子投擲至多60呎。珠子撞擊時在半徑10呎的球形區域內爆炸並被摧毀。每個生物在球形區域內都必須成功通過DC 15的敏捷豁免，否則受到5d4力場傷害。隨後，一個透明的力場球體會包覆該區域1分鐘。任何豁免失敗且完全位於該區域內的生物都會被困在球體內。豁免成功或僅有部分身體位於該區域內的生物，會被從球體中心向外推開，直到不再位於球體內。只有可呼吸的空氣能穿過球體的壁。任何攻擊或其他效果都無法穿過。

      被包覆的生物可以進行使用動作推擠球體的壁，使球體移動至多該生物速度的一半。球體可以被拿起，其魔法使它不論內部生物的重量多少，都只重1磅。
  - id: bead-of-nourishment
    name: 飽腹珠
    nameEn: "Bead of Nourishment"
    source: srd
    category: wondrous
    group: consumable
    rarity: common
    attunement: false
    consumable: true
    text: |-
      這顆無味的膠狀珠子會在你的舌頭上溶解，提供相當於1天口糧的營養。
  - id: belt-of-dwarvenkind
    name: 矮人腰帶
    nameEn: "Belt of Dwarvenkind"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      穿戴這條腰帶時，你獲得以下益處：

      **矮人語。** 你懂矮人語。

      **矮人之友。** 你在與矮人和灰矮人互動的魅力（遊說）檢定上具有優勢。

      **堅韌。** 你的體質提高2點，最高為20。

      此外，當你與腰帶同調時，每天黎明你有50%的機率長出一把濃密的鬍鬚（若你能長鬍鬚），或讓原有的鬍鬚更濃密。

      若你不是矮人或灰矮人，則穿戴腰帶時你還會獲得以下額外益處：

      **黑暗視覺。** 你具有射程60呎的黑暗視覺。

      **韌性。** 你對毒素傷害具有抗性。你在為避免或結束中毒狀態而進行的豁免上也具有優勢。
  - id: belt-of-giant-strength
    name: 巨人之力腰帶
    nameEn: "Belt of Giant Strength"
    source: srd
    category: wondrous
    group: wearable
    rarity: varies
    attunement: true
    options:
      - id: giant
        label: 巨人種類
        choices:
          - { value: hill, label: 山丘, rarity: rare, score: 21 }
          - { value: frost-stone, label: 霜或石, rarity: very-rare, score: 23 }
          - { value: fire, label: 火, rarity: very-rare, score: 25 }
          - { value: cloud, label: 雲, rarity: legendary, score: 27 }
          - { value: storm, label: 風暴, rarity: legendary, score: 29 }
    text: |-
      穿戴這條腰帶時，你的力量會變為腰帶賦予的屬性值。巨人的種類決定該屬性值（見下表）。若你不穿戴腰帶時的力量等於或高於腰帶的屬性值，此物品對你沒有任何效果。

      | 腰帶 | 力量 | 稀有度 |
      | --- | --- | --- |
      | 巨人之力腰帶（山丘） | 21 | 稀有 |
      | 巨人之力腰帶（霜或石） | 23 | 極稀有 |
      | 巨人之力腰帶（火） | 25 | 極稀有 |
      | 巨人之力腰帶（雲） | 27 | 傳說 |
      | 巨人之力腰帶（風暴） | 29 | 傳說 |
  - id: berserker-axe
    name: 狂戰斧
    nameEn: "Berserker Axe"
    source: srd
    category: weapon
    rarity: rare
    attunement: true
    base: { from: [ 戰斧, 巨斧, 長戟 ] }
    effects: { attack: 1, damage: 1 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值。此外，當你與這件武器同調時，你已達到的每一個等級都使你的生命值上限增加1。

      _詛咒。_ 這件武器受到詛咒，與它同調會使詛咒延伸到你身上。只要你仍受到詛咒，你就不願與這件武器分離，隨時將它放在伸手可及之處。你使用這件武器以外的武器進行攻擊檢定時也具有劣勢。

      在你持有這件武器期間，每當有其他生物對你造成傷害，你必須成功通過DC 15的感知豁免，否則陷入狂暴。當你的回合開始時，若60呎內沒有你能看見或聽見的生物，這個狂暴狀態就會結束。

      狂暴期間，你把離你最近、你能看見或聽見的生物視為敵人。若有多個符合的生物，隨機選擇其中一個。在你的每個回合，你必須盡可能移動到靠近該生物的位置，並進行攻擊動作，以該生物為目標。若你無法靠近到能用這件武器攻擊該生物的距離，則在你用盡所有可用的移動力後，你的回合結束。若該生物死亡或你再也無法看見或聽見它，則你能看見或聽見的下一個最近的生物成為你的新目標。
  - id: boots-of-elvenkind
    name: 精靈之靴
    nameEn: "Boots of Elvenkind"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: false
    text: |-
      穿戴這雙靴子時，無論你走過什麼表面，你的腳步都不會發出聲音。你在敏捷（隱匿）檢定上也具有優勢。
  - id: boots-of-levitation
    name: 浮空之靴
    nameEn: "Boots of Levitation"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      穿戴這雙靴子時，你可以對自己施放_浮空術_。
  - id: boots-of-speed
    name: 速度之靴
    nameEn: "Boots of Speed"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      穿戴這雙靴子時，你可以進行附贈動作，將靴跟互相敲擊。若你這麼做，靴子會使你的速度加倍，且任何對你進行藉機攻擊的生物，其攻擊檢定具有劣勢。若你再次敲擊靴跟，就會結束此效果。

      當你使用靴子的特性累計達10分鐘後，這份魔法對你失效，直到你完成一次長休為止。
  - id: boots-of-striding-and-springing
    name: 跑跳之靴
    nameEn: "Boots of Striding and Springing"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這雙靴子時，你的速度變為30呎（除非你的速度原本更高），且你的速度不會因為你攜帶超過負重能力的重量或穿戴重甲而降低。

      在你的每個回合中，你可以有一次只花費10呎移動力就跳躍至多30呎。
  - id: boots-of-the-winterlands
    name: 雪地之靴
    nameEn: "Boots of the Winterlands"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      這雙帶毛的靴子貼腳又溫暖。穿戴它們時，你獲得以下益處。

      _冷凍抗性。_ 你對冷凍傷害具有抗性，且不需要任何額外保護就能忍受華氏0度或更低的氣溫。

      _冬日行者。_ 你無視由冰或雪造成的困難地形。
  - id: bowl-of-commanding-water-elementals
    name: 命令水元素碗缽
    nameEn: "Bowl of Commanding Water Elementals"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    text: |-
      當這個碗缽裝滿水且你在其5呎內時，你可以進行魔法動作來召喚一隻水元素。該元素生物出現在盡可能靠近碗缽的未被佔據的空間，聽得懂你的語言、服從你的命令，並在你的先攻順位上緊接在你之後進行回合。該元素生物會在1小時後、死亡時，或當你以附贈動作遣散它時消失。直到下次黎明前，碗缽都無法再次這樣使用。

      碗缽直徑約1呎，深度為直徑的一半，約可裝3加侖。
  - id: bracers-of-archery
    name: 射手護腕
    nameEn: "Bracers of Archery"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這對護腕時，你擁有長弓與短弓的熟練，且使用此類武器進行的傷害擲骰獲得+2加值。
  - id: bracers-of-defense
    name: 防禦護腕
    nameEn: "Bracers of Defense"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    effects: { ac: 2, condition: unarmored }
    text: |-
      穿戴這對護腕時，若你未穿戴護甲且未使用盾牌，你的護甲等級獲得+2加值。
  - id: brazier-of-commanding-fire-elementals
    name: 命令火元素火盆
    nameEn: "Brazier of Commanding Fire Elementals"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    text: |-
      當你在這個火盆5呎內時，你可以進行魔法動作來召喚一隻火元素。該元素生物出現在盡可能靠近火盆的未被佔據的空間，聽得懂你的語言、服從你的命令，並在你的先攻順位上緊接在你之後進行回合。該元素生物會在1小時後、死亡時，或當你以附贈動作遣散它時消失。直到下次黎明前，火盆都無法再次這樣使用。
  - id: brooch-of-shielding
    name: 護盾胸針
    nameEn: "Brooch of Shielding"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這枚胸針時，你對力場傷害具有抗性，並且對_魔法飛彈_法術造成的傷害具有免疫。
  - id: broom-of-flying
    name: 飛天掃帚
    nameEn: "Broom of Flying"
    source: srd
    category: wondrous
    group: tool
    rarity: uncommon
    attunement: true
    text: |-
      這把木掃帚在你跨坐其上並進行魔法動作讓它懸停在你身下之前，功能與普通掃帚無異；懸停之後，就可以騎乘它在空中飛行。它的飛行速度為50呎。它最多可承載400磅，但承載超過200磅時，飛行速度變為30呎。當你著陸或不再騎乘時，掃帚就會停止懸停。

      作為魔法動作，只要你說出地點並熟悉該地，你就可以讓掃帚獨自前往你1英里內的目的地。當你進行魔法動作並使用命令詞時，若掃帚仍在你1英里內，它就會回到你身邊。
  - id: candle-of-invocation
    name: 祈神蠟燭
    nameEn: "Candle of Invocation"
    source: srd
    category: wondrous
    group: consumable
    rarity: very-rare
    attunement: true
    text: |-
      這根蠟燭的魔法在點燃時啟動，點燃需要進行魔法動作。燃燒4小時後，蠟燭會被摧毀。你可以提前將它熄滅，留待之後使用。以1分鐘為單位，從它的總燃燒時間中扣除已燃燒的時間。

      燃燒期間，蠟燭在半徑30呎內散發微光光照。當你在該光照內時，你在D20檢定上具有優勢。此外，在光照內的牧師或德魯伊可以不消耗法術位，施放其已準備的1環法術。

      或者，當你第一次點燃蠟燭時，可以用它施放_異界之門_。這麼做會摧毀蠟燭。該法術所創造的傳送門連結到由DM選擇或依下表擲骰決定的某個外層位面。

      | 1d100 | 外層位面 | 1d100 | 外層位面 |
      | --- | --- | --- | --- |
      | 01–05 | 深淵 | 55–59 | 葛黑納 |
      | 06–10 | 亞克倫 | 60–64 | 哈迪斯 |
      | 11–17 | 阿堡瑞亞 | 65–69 | 靈薄獄 |
      | 18–25 | 阿卡迪亞 | 70–77 | 機械境 |
      | 26–33 | 獸域 | 78–85 | 天堂山 |
      | 34–41 | 貝托匹亞 | 86–90 | 九層地獄 |
      | 42–46 | 卡塞瑞 | 91–95 | 萬魔殿 |
      | 47–54 | 極樂境 | 96–00 | 伊斯嘉德 |
  - id: cape-of-the-mountebank
    name: 郎中披肩
    nameEn: "Cape of the Mountebank"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: false
    text: |-
      這件披肩隱約散發硫磺的氣味。穿戴時，你可以用它施放_任意門_，施放時間為魔法動作。此特性直到下次黎明前都無法再次使用。

      當你用該法術傳送時，會留下一團煙霧。你離開的空間在你下個回合結束前，會因這團煙霧而處於輕度遮蔽。
  - id: carpet-of-flying
    name: 飛毯
    nameEn: "Carpet of Flying"
    source: srd
    category: wondrous
    group: tool
    rarity: very-rare
    attunement: false
    options:
      - id: size
        label: 尺寸
        choices:
          - { value: "3x5", label: "3呎 × 5呎" }
          - { value: "4x6", label: "4呎 × 6呎" }
          - { value: "5x7", label: "5呎 × 7呎" }
          - { value: "6x9", label: "6呎 × 9呎" }
    text: |-
      你可以進行魔法動作並使用地毯的命令詞，讓這張地毯懸停並飛行。若你在地毯30呎內，它會依照你的指示移動。

      _飛毯_有四種尺寸。DM選擇特定地毯的尺寸，或依下表擲骰隨機決定。地毯最多可承載表中所列重量的兩倍，但若承載超過正常承載量，其飛行速度會減半。

      | 1d100 | 尺寸 | 承載量 | 飛行速度 |
      | --- | --- | --- | --- |
      | 01–20 | 3呎 × 5呎 | 200磅 | 80呎 |
      | 21–55 | 4呎 × 6呎 | 400磅 | 60呎 |
      | 56–80 | 5呎 × 7呎 | 600磅 | 40呎 |
      | 81–00 | 6呎 × 9呎 | 800磅 | 30呎 |
  - id: censer-of-controlling-air-elementals
    name: 風元素控制香爐
    nameEn: "Censer of Controlling Air Elementals"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    text: |-
      輕輕搖晃這個香爐時，你可以進行魔法動作來召喚一隻風元素。該元素生物出現在盡可能靠近香爐的未被佔據的空間，聽得懂你的語言、服從你的命令，並在你的先攻順位上緊接在你之後進行回合。該元素生物會在1小時後、死亡時，或當你以附贈動作遣散它時消失。直到下次黎明前，香爐都無法再次這樣使用。
  - id: chime-of-opening
    name: 開門鐘琴
    nameEn: "Chime of Opening"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    weight: 1
    text: |-
      這根中空的金屬管長約1呎，重1磅。作為魔法動作，你可以敲擊鐘琴來施放_敲擊術_。該法術慣有的敲擊聲被鐘琴清亮的鳴響取代，在300呎外都聽得見。

      鐘琴可以使用10次。第十次使用後，它會裂開而變得無用。
  - id: circlet-of-blasting
    name: 爆裂頭飾
    nameEn: "Circlet of Blasting"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: false
    text: |-
      穿戴這個頭飾時，你可以用它施放_灼熱射線_（命中+5）。直到下次黎明前，頭飾都無法再次施放這個法術。
  - id: cloak-of-arachnida
    name: 節肢斗篷
    nameEn: "Cloak of Arachnida"
    source: srd
    category: wondrous
    group: wearable
    rarity: very-rare
    attunement: true
    text: |-
      這件精緻的衣物以黑色絲綢織成，其中交織著淡淡的銀色絲線。穿戴時，你獲得以下益處。

      _毒素抗性。_ 你對毒素傷害具有抗性。

      _蜘蛛攀爬。_ 你具有等同於你速度的攀爬速度，可以在垂直表面上向上、向下與橫向移動，也可以沿天花板移動，且雙手保持自由。

      _蜘蛛行走。_ 你不會被任何種類的蛛網困住，並且可以把蛛網視為困難地形穿越。

      _蛛網。_ 你可以施放_蛛網術_（豁免DC 13）。該法術創造的蛛網會填滿其正常範圍的兩倍。此特性使用後，直到下次黎明前都無法再次使用。
  - id: cloak-of-displacement
    name: 位移斗篷
    nameEn: "Cloak of Displacement"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      穿戴這件斗篷時，它會以魔法投射出一個幻象，使你看起來站在靠近你實際位置的某處，讓任何生物對你進行的攻擊檢定都具有劣勢。若你受到傷害，此特性在你的下個回合開始前停止作用。當你的速度為0時，此特性受到抑制。
  - id: cloak-of-elvenkind
    name: 精靈斗篷
    nameEn: "Cloak of Elvenkind"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這件斗篷時，為察覺你而進行的感知（察覺）檢定具有劣勢，且你在敏捷（隱匿）檢定上具有優勢。
  - id: cloak-of-invisibility
    name: 隱形斗篷
    nameEn: "Cloak of Invisibility"
    source: srd
    category: wondrous
    group: wearable
    rarity: legendary
    attunement: true
    text: |-
      這件斗篷有3次充能，每天黎明恢復1d3次已消耗的充能。穿戴斗篷時，你可以進行魔法動作拉起兜帽罩住頭部並消耗1次充能，使自己陷入隱形狀態1小時。若你放下兜帽（不需動作）或不再穿戴斗篷，此效果會提前結束。
  - id: cloak-of-protection
    name: 防護斗篷
    nameEn: "Cloak of Protection"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    effects: { ac: 1, saves: 1 }
    text: |-
      穿戴這件斗篷時，你的護甲等級與豁免獲得+1加值。
  - id: cloak-of-the-bat
    name: 蝙蝠斗篷
    nameEn: "Cloak of the Bat"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      穿戴這件斗篷時，你在敏捷（隱匿）檢定上具有優勢。在微光光照或黑暗的區域中，你可以抓住斗篷的邊緣，利用它獲得40呎的飛行速度。若你在這樣飛行時任何時候沒能抓住斗篷的邊緣，或你不再處於微光光照或黑暗中，你就失去這個飛行速度。

      在微光光照或黑暗的區域中穿戴斗篷時，你可以對自己施放_變形術_，變身成一隻蝙蝠。處於該形態時，你保留自己的智力、感知與魅力屬性值。直到下次黎明前，斗篷都無法再次這樣使用。
  - id: cloak-of-the-manta-ray
    name: 魟魚斗篷
    nameEn: "Cloak of the Manta Ray"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這件斗篷時，你可以在水下呼吸，並具有60呎的游泳速度。
  - id: crystal-ball
    name: 水晶球
    nameEn: "Crystal Ball"
    source: srd
    category: wondrous
    group: curio
    rarity: very-rare
    attunement: true
    text: |-
      觸碰這顆水晶球時，你可以用它施放_探知術_（豁免DC 17）。
  - id: crystal-ball-of-mind-reading
    name: 讀心水晶球
    nameEn: "Crystal Ball of Mind Reading"
    source: srd
    category: wondrous
    group: curio
    rarity: legendary
    attunement: true
    text: |-
      觸碰這顆水晶球時，你可以用它施放_探知術_（豁免DC 17）。此外，你可以施放_偵測思想_（豁免DC 17），以你在該法術感應器30呎內能看見的生物為目標。你不需要專注於這個_偵測思想_法術來在其持續時間內維持它，但若_探知術_法術結束，它也會結束。
  - id: crystal-ball-of-telepathy
    name: 心靈感應水晶球
    nameEn: "Crystal Ball of Telepathy"
    source: srd
    category: wondrous
    group: curio
    rarity: legendary
    attunement: true
    text: |-
      觸碰這顆水晶球時，你可以用它施放_探知術_（豁免DC 17）。此外，你可以與你在該法術感應器30呎內能看見的生物進行心靈感應溝通。你也可以透過感應器，對其中一個生物施放_暗示術_（豁免DC 17）。你不需要專注於這個_暗示術_來在其持續時間內維持它，但若_探知術_結束，它也會結束。直到下次黎明前，你都無法再以這種方式施放_暗示術_。
  - id: crystal-ball-of-true-seeing
    name: 真知水晶球
    nameEn: "Crystal Ball of True Seeing"
    source: srd
    category: wondrous
    group: curio
    rarity: legendary
    attunement: true
    text: |-
      觸碰這顆水晶球時，你可以用它施放_探知術_（豁免DC 17）。此外，你具有以該法術感應器為中心、射程120呎的真實視覺。
  - id: cube-of-force
    name: 力場魔方
    nameEn: "Cube of Force"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: true
    text: |-
      這個方塊寬約1吋。每一面都有不同的標記。你可以按下其中一面，消耗該面所需的充能次數，藉此施放與之對應的法術（豁免DC 17），如「力場魔方各面」表所示。

      魔方起初有10次充能，每天黎明恢復1d6次已消耗的充能。

      **力場魔方各面**

      | 法術 | 充能消耗 |
      | --- | --- |
      | 法師護甲 | 1 |
      | 護盾術 | 1 |
      | 小屋魔法 | 3 |
      | 私人密室 | 4 |
      | 彈力法球 | 4 |
      | 力場牆 | 5 |
  - id: cubic-gate
    name: 異界之門魔方
    nameEn: "Cubic Gate"
    source: srd
    category: wondrous
    group: tool
    rarity: legendary
    attunement: false
    text: |-
      這個方塊寬3吋，散發著可察覺的魔法能量。方塊的六個面各自對應一個不同的位面，其中一個是物質位面。其他面連結到由DM決定的位面。

      魔方有3次充能，每天黎明恢復1d3次已消耗的充能。作為魔法動作，你可以消耗魔方的1次充能，用魔方施放下列其中一個法術。

      _異界之門。_ 按下魔方的一面，你施放_異界之門_，開啟一道通往該面所對應位面的傳送門。

      _異界傳送。_ 連按魔方的一面兩次，你施放_異界傳送_，將目標傳送到該面所對應的位面。
  - id: dagger-of-venom
    name: 淬毒匕首
    nameEn: "Dagger of Venom"
    source: srd
    category: weapon
    rarity: rare
    attunement: false
    base: { fixed: 匕首 }
    effects: { attack: 1, damage: 1 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值。

      你可以進行附贈動作，以魔法在刃上塗上毒藥。毒藥會持續1分鐘，或直到使用這件武器的攻擊命中某個生物為止。該生物必須成功通過DC 15的體質豁免，否則受到2d10毒素傷害並陷入中毒狀態1分鐘。直到下次黎明前，這件武器都無法再次這樣使用。
  - id: dancing-sword
    name: 舞空劍
    nameEn: "Dancing Sword"
    source: srd
    category: weapon
    rarity: very-rare
    attunement: true
    base: { from: [ 巨劍, 長劍, 刺劍, 彎刀, 短劍 ] }
    text: |-
      你可以進行附贈動作，把這件魔法武器拋向空中。這麼做時，武器開始懸停，飛行至多30呎，並攻擊其自身5呎內你選擇的一個生物。武器使用你的攻擊檢定，並在傷害擲骰上加上你的屬性調整值。

      武器懸停期間，你可以進行附贈動作，使它飛至你30呎內的另一處地點，飛行至多30呎。作為同一個附贈動作的一部分，你可以使武器攻擊其5呎內的一個生物。

      懸停的武器第四次進行攻擊後，它會飛回你身邊並嘗試回到你的手中。若你沒有空著的手，武器會掉落在你所在的空間的地面上。若武器沒有通往你的暢通路徑，它會盡可能移動到靠近你的位置，然後掉落地面。若你抓住它，或你距離它超過30呎，它也會停止懸停。
  - id: decanter-of-endless-water
    name: 無盡水瓶
    nameEn: "Decanter of Endless Water"
    source: srd
    category: wondrous
    group: container
    rarity: uncommon
    attunement: false
    weight: 2
    text: |-
      這個塞著瓶塞的瓶子，搖晃時會發出水聲，彷彿裡面裝著水。水瓶重2磅。

      你可以進行魔法動作拔掉瓶塞並說出三個命令詞之一，隨後瓶中會流出一定量的淡水或鹹水（由你選擇）。水會在你的下個回合開始時停止流出。從下列命令詞中選擇：

      **濺水。** 水瓶產生1加侖的水。
      **噴泉。** 水瓶產生5加侖的水。
      **間歇泉。** 水瓶產生30加侖的水，噴湧成一道長30呎、寬1呎的直線。如果你正手持水瓶，可以將間歇泉瞄準某個方向（不需動作）。直線內你選擇的一個生物必須成功通過DC 13的力量豁免，否則受到1d4鈍擊傷害並陷入倒地狀態。你也可以不以生物為目標，而以直線內一個未被穿戴或攜帶、重量不超過200磅的物體為目標。該物體會被間歇泉衝倒。
  - id: deck-of-illusions
    name: 幻象牌組
    nameEn: "Deck of Illusions"
    source: srd
    category: wondrous
    group: curio
    rarity: uncommon
    attunement: false
    text: |-
      這個盒子裡裝著一組牌。完整的牌組有34張牌：32張繪有特定生物，2張為鏡面。作為寶藏被發現的牌組通常缺少1d20 − 1張牌。

      牌組的魔法只有在隨機抽牌時才會運作。你可以進行魔法動作，從牌組中隨機抽出一張牌，並將它扔到你30呎內某一點的地上。一個生物的幻象會在被扔出的牌上方形成，並持續到被解除為止，該生物依「幻象牌組」表擲骰決定。這張牌創造的幻象生物，外觀與行為都如同該種類的真實生物，只是無法造成任何傷害。當你在幻象生物120呎內且能看見它時，你可以進行魔法動作，將它移動到其牌30呎內的任何位置。

      任何與幻象生物的實體互動都會揭露它是假的，因為物體會穿過它。生物可以進行研究動作以視覺檢查幻象生物，成功通過DC 15的智力（調查）檢定即可識破它是幻象。幻象會持續到其牌被移動，或幻象被解除（使用_解除魔法_法術或類似效果）為止。當幻象結束時，牌上的圖像消失，該牌無法再次使用。

      **幻象牌組**

      | 1d100 | 幻象* |
      | --- | --- |
      | 01–03 | 成年紅龍 |
      | 04–06 | 大法師 |
      | 07–09 | 刺客 |
      | 10–12 | 盜匪首領 |
      | 13–15 | 蛇怪 |
      | 16–18 | 狂戰士 |
      | 19–21 | 熊地精戰士 |
      | 22–24 | 雲巨人 |
      | 25–27 | 德魯伊 |
      | 28–30 | 復仇魔 |
      | 31–33 | 雙頭巨人 |
      | 34–36 | 火巨人 |
      | 37–39 | 霜巨人 |
      | 40–42 | 豺狼人戰士 |
      | 43–45 | 地精戰士 |
      | 46–48 | 守衛娜迦 |
      | 49–51 | 山丘巨人 |
      | 52–54 | 大地精戰士 |
      | 55–57 | 夢魔 |
      | 58–60 | 鐵魔像 |
      | 61–63 | 騎士 |
      | 64–66 | 狗頭人戰士 |
      | 67–69 | 巫妖 |
      | 70–72 | 梅杜莎 |
      | 73–75 | 夜鬼婆 |
      | 76–78 | 食人魔 |
      | 79–81 | 鬼巨魔 |
      | 82–84 | 祭司 |
      | 85–87 | 魅魔 |
      | 88–90 | 巨魔 |
      | 91–93 | 老兵戰士 |
      | 94–96 | 飛龍 |
      | 97–00 | 抽牌者 |

      \*這些生物（抽牌者除外）的數據塊見「怪物」章節。
  - id: defender
    name: 防禦者
    nameEn: Defender
    source: srd
    category: weapon
    rarity: legendary
    attunement: true
    base: { any: [ melee-weapon ], label: 任意近戰武器 }
    effects: { attack: 3, damage: 3 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+3加值。

      你在每個自己的回合中第一次以此武器進行攻擊時，可以將武器的部分或全部加值轉移到你的護甲等級上。例如，你可以把攻擊檢定與傷害擲骰的加值降為+1，並獲得+2的護甲等級加值。調整後的加值持續到你下個回合開始為止，但你必須手持該武器，才能從它獲得AC加值。
  - id: demon-armor
    name: 惡魔護甲
    nameEn: "Demon Armor"
    source: srd
    category: armor
    rarity: very-rare
    attunement: true
    base: { any: [ light-armor, medium-armor, heavy-armor ], label: "任意輕甲、中甲或重甲" }
    effects: { ac: 1 }
    text: |-
      穿戴這件護甲時，你獲得+1護甲等級加值，並且你懂深淵語。此外，護甲上帶爪的護手讓你的徒手打擊造成1d8揮砍傷害，而非一般的鈍擊傷害，並且你的徒手打擊的攻擊檢定與傷害擲骰獲得+1加值。

      _詛咒。_ 一旦你穿上這件受詛咒的護甲，除非你成為_移除詛咒_法術或類似魔法的目標，否則無法脫下。穿戴這件護甲時，你對惡魔進行的攻擊檢定具有劣勢，且對抗惡魔的法術與特殊能力的豁免也具有劣勢。
  - id: dimensional-shackles
    name: 次元鐐銬
    nameEn: "Dimensional Shackles"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    text: |-
      你可以進行使用動作，將這副鐐銬銬在處於失能狀態的生物身上。鐐銬會調整大小，以適應小型至大型體型的生物。被鐐銬束縛的生物無法使用任何異次元移動的方式，包括傳送或前往不同位面。鐐銬不會阻止該生物穿過跨次元傳送門。

      你，以及你在使用鐐銬時指定的任何生物，可以進行使用動作來解開鐐銬。每30天一次，被束縛的生物可以進行一次DC 30的力量（運動）檢定。檢定成功時，該生物掙脫束縛並摧毀鐐銬。
  - id: dragon-orb
    name: 龍族法球
    nameEn: "Dragon Orb"
    source: srd
    category: wondrous
    group: curio
    rarity: artifact
    attunement: true
    text: |-
      法球是一顆刻有紋路的水晶球，直徑約10吋。使用時，它會增大到直徑約20吋，內部有霧氣旋繞。

      與法球同調期間，你可以進行魔法動作，凝視法球深處。你接著必須進行一次DC 15的魅力豁免。豁免成功時，只要你仍與它同調，你就控制該法球。豁免失敗時，只要你仍與它同調，法球就使你陷入魅惑狀態。

      當你受到法球魅惑時，你無法自願結束與它的同調，且法球會隨意對你施放_暗示術_（豁免DC 18），促使你為它所渴望的邪惡目的努力。法球內的龍之精華可能想要許多事物：毀滅某個特定社會或組織、脫離法球的束縛、在世間散播苦難、推廣對提亞瑪特的崇拜，或是DM決定的其他事物。

      _法術。_ 法球有7次充能，每天黎明恢復1d4 + 3次已消耗的充能。若你控制法球，可以從中施放下表所列法術之一。表格列出施放各法術需要消耗的充能次數。

      | 法術 | 充能消耗 |
      | --- | --- |
      | 療傷術（9環版本） | 4 |
      | 晝明術 | 1 |
      | 防死結界 | 2 |
      | 偵測魔法 | 0 |
      | 探知術（豁免DC 18） | 3 |

      _召喚龍類。_ 當你控制法球時，你可以進行魔法動作，讓法球發出一道心靈感應召喚，向四面八方延伸40英里。範圍內的繽紛龍會感到被迫要以最直接的路線盡快前來法球所在之處。像提亞瑪特這樣的龍類神祇不受此召喚影響。被吸引到法球處的繽紛龍，可能因為被迫違背自己的意願而對你抱持敵對態度。此特性使用後，1小時內無法再次使用。

      _摧毀法球。_ _龍族法球_的AC為20，若受到_武器+3_或_解離術_法術的傷害就會被摧毀。其他任何事物都無法傷害它。
  - id: dragon-scale-mail
    name: 龍鱗甲
    nameEn: "Dragon Scale Mail"
    source: srd
    category: armor
    rarity: very-rare
    attunement: true
    base: { fixed: 鱗甲 }
    options:
      - id: dragon
        label: 龍種
        choices:
          - { value: black, label: 黑龍 }
          - { value: blue, label: 藍龍 }
          - { value: brass, label: 黃銅龍 }
          - { value: bronze, label: 青銅龍 }
          - { value: copper, label: 赤銅龍 }
          - { value: gold, label: 金龍 }
          - { value: green, label: 綠龍 }
          - { value: red, label: 紅龍 }
          - { value: silver, label: 銀龍 }
          - { value: white, label: 白龍 }
    effects: { ac: 1 }
    text: |-
      龍鱗甲由某一種龍的鱗片製成。有時龍會收集自己脫落的鱗片並贈予他人。其他時候，獵人會小心保存死去巨龍的獸皮。無論是哪種情況，_龍鱗甲_都極為珍貴。

      穿戴這件護甲時，你獲得+1護甲等級加值，對抗龍類吐息武器的豁免具有優勢，並且對提供鱗片的那種龍所決定的一種傷害類型具有抗性（見隨附的表格）。

      此外，你可以作為魔法動作集中感官，辨明距離你30英里內、與護甲屬於同一種類的最近一條龍的距離與方向。此動作在下次黎明前無法再次使用。

      | 龍 | 抗性 | 龍 | 抗性 |
      | --- | --- | --- | --- |
      | 黑龍 | 強酸 | 金龍 | 火焰 |
      | 藍龍 | 閃電 | 綠龍 | 毒素 |
      | 黃銅龍 | 火焰 | 紅龍 | 火焰 |
      | 青銅龍 | 閃電 | 銀龍 | 冷凍 |
      | 赤銅龍 | 強酸 | 白龍 | 冷凍 |
  - id: dragon-slayer
    name: 屠龍者
    nameEn: "Dragon Slayer"
    source: srd
    category: weapon
    rarity: rare
    attunement: false
    base: { any: [ simple-weapon, martial-weapon ], label: 任意簡易或軍用武器 }
    effects: { attack: 1, damage: 1 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值。

      若目標是龍類，這件武器額外造成3d6與武器相同類型的傷害。
  - id: dust-of-disappearance
    name: 無蹤粉
    nameEn: "Dust of Disappearance"
    source: srd
    category: wondrous
    group: consumable
    rarity: uncommon
    attunement: false
    consumable: true
    text: |-
      這種粉末看起來像細沙。數量足夠使用一次。當你進行使用動作，將粉末拋向空中時，你以及以你為源頭的10呎發散區域內的每個生物與物體，都會陷入隱形狀態2d4分鐘。所有受影響者的持續時間相同，且粉末在其魔法生效時耗盡。受影響的生物在進行攻擊檢定、造成傷害或施放法術之後，該生物的隱形狀態立即結束。
  - id: dust-of-dryness
    name: 乾燥粉
    nameEn: "Dust of Dryness"
    source: srd
    category: wondrous
    group: consumable
    rarity: uncommon
    attunement: false
    consumable: true
    text: |-
      這個小包裡裝有1d6 + 4撮粉末。作為使用動作，你可以將一撮粉末撒在水上，把最多一個邊長15呎的水之立方體變成一顆彈珠大小的小球，小球會漂浮或停留在粉末撒下處附近。小球的重量可忽略不計。生物可以進行使用動作，將小球砸向堅硬的表面，使小球碎裂並釋放粉末所吸收的水。這樣做會摧毀小球並結束其魔法。

      作為使用動作，你可以將一撮粉末撒在距離你5呎內、主要由水構成的元素生物（例如**水元素**）身上。受到一撮粉末接觸的該生物進行一次DC 13的體質豁免，失敗者受到10d6黯蝕傷害，成功者受到一半傷害。
  - id: dust-of-sneezing-and-choking
    name: 噴嚏粉
    nameEn: "Dust of Sneezing and Choking"
    source: srd
    category: wondrous
    group: consumable
    rarity: uncommon
    attunement: false
    consumable: true
    text: |-
      這種粉末裝在小容器中，外觀類似_無蹤粉_，而_鑑定術_會顯示它就是_無蹤粉_。數量足夠使用一次。

      作為使用動作，你可以將粉末拋向空中，迫使你自己以及以你為源頭的30呎發散區域內的每個生物進行一次DC 15的體質豁免。構裝生物、元素生物、軟泥怪、植物與不死生物自動通過豁免。

      豁免失敗時，生物會開始無法控制地打噴嚏；它陷入失能狀態並處於窒息狀態。該生物在其每個回合結束時重複進行該豁免，成功則結束其身上的此效果。此效果也會在成為_次級復原術_法術目標的任何生物身上結束。
  - id: dwarven-plate
    name: 矮人板甲
    nameEn: "Dwarven Plate"
    source: srd
    category: armor
    rarity: very-rare
    attunement: false
    base: { from: [ 半身板甲, 全身板甲 ] }
    effects: { ac: 2 }
    text: |-
      穿戴這件護甲時，你獲得+2護甲等級加值。此外，若有效果違背你的意願使你沿著地面移動，你可以進行反應動作，將你被移動的距離減少最多10呎。
  - id: dwarven-thrower
    name: 矮人飛錘
    nameEn: "Dwarven Thrower"
    source: srd
    category: weapon
    rarity: very-rare
    attunement: 由矮人或已與矮人腰帶同調的生物
    base: { fixed: 戰錘 }
    effects: { attack: 3, damage: 3 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+3加值。它具有投擲屬性，一般射程為20呎，遠射程為60呎。當你以這件武器進行遠程攻擊並命中時，它額外造成1d8力場傷害；若目標是巨人，則額外造成2d8力場傷害。無論命中或未命中，武器隨即飛回你的手中。
  - id: efficient-quiver
    name: 巧藏箭袋
    nameEn: "Efficient Quiver"
    source: srd
    category: wondrous
    group: container
    rarity: uncommon
    attunement: false
    weight: 2
    text: |-
      箭袋的三個隔間各自連接到一個異次元空間，使箭袋能容納大量物品，而重量始終不超過2磅。最短的隔間最多可容納60支箭矢、弩矢或類似物體。中等長度的隔間最多容納18支標槍或類似物體。最長的隔間最多容納6件長形物體，例如弓、長棍或短矛。

      你可以取出箭袋內的任何物品，就如同從一般箭袋或劍鞘中取出一般。
  - id: efreeti-bottle
    name: 火巨靈囚瓶
    nameEn: "Efreeti Bottle"
    source: srd
    category: wondrous
    group: container
    rarity: very-rare
    attunement: false
    text: |-
      當你進行魔法動作拔開這個彩繪黃銅瓶的瓶塞時，一團濃煙會從中湧出。在你的回合結束時，煙霧伴隨一道無害的火焰閃光消失，一個**火巨靈**出現在距離你30呎內一個未被佔據的空間。

      瓶子第一次被打開時，DM在下表擲骰以決定會發生什麼事。

      | 1d10 | 效果 |
      | --- | --- |
      | 1 | 火巨靈攻擊你。戰鬥5輪後，火巨靈消失，瓶子失去魔力。 |
      | 2–9 | 火巨靈聽得懂你的語言，並服從你的命令1小時，之後它回到瓶中，並有一個新的瓶塞將它封住。瓶塞在24小時內無法拔開。接下來瓶子被打開的兩次，都會發生相同的效果。若瓶子被打開第四次，火巨靈便會逃脫並消失，瓶子失去魔力。 |
      | 10 | 火巨靈聽得懂你的語言，並可以為你施放一次祈願術。它在實現願望後或1小時後消失，瓶子失去魔力。 |
  - id: elemental-gem
    name: 元素寶石
    nameEn: "Elemental Gem"
    source: srd
    category: wondrous
    group: consumable
    rarity: uncommon
    attunement: false
    options:
      - id: gem
        label: 寶石
        choices:
          - { value: sapphire, label: 藍寶石 }
          - { value: emerald, label: 祖母綠 }
          - { value: corundum, label: 紅剛玉 }
          - { value: yellow-diamond, label: 黃鑽石 }
    consumable: true
    text: |-
      這顆寶石蘊含一絲元素能量。當你進行使用動作打碎寶石時，會召喚出一個元素生物（數據塊見「怪物」章節），而寶石不再具有魔力。元素生物出現在盡可能靠近破碎寶石的一個未被佔據的空間，聽得懂你的語言、服從你的命令，並在你的先攻順位上緊接在你之後進行回合。元素生物會在1小時後、死亡時，或你以附贈動作遣散它時消失。寶石的種類決定元素生物的種類，如下表所示。

      | 寶石 | 召喚的元素生物 |
      | --- | --- |
      | 藍寶石 | 風元素 |
      | 祖母綠 | 水元素 |
      | 紅剛玉 | 火元素 |
      | 黃鑽石 | 土元素 |
  - id: elixir-of-health
    name: 健康靈藥
    nameEn: "Elixir of Health"
    source: srd
    category: potion
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      當你喝下這瓶藥水時，你所有的魔法傳染病都會被治癒。此外，你身上的以下狀態會結束：失明、耳聾、麻痺與中毒。

      這種清澈的紅色液體中帶有微小的光泡。
  - id: elven-chain
    name: 精靈鏈甲
    nameEn: "Elven Chain"
    source: srd
    category: armor
    rarity: rare
    attunement: false
    base: { from: [ 鎖子甲, 半身鎖甲 ] }
    effects: { ac: 1 }
    text: |-
      穿戴這件護甲時，你獲得+1護甲等級加值。即使你未受過中甲或重甲的訓練，也視為受過這件護甲的訓練。
  - id: energy-bow
    name: 能量弓
    nameEn: "Energy Bow"
    source: srd
    category: weapon
    rarity: very-rare
    attunement: true
    base: { from: [ 長弓, 短弓 ] }
    effects: { attack: 1, damage: 1 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值，這件武器沒有弓弦。每次你以射擊的姿勢拉開手臂時，一支由金色能量構成的魔法箭矢便會出現，已搭好並準備發射。這件武器產生的箭矢命中時造成力場傷害而非穿刺傷害，並在命中或未命中目標之後消失。在消失之前，這支箭矢在半徑20呎內散發明亮光照，並再向外20呎散發微光光照。

      這件武器具有以下額外特性。

      _束縛之箭。_ 每當你以這件武器對生物進行遠程攻擊時，你可以嘗試束縛目標，而非對其造成傷害。若箭矢命中，目標必須成功通過DC 15的力量豁免，否則陷入束縛狀態1分鐘。被箭矢束縛的生物可以作為動作進行一次DC 20的力量（運動）檢定，嘗試掙脫束縛；檢定成功則結束其身上的此效果。

      _傳送之箭。_ 作為魔法動作，你可以從這件武器射出一支能量箭矢，射向你周圍60呎內你能看見的一個目標。目標可以是一個自願的中型或更小的生物，或是一個未被穿戴或攜帶的物體，且該物體必須小到能放進邊長5呎的立方體內。箭矢會將目標傳送到距離你10呎內、你能看見的一個未被佔據的空間。

      _能量階梯。_ 作為魔法動作，你可以從這件武器朝距離你最遠60呎的一面牆壁射出一陣能量箭矢。這些箭矢會變成從牆上突出的發光梯級，在牆上形成一道最長60呎的魔法階梯。這道階梯持續1分鐘後消失。
  - id: eversmoking-bottle
    name: 無盡煙壺
    nameEn: "Eversmoking Bottle"
    source: srd
    category: wondrous
    group: container
    rarity: uncommon
    attunement: false
    text: |-
      作為魔法動作，你可以打開或關閉這個瓶子。打開瓶子會使濃煙湧出，形成一團充滿以瓶子為源頭的60呎發散區域的雲霧。煙霧範圍內為重度遮蔽。

      瓶子每保持開啟1分鐘，發散區域的大小就增加10呎，直到達到最大尺寸120呎。
      關閉瓶子會使雲霧固定在原地，並在10分鐘後消散。強風（例如由_造風術_法術產生的風）會在1分鐘後驅散雲霧。
  - id: eyes-of-charming
    name: 魅惑鏡片
    nameEn: "Eyes of Charming"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      這些水晶鏡片可戴在眼睛上。它們有3次充能。穿戴它們時，你可以消耗1次或更多次充能來施放_魅惑人類_（豁免DC 13）。消耗1次充能時，你施放的是該法術的1環版本。你每額外消耗1次充能，法術的環階就提高1環。鏡片每天黎明恢復所有已消耗的充能。
  - id: eyes-of-minute-seeing
    name: 微視鏡片
    nameEn: "Eyes of Minute Seeing"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: false
    text: |-
      這些水晶鏡片可戴在眼睛上。穿戴它們時，你的視力在1呎範圍內大幅提升，使你在該範圍內獲得黑暗視覺，並且在檢視該範圍內事物時進行的智力（調查）檢定具有優勢。
  - id: eyes-of-the-eagle
    name: 鷹眼鏡片
    nameEn: "Eyes of the Eagle"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: false
    text: |-
      這些水晶鏡片可戴在眼睛上。穿戴它們時，你依賴視覺的感知（察覺）檢定具有優勢。在視野清晰的條件下，你甚至能辨識極遠處的生物與物體，其寬度小至2呎也能看清細節。
  - id: feather-token
    name: 羽符
    nameEn: "Feather Token"
    source: srd
    category: wondrous
    group: consumable
    rarity: varies
    attunement: false
    options:
      - id: kind
        label: 種類
        choices:
          - { value: anchor, label: 錨, rarity: uncommon }
          - { value: bird, label: 鳥, rarity: rare }
          - { value: fan, label: 扇, rarity: uncommon }
          - { value: swan-boat, label: 天鵝船, rarity: rare }
          - { value: tree, label: 樹, rarity: uncommon }
          - { value: whip, label: 鞭, rarity: rare }
    consumable: true
    text: |-
      這件物體看起來像一根羽毛。羽符有不同的種類，各有不同的一次性效果。DM選擇羽符的種類，或在「羽符」表擲骰隨機決定。羽符的種類決定其稀有度。

      _錨（非常見）。_ 你可以進行魔法動作，將羽符觸碰到一艘小船或大船上。接下來24小時內，該船隻無法以任何方式移動。再次將羽符觸碰到該船隻上則結束此效果。效果結束時，羽符消失。

      _鳥（稀有）。_ 你可以進行魔法動作，將羽符拋向5呎高的空中。羽符消失，取而代之的是一隻巨大的彩色鳥。這隻鳥擁有**大鵬**的數據，但無法攻擊。它服從你的簡單命令，並能以最大速度飛行時承載最多500磅（每小時16英里，每天最多144英里，每飛行3小時須休息1小時），或以一半速度承載1,000磅。這隻鳥在一天內飛完最大距離後，或降到0生命值時消失。你可以進行魔法動作遣散這隻鳥。

      _扇（非常見）。_ 若你在小船或大船上，可以進行魔法動作，將羽符拋向最高10呎的空中。羽符消失，取而代之的是一把拍動的巨大扇子。扇子漂浮並產生強風。這陣風可以灌滿一艘船的船帆，使其速度在8小時內增加每小時5英里。你可以進行魔法動作遣散這把扇子。

      _天鵝船（稀有）。_ 你可以進行魔法動作，將羽符觸碰到一片直徑至少60呎的水域。羽符消失，取而代之的是一艘長50呎、寬20呎、形如天鵝的船。這艘船能自行推進，以每小時6英里的速度在水面上移動。你在船上時可以進行魔法動作，命令它移動或轉向最多90度。這艘船存在24小時後消失。你可以進行魔法動作遣散這艘船。

      _樹（非常見）。_ 你必須身處戶外才能使用這個羽符。你可以進行魔法動作，將它觸碰到地面上一個未被佔據的空間。羽符消失，原處長出一棵非魔法的橡樹。這棵樹高60呎，樹幹直徑5呎，頂端的樹枝向外展開成半徑20呎的範圍。

      _鞭（稀有）。_ 你可以進行魔法動作，將羽符擲向距離你10呎內的一點。羽符消失，取而代之的是一條漂浮的鞭子。你接著可以進行附贈動作，對鞭子10呎內的一個生物進行近戰法術攻擊，攻擊加值為+9。命中時，目標受到1d6 + 5力場傷害。

      作為附贈動作，你可以指揮鞭子飛行最多20呎，並對鞭子10呎內的一個生物重複進行攻擊。鞭子會在1小時後、你進行魔法動作遣散它時，或你死亡或陷入失能狀態時消失。

      **羽符**

      | 1d100 | 羽符 | 稀有度 |
      | --- | --- | --- |
      | 01–20 | 錨 | 非常見 |
      | 21–35 | 鳥 | 稀有 |
      | 36–50 | 扇 | 非常見 |
      | 51–65 | 天鵝船 | 稀有 |
      | 66–90 | 樹 | 非常見 |
      | 91–00 | 鞭 | 稀有 |
  - id: figurine-of-wondrous-power
    name: 異能塑像
    nameEn: "Figurine of Wondrous Power"
    source: srd
    category: wondrous
    group: curio
    rarity: varies
    attunement: false
    options:
      - id: kind
        label: 種類
        choices:
          - { value: bronze-griffon, label: 青銅獅鷲, rarity: rare }
          - { value: ebony-fly, label: 烏木蒼蠅, rarity: rare }
          - { value: golden-lions, label: 黃金雄獅, rarity: rare }
          - { value: ivory-goats, label: 象牙山羊, rarity: rare }
          - { value: marble-elephant, label: 大理石象, rarity: rare }
          - { value: obsidian-steed, label: 黑曜石駿馬, rarity: very-rare }
          - { value: onyx-dog, label: 縞瑪瑙犬, rarity: rare }
          - { value: serpentine-owl, label: 蛇紋石貓頭鷹, rarity: rare }
          - { value: silver-raven, label: 銀渡鴉, rarity: uncommon }
    text: |-
      _異能塑像_是一尊小到能放進口袋的塑像。若你進行魔法動作，將塑像丟向你周圍60呎內地面上的一點，塑像就會變成下方塑像說明中指定的活生物。若該生物將出現的空間被其他生物或物體佔據，或是沒有足夠的空間容納該生物，塑像就不會變成生物。

      該生物對你和你的盟友為友善。它聽得懂你的語言、服從你的命令，並在你的先攻順位上緊接在你之後進行回合。若你沒有下達命令，該生物會自衛，但不採取其他行動。

      該生物的存在時間依各塑像而定。持續時間結束時，該生物會恢復為塑像形態。若其生物形態降到0生命值，或你在接觸該生物的同時進行魔法動作使其恢復為塑像形態，它會提前恢復為塑像。當該生物再次變回塑像時，其特性在經過一段特定時間之前無法再次使用，該時間依各塑像的說明而定。

      **青銅獅鷲（稀有）。** 這尊青銅塑像是一隻人立的獅鷲。它可以變成**獅鷲**，最長6小時。使用後，要經過5天才能再次使用。

      **烏木蒼蠅（稀有）。** 這尊烏木塑像刻成馬蠅的模樣，可以變成**巨蠅**（見隨附的數據塊），最長12小時，並且可以當作坐騎騎乘。使用後，要經過2天才能再次使用。

      #### 巨蠅

      _大型野獸，無陣營_

      **AC** 11 **先攻** +1（11）
      **HP** 19（3d10 + 3）
      **速度** 30呎，飛行60呎

      |  |  | 調整值 | 豁免 |  |  | 調整值 | 豁免 |  |  | 調整值 | 豁免 |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | 力量 | 14 | +2 | +2 | 敏捷 | 13 | +1 | +1 | 體質 | 13 | +1 | +1 |
      | 智力 | 2 | −4 | −4 | 感知 | 10 | +0 | +0 | 魅力 | 3 | −4 | −4 |

      **感官** 黑暗視覺60呎，被動察覺10
      **語言** 無
      **CR** 0（XP 0；PB +2）

      **黃金雄獅（稀有）。** 這兩尊黃金獅子塑像總是成對製作。你可以使用其中一尊，或同時使用兩尊。每尊可以變成一隻**獅子**，最長1小時。一隻獅子使用過後，要經過7天才能再次使用。

      **象牙山羊（稀有）。** 這幾尊象牙山羊塑像總是三尊一組製作。每隻山羊看起來都獨一無二，功能也與其他山羊不同。它們的特性如下：

      **恐懼山羊。** 這尊塑像可以變成一隻**巨山羊**，最長3小時。這隻山羊無法攻擊，但你可以（無害地）取下它的角當作武器使用。一支角變成_騎槍+1_，另一支變成_長劍+2_。取下一支角需要進行魔法動作，當山羊恢復為塑像形態時，這些武器消失，角也回到山羊身上。當你騎乘山羊時，任何在其回合開始時位於

      以山羊為源頭的30呎發散區域內的敵對生物，必須成功通過DC 15的感知豁免，否則陷入恐慌狀態1分鐘，直到你不再騎乘山羊，或直到山羊恢復為塑像形態為止。陷入恐慌狀態的生物在其每個回合結束時重複進行該豁免，成功則結束其身上的此效果。一旦成功通過豁免，該生物在接下來24小時內免疫此效果。塑像使用後，要經過15天才能再次使用。

      **旅行山羊。** 這尊塑像可以變成一隻大型山羊，其數據與**馱用馬**相同。它有24次充能，每在山羊形態停留1小時或不足1小時，就消耗1次充能。只要它還有充能，你就可以隨意使用。當它的充能耗盡時，它會恢復為塑像，要經過7天才能再次使用，屆時它恢復所有已消耗的充能。

      **勞苦山羊。** 這尊塑像可以變成一隻巨**山羊**，最長3小時。使用後，要經過30天才能再次使用。

      **大理石象（稀有）。** 這尊大理石塑像形似一頭正在鳴叫的大象。它可以變成一頭**大象**，最長24小時。使用後，要經過7天才能再次使用。

      **黑曜石駿馬（極稀有）。** 這匹拋光的黑曜石馬可以變成一隻**夢魘獸**，最長24小時。夢魘獸只為了自衛而戰鬥。使用後，要經過5天才能再次使用。

      你每次使用這尊塑像時，它有10%的機率無視你的命令，包括要它恢復為塑像形態的命令。若你在夢魘獸無視你的命令時騎上它，你和夢魘獸會立即被傳送到哈迪斯位面上的隨機地點，夢魘獸在那裡恢復為塑像形態。

      **縞瑪瑙犬（稀有）。** 這尊縞瑪瑙塑像是一隻狗，可以變成一隻**獒犬**，最長6小時。這隻獒犬的智力為8，並能說通用語。它還具有射程60呎的盲視。使用後，要經過7天才能再次使用。

      **蛇紋石貓頭鷹（稀有）。** 這尊蛇紋石塑像是一隻貓頭鷹，可以變成一隻**巨貓頭鷹**，最長8小時。若你與它處於同一位面，貓頭鷹可以在任何距離下與你進行心靈感應溝通。使用後，要經過2天才能再次使用。

      **銀渡鴉（非常見）。** 這尊銀製塑像是一隻渡鴉，可以變成一隻**渡鴉**，最長12小時。使用後，要經過2天才能再次使用。處於渡鴉形態時，這尊塑像讓你能對它施放_動物信使_。
  - id: flame-tongue
    name: 焰舌
    nameEn: "Flame Tongue"
    source: srd
    category: weapon
    rarity: rare
    attunement: true
    base: { any: [ melee-weapon ], label: 任意近戰武器 }
    text: |-
      手持這件魔法武器時，你可以進行附贈動作並使用命令詞，使烈焰包覆武器造成傷害的部分。這些火焰在半徑40呎內散發明亮光照，並再向外40呎散發微光光照。武器燃燒期間，命中時額外造成2d6火焰傷害。火焰持續到你進行附贈動作再次下達命令，或你丟下、收起或將武器入鞘為止。
  - id: folding-boat
    name: 摺疊船
    nameEn: "Folding Boat"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    weight: 4
    text: |-
      這件物體外觀是一個長12吋、寬6吋、深6吋的木盒。它重4磅，且能浮在水面。它可以打開來存放物品。這件物品另有三個命令詞，各需要進行魔法動作才能使用：

      **第一命令詞。** 木盒展開成一艘划艇。

      **第二命令詞。** 木盒展開成一艘龍骨船。

      **第三命令詞。** 若船上沒有生物，_摺疊船_會摺回木盒。船上無法放進木盒內的任何物體會在木盒摺起時留在盒外。船上能放進木盒內的任何物體則會放入盒中。

      當木盒變成船隻時，其重量變為同尺寸一般船隻的重量，原本存放在木盒內的任何物品仍留在船內。

      划艇與龍骨船的數據見「裝備」章節。若任一艘船隻降到0生命值，_摺疊船_即被摧毀。
  - id: frost-brand
    name: 霜銘
    nameEn: "Frost Brand"
    source: srd
    category: weapon
    rarity: very-rare
    attunement: true
    base: { from: [ 長柄刀, 巨劍, 長劍, 刺劍, 彎刀, 短劍 ] }
    text: |-
      當你以這件魔法武器進行攻擊檢定並命中時，目標額外受到1d6冷凍傷害。此外，只要你手持這件武器，你對火焰傷害具有抗性。

      在冰點以下的溫度中，這件武器在半徑10呎內散發明亮光照，並再向外10呎散發微光光照。

      當你拔出這件武器時，可以熄滅你周圍30呎內所有非魔法的火焰。此特性使用後，1小時內無法再次使用。
  - id: gauntlets-of-ogre-power
    name: 食人魔力量護手
    nameEn: "Gauntlets of Ogre Power"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這副護手時，你的力量為19。若不穿戴護手時你的力量就已達到19或更高，護手對你沒有效果。
  - id: gem-of-brightness
    name: 光彩奪目寶石
    nameEn: "Gem of Brightness"
    source: srd
    category: wondrous
    group: curio
    rarity: uncommon
    attunement: false
    text: |-
      這顆稜柱寶石有50次充能。手持它時，你可以進行魔法動作並使用三個命令詞之一，造成下列效果之一：

      **第一命令詞。** 寶石在半徑30呎內散發明亮光照，並再向外30呎散發微光光照。此效果不消耗充能。它持續到你進行附贈動作重複說出該命令詞，或你使用寶石的另一項功能為止。

      **第二命令詞。** 你消耗1次充能，使寶石朝你周圍60呎內你能看見的一個生物射出一道耀眼的光束。該生物必須成功通過DC 15的體質豁免，否則陷入失明狀態1分鐘。該生物在其每個回合結束時重複進行該豁免，成功則結束其身上的此效果。

      **第三命令詞。** 你消耗5次充能，使寶石在30呎錐形區域內迸發強烈的閃光。錐形區域內的每個生物，都如同被第二命令詞產生的光束擊中一般進行豁免。

      當寶石的所有充能都耗盡時，它會變成一顆價值50 GP的非魔法珠寶。
  - id: gem-of-seeing
    name: 真視寶石
    nameEn: "Gem of Seeing"
    source: srd
    category: wondrous
    group: curio
    rarity: rare
    attunement: true
    text: |-
      這顆寶石有3次充能。作為魔法動作，你可以消耗1次充能。接下來10分鐘內，當你透過寶石凝視時，擁有範圍120呎的真實視覺。

      寶石每天黎明恢復1d3次已消耗的充能。
  - id: giant-slayer
    name: 巨人屠殺者
    nameEn: "Giant Slayer"
    source: srd
    category: weapon
    rarity: rare
    attunement: false
    base: { any: [ simple-weapon, martial-weapon ], label: 任意簡易或軍用武器 }
    effects: { attack: 1, damage: 1 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值。

      當你以這件武器命中巨人時，該巨人額外受到2d6與武器相同類型的傷害，並且必須成功通過DC 15的力量豁免，否則陷入倒地狀態。
  - id: glamoured-studded-leather
    name: 幻惑鑲釘皮甲
    nameEn: "Glamoured Studded Leather"
    source: srd
    category: armor
    rarity: rare
    attunement: false
    base: { fixed: 鑲釘皮甲 }
    effects: { ac: 1 }
    text: |-
      穿戴這件護甲時，你獲得+1護甲等級加值。你也可以進行附贈動作，使護甲呈現出一般衣物或其他種類護甲的外觀。你決定它的外觀，包括顏色、款式與配件，但護甲仍保有其正常的體積與重量。這種幻象外觀持續到你再次使用此特性，或脫下護甲為止。
  - id: gloves-of-missile-snaring
    name: 避矢奪箭手套
    nameEn: "Gloves of Missile Snaring"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      如果你穿戴這雙手套時被使用遠程武器或投擲武器進行的攻擊檢定命中，且你有一隻空手，你可以進行反應動作，將傷害減少1d10加上你的敏捷調整值。若你將傷害減為0，且彈藥或武器小到你能用那隻手握住，你就能接住它。
  - id: gloves-of-swimming-and-climbing
    name: 運動健將手套
    nameEn: "Gloves of Swimming and Climbing"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這雙手套時，你擁有等同於你的速度的攀爬速度與游泳速度，且你進行攀爬或游泳的力量（運動）檢定時獲得+5加值。
  - id: gloves-of-thievery
    name: 竊賊手套
    nameEn: "Gloves of Thievery"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: false
    text: |-
      這雙手套穿戴時無法被察覺。穿戴它們時，你進行敏捷（巧手）檢定獲得+5加值。
  - id: goggles-of-night
    name: 夜視鏡
    nameEn: "Goggles of Night"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: false
    text: |-
      穿戴這副深色鏡片時，你擁有60呎的黑暗視覺。若你本來就擁有黑暗視覺，穿戴夜視鏡會使其距離增加60呎。
  - id: hammer-of-thunderbolts
    name: 雷神之錘
    nameEn: "Hammer of Thunderbolts"
    source: srd
    category: weapon
    rarity: legendary
    attunement: true
    base: { from: [ 巨錘, 戰錘 ] }
    effects: { attack: 1, damage: 1 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值。

      這件武器有5次充能。你可以消耗1次充能並以這件武器進行遠程攻擊，將它擲出，視同它具有投擲屬性，一般射程20呎、遠射程60呎。若攻擊命中，武器會釋放一聲在300呎外都聽得見的雷鳴巨響。目標與其30呎內除你以外的每個生物必須成功通過DC 17的體質豁免，否則陷入震懾狀態，持續到你的下個回合結束。無論命中或未命中，武器會立刻飛回你的手中。這件武器每天黎明恢復1d4 + 1次已消耗的充能。

      _巨人之禍。_ 當你與這件武器同調，並穿戴著同樣已與你同調的_巨人之力腰帶_或_食人魔力量護手_時，你獲得以下益處：

      _巨人剋星。_ 當你使用這件武器對巨人進行攻擊檢定，d20擲出20時，該生物必須成功通過DC 17的體質豁免，否則死亡。

      _巨人之力。_ _巨人之力腰帶_或_食人魔力量護手_所賦予的力量屬性值增加4，最高為30。
  - id: handy-haversack
    name: 便利袋
    nameEn: "Handy Haversack"
    source: srd
    category: wondrous
    group: container
    rarity: rare
    attunement: false
    weight: 5
    text: |-
      這個背包有一個中央袋與兩個側袋，每個都是異次元空間。每個側袋最多可容納200磅物資，體積不超過25立方呎。中央袋最多可容納500磅物資，體積不超過64立方呎。無論內容物為何，便利袋的重量永遠是5磅。

      從便利袋中取出物品需要進行使用動作或附贈動作（由你選擇）。當你伸手進便利袋中取特定物品時，該物品總是神奇地位於最上面。

      若任何一個袋子過載、被刺穿或被撕裂，便利袋就會破裂並被摧毀。若便利袋被摧毀，其內容物將永遠遺失，不過神器一定會在某處再度出現。若便利袋被內外翻轉，其內容物會完好無損地散出，而便利袋必須先翻回原狀才能再次使用。

      便利袋的每個袋子裝有足夠呼吸10分鐘的空氣，再除以袋內呼吸的生物數量。

      把便利袋放進_次元袋_、_便攜式次元洞_或類似物品創造的異次元空間內，會立即摧毀兩件物品，並開啟一道通往星界的通道。通道出現在其中一件物品被放進另一件物品內的位置。通道10呎內且不在全掩蔽之後的任何生物都會被吸進通道，並被安置在星界的隨機位置。通道隨後關閉。通道只能單向通行，且無法重新開啟。
  - id: hat-of-disguise
    name: 易容帽
    nameEn: "Hat of Disguise"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這頂帽子時，你可以施放_易容術_法術。若帽子被取下，法術結束。
  - id: hat-of-many-spells
    name: 萬法帽
    nameEn: "Hat of Many Spells"
    source: srd
    category: wondrous
    group: wearable
    rarity: very-rare
    attunement: 由法師
    text: |-
      這頂尖帽具有以下特性。

      _施法法器。_ 手持這頂帽子時，你可以將它當作施放法師法術的施法法器。你使用帽子施放的任何法術都會獲得一個特殊的姿勢成分：你必須把手伸進帽中，將法術「拉」出來。
      _未知法術。_ 手持這頂帽子時，你可以嘗試施放一個你不知道的1環以上法術。該法術必須在法師法術列表上，必須是你能施放的環階，且不能有價值超過1,000 GP的材料成分。決定法術後，你必須消耗一個該法術環階的法術位。接著，為判定你是否成功施放法術，進行一次智力（奧秘）檢定（DC為10加上法術的環階）。檢定成功時，你以法術的一般施放時間施放該法術，且在你完成一次短休或長休之前，不能再使用此特性。檢定失敗時，你無法施放該法術，而會發生一個隨機效果，由擲下表決定。

      你從帽子施放的任何法術都使用你的法術豁免DC與法術攻擊加值。

      | 1d100 | 效果 |
      | --- | --- |
      | 01–50 | 你施放一個隨機法術，擲1d10決定：擲出**1**：*變巨術/縮小術*（變巨效果）；擲出**2**：*變巨術/縮小術*（縮小效果）；擲出**3**：*妖火*；擲出**4**：*火球術*；擲出**5**：*造風術*；擲出**6**：*隱形術*（對你自己施放）；擲出**7**：*閃電束*；擲出**8**：*魅影之力*；擲出**9**：*變形術*；擲出**10**：*臭雲術*。 |
      | 51–55 | 你陷入震懾狀態，持續到你的下個回合結束，因為你以為剛才發生了什麼驚天動地的事。 |
      | 56–60 | 一群無害的蝴蝶充滿你30呎內的一個10呎立方體。蝶群在1分鐘後散去。 |
      | 61–65 | 你從帽中拉出一個非魔法物體。擲1d4決定物體：擲出**1**：一瓶強酸；擲出**2**：一瓶煉金火焰；擲出**3**：一根撬棍；擲出**4**：一支點燃的火把。 |
      | 66–70 | 你突發魔法病，陷入中毒狀態1小時。 |
      | 71–75 | 你陷入石化狀態，持續到你的下個回合結束。 |
      | 76–80 | 你從帽中拉出一個非魔法物體。擲1d4決定物體：擲出**1**：一把匕首；擲出**2**：一條一端綁著抓鉤的繩索；擲出**3**：一袋鐵蒺藜；擲出**4**：一顆價值50 GP的寶石。 |
      | 81–85 | 一個生物出現在盡可能靠近你的未被佔據的空間。該生物不受你控制，並如常行動，在1小時後或生命值降至0時消失。擲1d4決定生物：擲出**1**：**駱駝**；擲出**2**：**蟒蛇**；擲出**3**：**大象**；擲出**4**：**騾子**。 |
      | 86–90 | 一個敵對的**蝙蝠群**從帽中飛出，佔據你的空間並攻擊你。 |
      | 91–95 | 一道垂直的、直徑10呎的雙向傳送門在你30呎內一個未被佔據的空間開啟，通往另一個位面，並保持開啟直到你的下個回合結束。DM決定它通往何處。 |
      | 96–00 | 你從帽中拉出一件魔法物品。擲1d6決定物品的稀有度：擲出**1–3**：常見；擲出**4–5**：非常見；擲出**6**：稀有。DM選擇該物品，若它在1小時內沒有被消耗或摧毀，就會消失。 |
  - id: headband-of-intellect
    name: 智力頭帶
    nameEn: "Headband of Intellect"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      你穿戴這條頭帶時，你的智力為19。若你不靠它智力就已是19或更高，它對你沒有效果。
  - id: helm-of-brilliance
    name: 光輝頭盔
    nameEn: "Helm of Brilliance"
    source: srd
    category: wondrous
    group: wearable
    rarity: very-rare
    attunement: true
    text: |-
      這頂頭盔鑲有1d10顆鑽石、2d10顆紅寶石、3d10顆火蛋白石與4d10顆蛋白石。從頭盔上撬下的任何寶石都會碎成粉末。當所有寶石都被移除或摧毀時，頭盔失去魔力。

      穿戴頭盔時，你獲得以下益處。

      _鑽石之光。_ 只要頭盔至少有一顆鑽石，頭盔就會散發30呎發散區域。當至少一個不死生物位於該區域內時，該發散區域會充滿微光光照。任何在該區域內開始回合的不死生物受到1d6光耀傷害。

      _火蛋白石烈焰。_ 只要頭盔至少有一顆火蛋白石，你就可以進行魔法動作，使你手持的一件武器爆出火焰。火焰在半徑10呎內散發明亮光照，並再向外10呎散發微光光照。火焰對你與該武器無害。你以這件燃燒的武器攻擊命中時，目標額外受到1d6火焰傷害。火焰持續到你進行附贈動作熄滅它們，或你丟下或收起該武器為止。

      _紅寶石抗性。_ 只要頭盔至少有一顆紅寶石，你就擁有火焰傷害抗性。

      _法術。_ 你可以施放以下其中一個法術（豁免DC 18），並以頭盔上一顆指定種類的寶石作為成分：_晝明術_（蛋白石）、_火球術_（火蛋白石）、_虹光噴射_（鑽石）或_火牆術_（紅寶石）。施放法術時，該寶石會被摧毀並從頭盔上消失。

      _承受火焰傷害。_ 遇到以下情況時擲1d20：你穿戴著頭盔，並且因為對法術的豁免失敗而受到火焰傷害。擲出1時，頭盔從其餘寶石射出光束，隨後被摧毀。以你為源頭的60呎發散區域內的每個生物必須成功通過DC 17的敏捷豁免，否則被光束擊中，受到光耀傷害，傷害等於頭盔內寶石的數量。
  - id: helm-of-comprehending-languages
    name: 通曉語言頭盔
    nameEn: "Helm of Comprehending Languages"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: false
    text: |-
      穿戴這頂頭盔時，你可以從中施放_通曉語言_。
  - id: helm-of-telepathy
    name: 心靈感應頭盔
    nameEn: "Helm of Telepathy"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這頂頭盔時，你擁有射程30呎的心靈感應，並且可以從頭盔施放_偵測思想_或_暗示術_（豁免DC 13）。頭盔施放過其中任一法術後，直到下次黎明前，都無法再從頭盔施放該法術。
  - id: helm-of-teleportation
    name: 傳送頭盔
    nameEn: "Helm of Teleportation"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      這頂頭盔有3次充能。穿戴它時，你可以消耗1次充能，從中施放_傳送術_。頭盔每天黎明恢復1d3次已消耗的充能。
  - id: holy-avenger
    name: 神聖復仇者
    nameEn: "Holy Avenger"
    source: srd
    category: weapon
    rarity: legendary
    attunement: 由聖騎士
    base: { any: [ simple-weapon, martial-weapon ], label: 任意簡易或軍用武器 }
    effects: { attack: 3, damage: 3 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+3加值。你用它命中邪魔或不死生物時，該生物額外受到2d10光耀傷害。

      當你手持出鞘的武器時，它會產生以你為源頭的10呎發散區域。你與發散區域內所有對你友善的生物，對法術與其他魔法效果的豁免具有優勢。若你擁有17級以上的聖騎士等級，發散區域的大小增加為30呎。
  - id: horn-of-blasting
    name: 音爆號角
    nameEn: "Horn of Blasting"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    text: |-
      你可以進行魔法動作吹響這支號角，發出一聲30呎錐形區域內的雷鳴巨響，在600呎外都聽得見。錐形區域內的每個生物進行一次DC 15的體質豁免。豁免失敗者受到5d8雷鳴傷害並陷入耳聾狀態1分鐘。豁免成功者只受到一半傷害。錐形區域內未被穿戴或攜帶的玻璃或水晶物體受到10d8雷鳴傷害。

      每次使用號角的魔法都有20%的機率使號角爆炸。爆炸對使用者造成10d6力場傷害並摧毀號角。
  - id: horn-of-valhalla
    name: 瓦爾哈拉號角
    nameEn: "Horn of Valhalla"
    source: srd
    category: wondrous
    group: tool
    rarity: varies
    rarityText: "稀有（銀或黃銅）、極稀有（青銅）或傳說（鐵）"
    attunement: false
    options:
      - id: metal
        label: 材質
        choices:
          - { value: silver, label: 銀, rarity: rare }
          - { value: brass, label: 黃銅, rarity: rare }
          - { value: bronze, label: 青銅, rarity: very-rare }
          - { value: iron, label: 鐵, rarity: legendary }
    text: |-
      你可以進行魔法動作吹響這支號角。作為回應，來自伊斯嘉德位面的戰士靈體會出現在你60呎內未被佔據的空間。每個靈體使用**狂戰士**數據塊，並在1小時後或生命值降至0時回到伊斯嘉德。這些靈體看起來像活生生、會呼吸的戰士，並且免疫魅惑與恐慌狀態。你使用號角後，經過7天才能再次使用。

      已知存在四種_瓦爾哈拉號角_，各以不同的金屬製成。號角的種類決定它召喚多少靈體，以及使用它的要求。DM選擇號角的種類，或擲下表隨機決定。

      若你在未滿足要求的情況下吹響號角，被召喚的靈體會攻擊你。若你滿足要求，它們對你與你的盟友友善，並聽從你的命令。

      | 1d100 | 號角種類 | 靈體 | 要求 |
      | --- | --- | --- | --- |
      | 01–40 | 銀 | 2 | 無 |
      | 41–75 | 黃銅 | 3 | 熟練所有簡易武器 |
      | 76–90 | 青銅 | 4 | 受過所有中甲的訓練 |
      | 91–00 | 鐵 | 5 | 熟練所有軍用武器 |
  - id: horseshoes-of-a-zephyr
    name: 西風馬蹄鐵
    nameEn: "Horseshoes of a Zephyr"
    source: srd
    category: wondrous
    group: tool
    rarity: very-rare
    attunement: false
    text: |-
      這些馬蹄鐵共四個一組。作為魔法動作，你可以把其中一個馬蹄鐵碰觸馬或類似生物的蹄，馬蹄鐵便會自行固定在蹄上。取下馬蹄鐵也需要一個魔法動作。

      當四個馬蹄鐵都固定在馬或類似生物的蹄上時，它們讓該生物能在離表面4吋的高度漂浮並正常移動。此效果表示該生物可以越過或站在非固體或不穩定的表面上，例如水或熔岩。該生物不留下足跡，並無視困難地形。此外，該生物每天最多可以旅行12小時，而不會因長途旅行獲得力竭級數。
  - id: horseshoes-of-speed
    name: 加速馬蹄鐵
    nameEn: "Horseshoes of Speed"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    text: |-
      這些馬蹄鐵共四個一組。作為魔法動作，你可以把其中一個馬蹄鐵碰觸馬或類似生物的蹄，馬蹄鐵便會自行固定在蹄上。取下馬蹄鐵也需要一個魔法動作。

      當四個馬蹄鐵都裝在同一個生物身上時，它的速度增加30呎。
  - id: immovable-rod
    name: 不動權杖
    nameEn: "Immovable Rod"
    source: srd
    category: rod
    rarity: uncommon
    attunement: false
    text: |-
      這根鐵權杖一端有個按鈕。你可以進行使用動作按下按鈕，使權杖神奇地固定在原位。直到你或另一個生物進行使用動作再次按下按鈕之前，權杖都不會移動，即使它違反重力。權杖最多可承受8,000磅的重量。超過這個重量會使權杖解除啟動並掉落。生物可以進行使用動作，進行一次DC 30的力量（運動）檢定；檢定成功時，可將固定的權杖移動最多10呎。
  - id: instant-fortress
    name: 瞬間要塞
    nameEn: "Instant Fortress"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: true
    text: |-
      作為魔法動作，你可以把這座1吋高的精金塑像放在地上，並以命令詞使其迅速長成一座方形的精金塔。重複說出命令詞會使塔變回塑像形態，這只有在塔內是空的時候才有效。塔出現區域內的每個生物都會被推到塔外但緊鄰塔的未被佔據空間。該區域內未被穿戴或攜帶的物體也會被推離塔。

      塔每邊長20呎、高30呎，四面都有箭孔，頂端有城垛。塔內分成兩層樓，由梯子、階梯或斜坡（由你選擇）連接。這個梯子、階梯或斜坡的盡頭是一道通往屋頂的活板門。創造出來時，塔在朝向你的那一面地面層有一扇門。門只會在你的命令下開啟，你可以用附贈動作下達這個命令。它免疫_敲擊術_法術與類似魔法。

      魔法使塔不會被推倒。屋頂、門與牆壁各自擁有AC 20；HP 100；免疫鈍擊、穿刺與揮砍傷害，但攻城器械造成的傷害除外；並對所有其他傷害具有抗性。

      把塔縮回塑像形態不會修復塔受到的損傷。只有_祈願術_法術能修復這座塔（此法術的這種用法視為複製8環或更低環的法術）。每次施放_祈願術_都會使塔恢復所有生命值。
  - id: ioun-stone
    name: 艾恩石
    nameEn: "Ioun Stone"
    source: srd
    category: wondrous
    group: curio
    rarity: varies
    attunement: true
    options:
      - id: kind
        label: 種類
        choices:
          - { value: absorption, label: 吸收, rarity: very-rare }
          - { value: agility, label: 靈活, rarity: very-rare }
          - { value: awareness, label: 警覺, rarity: rare }
          - { value: fortitude, label: 堅忍, rarity: very-rare }
          - { value: greater-absorption, label: 高等吸收, rarity: legendary }
          - { value: insight, label: 洞悉, rarity: very-rare }
          - { value: intellect, label: 智識, rarity: very-rare }
          - { value: leadership, label: 領導, rarity: very-rare }
          - { value: mastery, label: 精進, rarity: legendary }
          - { value: protection, label: 防護, rarity: rare, effects: { ac: 1 } }
          - { value: regeneration, label: 再生, rarity: legendary }
          - { value: reserve, label: 儲存, rarity: rare }
          - { value: strength, label: 力量, rarity: very-rare }
          - { value: sustenance, label: 維生, rarity: rare }
    text: |-
      大小約如彈珠的_艾恩石_，得名自艾恩，一位在某些世界受到崇敬的知識與預言之神。_艾恩石_有許多種類，每種都是形狀與顏色的獨特組合。

      當你進行魔法動作將一顆_艾恩石_拋向空中時，石頭會在距你頭部1d3呎處環繞，並在環繞期間賜予你它的益處。你最多可以同時有三顆_艾恩石_環繞你的頭部。

      每顆環繞你頭部的_艾恩石_都視為你所穿戴的物體。環繞的石頭會避免接觸其他生物與物體，調整軌道以避免碰撞，並阻擋其他生物攻擊或奪取它的所有嘗試。

      作為使用動作，你可以抓住並收起任意數量環繞你頭部的_艾恩石_。若你與某顆_艾恩石_的同調在它環繞你頭部時結束，該石頭會如同你丟下它一般墜落。

      石頭的種類決定其稀有度與效果。

      _吸收（極稀有）。_ 當這個淡薰衣草色橢球體環繞你頭部時，你可以進行反應動作，取消你看得見的生物所施放的4環或更低環法術。被取消的法術沒有效果，施放它所用的任何資源都白白浪費。一旦這顆石頭取消了累計20環的法術，它就會燒盡、變成暗灰色並失去魔力。

      _靈活（極稀有）。_ 當這個深紅色球體環繞你頭部時，你的敏捷增加2，最高為20。

      _警覺（稀有）。_ 當這個深藍色菱面體環繞你頭部時，你的先攻擲骰與感知（察覺）檢定具有優勢。

      _堅忍（極稀有）。_ 當這個粉紅色菱面體環繞你頭部時，你的體質增加2，最高為20。

      _高等吸收（傳說）。_ 當這個大理石紋的薰衣草色與綠色橢球體環繞你頭部時，你可以進行反應動作，取消你看得見的生物所施放的8環或更低環法術。被取消的法術沒有效果，施放它所用的任何資源都白白浪費。一旦這顆石頭取消了累計20環的法術，它就會燒盡、變成暗灰色並失去魔力。

      _洞悉（極稀有）。_ 當這個熾亮的藍色球體環繞你頭部時，你的感知增加2，最高為20。

      _智識（極稀有）。_ 當這個大理石紋的緋紅色與藍色球體環繞你頭部時，你的智力增加2，最高為20。

      _領導（極稀有）。_ 當這個大理石紋的粉紅色與綠色球體環繞你頭部時，你的魅力增加2，最高為20。
      _精進（傳說）。_ 當這個淡綠色稜柱體環繞你頭部時，你的熟練加值增加1。

      _防護（稀有）。_ 當這個灰玫瑰色稜柱體環繞你頭部時，你的AC獲得+1加值。

      _再生（傳說）。_ 若你至少有1點生命值，當這個珍珠白色紡錘體環繞你頭部時，你在每個小時結束時恢復15點生命值。

      _儲存（稀有）。_ 這個鮮豔的紫色稜柱體會儲存施放進它的法術，並保留到你使用它們為止。這顆石頭一次最多可儲存4環的法術。發現時，其中有由DM選擇的1d4環已儲存的法術。

      任何生物都可以在施放1至4環的法術時碰觸石頭，將法術施放進石頭中。該法術除了被儲存在石頭中以外沒有任何效果。若石頭無法容納該法術，法術就會被消耗而沒有效果。施放法術所用的法術位環階，決定它佔用多少空間。

      當這顆石頭環繞你頭部時，你可以施放其中儲存的任何法術。該法術使用原施法者的法術位環階、法術豁免DC、法術攻擊加值與施法屬性，但除此之外視為由你施放。從石頭施放出的法術不再儲存其中，從而騰出空間。

      _力量（極稀有）。_ 當這個淡藍色菱面體環繞你頭部時，你的力量增加2，最高為20。

      _維生（稀有）。_ 當這個透明的紡錘體環繞你頭部時，你不需要飲食。
  - id: iron-bands
    name: 鐵索
    nameEn: "Iron Bands"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    weight: 1
    text: |-
      這顆生鏽的鐵球直徑3吋、重1磅。你可以進行魔法動作，將這顆球擲向你60呎內你看得見的一個巨型或更小的生物。球在空中移動時，會展開成一團纏結的金屬環帶。

      進行一次遠程攻擊檢定，攻擊加值等於你的敏捷調整值加上你的熟練加值。命中時，目標陷入束縛狀態，直到你進行附贈動作下達釋放它的命令為止。這樣做，或攻擊未命中，都會使鐵索收縮，再度變回球形。

      能碰觸到鐵索的生物，包括被束縛的那個，可以進行一個動作，進行一次DC 20的力量（運動）檢定來扯斷鐵索。檢定成功時，物品被摧毀，被束縛的生物獲釋。檢定失敗時，該生物之後的任何嘗試都會自動失敗，直到經過24小時為止。

      鐵索使用後，直到下次黎明前，都無法再次使用。
  - id: iron-flask
    name: 收妖瓶
    nameEn: "Iron Flask"
    source: srd
    category: wondrous
    group: container
    rarity: legendary
    attunement: false
    text: |-
      手持這個以黃銅瓶塞封口的鐵瓶時，你可以進行魔法動作，以你60呎內你看得見的一個生物為目標。若瓶子是空的，且目標原生於你所在位面以外的其他位面，目標必須成功通過DC 17的感知豁免，否則被困在瓶中。若目標先前曾被這個瓶子困住過，它在豁免上具有優勢。一旦被困，生物會留在瓶中，直到被釋放為止。瓶子一次只能容納一個生物。被困在瓶中的生物不會老化，也不需要呼吸、飲食。

      你可以進行魔法動作拔掉瓶塞，釋放瓶中的生物。該生物隨後服從你的命令1小時，即使不懂下達命令所用的語言，也聽得懂這些命令。若你不下達命令，或給予該生物可能導致其死亡或被囚禁的命令，它會自衛，但除此之外不採取任何行動。持續時間結束時，該生物依其一般的性情與陣營行動。

      _鑑定術_法術能揭示瓶中是否有生物，但要判定生物的種類，唯一的方法就是打開瓶子。新發現的_收妖瓶_可能已經含有一個由DM選擇的生物。
  - id: javelin-of-lightning
    name: 閃電標槍
    nameEn: "Javelin of Lightning"
    source: srd
    category: weapon
    rarity: uncommon
    attunement: false
    base: { fixed: 標槍 }
    text: |-
      每次你以這件魔法武器進行攻擊檢定並命中時，你可以讓它造成閃電傷害而非穿刺傷害。

      _閃電束。_ 當你把這件武器擲向距離你不超過120呎的目標時，你可以放棄進行遠程攻擊檢定，改為將武器變成一道閃電。這道閃電在你與目標之間形成一條寬5呎的直線區域。目標與直線區域內的每個其他生物（不含你）進行一次DC 13的敏捷豁免，失敗者受到4d6閃電傷害，成功者受到一半傷害。造成此傷害後，武器立刻重新出現在你的手中。此特性使用後，直到下次黎明前，都無法再次使用。
  - id: lantern-of-revealing
    name: 顯像提燈
    nameEn: "Lantern of Revealing"
    source: srd
    category: wondrous
    group: tool
    rarity: uncommon
    attunement: false
    text: |-
      點燃時，這盞有罩的提燈用1品脫的油可燃燒6小時，在半徑30呎內散發明亮光照，並再向外30呎散發微光光照。隱形的生物與物體只要在提燈的明亮光照內就看得見。你可以進行使用動作降下燈罩，將提燈的光線降為半徑5呎的微光光照。
  - id: luck-blade
    name: 吉兆之刃
    nameEn: "Luck Blade"
    source: srd
    category: weapon
    rarity: legendary
    attunement: true
    base: { from: [ 長柄刀, 巨劍, 長劍, 刺劍, 彎刀, 鐮刀, 短劍 ] }
    effects: { attack: 1, damage: 1, saves: 1 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值。只要武器在你身上，你的豁免也獲得+1加值。

      _幸運。_ 若武器在你身上，且你沒有陷入失能狀態，你可以呼喚它的幸運（不需動作），重擲一次失敗的D20檢定。你必須採用第二次擲骰結果。此特性使用後，直到下次黎明前，都無法再次使用。

      _祈願。_ 這件武器有1d3次充能。手持它時，你可以消耗1次充能，從中施放_祈願術_。此特性使用後，直到下次黎明前，都無法再次使用。若武器沒有充能，就失去此特性。
  - id: mace-of-disruption
    name: 瓦解之錘
    nameEn: "Mace of Disruption"
    source: srd
    category: weapon
    rarity: rare
    attunement: true
    base: { fixed: 硬頭錘 }
    text: |-
      你用這件魔法武器命中邪魔或不死生物時，該生物額外受到2d6光耀傷害。若目標在承受此傷害後生命值為25點或更少，它必須成功通過DC 15的感知豁免，否則被摧毀。豁免成功時，該生物陷入恐慌狀態，持續到你的下個回合結束。

      _光。_ 手持這件武器時，它在半徑20呎內散發明亮光照，並再向外20呎散發微光光照。
  - id: mace-of-smiting
    name: 打擊之錘
    nameEn: "Mace of Smiting"
    source: srd
    category: weapon
    rarity: rare
    attunement: false
    base: { fixed: 硬頭錘 }
    effects: { attack: 1, damage: 1 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+1加值。當你使用這件武器攻擊構裝生物時，加值增加為+3。

      當你使用這件武器進行的攻擊檢定擲出20時，目標額外受到7點鈍擊傷害；若目標是構裝生物，則改為額外受到14點鈍擊傷害。若構裝生物在承受此傷害後生命值為25點或更少，它就被摧毀。
  - id: mace-of-terror
    name: 恐懼之錘
    nameEn: "Mace of Terror"
    source: srd
    category: weapon
    rarity: rare
    attunement: true
    base: { fixed: 硬頭錘 }
    text: |-
      這件魔法武器有3次充能，並且每天黎明恢復1d3次已消耗的充能。手持武器時，你可以進行魔法動作並消耗1次充能，從中釋放一波恐懼。你30呎內由你選擇的每個生物必須成功通過DC 15的感知豁免，否則陷入恐慌狀態1分鐘。在以這種方式陷入恐慌狀態期間，生物必須把回合花在盡可能遠離你的移動上，且不能進行藉機攻擊。它的動作只能用來進行疾走動作，或嘗試脫離阻止它移動的效果。若它無處可移動，該生物可以進行閃避動作。在其每個回合結束時，生物重複進行該豁免，成功則結束其身上的此效果。
  - id: mantle-of-spell-resistance
    name: 法術抗性披肩
    nameEn: "Mantle of Spell Resistance"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      你穿戴這件披肩時，對法術的豁免具有優勢。
  - id: manual-of-bodily-health
    name: 強身手冊
    nameEn: "Manual of Bodily Health"
    source: srd
    category: wondrous
    group: book
    rarity: very-rare
    attunement: false
    text: |-
      這本書含有健康與營養的建議，其文字充滿魔力。若你在6天或更短的期間內花48小時研讀書中內容並實踐其指引，你的體質增加2，最高為30。這本書隨後失去魔力，但在一個世紀後恢復。
  - id: manual-of-gainful-exercise
    name: 健體手冊
    nameEn: "Manual of Gainful Exercise"
    source: srd
    category: wondrous
    group: book
    rarity: very-rare
    attunement: false
    text: |-
      這本書描述健身運動，其文字充滿魔力。若你在6天或更短的期間內花48小時研讀書中內容並實踐其指引，你的力量增加2，最高為30。這本書隨後失去魔力，但在一個世紀後恢復。
  - id: manual-of-golems
    name: 魔像手冊
    nameEn: "Manual of Golems"
    source: srd
    category: wondrous
    group: book
    rarity: very-rare
    attunement: false
    options:
      - id: golem
        label: 魔像類型
        choices:
          - { value: clay, label: 黏土魔像 }
          - { value: flesh, label: 血肉魔像 }
          - { value: iron, label: 鐵魔像 }
          - { value: stone, label: 石魔像 }
    text: |-
      這本書含有製作特定類型魔像所需的資訊與咒文。DM選擇類型，或擲隨附的表格隨機決定。要解讀並使用這本書，你必須是至少有兩個5環法術位的施法者。無法使用_魔像手冊_卻試圖閱讀它的生物，受到6d6心靈傷害。

      要製作魔像，你必須花費表中所示的時間，手邊備有手冊不間斷地工作，且每天休息不超過8小時。你也必須支付購買補給品的指定成本。

      一旦你完成魔像的製作，書便在詭異的火焰中被焚毀。把手冊的灰燼灑在魔像上，魔像就會活動起來。魔像的數據塊見「怪物」章節。魔像受你控制，並聽得懂、服從你的命令。

      | 1d20 | 魔像 | 時間 | 成本 |
      | --- | --- | --- | --- |
      | 1–5 | 黏土魔像 | 30天 | 65,000 GP |
      | 6–17 | 血肉魔像 | 60天 | 50,000 GP |
      | 18 | 鐵魔像 | 120天 | 100,000 GP |
      | 19–20 | 石魔像 | 90天 | 80,000 GP |
  - id: manual-of-quickness-of-action
    name: 靈巧手冊
    nameEn: "Manual of Quickness of Action"
    source: srd
    category: wondrous
    group: book
    rarity: very-rare
    attunement: false
    text: |-
      這本書收錄協調與平衡的練習，字句中充滿魔力。若你在6天或更短的期間內花費48小時研讀書中內容並練習其指引，你的敏捷增加2，上限為30。之後這本書會失去魔力，但在一個世紀後恢復。
  - id: marvelous-pigments
    name: 驚奇顏料
    nameEn: "Marvelous Pigments"
    source: srd
    category: wondrous
    group: consumable
    rarity: very-rare
    attunement: false
    consumable: true
    weight: 1
    text: |-
      這個精緻的木盒內裝有1d4罐顏料與一支畫筆（合計重1磅）。

      使用畫筆並消耗1罐顏料，你可以繪製任意數量的立體物體與地形特徵（例如牆壁、門、樹木、花朵、武器、蛛網與坑洞），前提是這些元素全都限制在一個20呎立方體內。這項作業需時10分鐘（不論你創造的元素有多少），期間你必須留在該立方體內，並且需要專注。若你的專注中斷，或在作業完成前離開該立方體，所有繪製的元素都會消失，那罐顏料也就浪費了。

      作業完成時，所有繪製的物體與地形特徵都會成真。因此，在牆上畫一扇門會創造出一扇真正的門，可以打開通往門後的任何地方。繪製一個坑洞會創造出一個真正的坑洞，其整個深度都必須位於該20呎立方體內。

      一罐顏料所創造的物體，價值不可超過25 GP，且一罐顏料所創造的所有物體總價值不可超過500 GP。若你繪製價值更高的物體（例如一大堆黃金），它們看起來很逼真，但仔細檢查就會發現它們是由漿糊、餅乾或其他毫無價值的材料製成。

      若你繪製火焰或閃電等形式的能量，該能量會在你完成繪製的那一刻消散，不造成任何傷害。
  - id: medallion-of-thoughts
    name: 讀心勳章
    nameEn: "Medallion of Thoughts"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      這枚勳章有5次充能。穿戴它時，你可以消耗1次充能，從中施放_偵測思想_（豁免DC 13）。勳章每天黎明恢復1d4次已消耗的充能。
  - id: mirror-of-life-trapping
    name: 攝心魔鏡
    nameEn: "Mirror of Life Trapping"
    source: srd
    category: wondrous
    group: tool
    rarity: very-rare
    attunement: false
    weight: 50
    text: |-
      當從側面觀看這面高4呎、寬2呎的鏡子時，鏡面會顯現出隱約的生物影像。這面鏡子重50磅，AC 11、HP 10，對毒素與心靈傷害免疫，並對鈍擊傷害易傷。它被降到0生命值時會碎裂並被摧毀。

      若鏡子懸掛在垂直表面上，而你在其5呎內，你可以進行魔法動作並使用命令詞來啟動它。它會持續啟動，直到你進行魔法動作並重複命令詞來關閉它為止。

      除你以外，任何在鏡子30呎內看見自己在已啟動的鏡中倒影的生物，必須成功通過DC 15的魅力豁免，否則連同其穿戴或攜帶的一切，一起被困在鏡子的十二個異次元隔間之一內。知道鏡子本質的生物進行該豁免時具有優勢，構裝生物則自動通過該豁免。

      異次元隔間是一片無盡的空間，充滿使能見度降至10呎的濃霧。被困在鏡中隔間的生物不會老化，也不需要進食、飲水或睡眠。被困在隔間內的生物可以使用允許跨位面旅行的魔法逃脫。否則，該生物會被禁錮在隔間內，直到被釋放為止。

      若鏡子困住了一個生物，但它的十二個異次元隔間都已被佔據，鏡子會隨機釋放一個被困的生物，以容納新的囚犯。被釋放的生物會出現在看得見鏡子的一個未被佔據的空間，且背對著鏡子。若鏡子被打碎，其中所有的生物都會被釋放，並出現在鏡子附近未被佔據的空間。

      在鏡子5呎內時，你可以進行魔法動作，指名一個被困在其中的生物，或喊出某個隔間的編號。被指名的生物或位於被指名隔間內的生物，會以影像的形式出現在鏡面上。你與該生物接著就可以進行溝通。

      以類似的方式，你可以進行魔法動作並使用第二個命令詞，釋放一個被困在鏡中的生物。被釋放的生物連同其財物，會出現在離鏡子最近的未被佔據空間，並背對著鏡子。

      將鏡子放入由_次元袋_、_便攜式次元洞_或類似物品所創造的異次元空間中，會立即摧毀兩件物品，並開啟一道通往星界的通道。該通道的起點就是其中一件物品被放入另一件物品內的位置。任何在通道10呎內且未處於全掩蔽之後的生物，都會被吸進通道，來到星界上的隨機位置。之後通道關閉。該通道只能單向通行，且無法重新開啟。
  - id: mithral-armor
    name: 秘銀護甲
    nameEn: "Mithral Armor"
    source: srd
    category: armor
    rarity: uncommon
    attunement: false
    base: { any: [ medium-armor, heavy-armor ], except: [ 獸皮甲 ], label: "任意中甲或重甲，獸皮甲除外" }
    text: |-
      秘銀是一種輕盈而柔韌的金屬。以這種材料製成的護甲可以穿在一般衣物底下。若該護甲原本會使敏捷（隱匿）檢定具有劣勢，或有力量需求，其秘銀版本就沒有這些限制。
  - id: mysterious-deck
    name: 神秘牌組
    nameEn: "Mysterious Deck"
    source: srd
    category: wondrous
    group: curio
    rarity: legendary
    attunement: false
    text: |-
      這副牌通常存放在盒子或小袋中，內有若干張象牙或羊皮紙製成的牌。這類牌組多數（75%）有十三張牌，但有些有二十二張。隨機決定從牌組中抽到的牌時，使用神秘牌組表中對應的欄位。

      抽牌之前，你必須先宣告打算抽幾張牌，然後隨機抽出。超過這個數量而多抽的牌不會產生效果。除此之外，你一從牌組中抽出一張牌，它的魔法就會生效。你抽每張牌的時間，與前一次抽牌相隔不得超過1小時。若你沒有抽滿所選的張數，剩餘張數的牌會自行從牌組中飛出，並同時生效。

      牌一旦被抽出就會消失。除非那張牌是愚者或弄臣，否則該牌會重新出現在牌組中，因此有可能兩次抽到同一張牌。（愚者或弄臣離開牌組後，若再次抽到該牌，就在表上重擲。）

      **神秘牌組**

      | 1d100（13張牌組） | 1d100（22張牌組） | 牌 |
      | --- | --- | --- |
      | — | 01–05 | 平衡 |
      | — | 06–10 | 彗星 |
      | — | 11–14 | 地牢 |
      | 01–08 | 15–18 | 歐律阿勒 |
      | — | 19–23 | 命運 |
      | 09–16 | 24–27 | 烈焰 |
      | — | 28–31 | 愚者 |
      | — | 32–36 | 寶石 |
      | 17–24 | 37–41 | 弄臣 |
      | 25–32 | 42–46 | 鑰匙 |
      | 33–40 | 47–51 | 騎士 |
      | 41–48 | 52–56 | 月亮 |
      | — | 57–60 | 謎題 |
      | 49–56 | 61–64 | 無賴 |
      | 57–64 | 65–68 | 毀滅 |
      | — | 69–73 | 賢者 |

      | 1d100（13張牌組） | 1d100（22張牌組） | 牌 |
      | --- | --- | --- |
      | 65–72 | 74–77 | 骷髏 |
      | 73–80 | 78–82 | 星辰 |
      | 81–88 | 83–87 | 太陽 |
      | — | 88–91 | 利爪 |
      | 89–96 | 92–96 | 王座 |
      | 97–00 | 97–00 | 虛空 |

      每張牌的效果說明如下。

      _平衡。_ 你可以將你的一項屬性值提高2，上限為22，前提是你同時將另一項屬性值降低2。你無法降低屬性值為5或更低的屬性。或者，你也可以選擇不調整屬性值，此時這張牌沒有效果。

      _彗星。_ 下次你與一個或多個敵對生物進入戰鬥時，你擲先攻時可以選擇其中一個作為你的對頭。若你在該場戰鬥中將你的對頭降到0生命值，你在1年內進行死亡豁免具有優勢。若是其他人將你選定的對頭降到0生命值，或你沒有選擇對頭，這張牌沒有效果。

      _地牢。_ 你消失，並以假死狀態被封禁在一個異次元球體中。你穿戴與攜帶的一切都會隨你消失，唯獨神器除外，神器會留在你消失時所佔據的空間。你會一直被囚禁，直到被人找到並從球體中救出。任何預言魔法都無法定位你，但_祈願術_法術可以揭露你囚牢的位置。你不能再抽牌。

      _歐律阿勒。_ 這張牌上形似梅杜莎的面容詛咒了你。受到這種詛咒期間，你的豁免承受−2懲罰。只有神明或命運牌的魔法能結束這個詛咒。

      _命運。_ 現實的織網鬆開並重新紡織，讓你得以避開或抹除一件事件，彷彿它從未發生。你可以在抽到這張牌時立即使用牌的魔法，或在你死亡之前的任何其他時間使用。

      _烈焰。_ 一名強大的魔鬼成為你的敵人。這名魔鬼謀求你的毀滅並折磨你，在試圖殺死你之前先品味你的痛苦。這種敵對關係會持續到你或這名魔鬼死亡為止。

      _愚者。_ 在接下來的72小時內，你的D20檢定具有劣勢。再抽一張牌；這次抽牌不計入你所宣告的抽牌張數。

      _寶石。_ 二十五件價值各2,000 GP的珠寶，或五十顆價值各1,000 GP的寶石，出現在你的腳邊。

      _弄臣。_ 在接下來的72小時內，你的D20檢定具有優勢，或者你可以在宣告的抽牌張數之外，額外再抽兩張牌。

      _鑰匙。_ 一件你具有熟練的稀有或更高稀有度魔法武器出現在你身上。該武器由DM選擇。

      _騎士。_ 你獲得一名**騎士**的效力，他會神奇地出現在你自身30呎內、由你選擇的一個未被佔據的空間。這名騎士與你陣營相同，並忠誠地為你效力直到死亡，相信你們兩人是被命運牽引到一起的。請與你的DM一同為這名NPC創造名字與背景故事。DM可以依喜好使用不同的數據塊來代表這名騎士。

      _月亮。_ 你獲得施放_祈願術_1d3次的能力。

      _謎題。_ 永久降低你的智力或感知1d4 + 1（最低降到1）。你可以在宣告的抽牌張數之外，額外再抽一張牌。

      _無賴。_ 一名由DM選擇的NPC對你變得敵對。在這名NPC或其他人揭露其身分之前，你不知道他是誰。唯有_祈願術_法術或神明介入，才能結束這名NPC對你的敵意。

      _毀滅。_ 你攜帶或擁有的除魔法物品以外的所有形式財富都會從你身上失去。可攜帶的財產消失。你擁有的商業、建築與土地會以對現實改變最小的方式失去。任何證明你應該擁有被這張牌奪走之物的文件也都會消失。

      _賢者。_ 在抽到這張牌後的一年內，你可以在任何自己選擇的時間，於冥想中提出一個問題，並在心中得到該問題的真實答案。

      _骷髏。_ 一個**死亡化身**（見隨附的數據塊）出現在盡可能靠近你的一個未被佔據的空間。這個化身只以你為攻擊目標，外表是一具身穿破爛黑袍、手持幽靈鐮刀的幽魂骷髏。當化身降到0生命值或你死亡時，化身消失。若你的盟友對化身造成傷害，該盟友就會召喚出另一個**死亡化身**。新的化身出現在盡可能靠近該盟友的一個未被佔據的空間，並只以該盟友為攻擊目標。你與你的盟友每人因這次抽牌只能各召喚一個化身。被化身殺死的生物無法復活。

      _星辰。_ 將你的一項屬性值提高2，上限為24。

      _太陽。_ 一件魔法物品（由DM選擇）出現在你身上。此外，在你死亡之前，你每天黎明獲得10點臨時生命值。

      _利爪。_ 你穿戴或攜帶的每一件魔法物品都會瓦解。你持有的神器則改為消失。

      _王座。_ 你在歷史、洞悉、威嚇或遊說之中，擇一獲得熟練與專精。此外，你合法擁有世界上某處的一座小型城堡。然而，該城堡目前是一個或多個怪物的巢穴，你必須先將它們清除，才能宣告城堡歸你所有。

      _虛空。_ 你的靈魂被從身體中抽離，並被封入DM選擇的某處的一個物體中。一個或多個強大的存在守衛著該處。當你的靈魂以這種方式被困時，你的身體處於無活動狀態、停止老化，且不需要食物、空氣或水。_祈願術_法術無法讓你的靈魂回到身體，但該法術會揭露存放你靈魂之物的位置。你不能再抽牌。

      #### 死亡化身

      _中型不死生物，中立邪惡_

      **AC** 20 **先攻** +3（13）
      **HP** 其召喚者生命值上限的一半
      **速度** 60呎，飛行60呎（懸停）

      |  |  | 調整值 | 豁免 |  |  | 調整值 | 豁免 |  |  | 調整值 | 豁免 |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      | **力量** | 16 | +3 | +3 | **敏捷** | 16 | +3 | +3 | **體質** | 16 | +3 | +3 |
      | **智力** | 16 | +3 | +3 | **感知** | 16 | +3 | +3 | **魅力** | 16 | +3 | +3 |

      **免疫** 黯蝕、毒素；魅惑、力竭、恐慌、麻痺、石化、中毒、昏迷
      **感官** 真實視覺60呎，被動察覺13
      **語言** 其召喚者所知的所有語言
      **CR** 無（XP 0；PB等同其召喚者的）

      ### 特性

      **_無實體移動。_** 化身可以穿過其他生物與物體，視同穿過困難地形。若它在物體內結束其回合，會受到5（1d10）力場傷害。

      ### 動作

      **_多重攻擊。_** 化身進行的收割鐮刀攻擊次數，等於召喚者熟練加值的一半（無條件進位）。

      **_收割鐮刀。_** _近戰攻擊檢定：_ 自動命中，觸及5呎。 _命中：_ 7（1d8 + 3）揮砍傷害外加4（1d8）黯蝕傷害。
  - id: necklace-of-adaptation
    name: 適應項鍊
    nameEn: "Necklace of Adaptation"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這條項鍊時，你可以在任何環境中正常呼吸，且你進行豁免以避免或結束中毒狀態時具有優勢。
  - id: necklace-of-fireballs
    name: 火球項鍊
    nameEn: "Necklace of Fireballs"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: false
    text: |-
      這條項鍊上掛有1d6 + 3顆珠子。你可以進行魔法動作，取下一顆珠子並將它擲向最遠60呎外。當珠子抵達其軌跡終點時，會以3環_火球術_（豁免DC 15）引爆。

      你可以一次投擲多顆珠子，甚至整條項鍊。這麼做時，第一顆之後每多一顆珠子，_火球術_的傷害就增加1d6（最多12d6）。
  - id: necklace-of-prayer-beads
    name: 念珠項鍊
    nameEn: "Necklace of Prayer Beads"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: "由牧師、德魯伊或聖騎士"
    text: |-
      這條項鍊有1d4 + 2顆以海藍寶、黑珍珠或黃玉製成的魔法珠子。它還有許多以琥珀、血石、黃水晶、珊瑚、玉、珍珠或石英等石材製成的非魔法珠子。若將魔法珠子從項鍊上取下，該珠子就會失去魔力。

      魔法珠子共有六種。DM決定項鍊上每顆珠子的種類，或在下表上擲骰隨機決定。一條項鍊可以有不只一顆相同種類的珠子。要使用珠子，你必須穿戴著這條項鍊。每顆珠子都蘊含一個法術，你可以作為附贈動作從中施放（若需要豁免，則使用你的法術豁免DC）。魔法珠子的法術一旦施放，該珠子直到下次黎明前都無法再次使用。

      | 1d20 | 珠子 | 法術 |
      | --- | --- | --- |
      | 1–6 | 祝福念珠 | 祝福術 |
      | 7–12 | 治療念珠 | 療傷術（2環版本） |
      | 13–16 | 恩惠念珠 | 高等復原術 |
      | 17–18 | 懲擊念珠 | 閃耀斬 |
      | 19 | 召喚念珠 | 信仰守衛 |
      | 20 | 御風念珠 | 御風而行 |
  - id: nine-lives-stealer
    name: 九轉奪命劍
    nameEn: "Nine Lives Stealer"
    source: srd
    category: weapon
    rarity: very-rare
    attunement: true
    base: { any: [ simple-weapon, martial-weapon ], label: 任意簡易或軍用武器 }
    effects: { attack: 2, damage: 2 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+2加值。

      **_奪取生命。_** 這件武器有1d8 + 1次充能。當你用這件武器攻擊生命值少於100的生物，且攻擊檢定的d20擲出20時，該生物必須成功通過DC 15的體質豁免，否則會因劍從其身體中扯出生命力而當場死亡。構裝生物與不死生物自動通過該豁免。若該生物被殺死，武器失去1次充能。當武器沒有剩餘充能時，它就失去這項特性。
  - id: oathbow
    name: 誓仇弓
    nameEn: Oathbow
    source: srd
    category: weapon
    rarity: very-rare
    attunement: true
    base: { from: [ 長弓, 短弓 ] }
    text: |-
      當你把箭搭上這把弓時，它會以精靈語低語：「迅速擊敗我的敵人。」當你用這件武器進行遠程攻擊時，你可以說出或以手語打出下列命令詞：「願你這傷害過我的人迅速死亡。」你攻擊的目標會成為你的死敵，直到它死亡，或直到7天後的黎明為止。你同一時間只能有一個這樣的死敵。當你的死敵死亡後，你可以在下次黎明後選擇新的死敵。

      當你用這件武器對你的死敵進行遠程攻擊檢定時，該檢定具有優勢。此外，你的目標無法從半掩蔽或四分之三掩蔽獲得益處，且你不會因遠射程而承受劣勢。若攻擊命中，你的死敵額外受到3d6穿刺傷害。

      只要你的死敵還活著，你用所有其他武器進行攻擊檢定時都具有劣勢。
  - id: oil-of-etherealness
    name: 以太化之油
    nameEn: "Oil of Etherealness"
    source: srd
    category: potion
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      一瓶這種油可以塗滿一個中型或更小的生物，連同它穿戴與攜帶的裝備（每高於中型一個體型類別，就需要多一瓶）。塗抹這種油需時10分鐘。受影響的生物接著獲得_以太化_法術的效果，持續1小時。

      這種灰濁的油會在容器外側凝成珠子，並迅速蒸發。
  - id: oil-of-sharpness
    name: 銳鋒之油
    nameEn: "Oil of Sharpness"
    source: srd
    category: potion
    rarity: very-rare
    attunement: false
    consumable: true
    text: |-
      一瓶這種油可以塗覆一件近戰武器或20件彈藥，但只有非魔法且造成揮砍或穿刺傷害的彈藥與近戰武器會受到影響。塗抹這種油需時1分鐘，之後油會神奇地滲入所塗覆之物，使被塗覆的武器變成_武器+3_，或使被塗覆的彈藥變成_彈藥+3_。

      這種清澈的膠狀油閃爍著細小而極薄的銀色碎片。
  - id: oil-of-slipperiness
    name: 滑溜之油
    nameEn: "Oil of Slipperiness"
    source: srd
    category: potion
    rarity: uncommon
    attunement: false
    consumable: true
    text: |-
      一瓶這種油可以塗滿一個中型或更小的生物，連同它穿戴與攜帶的裝備（每高於中型一個體型類別，就需要多一瓶）。塗抹這種油需時10分鐘。受影響的生物接著獲得_行動自如_法術的效果，持續8小時。

      或者，也可以作為魔法動作將這種油倒在地上，覆蓋一個邊長10呎的正方形，在該區域內重現_油膩術_法術的效果，持續8小時。

      這種黏稠的黑色油膏濃厚而沉重，但倒出時流動得很快。
  - id: pearl-of-power
    name: 法力再生珍珠
    nameEn: "Pearl of Power"
    source: srd
    category: wondrous
    group: curio
    rarity: uncommon
    attunement: 由施法者
    text: |-
      這顆珍珠帶在身上時，你可以進行魔法動作，恢復一個3環或更低的已消耗法術位。你使用珍珠後，直到下次黎明前都無法再次使用。
  - id: periapt-of-health
    name: 健康護身符
    nameEn: "Periapt of Health"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這件墜飾時，你可以進行魔法動作，恢復2d4 + 2點生命值。此特性使用後，直到下次黎明前都無法再次使用。

      此外，穿戴這件墜飾時，你進行豁免以避免或結束中毒狀態具有優勢。
  - id: periapt-of-proof-against-poison
    name: 辟毒護身符
    nameEn: "Periapt of Proof against Poison"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      這條精緻的銀鍊上掛著一枚明亮式切割的黑色寶石墜飾。穿戴它時，你對中毒狀態與毒素傷害免疫。
  - id: periapt-of-wound-closure
    name: 癒合護符
    nameEn: "Periapt of Wound Closure"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這件墜飾時，你獲得下列益處。

      **_保全生命。_** 每當你進行死亡豁免時，你可以將9或更低的擲骰結果改為10，使失敗的豁免變成成功。

      **_強化自然療癒。_** 每當你擲生命骰以恢復生命值時，將其恢復的生命值加倍。
  - id: philter-of-love
    name: 迷情媚藥
    nameEn: "Philter of Love"
    source: srd
    category: potion
    rarity: uncommon
    attunement: false
    consumable: true
    text: |-
      喝下這份媚藥後的10分鐘內，你下次看見某個生物時，你會被該生物魅惑，並陷入魅惑狀態1小時。

      這種玫瑰色的起泡液體中有一顆不易察覺的心形氣泡。
  - id: pipes-of-haunting
    name: 顫慄之笛
    nameEn: "Pipes of Haunting"
    source: srd
    category: wondrous
    group: tool
    rarity: uncommon
    attunement: false
    text: |-
      這支笛子有3次充能，每天黎明恢復1d3次已消耗的充能。你可以進行魔法動作演奏它並消耗1次充能，奏出一段詭異而令人著迷的曲調。你選擇的、在你30呎內的每個生物，必須成功通過DC 15的感知豁免，否則陷入恐慌狀態1分鐘。豁免失敗的生物在其每個回合結束時重複進行該豁免，成功則結束其身上的此效果。豁免成功的生物對這支笛子的效果免疫24小時。
  - id: pipes-of-the-sewers
    name: 喚鼠排笛
    nameEn: "Pipes of the Sewers"
    source: srd
    category: wondrous
    group: tool
    rarity: uncommon
    attunement: true
    text: |-
      這支排笛帶在你身上時，一般老鼠與巨鼠對你保持冷漠，除非你威脅或傷害牠們，否則不會攻擊你。

      這支排笛有3次充能，每天黎明恢復1d3次已消耗的充能。若你以魔法動作演奏排笛，你可以進行附贈動作消耗1至3次充能，每消耗1次充能就召來一群鼠群，前提是你半英里內有足夠的老鼠能以這種方式召來（由DM判定）。若老鼠不足以組成一群，該次充能就浪費了。被召來的鼠群會循最短的可用路徑朝音樂移動，但除此之外不受你控制。

      每當一群不受其他生物控制的鼠群，在你演奏排笛期間進入你30呎內時，該鼠群進行一次DC 15的感知豁免。豁免成功時，鼠群照常行動，且在接下來的24小時內不會被排笛的音樂左右。豁免失敗時，鼠群被排笛的音樂左右，只要你持續每輪以魔法動作演奏排笛，就對你與你的盟友保持友善。友善的鼠群服從你的命令。若你沒有對友善的鼠群下達命令，它會自衛，但除此之外不採取任何動作。若友善的鼠群在其回合開始時離你超過30呎，你對該鼠群的控制就會結束，鼠群照常行動，且在接下來的24小時內不會被排笛的音樂左右。
  - id: plate-armor-of-etherealness
    name: 以太化板甲
    nameEn: "Plate Armor of Etherealness"
    source: srd
    category: armor
    rarity: legendary
    attunement: true
    base: { from: [ 半身板甲, 全身板甲 ] }
    text: |-
      穿戴這件護甲時，你可以進行魔法動作並使用命令詞，獲得_以太化_法術的效果。若你脫下護甲，或進行魔法動作重複命令詞，該法術會立即結束。護甲的此特性直到下次黎明前都無法再次使用。
  - id: portable-hole
    name: 便攜式次元洞
    nameEn: "Portable Hole"
    source: srd
    category: wondrous
    group: container
    rarity: rare
    attunement: false
    text: |-
      這塊如絲般柔軟的精緻黑布，被摺成手帕大小。展開後是直徑6呎的圓形布面。

      你可以進行魔法動作，展開_便攜式次元洞_並將它放在堅硬的表面上或靠著堅硬的表面，隨後_便攜式次元洞_會形成一個深10呎的異次元洞。洞內的圓柱形空間存在於另一個位面，因此無法用來創造開放的通道。任何位於開啟的_便攜式次元洞_內的生物，都可以爬出洞外離開。

      你可以進行魔法動作來關閉_便攜式次元洞_，方法是抓住布的邊緣並將它摺起。摺起布會關閉洞口，洞內的任何生物或物體仍留在異次元空間中。不論裡面裝了什麼，這個洞的重量都幾乎為零。

      若洞被摺起，位於洞的異次元空間內的生物可以進行一個動作，做一次DC 10的力量（運動）檢定。檢定成功時，該生物強行脫出，並出現在_便攜式次元洞_5呎內。關閉的_便攜式次元洞_所存的空氣，足夠1小時的呼吸量，並由洞內進行呼吸的生物數量均分。

      將_便攜式次元洞_放入由_次元袋_、_便利袋_或類似物品所創造的異次元空間中，會立即摧毀兩件物品，並開啟一道通往星界的通道。該通道的起點就是其中一件物品被放入另一件物品內的位置。任何在通道10呎內且未處於全掩蔽之後的生物，都會被吸進通道，並被置於星界上的隨機位置。之後通道關閉。該通道只能單向通行，且無法重新開啟。
  - id: potion-of-animal-friendship
    name: 化獸為友藥水
    nameEn: "Potion of Animal Friendship"
    source: srd
    category: potion
    rarity: uncommon
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水時，你可以施放_化獸為友_法術的3環版本（豁免DC 13）。

      搖晃這瓶藥水的混濁液體，會有些許小東西浮現：一片魚鱗、一根蜂鳥羽毛、一根貓爪，或一根松鼠毛。
  - id: potion-of-clairvoyance
    name: 鷹眼術藥水
    nameEn: "Potion of Clairvoyance"
    source: srd
    category: potion
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水時，你獲得_鷹眼術_法術的效果（不需專注）。

      一顆眼球漂浮在這瓶藥水淡黃色的液體中，但藥水被打開時就會消失。
  - id: potion-of-climbing
    name: 攀爬藥水
    nameEn: "Potion of Climbing"
    source: srd
    category: potion
    rarity: common
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水時，你獲得等同你速度的攀爬速度，持續1小時。在此期間，你進行攀爬的力量（運動）檢定具有優勢。

      這瓶藥水分成棕色、銀色與灰色的層次，如同岩石的紋帶。搖晃瓶子也無法讓這些顏色混合。
  - id: potion-of-diminution
    name: 縮小藥水
    nameEn: "Potion of Diminution"
    source: srd
    category: potion
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水時，你獲得_變巨術/縮小術_法術的「縮小」效果，持續1d4小時（不需專注）。

      藥水液體中的紅色不斷收縮成一顆小珠，然後再擴散開來，將周圍的透明液體染色。搖晃瓶子也無法打斷這個過程。
  - id: potion-of-flying
    name: 飛行藥水
    nameEn: "Potion of Flying"
    source: srd
    category: potion
    rarity: very-rare
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水時，你獲得等同你速度的飛行速度，持續1小時，並且可以懸停。若藥水效力消退時你在空中，除非你有其他方式停留在空中，否則你會墜落。

      這瓶藥水的清澈液體漂浮在容器頂端，其中有白色混濁的雜質在飄動。
  - id: potion-of-gaseous-form
    name: 氣化形體藥水
    nameEn: "Potion of Gaseous Form"
    source: srd
    category: potion
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水時，你獲得_氣化形體_法術的效果，持續1小時（不需專注），或直到你以附贈動作結束該效果為止。

      這瓶藥水的容器似乎裝著會像水一樣流動傾倒的霧氣。
  - id: potion-of-giant-strength
    name: 巨人之力藥水
    nameEn: "Potion of Giant Strength"
    source: srd
    category: potion
    rarity: varies
    attunement: false
    options:
      - id: giant
        label: 巨人種類
        choices:
          - { value: hill, label: 山丘, rarity: uncommon, score: 21 }
          - { value: frost-stone, label: 霜或石, rarity: rare, score: 23 }
          - { value: fire, label: 火, rarity: rare, score: 25 }
          - { value: cloud, label: 雲, rarity: very-rare, score: 27 }
          - { value: storm, label: 風暴, rarity: legendary, score: 29 }
    consumable: true
    text: |-
      喝下這瓶藥水時，你的力量值會改變，持續1小時。巨人的類型決定該力量值（見下表）。若你的力量等於或高於該力量值，藥水對你沒有效果。

      這瓶藥水的透明液體中漂浮著一絲光芒，形似巨人的指甲。

      | 藥水 | 力量 | 稀有度 |
      | --- | --- | --- |
      | 巨人之力藥水（山丘） | 21 | 非常見 |
      | 巨人之力藥水（霜或石） | 23 | 稀有 |
      | 巨人之力藥水（火） | 25 | 稀有 |
      | 巨人之力藥水（雲） | 27 | 極稀有 |
      | 巨人之力藥水（風暴） | 29 | 傳說 |
  - id: potion-of-growth
    name: 成長藥水
    nameEn: "Potion of Growth"
    source: srd
    category: potion
    rarity: uncommon
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水時，你獲得_變巨術/縮小術_法術的「變巨」效果，持續10分鐘（不需專注）。

      藥水液體中的紅色不斷從一顆小珠擴散開來，將周圍的透明液體染色，然後再收縮。搖晃瓶子也無法打斷這個過程。
  - id: potions-of-healing
    name: 治療藥水
    nameEn: "Potions of Healing"
    source: srd
    category: potion
    rarity: varies
    attunement: false
    options:
      - id: potency
        label: 等級
        choices:
          - { value: normal, label: 一般, rarity: common, heal: "2d4 + 2", omitInName: true }
          - { value: greater, label: 高等, rarity: uncommon, heal: "4d4 + 4" }
          - { value: superior, label: 強效, rarity: rare, heal: "8d4 + 8" }
          - { value: supreme, label: 極效, rarity: very-rare, heal: "10d4 + 20" }
    consumable: true
    text: |-
      你喝下這瓶藥水時會恢復生命值。恢復的生命值多寡取決於藥水的稀有度，如下表所示。

      不論效力強弱，這瓶藥水的紅色液體在搖晃時都會閃爍光芒。

      | 藥水 | 恢復的生命值 | 稀有度 |
      | --- | --- | --- |
      | 治療藥水 | 2d4 + 2 | 常見 |
      | 治療藥水（高等） | 4d4 + 4 | 非常見 |
      | 治療藥水（強效） | 8d4 + 8 | 稀有 |
      | 治療藥水（極效） | 10d4 + 20 | 極稀有 |
  - id: potion-of-heroism
    name: 英雄氣概藥水
    nameEn: "Potion of Heroism"
    source: srd
    category: potion
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水時，你獲得10點臨時生命值，持續1小時。在相同的持續時間內，你處於_祝福術_法術的效果之下（不需專注）。

      這瓶藥水的藍色液體冒泡並冒著蒸氣，彷彿在沸騰。
  - id: potion-of-invisibility
    name: 隱形藥水
    nameEn: "Potion of Invisibility"
    source: srd
    category: potion
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      這瓶藥水的容器看起來是空的，摸起來卻像裝有液體。喝下藥水時，你陷入隱形狀態1小時。若你進行攻擊檢定、造成傷害或施放法術，該效果會提早結束。
  - id: potion-of-invulnerability
    name: 堅不可摧藥水
    nameEn: "Potion of Invulnerability"
    source: srd
    category: potion
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水後的1分鐘內，你對所有傷害具有抗性。

      這瓶藥水糖漿般的液體看起來像液態的鐵。
  - id: potion-of-longevity
    name: 延壽藥水
    nameEn: "Potion of Longevity"
    source: srd
    category: potion
    rarity: very-rare
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水時，你的生理年齡減少1d6 + 6歲，最低降到13歲。之後每次你再喝下_延壽藥水_，就有10%的累積機率改為讓你老化1d6 + 6歲。

      這種琥珀色的液體中懸浮著一顆小小的心臟，不合常理地仍在跳動。藥水被打開時，這些成分就會消失。
  - id: potion-of-mind-reading
    name: 讀心藥水
    nameEn: "Potion of Mind Reading"
    source: srd
    category: potion
    rarity: rare
    attunement: false
    consumable: true
    text: |-
      當你喝下這瓶藥水時，你獲得_偵測思想_法術（豁免DC 13）的效果，持續10分鐘（不需專注）。

      這瓶藥水的濃稠紫色液體中，漂浮著一團卵形的粉紅色雲霧。
  - id: potion-of-poison
    name: 劇毒藥水
    nameEn: "Potion of Poison"
    source: srd
    category: potion
    rarity: uncommon
    attunement: false
    consumable: true
    text: |-
      這種混合藥劑看起來、聞起來和嚐起來都像_治療藥水_或其他有益的藥水。然而，它實際上是被幻術魔法偽裝的毒藥。_鑑定術_會揭露它的真實本質。

      如果你喝下這瓶藥水，你受到4d6毒素傷害，且必須成功通過DC 13的體質豁免，否則陷入中毒狀態1小時。
  - id: potion-of-resistance
    name: 抗性藥水
    nameEn: "Potion of Resistance"
    source: srd
    category: potion
    rarity: uncommon
    attunement: false
    options:
      - id: damageType
        label: 傷害類型
        choices:
          - { value: acid, label: 強酸 }
          - { value: cold, label: 冷凍 }
          - { value: fire, label: 火焰 }
          - { value: force, label: 力場 }
          - { value: lightning, label: 閃電 }
          - { value: necrotic, label: 黯蝕 }
          - { value: poison, label: 毒素 }
          - { value: psychic, label: 心靈 }
          - { value: radiant, label: 光耀 }
          - { value: thunder, label: 雷鳴 }
    consumable: true
    text: |-
      當你喝下這瓶藥水時，你對一種傷害類型具有抗性，持續1小時。該類型由DM選擇，或擲下表來隨機決定。

      | 1d10 | 傷害類型 | 1d10 | 傷害類型 |
      | --- | --- | --- | --- |
      | 1 | 強酸 | 6 | 黯蝕 |
      | 2 | 冷凍 | 7 | 毒素 |
      | 3 | 火焰 | 8 | 心靈 |
      | 4 | 力場 | 9 | 光耀 |
      | 5 | 閃電 | 10 | 雷鳴 |
  - id: potion-of-speed
    name: 加速藥水
    nameEn: "Potion of Speed"
    source: srd
    category: potion
    rarity: very-rare
    attunement: false
    consumable: true
    text: |-
      當你喝下這瓶藥水時，你獲得_加速術_法術的效果，持續1分鐘（不需專注），且不會承受效果結束時通常會發生的那陣疲憊浪潮。

      這瓶藥水的黃色液體中帶有黑色條紋，並自行旋轉。
  - id: potion-of-vitality
    name: 活力藥水
    nameEn: "Potion of Vitality"
    source: srd
    category: potion
    rarity: very-rare
    attunement: false
    consumable: true
    text: |-
      當你喝下這瓶藥水時，它會移除你身上所有的力竭等級，並結束你身上的中毒狀態。在接下來的24小時內，你每花費一顆生命骰，都會恢復該顆生命骰的最大生命值。

      這瓶藥水的深紅色液體會規律地閃動暗淡的光芒，讓人聯想到心跳。
  - id: potion-of-water-breathing
    name: 水下呼吸藥水
    nameEn: "Potion of Water Breathing"
    source: srd
    category: potion
    rarity: uncommon
    attunement: false
    consumable: true
    text: |-
      喝下這瓶藥水後，你可以在水下呼吸24小時。
      這瓶藥水的混濁綠色液體帶有海洋的氣味，裡面漂浮著一顆水母狀的氣泡。
  - id: quarterstaff-of-the-acrobat
    name: 特技師長棍
    nameEn: "Quarterstaff of the Acrobat"
    source: srd
    category: weapon
    rarity: very-rare
    attunement: true
    base: { fixed: 長棍 }
    effects: { attack: 2, damage: 2 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+2加值。

      手持這件武器時，你可以讓它發出綠色微光光照，範圍至10呎，可以作為附贈動作或在你擲先攻之後發出，你也可以作為附贈動作熄滅這道光。

      手持這件武器時，你可以進行附贈動作來改變它的形態，將它變成6吋短桿（方便收納）或10呎長桿，或將它變回長棍；武器只會延長到周圍空間允許的程度。

      在特定形態下，這件武器具有下列額外特性。

      _特技輔助（僅限長棍與10呎長桿形態）。_ 手持這件武器時，你在敏捷（體操）檢定上具有優勢。

      _攻擊偏轉（僅限長棍形態）。_ 當你手持這件武器並被攻擊命中時，你可以進行反應動作，讓武器在你身周旋轉，使你對觸發此動作的那次攻擊獲得+5的護甲等級加值，有可能使該攻擊落空。你完成一次短休或長休之前，無法再次使用此特性。

      _遠程武器（僅限長棍形態）。_ 這件武器具有投擲屬性，一般射程為30呎，遠射程為120呎。你用這件武器進行遠程攻擊後，它會立即飛回你的手中。
  - id: ring-of-animal-influence
    name: 支配動物戒指
    nameEn: "Ring of Animal Influence"
    source: srd
    category: ring
    rarity: rare
    attunement: false
    text: |-
      這枚戒指有3次充能，每天黎明恢復1d3次已消耗的充能。穿戴這枚戒指時，你可以消耗1次充能，從戒指施放下列法術之一（豁免DC 13）：

      - _化獸為友_
      - _恐懼術_（僅影響野獸）
      - _動物交談_
  - id: ring-of-djinni-summoning
    name: 風巨靈召喚戒指
    nameEn: "Ring of Djinni Summoning"
    source: srd
    category: ring
    rarity: legendary
    attunement: true
    text: |-
      穿戴這枚戒指時，你可以進行魔法動作，從風元素位面召喚一隻特定的**風巨靈**。風巨靈會出現在距離你自身120呎內、由你選擇的一個未被佔據的空間。只要你維持專注，它就會持續存在，最長1小時，或直到它的生命值降至0為止。

      被召喚期間，風巨靈對你和你的盟友友善，並服從你的命令。如果你未能對它下令，風巨靈會抵禦攻擊者，但不會採取其他動作。

      風巨靈離去後，24小時內無法再次被召喚，且若風巨靈死亡，戒指會變成非魔法物品。

      _風巨靈召喚戒指_往往由它們所召喚的風巨靈製作，並作為友誼的贈禮或敬意的象徵送給凡人。
  - id: ring-of-elemental-command
    name: 命令元素戒指
    nameEn: "Ring of Elemental Command"
    source: srd
    category: ring
    rarity: legendary
    attunement: true
    options:
      - id: element
        label: 元素位面
        choices:
          - { value: air, label: 風 }
          - { value: earth, label: 土 }
          - { value: fire, label: 火 }
          - { value: water, label: 水 }
    text: |-
      每枚_命令元素戒指_都連結到四個元素位面之一。連結的位面由DM選擇或隨機決定。例如，_命令元素戒指_（風）連結到風元素位面。

      每枚_命令元素戒指_都具有下列兩項特性：

      **元素剋星。** 穿戴這枚戒指時，你對元素生物的攻擊檢定具有優勢，而元素生物對你的攻擊檢定具有劣勢。

      **元素驅使。** 穿戴這枚戒指時，你可以進行魔法動作，嘗試驅使你自身60呎內你看得見的一隻元素生物。該元素生物進行一次DC 18的感知豁免。豁免失敗時，該元素生物陷入魅惑狀態，直到你的下個回合開始，且你決定它在下個回合如何運用其移動與動作。

      _元素專精。_ 穿戴這枚戒指時，你還能獲得與戒指所連結的元素位面相對應的額外特性：

      **風。** 你懂風族語，你對閃電傷害具有抗性，並且你擁有等同於你速度的飛行速度，且可以懸停。

      **土。** 你懂土族語，並且你對強酸傷害具有抗性。由碎石、岩石或泥土構成的地形對你而言不是困難地形。此外，你可以穿越堅實的土壤或岩石，如同這些區域是困難地形，且不會擾動你所經過的物質。如果你在堅實的土壤或岩石中結束回合，你會被推出至你最後佔據過的、最近的未被佔據空間。

      **火。** 你懂火族語，並且你對火焰傷害免疫。

      **水。** 你懂水族語，你獲得60呎的游泳速度，並且你可以在水下呼吸。

      _施法。_ 這枚戒指有5次充能，每天黎明恢復1d4 + 1次已消耗的充能。穿戴這枚戒指時，你可以從中施放法術。依戒指所連結的元素位面，從可用的法術清單中選擇法術，如下表所示。表格列出施放各法術需要消耗的充能次數，該法術的豁免DC為18。

      | 位面 | 法術（充能） |
      | --- | --- |
      | 風 | *連鎖閃電*（3次充能）、*羽落術*（0次充能）、*造風術*（2次充能）、*風牆術*（1次充能） |
      | 土 | *地震術*（5次充能）、*塑石術*（2次充能）、*石膚術*（3次充能）、*石牆術*（3次充能） |
      | 火 | *燃燒之手*（1次充能）、*火球術*（2次充能）、*火焰風暴*（4次充能）、*火牆術*（3次充能） |
      | 水 | *造水術/枯水術*（1次充能）、*冰風暴*（2次充能）、*海嘯術*（5次充能）、*冰牆術*（3次充能）、*水上行走*（2次充能） |
  - id: ring-of-evasion
    name: 反射閃避戒指
    nameEn: "Ring of Evasion"
    source: srd
    category: ring
    rarity: rare
    attunement: true
    text: |-
      這枚戒指有3次充能，每天黎明恢復1d3次已消耗的充能。穿戴這枚戒指時，當你敏捷豁免失敗，你可以進行反應動作並消耗1次充能，改為使該豁免成功。
  - id: ring-of-feather-falling
    name: 羽落戒指
    nameEn: "Ring of Feather Falling"
    source: srd
    category: ring
    rarity: rare
    attunement: true
    text: |-
      穿戴這枚戒指時墜落，你每輪下降60呎，且不會受到墜落傷害。
  - id: ring-of-free-action
    name: 自由行動戒指
    nameEn: "Ring of Free Action"
    source: srd
    category: ring
    rarity: rare
    attunement: true
    text: |-
      你穿戴這枚戒指時，困難地形不會讓你額外花費移動力。此外，魔法既不能降低你的任何速度，也不能使你陷入麻痺或束縛狀態。
  - id: ring-of-invisibility
    name: 隱形戒指
    nameEn: "Ring of Invisibility"
    source: srd
    category: ring
    rarity: legendary
    attunement: true
    text: |-
      穿戴這枚戒指時，你可以進行魔法動作使自己陷入隱形狀態。你會保持隱形，直到戒指被取下，或直到你進行附贈動作使自己重新可見。
  - id: ring-of-jumping
    name: 跳躍戒指
    nameEn: "Ring of Jumping"
    source: srd
    category: ring
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這枚戒指時，你可以從中施放_跳躍術_，但這樣做時只能以你自己為目標。
  - id: ring-of-mind-shielding
    name: 心靈護盾戒指
    nameEn: "Ring of Mind Shielding"
    source: srd
    category: ring
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這枚戒指時，你對讓其他生物能讀取你的思想、判定你是否說謊、得知你的陣營或得知你的生物類型的魔法免疫。只有在你允許時，生物才能以心靈感應與你溝通。

      你可以進行魔法動作使戒指變得無法察覺，直到你進行另一個魔法動作使其變得可察覺、直到你取下戒指，或直到你死亡為止。

      如果你在穿戴這枚戒指時死亡，你的靈魂會進入戒指，除非戒指中已經容納了一個靈魂。你可以留在戒指中，或前往來世。只要你的靈魂在戒指中，你就能以心靈感應與任何穿戴這枚戒指的生物溝通。穿戴者無法阻止這種心靈感應溝通。
  - id: ring-of-protection
    name: 防禦戒指
    nameEn: "Ring of Protection"
    source: srd
    category: ring
    rarity: rare
    attunement: true
    effects: { ac: 1, saves: 1 }
    text: |-
      穿戴這枚戒指時，你的護甲等級與豁免獲得+1加值。
  - id: ring-of-regeneration
    name: 再生戒指
    nameEn: "Ring of Regeneration"
    source: srd
    category: ring
    rarity: very-rare
    attunement: true
    text: |-
      穿戴這枚戒指時，只要你至少有1點生命值，你每10分鐘恢復1d6點生命值。如果你失去身體部位，且在這段期間你始終至少有1點生命值，戒指會使缺失的部位在1d6 + 1天後重新長出並恢復完整功能。
  - id: ring-of-resistance
    name: 抗性戒指
    nameEn: "Ring of Resistance"
    source: srd
    category: ring
    rarity: rare
    attunement: false
    options:
      - id: damageType
        label: 傷害類型
        choices:
          - { value: acid, label: 強酸 }
          - { value: cold, label: 冷凍 }
          - { value: fire, label: 火焰 }
          - { value: force, label: 力場 }
          - { value: lightning, label: 閃電 }
          - { value: necrotic, label: 黯蝕 }
          - { value: poison, label: 毒素 }
          - { value: psychic, label: 心靈 }
          - { value: radiant, label: 光耀 }
          - { value: thunder, label: 雷鳴 }
    text: |-
      穿戴這枚戒指時，你對一種傷害類型具有抗性。戒指上的寶石標示該類型，由DM選擇，或擲下表來隨機決定。

      | 1d10 | 傷害類型 | 寶石 |
      | --- | --- | --- |
      | 1 | 強酸 | 珍珠 |
      | 2 | 冷凍 | 碧璽 |
      | 3 | 火焰 | 石榴石 |
      | 4 | 力場 | 藍寶石 |
      | 5 | 閃電 | 黃水晶 |
      | 6 | 黯蝕 | 煤玉 |
      | 7 | 毒素 | 紫水晶 |
      | 8 | 心靈 | 玉 |
      | 9 | 光耀 | 黃玉 |
      | 10 | 雷鳴 | 尖晶石 |
  - id: ring-of-shooting-stars
    name: 流星戒指
    nameEn: "Ring of Shooting Stars"
    source: srd
    category: ring
    rarity: very-rare
    attunement: true
    text: |-
      你可以從這枚戒指施放_舞光術_或_光亮術_。

      這枚戒指有6次充能，每天黎明恢復1d6次已消耗的充能。你可以消耗它的充能來使用下列特性。

      **_妖火。_** 你可以消耗1次充能，從戒指施放_妖火_。

      **_閃電球。_** 你可以消耗2次充能，作為魔法動作創造最多四顆直徑3呎的閃電球。每顆球體出現在距離你自身120呎內、你看得見的一個未被佔據的空間。球體在你維持專注期間持續存在，最長1分鐘。每顆球體在半徑30呎內散發微光光照。

      作為附贈動作，你可以移動每顆球體最多30呎，但離你自身不得超過120呎。球體第一次來到除你之外、未處於全掩蔽後方的生物5呎內時，球體會對該生物放出閃電並消失。該生物進行一次DC 15的敏捷豁免。豁免失敗時，該生物受到的閃電傷害依你創造的球體數量而定，如下表所示。豁免成功時，該生物受到一半傷害。

      | 球體數量 | 閃電傷害 | 球體數量 | 閃電傷害 |
      | --- | --- | --- | --- |
      | 1 | 4d12 | 3 | 2d6 |
      | 2 | 5d4 | 4 | 2d4 |

      _流星。_ 你可以進行魔法動作，消耗1至3次充能。你每消耗1次充能，就從戒指朝你自身60呎內你看得見的一點射出一顆發光的光點。以該點為起點的15呎立方體內的每個生物都會被火花籠罩，並進行一次DC 15的敏捷豁免，豁免失敗者受到5d4光耀傷害，豁免成功者受到一半傷害。
  - id: ring-of-spell-storing
    name: 儲法戒指
    nameEn: "Ring of Spell Storing"
    source: srd
    category: ring
    rarity: rare
    attunement: true
    text: |-
      這枚戒指會儲存被施放進其中的法術，並保存它們，直到同調的穿戴者使用它們。這枚戒指一次最多可儲存總計5環的法術。被發現時，它內含由DM選擇、總計1d6 − 1環的已儲存法術。

      任何生物都可以在施放1至5環的法術時，藉由觸碰這枚戒指，將該法術施放進戒指中。該法術除了被儲存進戒指之外沒有其他效果。如果戒指無法容納該法術，法術會被消耗而沒有任何效果。用來施放該法術的法術位環階，決定它佔用多少空間。

      穿戴這枚戒指時，你可以施放其中儲存的任何法術。該法術使用原施法者的法術位環階、法術豁免DC、法術攻擊加值與施法屬性，但在其他方面視同由你施放該法術。從戒指施放出的法術不再儲存於其中，騰出空間。
  - id: ring-of-spell-turning
    name: 法術反轉戒指
    nameEn: "Ring of Spell Turning"
    source: srd
    category: ring
    rarity: legendary
    attunement: true
    text: |-
      穿戴這枚戒指時，你對法術的豁免具有優勢。如果你對一個7環或更低環的法術豁免成功，該法術對你不產生效果。如果該法術只以你為目標，且沒有創造效果區域，你可以進行反應動作將該法術反彈回施法者身上；施法者必須使用自己的法術豁免DC，對該法術進行一次豁免。
  - id: ring-of-swimming
    name: 游泳戒指
    nameEn: "Ring of Swimming"
    source: srd
    category: ring
    rarity: uncommon
    attunement: false
    text: |-
      穿戴這枚戒指時，你擁有40呎的游泳速度。
  - id: ring-of-telekinesis
    name: 心靈遙控戒指
    nameEn: "Ring of Telekinesis"
    source: srd
    category: ring
    rarity: very-rare
    attunement: true
    text: |-
      穿戴這枚戒指時，你可以從中施放_心靈遙控_。
  - id: ring-of-the-ram
    name: 公羊戒指
    nameEn: "Ring of the Ram"
    source: srd
    category: ring
    rarity: rare
    attunement: true
    text: |-
      這枚戒指有3次充能，每天黎明恢復1d3次已消耗的充能。穿戴這枚戒指時，你可以進行魔法動作，消耗1至3次充能，對你自身60呎內你看得見的一個生物進行一次遠程法術攻擊。戒指會生成一個幽靈般的公羊頭，並以+7加值進行其攻擊檢定。命中時，你每花費1次充能，目標就受到2d10力場傷害，並被推離你5呎。

      或者，你可以作為魔法動作消耗戒指的1至3次充能，嘗試破壞你自身60呎內你看得見的一個未被穿戴或攜帶的非魔法物體。戒指進行一次力量檢定，你每花費1次充能，檢定獲得+5加值。
  - id: ring-of-three-wishes
    name: 三願戒指
    nameEn: "Ring of Three Wishes"
    source: srd
    category: ring
    rarity: legendary
    attunement: false
    text: |-
      穿戴這枚戒指時，你可以消耗它3次充能中的1次，從中施放_祈願術_。當你使用最後一次充能時，戒指會變成非魔法物品。
  - id: ring-of-warmth
    name: 溫暖戒指
    nameEn: "Ring of Warmth"
    source: srd
    category: ring
    rarity: uncommon
    attunement: true
    text: |-
      如果你在穿戴這枚戒指時受到冷凍傷害，戒指會使你受到的傷害減少2d8。

      此外，穿戴這枚戒指時，你以及你穿戴和攜帶的一切物品，不會受到華氏0度或更低溫度的傷害。
  - id: ring-of-water-walking
    name: 水行戒指
    nameEn: "Ring of Water Walking"
    source: srd
    category: ring
    rarity: uncommon
    attunement: false
    text: |-
      穿戴這枚戒指時，你從中施放_水上行走_，且只能以你自己為目標。
  - id: ring-of-x-ray-vision
    name: 透視戒指
    nameEn: "Ring of X-ray Vision"
    source: srd
    category: ring
    rarity: rare
    attunement: true
    text: |-
      穿戴這枚戒指時，你可以進行魔法動作，獲得範圍30呎的透視視覺，持續1分鐘。對你而言，該半徑內的堅實物體看起來是透明的，也不會阻擋光線穿過。這種視覺可以穿透1呎的石頭、1吋的普通金屬，或最多3呎的木頭或泥土。更厚的物質或一片薄鉛板會阻擋這種視覺。

      每當你在進行長休之前再次使用這枚戒指，你必須成功通過DC 15的體質豁免，否則獲得1級力竭。
  - id: robe-of-eyes
    name: 百眼法袍
    nameEn: "Robe of Eyes"
    source: srd
    category: wondrous
    group: wearable
    rarity: rare
    attunement: true
    text: |-
      這件法袍裝飾著眼睛狀的圖案。你穿戴這件法袍時，會獲得下列益處：

      **全方位視覺。** 這件法袍使你在依賴視覺的感知（察覺）檢定上具有優勢。

      **特殊感官。** 你擁有黑暗視覺與真實視覺，範圍皆為120呎。

      _缺點。_ 對這件法袍施放的_光亮術_法術，或在法袍5呎內施放的_晝明術_法術，會使你陷入失明狀態1分鐘。在你的每個回合結束時，你進行一次體質豁免（_光亮術_為DC 11，_晝明術_為DC 15），成功則結束你身上的此狀態。
  - id: robe-of-scintillating-colors
    name: 虹光法袍
    nameEn: "Robe of Scintillating Colors"
    source: srd
    category: wondrous
    group: wearable
    rarity: very-rare
    attunement: true
    text: |-
      這件法袍有3次充能，每天黎明恢復1d3次已消耗的充能。你穿戴它時，可以進行魔法動作並消耗1次充能，使這件衣物顯現出變幻不定的炫目色彩圖樣，直到你下個回合結束。在此期間，法袍在半徑30呎內散發明亮光照，並再向外30呎散發微光光照，且能看見你的生物對你的攻擊檢定具有劣勢。當法袍的力量被啟動時，處於明亮光照內且能看見你的任何生物，必須成功通過DC 15的感知豁免，否則陷入震懾狀態，直到效果結束。
  - id: robe-of-stars
    name: 星辰法袍
    nameEn: "Robe of Stars"
    source: srd
    category: wondrous
    group: wearable
    rarity: very-rare
    attunement: true
    effects: { saves: 1 }
    text: |-
      這件黑色或深藍色的法袍上繡有白色或銀色的小星星。你穿戴它時，豁免獲得+1加值。

      法袍前方上半部有六顆特別大的星星。穿戴這件法袍時，你可以進行魔法動作，摘下其中一顆星星並消耗它，來施放_魔法飛彈_的5環版本。每天黃昏，有1d6顆被摘下的星星會重新出現在法袍上。

      你穿戴法袍時，可以進行魔法動作，連同你穿戴和攜帶的一切進入星界。你會留在那裡，直到你進行魔法動作返回你原本所在的位面。你會重新出現在你最後佔據的空間；如果該空間已被佔據，則出現在最近的未被佔據空間。
  - id: robe-of-the-archmagi
    name: 大法師法袍
    nameEn: "Robe of the Archmagi"
    source: srd
    category: wondrous
    group: wearable
    rarity: legendary
    attunement: "由術士、契術師或法師"
    text: |-
      這件優雅的衣物以精緻的布料製成，並裝飾著符文。

      你穿戴這件法袍時，獲得這些益處。

      _護甲。_ 如果你沒有穿戴護甲，你的基礎護甲等級為15加上你的敏捷調整值。

      _魔法抗性。_ 你對法術與其他魔法效果的豁免具有優勢。

      _戰法師。_ 你的法術豁免DC與法術攻擊加值各增加2。
  - id: robe-of-useful-items
    name: 雜貨法袍
    nameEn: "Robe of Useful Items"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: false
    text: |-
      這件法袍上覆蓋著各種形狀與顏色的布片。穿戴法袍時，你可以進行魔法動作，撕下其中一塊布片，使它變成它所代表的物體或生物。一旦最後一塊布片被撕下，法袍就會變成一件普通衣物。

      法袍上有下列布片，每種各兩塊：

      - 牛眼提燈（已裝滿燈油並點燃）
      - 匕首
      - 鏡子
      - 長桿
      - 繩索（已盤好）
      - 麻袋此外，法袍上還有4d4塊其他布片。這些布片由DM選擇，或擲下表來隨機決定。

      | 1d100 | 布片 |
      | --- | --- |
      | 01–08 | 裝有100 GP的袋子 |
      | 09–15 | 價值500 GP的銀製小箱（長1呎，寬與深6吋） |
      | 16–22 | 鐵門（寬最多10呎、高最多10呎，在你選擇的一側有門閂），你可以將它放在你伸手可及的開口處；它會變形以貼合開口，自行固定並裝上鉸鏈 |
      | 23–30 | 10顆寶石，每顆價值100 GP |
      | 31–44 | 木梯（長24呎） |
      | 45–51 | 配騎乘鞍的馱用馬 |
      | 52–59 | 開放的坑洞（10呎立方體），你可以將它放在你自身10呎內的地面上 |
      | 60–68 | 4瓶治療藥水 |
      | 69–75 | 划艇（長12呎） |
      | 76–83 | 法術卷軸，內含一個1環、2環或3環的法術（由你選擇） |
      | 84–90 | 2隻獒犬 |
      | 91–96 | 窗戶（2呎乘4呎，深度最多2呎），你可以將它放在你伸手可及的垂直表面上 |
      | 97–00 | 便攜式攻城錘 |
  - id: rod-of-absorption
    name: 吸收權杖
    nameEn: "Rod of Absorption"
    source: srd
    category: rod
    rarity: very-rare
    attunement: true
    text: |-
      手持這根權杖時，你可以進行反應動作，吸收一個只以你為目標、且沒有創造效果區域的法術。被吸收法術的效果會被取消，法術的能量（而非法術本身）會被儲存在權杖中。該能量的環數與法術被施放時的環數相同。被取消的法術會消散而沒有任何效果，用來施放它的任何資源都會被浪費。權杖在其存在期間，最多可以吸收並儲存50環的能量。一旦權杖吸收了50環的能量，就無法再吸收更多。如果你成為權杖無法儲存的法術的目標，權杖對該法術沒有效果。

      當你與權杖同調時，你會知道權杖在其存在期間總共吸收了多少環的能量，以及它目前儲存了多少環的法術能量。

      如果你是手持權杖的施法者，你可以把儲存在其中的能量轉換為法術位，來施放你已準備或已知的法術。你只能創造環階等於或低於你自己法術位的法術位，最高為5環。你使用儲存的環數來取代你的法術位，但在其他方面照常施放法術。例如，你可以把權杖中儲存的3環能量當作一個3環法術位使用。

      新發現的權杖通常儲存有1d10環的法術能量。無法再吸收法術能量且沒有剩餘能量的權杖會變成非魔法物品。
  - id: rod-of-alertness
    name: 警示權杖
    nameEn: "Rod of Alertness"
    source: srd
    category: rod
    rarity: very-rare
    attunement: true
    text: |-
      這根權杖具有下列特性。

      _警覺。_ 手持權杖時，你在感知（察覺）檢定與先攻擲骰上具有優勢。

      _法術。_ 手持權杖時，你可以從中施放下列法術：

      - _偵測善惡_
      - _偵測魔法_
      - _偵測毒性和疾病_
      - _識破隱形_

      _防護靈光。_ 作為魔法動作，你可以把權杖的柄端插入地面，隨後權杖的頂端會在半徑60呎內散發明亮光照，並再向外60呎散發微光光照。處於該明亮光照內時，你和你的盟友獲得+1的護甲等級與豁免加值，並能感知同樣處於該明亮光照內的任何隱形生物的位置。

      權杖頂端會停止發光，且效果在10分鐘後，或在有生物進行魔法動作將權杖從地面拔起時結束。此特性使用後，直到下次黎明前都無法再次使用。
  - id: rod-of-lordly-might
    name: 王者權杖
    nameEn: "Rod of Lordly Might"
    source: srd
    category: rod
    rarity: legendary
    attunement: true
    base: { fixed: 硬頭錘 }
    effects: { attack: 3, damage: 3 }
    text: |-
      這根權杖有凸緣狀的頂端，並且作為一把魔法硬頭錘，使用它進行的攻擊檢定與傷害擲骰獲得+3加值。權杖具有六個與按鈕相關的特性，這些按鈕沿著權杖的柄排成一列。它還有另外三項特性，詳述如下。

      _按鈕。_ 你可以進行附贈動作按下下列按鈕之一；按鈕的效果持續到你按下另一個按鈕，或再次按下同一個按鈕為止，後者會使權杖恢復原本的形態：

      **按鈕1。** 權杖凸緣狀頂端的另一端會長出一把火焰之刃。火焰在半徑40呎內散發明亮光照，並再向外40呎散發微光光照，這把刃作為一把魔法長劍或短劍（由你選擇），命中時額外造成2d6火焰傷害。

      **按鈕2。** 權杖的凸緣狀頂端向下摺起，並彈出兩片新月形的刃，使權杖變成一把魔法戰斧，使用它進行的攻擊檢定與傷害擲骰獲得+3加值。

      **按鈕3。** 權杖的凸緣狀頂端向下摺起，權杖的尖端彈出一個矛尖，權杖的握柄延長為6呎長的柄，使權杖變成一把魔法短矛，使用它進行的攻擊檢定與傷害擲骰獲得+3加值。

      **按鈕4。** 權杖變成最長50呎的攀爬桿（長度由你指定），但權杖的按鈕仍會留在你伸手可及之處。在像花崗岩那樣堅硬的表面上，底部的尖釘和頂端的三個鉤子會固定住這根桿子。3吋長的水平橫桿會從兩側摺出，彼此相距1呎，形成一道梯子。這根桿子最多可承受4,000磅。更大的重量或缺乏穩固的固定，會使權杖恢復原本的形態。

      **按鈕5。** 權杖變成一支手持式攻城錘，並讓其使用者在為了突破門、路障及其他障礙而進行的力量（運動）檢定上獲得+10加值。

      **按鈕6。** 權杖呈現或維持原本的形態，並指出磁北方向。（如果在沒有磁北的地點使用權杖的這項功能，則什麼也不會發生。）權杖還會讓你得知你在地面下的大致深度，或在地面上的大致高度。

      _汲取生命。_ 當你用權杖進行近戰攻擊命中一個生物時，你可以迫使目標進行一次DC 17的體質豁免。豁免失敗時，目標額外受到4d6黯蝕傷害，且你恢復等同於該黯蝕傷害一半的生命值。此特性使用後，直到下次黎明前都無法再次使用。

      _麻痺。_ 當你用權杖進行近戰攻擊命中一個生物時，你可以迫使目標進行一次DC 17的體質豁免。豁免失敗時，目標陷入麻痺狀態1分鐘。目標在其每個回合結束時重複進行該豁免，成功則結束效果。此特性使用後，直到下次黎明前都無法再次使用。

      _恐嚇。_ 手持權杖時，你可以進行魔法動作，迫使你自身30呎內你看得見的每個生物進行一次DC 17的感知豁免。豁免失敗時，目標陷入恐慌狀態1分鐘。陷入恐慌狀態的目標在其每個回合結束時重複進行該豁免，成功則結束其身上的效果。此特性使用後，直到下次黎明前都無法再次使用。
  - id: rod-of-resurrection
    name: 復活權杖
    nameEn: "Rod of Resurrection"
    source: srd
    category: rod
    rarity: legendary
    attunement: true
    text: |-
      這根權杖有5次充能。你手持它時，可以從中施放下列法術之一：_醫療術_（消耗1次充能）或_復生術_（消耗5次充能）。

      權杖每天黎明恢復1次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，權杖會在一陣無害的光輝爆發中消失。
  - id: rod-of-rulership
    name: 支配權杖
    nameEn: "Rod of Rulership"
    source: srd
    category: rod
    rarity: rare
    attunement: true
    text: |-
      你可以進行魔法動作展示這根權杖，並對你自身120呎內你看得見、由你選擇的每個生物要求服從。每個目標必須成功通過DC 15的感知豁免，否則陷入魅惑狀態8小時。以此方式陷入魅惑時，該生物會將你視為它所信任的領袖。如果受到你或你的盟友傷害，或被命令去做違背其本性的事，目標就不再以此方式陷入魅惑。此特性使用後，直到下次黎明前都無法再次使用。
  - id: rod-of-security
    name: 庇護權杖
    nameEn: "Rod of Security"
    source: srd
    category: rod
    rarity: very-rare
    attunement: false
    text: |-
      手持這根權杖時，你可以進行魔法動作啟動它。權杖隨即立刻將你以及你看得見的至多199個其他自願生物傳送到一個半位面。半位面呈現的形式由你決定。它可以是寧靜的花園、歡樂的酒館、宏偉的宮殿、熱帶島嶼、奇幻的嘉年華，或你能想像的任何其他地方。無論其性質為何，半位面都含有足夠供其訪客維生的水與食物，且半位面的環境無法傷害其中的居住者。那裡其他可供互動的一切事物都只能存在於那裡。例如，從那裡的花園摘下的花朵，如果被帶到半位面之外就會消失。

      訪客在半位面中每待1小時，就恢復生命值，如同花費了1顆生命骰。此外，生物在那裡不會變老，但時間仍正常流逝。訪客最多可以在那裡停留200天除以在場生物數量的天數（無條件捨去）。

      當時間用盡，或你進行魔法動作結束效果時，所有訪客會重新出現在你啟動權杖時他們所在的位置，或最靠近該位置的未被佔據空間。此特性使用後，要經過10天才能再次使用。
  - id: rope-of-climbing
    name: 攀爬繩
    nameEn: "Rope of Climbing"
    source: srd
    category: wondrous
    group: tool
    rarity: uncommon
    attunement: false
    text: |-
      這條60呎長的繩子最多可承受3,000磅。握住繩子一端時，你可以進行魔法動作，命令繩子的另一端活動，並朝你選擇的目的地移動，距離不超過繩子的長度。該端在你第一次下令的回合移動10呎，並在你之後每個回合開始時移動10呎，直到抵達目的地或你叫它停止為止。你也可以叫繩子牢固地綁在某個物體上或解開，打結或解結，或自行盤起以便攜帶。

      如果你叫繩子打結，繩子上每隔1呎就會出現大型繩結。打結時，繩子會縮短為50呎長，並使利用繩子攀爬所進行的屬性檢定具有優勢。

      這條繩子的AC為20，HP為20，並對毒素與心靈傷害免疫。只要它至少有1點生命值，每5分鐘就恢復1點生命值。如果繩子的生命值降至0，它就會被摧毀。
  - id: rope-of-entanglement
    name: 糾纏繩
    nameEn: "Rope of Entanglement"
    source: srd
    category: wondrous
    group: tool
    rarity: rare
    attunement: false
    text: |-
      這條繩索長30呎。手持繩索一端時，你可以進行魔法動作，命令另一端向前竄出，纏住你20呎內一個你能看見的生物。目標必須成功通過DC 15的敏捷豁免，否則陷入束縛狀態。你可以藉由放開你這一端的繩索（使繩索在目標的空間內盤起），或進行附贈動作重複下達命令（使繩索在你手中盤起），來釋放目標。

      被繩索束縛的目標可以進行一個動作，自行選擇進行DC 15的力量（運動）或敏捷（體操）檢定。檢定成功時，目標不再被繩索束縛。若目標脫離繩索時你仍握著繩索，你可以進行反應動作，命令繩索在你手中盤起；否則，繩索在目標的空間內盤起。

      繩索的AC為20、HP為20，並對毒素與心靈傷害免疫。只要至少剩餘1點生命值，它每5分鐘恢復1點生命值。若繩索降至0點生命值，它就會被摧毀。
  - id: scarab-of-protection
    name: 防護聖甲蟲
    nameEn: "Scarab of Protection"
    source: srd
    category: wondrous
    group: wearable
    rarity: legendary
    attunement: true
    effects: { ac: 1 }
    text: |-
      這枚甲蟲形狀的徽章帶在你身上時，提供三種益處。

      _防禦。_ 你獲得+1的AC加值。

      _保存。_ 聖甲蟲有12次充能。若你對死靈法術或源自不死生物的有害效果的豁免失敗，你可以進行反應動作並消耗1次充能，將失敗的豁免轉為成功。當最後一次充能被消耗時，聖甲蟲化為粉末並被摧毀。

      _法術抗性。_ 你對法術的豁免具有優勢。
  - id: scimitar-of-speed
    name: 急速彎刀
    nameEn: "Scimitar of Speed"
    source: srd
    category: weapon
    rarity: very-rare
    attunement: true
    base: { fixed: 彎刀 }
    effects: { attack: 2, damage: 2 }
    text: |-
      使用這件魔法武器進行的攻擊檢定與傷害擲骰獲得+2加值。此外，你可以在自己的每個回合以附贈動作使用它進行一次攻擊。
  - id: sending-stones
    name: 傳訊石
    nameEn: "Sending Stones"
    source: srd
    category: wondrous
    group: tool
    rarity: uncommon
    attunement: false
    text: |-
      _傳訊石_成對出現，每顆石頭都雕成與另一顆相配，因此容易認出它們是一對。當你觸碰其中一顆石頭時，你可以從它施放_短訊術_。目標是另一顆石頭的持有者。若沒有任何生物持有另一顆石頭，你在使用該石頭時就會立即知道這件事，且你不會施放該法術。

      一旦使用任一顆石頭施放了_短訊術_，直到下次黎明前，這些石頭都無法再次使用。若一對石頭中的一顆被摧毀，另一顆就會變成非魔法物品。
  - id: sentinel-shield
    name: 警戒之盾
    nameEn: "Sentinel Shield"
    source: srd
    category: armor
    rarity: uncommon
    attunement: false
    base: { fixed: 盾牌 }
    text: |-
      手持這面盾牌時，你的先攻擲骰與感知（察覺）檢定具有優勢。盾牌上飾有一個眼睛的符號。
  - id: shield-plus
    name: "盾牌+1／+2／+3"
    nameEn: "Shield, +1, +2, or +3"
    source: srd
    category: armor
    rarity: varies
    rarityText: "非常見（+1）、稀有（+2）或極稀有（+3）"
    attunement: false
    base: { fixed: 盾牌 }
    options:
      - id: bonus
        label: 加值
        choices:
          - { value: 1, label: "+1", rarity: uncommon }
          - { value: 2, label: "+2", rarity: rare }
          - { value: 3, label: "+3", rarity: very-rare }
    effects: { ac: bonus }
    displayName: "{base}{bonus}"
    text: |-
      手持這面盾牌時，除了盾牌本身的一般AC加值外，你還獲得由盾牌稀有度決定的AC加值。
  - id: shield-of-missile-attraction
    name: 招矢之盾
    nameEn: "Shield of Missile Attraction"
    source: srd
    category: armor
    rarity: rare
    attunement: true
    base: { fixed: 盾牌 }
    text: |-
      手持這面盾牌時，你對遠程武器攻擊造成的傷害具有抗性。

      _詛咒。_ 這面盾牌受到詛咒。與它同調會使你受到詛咒，直到你成為_移除詛咒_法術或類似魔法的目標為止。移除盾牌無法結束你身上的詛咒。每當遠程武器攻擊以你10呎內的生物為目標時，詛咒會使你改為成為目標。
  - id: shield-of-the-cavalier
    name: 騎士之盾
    nameEn: "Shield of the Cavalier"
    source: srd
    category: armor
    rarity: very-rare
    attunement: true
    base: { fixed: 盾牌 }
    effects: { ac: 2 }
    text: |-
      手持這面盾牌時，你獲得+2的AC加值。此加值與盾牌本身的一般AC加值相加。

      手持這面盾牌時，你還可以使用盾牌的下列額外特性。

      _強力盾擊。_ 當你進行攻擊動作時，你可以用盾牌對你5呎內的一個目標進行其中一次攻擊檢定。該攻擊檢定套用你的熟練加值與力量調整值。命中時，盾牌對目標造成等同於2d6 + 2加上你的力量調整值的力場傷害；若目標是生物，你可以將其朝直接遠離你的方向推開最多10呎。若該生物的體型與你相同或比你小，你還可以將其擊倒，使其陷入倒地狀態。

      _防護力場。_ 當你或你5呎內一個你能看見的盟友成為攻擊的目標，或是對一個效果區域進行豁免時，你可以作為反應動作使用盾牌，創造一個以你為起點、不可移動的5呎發散區域。發散區域出現時，任何沒有完全位於其中的生物或物體，都會被推到其外側最近的未被佔據的空間。觸發該反應動作的攻擊或效果區域對發散區域內的生物與物體不產生效果，發散區域會持續到你不再維持專注為止，最長1分鐘。任何東西都無法進入或離開發散區域。發散區域內的生物或物體無法被來自外部的攻擊或效果傷害，發散區域內的生物也無法傷害其外部的任何東西。此特性使用後，直到下次黎明前都無法再次使用。
  - id: slippers-of-spider-climbing
    name: 蛛行拖鞋
    nameEn: "Slippers of Spider Climbing"
    source: srd
    category: wondrous
    group: wearable
    rarity: uncommon
    attunement: true
    text: |-
      穿戴這雙輕便鞋子時，你可以在垂直表面上向上、向下與橫向移動，也可以沿著天花板移動，同時讓雙手保持空閒。你擁有等同於你速度的攀爬速度。然而，拖鞋不允許你在濕滑的表面上以這種方式移動，例如覆蓋著冰或油的表面。
  - id: sovereign-glue
    name: 至尊膠
    nameEn: "Sovereign Glue"
    source: srd
    category: wondrous
    group: consumable
    rarity: legendary
    attunement: false
    consumable: true
    text: |-
      這種黏稠的乳白色物質能在任意兩個物體之間形成永久的黏合。它必須存放在內側塗有_滑溜之油_的罐子或瓶子中。被發現時，一個容器內有1d6 + 1盎司。

      1盎司的膠水可以覆蓋1平方呎的表面。塗抹1盎司的_至尊膠_需要一個使用動作，塗上的膠水需要1分鐘凝固。凝固之後，它所形成的黏合只能藉由施用_萬溶劑_或_以太化之油_，或是以_祈願術_法術來破除。
  - id: spellguard-shield
    name: 抗法盾牌
    nameEn: "Spellguard Shield"
    source: srd
    category: armor
    rarity: very-rare
    attunement: true
    base: { fixed: 盾牌 }
    text: |-
      手持這面盾牌時，你對法術與其他魔法效果的豁免具有優勢，且法術攻擊檢定對你具有劣勢。
  - id: spell-scroll
    name: 法術卷軸
    nameEn: "Spell Scroll"
    source: srd
    category: scroll
    rarity: varies
    attunement: false
    options:
      - id: spellLevel
        label: 法術環階
        choices:
          - { value: 0, label: 戲法, rarity: common, saveDc: 13, attackBonus: 5 }
          - { value: 1, label: "1環", rarity: common, saveDc: 13, attackBonus: 5 }
          - { value: 2, label: "2環", rarity: uncommon, saveDc: 13, attackBonus: 5 }
          - { value: 3, label: "3環", rarity: uncommon, saveDc: 15, attackBonus: 7 }
          - { value: 4, label: "4環", rarity: rare, saveDc: 15, attackBonus: 7 }
          - { value: 5, label: "5環", rarity: rare, saveDc: 17, attackBonus: 9 }
          - { value: 6, label: "6環", rarity: very-rare, saveDc: 17, attackBonus: 9 }
          - { value: 7, label: "7環", rarity: very-rare, saveDc: 18, attackBonus: 10 }
          - { value: 8, label: "8環", rarity: very-rare, saveDc: 18, attackBonus: 10 }
          - { value: 9, label: "9環", rarity: legendary, saveDc: 19, attackBonus: 11 }
    consumable: true
    text: |-
      _法術卷軸_上寫有單一法術的文字，以神秘的密碼書寫。若該法術在你的法術列表上，你可以閱讀卷軸並施放其法術，不需要材料成分。否則，卷軸無法辨讀。藉由閱讀卷軸來施放法術，需要該法術的一般施法時間。法術施放完畢後，卷軸化為塵土。若施法被打斷，卷軸不會消失。

      若該法術在你的法術列表上，但環階高於你通常能施放的環階，你要使用你的施法屬性進行一次屬性檢定，以判定你是否成功施放該法術。DC等於10加上該法術的環階。檢定失敗時，該法術從卷軸上消失，沒有其他效果。

      卷軸上法術的環階決定了該法術的豁免DC與攻擊加值，以及卷軸的稀有度，如下表所示。

      | 法術環階 | 稀有度 | 豁免DC | 攻擊加值 |
      | --- | --- | --- | --- |
      | 戲法 | 常見 | 13 | +5 |
      | 1 | 常見 | 13 | +5 |
      | 2 | 非常見 | 13 | +5 |
      | 3 | 非常見 | 15 | +7 |
      | 4 | 稀有 | 15 | +7 |
      | 5 | 稀有 | 17 | +9 |
      | 6 | 極稀有 | 17 | +9 |
      | 7 | 極稀有 | 18 | +10 |
      | 8 | 極稀有 | 18 | +10 |
      | 9 | 傳說 | 19 | +11 |

      _將卷軸抄入法術書。_ _法術卷軸_上的法師法術可以抄入法術書。以這種方式抄寫法術時，抄寫者必須成功通過DC等於10加上該法術環階的智力（奧秘）檢定。檢定成功時，法術被抄寫下來。無論檢定成功或失敗，_法術卷軸_都會被摧毀。
  - id: sphere-of-annihilation
    name: 湮滅法球
    nameEn: "Sphere of Annihilation"
    source: srd
    category: wondrous
    group: curio
    rarity: legendary
    attunement: false
    text: |-
      這顆直徑2呎的黑色球體是多元宇宙中的一個洞，懸停在空間中，並由環繞它的魔法力場穩定住。

      球體會抹除它穿過的所有物質，以及穿過它的所有物質。神器是例外。除非神器易受_湮滅法球_的傷害，否則它會毫髮無傷地穿過球體。任何其他接觸球體但未被它完全吞沒並抹除的東西，會受到8d10力場傷害。

      _控制法球。_ _湮滅法球_在有人掌控它之前是靜止不動的。若你在法球60呎內，你可以進行魔法動作，進行一次DC 25的智力（奧秘）檢定。檢定成功時，你控制法球直到你下個回合開始為止；若它原本在另一個生物的控制之下，該生物就失去對法球的控制。檢定失敗時，法球會沿直線朝你移動10呎。

      掌控法球期間，你可以進行附贈動作使它朝你選擇的一個方向移動，距離最多為你智力調整值的5倍呎數（最少5呎）。法球進入其空間的任何生物，必須成功通過DC 19的敏捷豁免，否則會被它觸及，受到8d10力場傷害。因此傷害而降至0點生命值的生物會被抹除，留下它的財物，但沒有其他任何實體遺骸。

      _法球互動。_ 若法球與位面傳送門（例如_異界之門_法術所創造的傳送門）或異次元空間（例如_便攜式次元洞_內的空間）接觸，DM使用下表隨機決定發生什麼事。

      | 1d100 | 結果 |
      | --- | --- |
      | 01–50 | 法球被摧毀。 |
      | 51–85 | 法球穿過傳送門或進入異次元空間。 |
      | 86–00 | 空間裂隙將法球，以及法球180呎內的每個生物與物體，送往一個隨機的位面。 |
  - id: staff-of-charming
    name: 魅惑法杖
    nameEn: "Staff of Charming"
    source: srd
    category: staff
    rarity: rare
    attunement: "由吟遊詩人、牧師、德魯伊、術士、契術師或法師"
    base: { fixed: 長棍 }
    text: |-
      這根法杖有10次充能。手持法杖時，你可以使用它的任一特性：

      **施放法術。** 你可以消耗法杖的1次充能，使用你的法術豁免DC從法杖施放_魅惑人類_、_命令術_或_通曉語言_。

      **反射惑控。** 若你對僅以你為目標的惑控法術豁免成功，你可以進行反應動作並消耗法杖的1次充能，讓該法術如同由你施放一般反彈回其施法者身上。

      **抵抗惑控。** 若你對僅以你為目標的惑控法術豁免失敗，你可以將失敗的豁免轉為成功。直到下次黎明前，你無法再次使用法杖的這項特性。

      _恢復充能。_ 法杖每天黎明恢復1d8 + 2次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，法杖化為塵土並被摧毀。
