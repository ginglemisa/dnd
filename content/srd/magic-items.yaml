      _恢復充能。_ 法杖每天黎明恢復1d6次已消耗的充能。若你消耗最後一次充能，擲1d20。擲出1時，法杖失去其特性，變成非魔法長棍。
  - id: staff-of-thunder-and-lightning
    name: 雷霆法杖
    nameEn: "Staff of Thunder and Lightning"
    source: srd
    category: staff
    rarity: very-rare
    attunement: true
    base: { fixed: 長棍 }
    effects: { attack: 2, damage: 2 }
    text: |-
      這根法杖可以當作魔法長棍揮舞，使用它進行的攻擊檢定與傷害擲骰獲得+2加值。它還具有下列額外特性。這些特性中的任一項使用後，直到下次黎明前都無法再次使用。

      _閃電。_ 當你使用法杖進行近戰攻擊命中時，你可以使目標額外受到2d6閃電傷害（不需動作）。

      _雷鳴。_ 當你使用法杖進行近戰攻擊命中時，你可以使法杖發出一聲雷鳴般的巨響，在300呎內都聽得見（不需動作）。你命中的目標必須成功通過DC 17的體質豁免，否則陷入震懾狀態，直到你的下個回合結束。

      **_雷鳴與閃電。_** 在你使用法杖進行近戰攻擊命中之後，你可以立即進行附贈動作，同時使用閃電與雷鳴特性（見上方）。這麼做不會消耗那些特性的每日使用次數，只會消耗這項特性的使用次數。

      _閃電打擊。_ 你可以進行魔法動作，使一道閃電從法杖尖端躍出，形成一條寬5呎、長120呎的直線。該直線上的每個生物進行一次DC 17的敏捷豁免，失敗者受到9d6閃電傷害，成功者受到一半傷害。

      _雷鳴爆響。_ 你可以進行魔法動作，使法杖發出一聲在600呎內都聽得見的雷鳴爆響。以你為起點的60呎發散區域內的每個生物進行一次DC 17的體質豁免。豁免失敗時，生物受到2d6雷鳴傷害，並陷入耳聾狀態1分鐘。豁免成功時，生物僅受到一半傷害。
  - id: staff-of-withering
    name: 凋零法杖
    nameEn: "Staff of Withering"
