# yaml-language-server: $schema=../../schema/subclass.schema.json
id: berserker
class: barbarian
name: 狂戰士道途
shortName: 狂戰
features:
  - id: barbarian-frenzy
    level: 3
    name: 狂怒
    actions:
      - mode: action
        key: dynamic-action-barbarian-ekb4kt
    text: |
      你在狂暴中使用魯莽攻擊，且用力量攻擊命中本回合第一個目標時，可造成額外傷害。

      - **額外傷害：**{frenzyDice|若干 d6}，骰數等於狂暴傷害加值。
      - **傷害類型：**與該次攻擊相同。
  - id: barbarian-mindless-rage
    level: 6
    name: 無我狂暴
    hint: {panels: [overview]}
    summary: 狂暴期間，你免疫魅惑與恐慌狀態；進入狂暴時，若你正處於其中一種狀態，該狀態立即終止。
    text: |
      狂暴期間，你**免疫**[[魅惑]]與[[恐慌]]狀態。

      - **進入狂暴時：**若你正處於其中一種狀態，該狀態立即終止。
srd:
  title: "野蠻人子職：狂戰士道途 Path of the Berserker"
  intro: |
    _化狂暴為暴烈怒火_

    走上狂戰士道途的野蠻人，主要把狂暴宣洩在暴力上。這條道途充滿毫無節制的怒火；他們任由狂暴攫住自己、為自己灌注力量，並在戰鬥的混亂中亢奮不已。
  features:
    - level: 3
      name: "狂怒 Frenzy"
      text: |
        若你在狂暴期間使用魯莽攻擊，該回合中你以力量進行的攻擊所命中的第一個目標，會受到額外傷害。額外傷害的算法：擲與你狂暴傷害加值相同數量的 d6，將點數加總。這份傷害的類型與該次攻擊使用的武器或徒手打擊相同。
    - level: 6
      name: "無我狂暴 Mindless Rage"
      text: |
        狂暴期間，你免疫魅惑與恐慌狀態。若你進入狂暴時正陷入魅惑或恐慌狀態，你身上的該狀態隨之結束。
    - level: 10
      name: "報復 Retaliation"
      text: |
        當你受到 5 呎內某個生物造成的傷害時，你可以用反應動作對該生物進行一次近戰攻擊，攻擊時使用武器或徒手打擊。
    - level: 14
      name: "懾人氣勢 Intimidating Presence"
      text: |
        你可以用附贈動作，以懾人的氣勢與原初力量讓他人心生恐懼。這麼做時，以你為中心的 30 呎發散區域內，由你選擇的每個生物都必須進行感知豁免（DC 等於 8 加上你的力量調整值與熟練加值）。豁免失敗的生物陷入恐慌狀態 1 分鐘。陷入恐慌的生物在它自己的每個回合結束時重複這次豁免，成功就結束它身上的這個效果。

        使用這項特性後，你必須完成長休才能再次使用，除非你消耗 1 次狂暴使用次數（不需要動作）來恢復這項特性的使用次數。
