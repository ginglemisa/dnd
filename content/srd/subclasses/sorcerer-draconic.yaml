# yaml-language-server: $schema=../../schema/subclass.schema.json
id: draconic
class: sorcerer
name: 龍族術法
shortName: 龍族
features:
  - id: sorcerer-draconic-resilience
    level: 3
    name: 龍族體魄
    text: |
      你的皮膚浮現龍鱗特徵，並獲得以下增益：

      - **生命值：**生命值上限提高 3，此後每提升 1 級術士，再提高 1。
      - **護甲等級：**未穿護甲時，AC 為「10＋敏捷調整值＋魅力調整值」。
  - id: sorcerer-draconic-spells
    level: 3
    name: 龍族法術
    spells:
      - id: chromatic-orb
      - id: command
      - id: alter-self
      - id: dragons-breath
      - id: fear
        level: 5
      - id: fly
        level: 5
      - id: arcane-eye
        level: 7
      - id: charm-monster
        level: 7
    text: |
      達到下列術士等級後，你始終準備對應法術：

      - **3 級：**變造自身、繁彩球、命令術、龍息術。
      - **5 級：**恐懼術、飛行術。
      - **7 級：**秘法眼、魅惑怪物。
  - id: sorcerer-elemental-affinity
    level: 6
    name: 元素親和
    choiceName: 元素親和傷害類型
    text: |
      選擇一種傷害類型：強酸、冷凍、火焰、閃電或毒素。
    select:
      id: sorcerer-elemental-affinity-damage-type
      placeholder: --請選擇傷害類型--
      choices:
        - {value: acid, name: 強酸}
        - {value: cold, name: 冷凍}
        - {value: fire, name: 火焰}
        - {value: lightning, name: 閃電}
        - {value: poison, name: 毒素}
      text: |
        **傷害抗性：**你對所選傷害類型具有[[抗性]]。

        **傷害加值：**施放造成該類型傷害的法術時，可將魅力調整值加到該法術的**一次傷害擲骰**中。
srd:
  title: 術士子職：龍族術法
  intro: |
    _吐納龍的魔力_

    你天生的魔力來自龍的餽贈。或許有一條面臨死亡的古龍，把自身的一部分魔法力量遺贈給你或你的祖先。你可能從某個地方吸收了魔力，而那裡灌注著龍的力量。又或許，你曾經手一件取自龍的寶藏、浸染著龍族力量的財寶。也可能，你有一位祖先就是龍。
  features:
    - level: 3
      name: 龍族體魄
      text: |
        你體內的魔力，讓你的身體顯現出龍族餽贈的特徵。你的生命值上限提高 3；每當你再提升一個術士等級，生命值上限就提高 1。

        你身上的某些部位也覆蓋著龍鱗般的鱗片。你沒穿護甲時，基礎護甲等級（AC）等於 10 加上你的敏捷調整值與魅力調整值。
    - level: 3
      name: 龍族法術
      text: |
        你達到「龍族法術」表中指定的術士等級後，從此始終準備著表中該等級列出的法術。

        **龍族法術**

        | 術士等級 | 法術 |
        | --- | --- |
        | 3 | 變造自身、繁彩球、命令術、龍息術 |
        | 5 | 恐懼術、飛行術 |
        | 7 | 秘法眼、魅惑怪物 |
        | 9 | 通曉傳奇、龍族召喚術 |
    - level: 6
      name: 元素親和
      text: |
        你的龍族魔力，對一種與龍相關的傷害類型具有親和力。從這些傷害類型中選擇一種：強酸、冷凍、火焰、閃電或毒素。

        你對這種傷害類型具有抗性；你施放會造成這種類型傷害的法術時，可以把你的魅力調整值加到這個法術的一次傷害擲骰上。
    - level: 14
      name: 龍族之翼
      text: |
        你可以用附贈動作，讓龍翼出現在你的背上。龍翼持續 1 小時，或直到你解除龍翼為止（不需要動作）。在持續時間內，你有 60 呎的飛行速度。

        使用這項特性後，你必須完成長休才能再次使用，除非你消耗 3 點術法點（不需要動作）來恢復這項特性的使用次數。
    - level: 18
      name: 與龍同行
      text: |
        你可以不用材料成分施放_龍族召喚術_。你也可以不用法術位施放這個法術一次；完成長休時，你恢復這樣施放的能力。

        每當你開始施放這個法術，可以修改它，讓它不需要專注。如果你這麼做，這次施放的法術持續時間變成 1 分鐘。
