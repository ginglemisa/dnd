# yaml-language-server: $schema=../../schema/subclass.schema.json
id: evoker
class: wizard
name: 塑能師
shortName: 塑能
features:
  - id: wizard-evocation-savant
    level: 3
    name: 塑能學者
    picks:
      - { kind: spellbookSpell, count: 2, from: any, school: evocation, maxLevel: 2 }
    text: |
      選擇 2 個不高於 2 環的塑能學派法師法術，免費加入法術書。

      之後每次首次獲得更高環階的法術位時，可再免費加入 1 個不高於該環階的塑能學派法師法術。
  - id: wizard-potent-cantrip
    level: 3
    name: 強力戲法
    actions:
      - mode: action
        key: dynamic-action-wizard-curated-potent-cantrip
    text: |
      對生物施放傷害戲法時，即使**攻擊未命中或目標豁免成功**，目標仍受到一半傷害，但不受該戲法的其他效果影響。
  - id: wizard-sculpt-spells
    level: 6
    name: 法術塑形
    actions:
      - mode: action
        key: dynamic-action-wizard-curated-sculpt-spells
    text: |
      施放會影響其他可見生物的塑能學派法術時，可從這些生物中選擇最多**「法術環階＋1」名**。

      這些生物對該法術的豁免自動成功，且不承受豁免成功時原本仍會受到的傷害。
srd:
  title: "法師子職：塑能師 Evoker"
  intro: |
    _創造爆裂的元素效果_

    你的研究著重於能創造強大元素效果的魔法，例如刺骨的嚴寒、灼熱的烈焰、滾滾的雷鳴、劈啪作響的閃電，以及燒蝕的強酸。有些塑能師受雇於軍隊，充當火砲，從遠處轟擊大軍。另一些塑能師用自己的力量保護他人，還有一些則為自己謀利。
  features:
    - level: 3
      name: "塑能學者 Evocation Savant"
      text: |
        選擇兩個塑能學派的法師法術，每個法術都不能高於 2 環，並把它們免費加入你的法術書。

        此外，每當你在本職業取得新環階的法術位，可以把一個塑能學派的法師法術免費加入你的法術書。所選法術的環階，必須是你有法術位的環階。
    - level: 3
      name: "強力戲法 Potent Cantrip"
      text: |
        你那些會造成傷害的戲法，就連避開了效果主要衝擊的生物也會受到影響。你對一個生物施放戲法時，如果你的攻擊檢定未命中，或目標成功通過對抗這個戲法的豁免，目標會受到這個戲法一半的傷害（如果有），但不受這個戲法的其他效果影響。
    - level: 6
      name: "法術塑形 Sculpt Spells"
      text: |
        你可以在自己塑能法術的效果中，創造出一些相對安全的空隙。你施放塑能法術時，如果它會影響你看得見的其他生物，可以從這些生物中選擇若干個，數量最多等於 1 加上這個法術的環階。被選中的生物對抗這個法術的豁免自動成功，而且如果它們原本在豁免成功時會受到一半傷害，就不受傷害。
    - level: 10
      name: "強效塑能 Empowered Evocation"
      text: |
        每當你施放塑能學派的法師法術，可以把你的智力調整值加到這個法術的一次傷害擲骰上。
    - level: 14
      name: "雷霆萬鈞 Overchannel"
      text: |
        你可以提高自己法術的威力。你用 1 到 5 環的法術位施放會造成傷害的法師法術時，可以在施放這個法術的那個回合，用它造成最大傷害。

        你第一次這麼做時，不會受到不良影響。如果你在完成長休前再次使用這項特性，那麼施放這個法術後，所用法術位每有一環，你就立刻受到 2d12 黯蝕傷害。這個傷害無視抗性與免疫。

        在完成長休前，你每再使用一次這項特性，每個法術環階的黯蝕傷害就增加 1d12。
