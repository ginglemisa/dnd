# yaml-language-server: $schema=../../schema/subclass.schema.json
id: land
class: druid
name: 大地結社
shortName: 大地
features:
  - id: druid-circle-of-the-land-spells
    level: 3
    name: 大地結社法術
    spellsByChoice:
      control: druid-land
      choices:
        - value: arid
          name: 旱地
          spells:
            - id: fire-bolt
            - id: burning-hands
            - id: blur
            - id: fireball
              level: 5
            - id: blight
              level: 7
        - value: polar
          name: 極地
          spells:
            - id: ray-of-frost
            - id: fog-cloud
            - id: hold-person
            - id: sleet-storm
              level: 5
            - id: ice-storm
              level: 7
        - value: temperate
          name: 溫帶
          spells:
            - id: shocking-grasp
            - id: sleep
            - id: misty-step
            - id: lightning-bolt
              level: 5
            - id: freedom-of-movement
              level: 7
        - value: tropical
          name: 熱帶
          spells:
            - id: acid-splash
            - id: ray-of-sickness
            - id: web
            - id: stinking-cloud
              level: 5
            - id: polymorph
              level: 7
    text: |
      - **選擇地貌：**每次長休後，從旱地、極地、溫帶或熱帶中選擇 1 種地貌。
      - **始終準備：**你始終準備所選地貌對應、且目前德魯伊等級可用的法術，詳見下表。

      | 地貌 | 等級 3 | 等級 5 | 等級 7 |
      | --- | --- | --- | --- |
      | 旱地 | 朦朧術、燃燒之手、火焰箭 | 火球術 | 枯萎術 |
      | 極地 | 雲霧術、人類定身術、冷凍射線 | 雪雨暴 | 冰風暴 |
      | 溫帶 | 迷蹤步、電爪、睡眠術 | 閃電束 | 行動自如 |
      | 熱帶 | 酸液飛濺、致病射線、蛛網術 | 臭雲術 | 變形術 |
    tables:
      - label: 大地結社地貌法術
        style: druid-terrain-spells
        kind: reference
        rowHeaders: true
        cellLabels: [等級 3, 等級 5, 等級 7]
  - id: druid-lands-aid
    level: 3
    name: 大地之援
    actions:
      - mode: action
        key: dynamic-action-class-lands-aid
        druidOperation: aid
    text: |
      以**魔法動作**消耗 1 次荒野形態，在 60 呎內選一點，產生 10 呎球形花荊區域。

      - **傷害：**區域內你指定的每個生物進行體質豁免，對抗你的法術豁免 DC；失敗時受到 2d6 黯蝕傷害，成功時傷害減半。
      - **治療：**同時可指定區域內 1 名生物恢復 2d6 生命值。
      - **等級提升：**傷害與治療在德魯伊 10 級時提升為 3d6，14 級時提升為 4d6。
  - id: druid-natural-recovery
    level: 6
    name: 自然恢復
    resource:
      key: druid-natural-recovery-spell-slots
      label: 自然恢復（法術位）
      uses: 1
      recover: {long: all}
      restChoice: {when: shortRest, restores: spellSlots, budget: naturalRecoveryBudget, maxSlotLevel: 5}
      note: 完成短休時，可恢復環階總和 {naturalRecoveryBudget} 的已消耗法術位（德魯伊等級一半，進位；每個法術位須低於 6 環）。每次長休前只能使用 1 次；完成長休後恢復。
    text: |
      - **免費施法：**可不消耗法術位，施放 1 次透過「大地結社法術」準備的 1 環以上法術。使用後，須完成長休才能再次使用。
      - **短休恢復：**完成短休時，可恢復部分已消耗的法術位，環階總和等於德魯伊等級的一半（無條件進位），單一法術位最高為 5 環。使用後，須完成長休才能再次恢復法術位。
srd:
  title: 德魯伊子職：大地結社
  intro: |
    _頌揚自然羈絆_

    大地結社由神祕主義者與賢者組成，他們守護著古老的知識與儀式。這些德魯伊在樹木或立石圍成的神聖圓環中聚會，以德魯伊語低聲傳述原初的祕密。結社中最睿智的成員，會擔任所屬社群的首席祭司。
  features:
    - level: 3
      name: 大地結社法術
      text: |
        每當你完成長休，就從旱地、極地、溫帶或熱帶中選擇一種地貌。查閱下方與所選地貌對應的表格，你準備著表中列在你德魯伊等級及更低等級的法術。

        **旱地**

        | 德魯伊等級 | 結社法術 |
        | --- | --- |
        | 3 | 朦朧術、燃燒之手、火焰箭 |
        | 5 | 火球術 |
        | 7 | 枯萎術 |
        | 9 | 石牆術 |

        **極地**

        | 德魯伊等級 | 結社法術 |
        | --- | --- |
        | 3 | 雲霧術、人類定身術、冷凍射線 |
        | 5 | 雪雨暴 |
        | 7 | 冰風暴 |
        | 9 | 寒冰錐 |

        **溫帶**

        | 德魯伊等級 | 結社法術 |
        | --- | --- |
        | 3 | 迷蹤步、電爪、睡眠術 |
        | 5 | 閃電束 |
        | 7 | 行動自如 |
        | 9 | 樹躍術 |

        **熱帶**

        | 德魯伊等級 | 結社法術 |
        | --- | --- |
        | 3 | 酸液飛濺、致病射線、蛛網術 |
        | 5 | 臭雲術 |
        | 7 | 變形術 |
        | 9 | 疫病蟲群 |
    - level: 3
      name: 大地之援
      text: |
        你可以用魔法動作消耗 1 次荒野形態使用次數，並選擇你 60 呎內的一點。賦予活力的花朵與吸取生命的荊棘，會在以該點為中心、半徑 10 呎的球形區域內短暫出現。球形區域內由你選擇的每個生物都必須進行體質豁免，對抗你的法術豁免 DC；豁免失敗時受到 2d6 黯蝕傷害，成功時傷害減半。該區域內由你選擇的一個生物恢復 2d6 生命值。

        你的德魯伊等級達到 10 級（3d6）與 14 級（4d6）時，傷害與治療各增加 1d6。
    - level: 6
      name: 自然恢復
      text: |
        你可以不消耗法術位，施放一個透過「大地結社法術」特性準備的 1 環以上法術；之後你必須完成長休，才能再次這樣做。

        此外，你完成短休時，可以選擇恢復一些已消耗的法術位。這些法術位的環階總和必須等於或小於你德魯伊等級的一半（無條件進位），而且其中不能有 6 環以上的法術位。例如，如果你是 6 級德魯伊，最多可以恢復環階總和為 3 的法術位：你可以恢復一個 3 環法術位，或一個 2 環與一個 1 環法術位，或三個 1 環法術位。用這項特性恢復法術位後，你必須完成長休才能再次這樣做。
    - level: 10
      name: 自然守護
      text: |
        你免疫中毒狀態，並對一種傷害類型具有抗性。這種傷害類型取決於你目前在「大地結社法術」特性中選擇的地貌，對應關係見「自然守護」表。

        **自然守護**

        | 地貌 | 抗性 | 地貌 | 抗性 |
        | --- | --- | --- | --- |
        | 旱地 | 火焰 | 溫帶 | 閃電 |
        | 極地 | 冷凍 | 熱帶 | 毒素 |
    - level: 14
      name: 自然聖域
      text: |
        你可以用魔法動作消耗 1 次荒野形態使用次數，讓幽靈般的樹木與藤蔓，出現在你 120 呎內地面上的一個 15 呎立方體中。它們會在那裡持續 1 分鐘，或直到你陷入失能狀態或死亡為止。你和你的盟友在該區域內時具有半掩蔽；你的盟友在那裡時，也會獲得你「自然守護」目前提供的抗性。

        你可以用附贈動作，把這個立方體移動最多 60 呎，移到你 120 呎內的地面上。
