# yaml-language-server: $schema=../../schema/subclass.schema.json
id: devotion
class: paladin
name: 奉獻之誓
shortName: 奉獻
features:
  - id: paladin-oath-of-devotion-spells
    level: 3
    name: 奉獻之誓法術
    spells:
      - id: protection-from-evil-and-good
      - id: shield-of-faith
      - id: aid
        level: 5
      - id: zone-of-truth
        level: 5
    text: |
      達到下列聖騎士等級後，你始終準備對應法術：

      - **3 級：**防護善惡、虔誠護盾。
      - **5 級：**援助術、誠實之域。
  - id: paladin-sacred-weapon
    level: 3
    name: 祝聖武器
    actions:
      - mode: action
        key: dynamic-action-paladin-curated-sacred-weapon
        legacyKeys: [dynamic-action-class-sacred-weapon]
        resource: paladin-channel-divinity
    text: |
      執行**攻擊動作**時，可消耗 1 次引導神力，為手上一把近戰武器注入神聖力量，持續 10 分鐘，或直到你再次使用本特性。期間獲得以下效果：

      - **攻擊加值：**該武器攻擊檢定加上你的魅力調整值（至少 +1）。
      - **傷害類型：**命中時可選擇造成原本傷害類型或光耀傷害。
      - **光照：**武器發出半徑 20 呎的明亮光照，再往外 20 呎為微光。

      **提前結束：**你可隨時結束效果，**無需動作**；若不再攜帶該武器，效果也會結束。
  - id: paladin-aura-of-devotion
    level: 7
    name: 奉獻靈氣
    text: |
      你的守護靈氣使你和其中的盟友**免疫**[[魅惑]]狀態。

      - **已受魅惑：**若正被[[魅惑]]的盟友進入靈氣範圍，該狀態會暫時失效。
srd:
  title: "聖騎士子職：奉獻之誓 Oath of Devotion"
  intro: |
    _堅守正義與秩序的理想_

    奉獻之誓約束聖騎士恪守正義與秩序的理想。這些聖騎士正是身披閃亮盔甲的騎士典型。他們以最高的行為準則要求自己，其中有些人——不論是好是壞——也拿同樣的準則要求世上其他人。

    許多立下這個誓言的人獻身於守序與善良的神祇，並以這些神祇的信條作為衡量自身奉獻的尺度。另一些人則把天使奉為理想，把天使羽翼的圖樣融入自己的頭盔或紋章。

    這些聖騎士共同奉行下列信條：

    - 說出口的話，就是你的承諾。
    - 保護弱者，絕不害怕採取行動。
    - 讓你高尚的作為成為榜樣。
  features:
    - level: 3
      name: "奉獻之誓法術 Oath of Devotion Spells"
      text: |
        你誓言的魔力，確保你始終備妥某些法術；你達到「奉獻之誓法術」表中指定的聖騎士等級後，從此始終準備著表中該等級列出的法術。

        **奉獻之誓法術 Oath of Devotion Spells**

        | 聖騎士等級 | 法術 |
        | --- | --- |
        | 3 | 防護善惡、虔誠護盾 |
        | 5 | 援助術、誠實之域 |
        | 9 | 希望信標、解除魔法 |
        | 13 | 行動自如、信仰守衛 |
        | 17 | 通神術、焰擊術 |
    - level: 3
      name: "祝聖武器 Sacred Weapon"
      text: |
        你執行攻擊動作時，可以消耗 1 次引導神力使用次數，為你握著的一把近戰武器注入正能量。在 10 分鐘內，或直到你再次使用這項特性為止，你用這把武器進行的攻擊檢定都加上你的魅力調整值（加值至少 +1）；每次用它命中時，由你決定它造成的是原本的傷害類型，還是光耀傷害。

        這把武器還會發出半徑 20 呎的明亮光照，並再往外 20 呎發出微光光照。

        你可以提早結束這個效果（不需要動作）。如果你沒有攜帶這把武器，這個效果也會結束。
    - level: 7
      name: "奉獻靈氣 Aura of Devotion"
      text: |
        你和你的盟友在你的守護靈氣內時，免疫魅惑狀態。如果陷入魅惑狀態的盟友進入靈氣，只要它待在靈氣內，這個狀態就對它沒有效果。
    - level: 15
      name: "護佑斬技 Smite of Protection"
      text: |
        你的魔法斬擊現在會散發保護能量。每當你施放_至聖斬_，你和你的盟友在你的守護靈氣內時具有半掩蔽。靈氣會保有這項好處，直到你的下個回合開始為止。
    - level: 20
      name: "聖潔光輪 Holy Nimbus"
      text: |
        你可以用附贈動作為你的守護靈氣注入聖潔的力量，帶來下列好處。這些好處持續 10 分鐘，或直到你結束它們為止（不需要動作）。使用這項特性後，你必須完成長休才能再次使用。你也可以消耗一個 5 環法術位（不需要動作），恢復這項特性的使用次數。

        _聖潔守護 Holy Ward。_ 邪魔或不死生物迫使你進行的任何豁免，都具有優勢。

        _光耀傷害 Radiant Damage。_ 每當一個敵人在靈氣內開始它的回合，該生物受到光耀傷害，數值等於你的魅力調整值加上你的熟練加值。

        _陽光 Sunlight。_ 靈氣內充滿明亮光照，這道光是陽光。
