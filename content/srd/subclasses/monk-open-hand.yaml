# yaml-language-server: $schema=../../schema/subclass.schema.json
id: open-hand
class: monk
name: 散打鬥士
shortName: 散打
features:
  - id: monk-open-hand-technique
    level: 3
    name: 散打技巧
    text: |
      你用「疾風連擊」命中時，可使目標承受下列 1 種效果。

      - **截擊：**到目標的下回合開始前，目標不能發動[[藉機攻擊]]。
      - **擊退：**目標力量豁免失敗時，被推離你最多 15 呎。
      - **擊倒：**目標敏捷豁免失敗時[[倒地]]。
  - id: monk-wholeness-of-body
    level: 6
    name: 混元體
    resource:
      key: monk-wholeness
      uses: wholenessUses
      recover: {long: all}
    actions:
      - mode: bonus
        key: dynamic-bonus-monk-curated-wholeness-of-body
        legacyKeys: [dynamic-bonus-class-3mzm48]
        resource: monk-wholeness
    text: |
      你可以用**附贈**擲武藝骰，恢復等同{wholenessHealing|「擲骰結果＋感知調整值」}的生命值（至少 1 點）。

      - **使用次數：**等同感知調整值（至少 1 次），**長休後全部恢復**。
srd:
  title: "武僧子職：散打鬥士 Warrior of the Open Hand"
  intro: |
    _掌握徒手戰鬥技巧_

    散打鬥士是徒手戰鬥的大師。他們學習各種技巧，用來推開、絆倒對手，並操控自身的能量，保護自己不受傷害。
  features:
    - level: 3
      name: "散打技巧 Open Hand Technique"
      text: |
        每當你用疾風連擊給予的攻擊命中生物，都可以對這個目標施加下列其中一種效果。

        **截擊 Addle。** 目標直到它自己的下個回合開始前，都無法進行藉機攻擊。

        **擊退 Push。** 目標必須成功通過力量豁免，否則會被推離你最多 15 呎。

        **擊倒 Topple。** 目標必須成功通過敏捷豁免，否則陷入倒地狀態。
    - level: 6
      name: "混元體 Wholeness of Body"
      text: |
        你獲得治療自己的能力。你可以用附贈動作擲武藝骰，恢復的生命值等於擲出的數字加上你的感知調整值（至少恢復 1 點生命值）。

        你可以使用這項特性的次數等於你的感知調整值（至少 1 次）；完成長休時，你恢復所有已消耗的使用次數。
    - level: 11
      name: "流雲步 Fleet Step"
      text: |
        你執行疾步如風以外的附贈動作時，還可以在那個附贈動作之後立刻使用疾步如風。
    - level: 17
      name: "震顫掌 Quivering Palm"
      text: |
        你獲得在他人體內引發致命震動的能力。你用徒手打擊命中生物時，可以消耗 4 點專注點，啟動這種察覺不到的震動；震動持續的天數等於你的武僧等級。除非你用一個動作結束震動，否則震動是無害的。或者，你在自己的回合執行攻擊動作時，可以放棄其中一次攻擊來結束震動。要結束震動，你和目標必須位於同一個位面。你結束震動時，目標必須進行體質豁免，豁免失敗時受到 10d12 力場傷害，成功時傷害減半。

        同一時間，你只能讓一個生物受這項特性影響。你可以無害地結束震動（不需要動作）。
