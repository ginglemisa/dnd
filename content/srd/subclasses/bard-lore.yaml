# yaml-language-server: $schema=../../schema/subclass.schema.json
id: lore
class: bard
name: 逸聞學院
shortName: 逸聞
features:
  - id: bard-bonus-proficiencies
    level: 3
    name: 額外熟練項
    picks:
      - { kind: skill, count: 3, from: any }
    text: |
      你獲得 3 項自選技能的熟練。
  - id: bard-cutting-words
    level: 3
    name: 語出驚人
    actions:
      - mode: reaction
        key: dynamic-reaction-class-1y0uv3b
        resource: bard-inspiration
    text: |
      離你 60 呎內看得到的生物做了下面其中一件事時，你可以出言打亂它：

      - 擲傷害骰。
      - 能力檢定或攻擊檢定成功。

      擲一顆激勵骰，從它的擲骰結果扣掉點數，藉此減少傷害，或讓成功變失敗。

      - **動作類型：**反應（對方擲完骰後才決定）。
      - **消耗：**1 次吟遊詩人激勵。
  - id: bard-magical-discoveries
    level: 6
    name: 魔法發現
    mount: { id: bard-magical-discoveries, label: 魔法發現法術選擇 }
    text: |
      你從牧師、德魯伊或法師法術列表中選擇並學會 2 個法術，兩者可以來自不同列表。

      - **選擇條件：**所選法術必須是戲法，或是你已有對應法術位的法術。
      - **始終準備：**你始終準備所選法術。
      - **升級替換：**每提升 1 級吟遊詩人，可將其中 1 個換成另一個符合條件的法術。

srd:
  title: "吟遊詩人子職：逸聞學院 College of Lore"
  intro: |
    _深究魔法學識_

    逸聞學院的吟遊詩人從各種來源蒐集法術與祕密，例如學術典籍、神祕儀式與鄉野故事。學院成員會在圖書館和大學聚會，彼此分享學識。他們也會在節慶或國事場合碰面，在那裡揭發腐敗、拆穿謊言，並嘲弄自命不凡的掌權人物。
  features:
    - level: 3
      name: "額外熟練項 Bonus Proficiencies"
      text: |
        你獲得 3 項自選技能的熟練。
    - level: 3
      name: "語出驚人 Cutting Words"
      text: |
        你學會運用機智，以超自然的方式讓他人分心、困惑，或以其他方式削弱對方的自信與能力。當你 60 呎內一個你看得見的生物進行傷害擲骰，或在屬性檢定或攻擊檢定中成功時，你可以用反應動作消耗 1 次吟遊詩人激勵：擲你的吟遊詩人激勵骰，從該生物的擲骰結果中減去擲出的點數。這可以減少傷害，也可能讓成功變成失敗。
    - level: 6
      name: "魔法發現 Magical Discoveries"
      text: |
        你學會 2 個自選法術。這些法術可以來自牧師、德魯伊或法師法術列表，也可以任意混搭這些列表（各職業的法術列表見該職業的章節）。你選擇的法術必須是戲法，或是你有該環階法術位的法術（法術位見「吟遊詩人特性」表）。

        你始終準備著所選的法術。每當你提升一個吟遊詩人等級，可以將其中 1 個法術換成另一個符合上述條件的法術。
    - level: 14
      name: "無雙絕技 Peerless Skill"
      text: |
        你進行屬性檢定或攻擊檢定失敗時，可以消耗 1 次吟遊詩人激勵：擲吟遊詩人激勵骰，將擲出的點數加到 d20 上，可能讓失敗變成成功。如果結果仍然失敗，這次吟遊詩人激勵就不會被消耗。
