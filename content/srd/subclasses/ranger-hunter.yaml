# yaml-language-server: $schema=../../schema/subclass.schema.json
id: hunter
class: ranger
name: 獵人
shortName: 獵人
features:
  - id: ranger-hunters-lore
    level: 3
    name: 獵人學識
    actions:
      - mode: bonus
        key: dynamic-bonus-ranger-we5ttw
    text: |
      目標被你的「獵人印記」標記時，你會知道它的免疫、[[抗性]]與易傷。
  - id: ranger-hunters-prey
    level: 3
    name: 狩獵目標
    choose: 1
    changeOn: rest
    actions:
      - mode: action
        key: dynamic-action-ranger-vdr4tc
        selectedOptionOnly: true
    text: |
      從下列選項中選擇 1 項，**每次短休或長休後**可改選：
    options:
      - id: ranger-hunters-prey-colossus-slayer
        name: 斬殺者
        text: |
          **每回合 1 次**，你用武器命中先前已失去生命值的目標時，額外造成 1d8 傷害。
      - id: ranger-hunters-prey-horde-breaker
        name: 破陣者
        text: |
          **你的每個回合 1 次**，你用武器攻擊時，可用同一把武器再攻擊另一個生物。該生物必須在原目標 5 呎內、在武器射程內，且本回合尚未被你攻擊過。
  - id: ranger-defensive-tactics
    level: 7
    name: 防守戰術
    choose: 1
    changeOn: rest
    optionStyle: cards
    actions:
      - mode: action
        key: dynamic-action-ranger-p55ifk
    text: |
      從下列選項中選擇 1 項，**每次短休或長休後**可改選：
    options:
      - id: ranger-defensive-tactics-escape-the-horde
        name: 衝出重圍
        hint: {panels: [overview]}
        text: |
          以你為目標的[[藉機攻擊]]具有**劣勢**。
      - id: ranger-defensive-tactics-multiattack-defense
        name: 多重防禦
        hint: {panels: [overview]}
        text: |
          一個生物的攻擊檢定命中你時，該生物本回合內對你發動的後續攻擊檢定都具有**劣勢**。
srd:
  title: "遊俠子職：獵人 Hunter"
  intro: |
    _守護自然與世人免於毀滅_

    你在荒野和其他地方追獵獵物，運用你身為獵人的能力，守護自然與各地的人們，抵擋那些會毀滅他們的勢力。
  features:
    - level: 3
      name: "獵人學識 Hunter's Lore"
      text: |
        你可以呼喚自然的力量，揭露獵物的某些強項與弱點。生物被你的_獵人印記_標記期間，你知道它是否有任何免疫、抗性或易傷；如果有，你知道是哪些。
    - level: 3
      name: "狩獵目標 Hunter's Prey"
      text: |
        你從下列特性選項中自選一項獲得。每當你完成短休或長休，可以把所選的選項換成另一個。

        _斬殺者 Colossus Slayer。_ 你的頑強，連最堅韌的敵人也能拖垮。你用武器命中一個生物時，如果目標的生命值不是全滿，這把武器對它額外造成 1d8 傷害。這個額外傷害每回合只能造成一次。

        _破陣者 Horde Breaker。_ 你在自己的每個回合中有一次機會：用武器進行一次攻擊時，可以用同一把武器對另一個生物再進行一次攻擊。這個生物必須在原目標 5 呎內、在這把武器的射程內，而且是你這個回合還沒攻擊過的。
    - level: 7
      name: "防守戰術 Defensive Tactics"
      text: |
        你從下列特性選項中自選一項獲得。每當你完成短休或長休，可以把所選的選項換成另一個。

        _衝出重圍 Escape the Horde。_ 針對你的藉機攻擊具有劣勢。

        _多重防禦 Multiattack Defense。_ 一個生物用攻擊檢定命中你時，它這個回合對你進行的所有其他攻擊檢定都具有劣勢。
    - level: 11
      name: "卓越狩獵目標 Superior Hunter's Prey"
      text: |
        每回合一次，你對一個被你的_獵人印記_標記的生物造成傷害時，也可以對另一個生物造成這個法術的額外傷害；這個生物必須是你看得見的，而且在第一個生物 30 呎內。
    - level: 15
      name: "卓越狩獵防禦 Superior Hunter's Defense"
      text: |
        你受到傷害時，可以用反應動作，讓自己對這次傷害以及同類型的任何其他傷害具有抗性，直到當前回合結束為止。
