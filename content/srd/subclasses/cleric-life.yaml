# yaml-language-server: $schema=../../schema/subclass.schema.json
id: life
class: cleric
name: 生命領域
shortName: 生命
features:
  - id: cleric-life-domain-spells
    level: 3
    name: 生命領域法術
    spells:
      - id: bless
      - id: cure-wounds
      - id: aid
      - id: lesser-restoration
      - id: mass-healing-word
        level: 5
      - id: revivify
        level: 5
      - id: aura-of-life
        level: 7
      - id: death-ward
        level: 7
    text: |
      達到下列牧師等級後，你始終準備對應法術：

      - **3 級：**援助術、祝福術、療傷術、次級復原術。
      - **5 級：**群體治癒真言、回生術。
      - **7 級：**生命靈氣、防死結界。
  - id: cleric-disciple-of-life
    level: 3
    name: 生命門徒
    actions:
      - mode: action
        key: dynamic-action-cleric-1ocjvx6
    text: |
      使用**法術位**施放恢復生命值的法術時，目標在本回合額外恢復「2＋法術環階」生命值。
  - id: cleric-preserve-life
    level: 3
    name: 維持生命
    actions:
      - mode: action
        key: dynamic-action-cleric-aoatsu
        legacyKeys: [dynamic-action-class-preserve-life]
        resource: cleric-channel-divinity
    text: |
      以**魔法動作**展示聖徽並消耗 1 次引導神力，治療 30 呎內任意數量的重傷生物。

      - **治療總量：**共{preserveLifeTotal|「牧師等級 × 5」}點，可自由分配給這些生物。
      - **恢復上限：**不能使目標的生命值超過其生命值上限的一半。
  - id: cleric-blessed-healer
    level: 6
    name: 神佑醫者
    hint: {panels: [overview, spells, weapons]}
    text: |
      消耗法術位施放法術並恢復其他生物的生命值後，你立即恢復「2＋該法術位環階」生命值。
srd:
  title: "牧師子職：生命領域 Life Domain"
  intro: |
    _撫平世間傷痛_

    生命領域著重於正能量，這股能量協助維繫多元宇宙中的一切生命。汲取這個領域力量的牧師是治療的大師，他們運用這股生命力治癒種種傷痛。

    存在本身就仰賴與這個領域相關的正能量，因此幾乎任何宗教傳統的牧師都可能選擇這個領域。這個領域尤其與農業神祇、治療之神或堅忍之神，以及家園與社群之神有關。以治療為志業的宗教修會，也會追尋這個領域的魔法。
  features:
    - level: 3
      name: "生命門徒 Disciple of Life"
      text: |
        你使用法術位施放的法術為某個生物恢復生命值時，該生物在你施法的那個回合會額外恢復生命值。額外恢復的生命值等於 2 加上所用法術位的環階。
    - level: 3
      name: "生命領域法術 Life Domain Spells"
      text: |
        你與這個神聖領域的連結，確保你始終備妥某些法術。你達到「生命領域法術」表中指定的牧師等級後，從此始終準備著表中該等級列出的法術。

        **生命領域法術 Life Domain Spells**

        | 牧師等級 | 準備法術 |
        | --- | --- |
        | 3 | 援助術、祝福術、療傷術、次級復原術 |
        | 5 | 群體治癒真言、回生術 |
        | 7 | 生命靈氣、防死結界 |
        | 9 | 高等復原術、群體療傷術 |
    - level: 3
      name: "維持生命 Preserve Life"
      text: |
        你用魔法動作展示聖徽並消耗 1 次引導神力使用次數，喚出治療能量。這股能量可以恢復的生命值，總數等於你牧師等級的五倍。選擇你 30 呎內處於受創的生物（可以包括你自己），把這些生命值分配給所選的生物。透過這項特性，每個生物的生命值最多只能恢復到它生命值上限的一半。
    - level: 6
      name: "神佑醫者 Blessed Healer"
      text: |
        你對他人施放的治療法術，也會治療你自己。你使用法術位施放法術，為自己以外的一個或多個生物恢復生命值後，你立即恢復生命值，數值等於 2 加上所用法術位的環階。
    - level: 17
      name: "至高治療 Supreme Healing"
      text: |
        你用法術或引導神力為某個生物恢復生命值，原本需要擲一顆或多顆骰子時，這次治療不擲這些骰子，改為每顆骰子都取可能的最大點數。例如，原本你用法術為某個生物恢復 2d6 生命值，現在改為恢復 12 點。
