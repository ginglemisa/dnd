# yaml-language-server: $schema=../../schema/subclass.schema.json
id: fiend
class: warlock
name: 邪魔宗主
shortName: 邪魔
features:
  - id: warlock-dark-ones-blessing
    level: 3
    name: 黑暗之賜
    text: |
      當你將**敵人的生命值降至 0**時，你獲得等同「魅力調整值＋契術師等級」的臨時生命值（至少 1）。

      其他人將**你 10 呎內敵人**的生命值降至 0 時，你也獲得這項好處。
  - id: warlock-fiend-spells
    level: 3
    name: 邪魔法術
    spellSourceKey: 邪魔
    spells:
      - id: burning-hands
      - id: command
      - id: scorching-ray
      - id: suggestion
      - id: fireball
        level: 5
      - id: stinking-cloud
        level: 5
      - id: fire-shield
        level: 7
      - id: wall-of-fire
        level: 7
    text: |
      達到下列契術師等級後，你始終準備對應法術：

      - **3 級：**燃燒之手、命令術、灼熱射線、暗示術。
      - **5 級：**火球術、臭雲術。
      - **7 級：**火焰護盾、火牆術。
  - id: warlock-dark-ones-own-luck
    level: 6
    name: 黑暗強運
    resource:
      key: warlock-dark-ones-own-luck
      uses: darkOnesOwnLuckUses
      recover: {long: all}
    actions:
      - mode: action
        key: dynamic-action-warlock-curated-dark-ones-own-luck
        resource: warlock-dark-ones-own-luck
    text: |
      進行屬性檢定或豁免時，可在**看到擲骰結果後、結果生效前**，將 1d10 加到結果中。

      - **使用次數：**等同魅力調整值（至少 1 次），每次擲骰限用 1 次。
      - **恢復時機：**長休後恢復所有已消耗的使用次數。
srd:
  title: "契術師子職：邪魔宗主 Fiend Patron"
  intro: |
    _與下層位面訂下交易_

    你的契約從下層位面汲取力量，那裡是沉淪之境。你可能和一位惡魔領主、一位大魔鬼，或另一個格外強大的邪魔談成交易。這位宗主的圖謀是邪惡的——腐化或毀滅萬物，最終連你也不例外——而你會走上什麼樣的道路，就看你奮力對抗這些圖謀到什麼程度。
  features:
    - level: 3
      name: "黑暗之賜 Dark One's Blessing"
      text: |
        你把一個敵人的生命值降到 0 時，獲得臨時生命值，數量等於你的魅力調整值加上你的契術師等級（至少 1 點臨時生命值）。如果是其他人把你 10 呎內一個敵人的生命值降到 0，你也獲得這項好處。
    - level: 3
      name: "邪魔法術 Fiend Spells"
      text: |
        你宗主的魔力，確保你始終備妥某些法術；你達到「邪魔法術」表中指定的契術師等級後，從此始終準備著表中該等級列出的法術。

        **邪魔法術 Fiend Spells**

        | 契術師等級 | 法術 |
        | --- | --- |
        | 3 | 燃燒之手、命令術、灼熱射線、暗示術 |
        | 5 | 火球術、臭雲術 |
        | 7 | 火焰護盾、火牆術 |
        | 9 | 指使術、疫病蟲群 |
    - level: 6
      name: "黑暗強運 Dark One's Own Luck"
      text: |
        你可以呼喚你的邪魔宗主，改變命運，讓它對你有利。你進行屬性檢定或豁免時，可以使用這項特性，把 1d10 加到這次擲骰上。你可以在看到擲骰結果之後、這次擲骰的任何效果發生之前這麼做。

        你可以使用這項特性的次數等於你的魅力調整值（至少 1 次），但同一次擲骰最多只能使用一次。完成長休時，你恢復所有已消耗的使用次數。
    - level: 10
      name: "邪魔淬體 Fiendish Resilience"
      text: |
        每當你完成短休或長休，選擇一種力場以外的傷害類型。你對這種傷害類型具有抗性，直到你用這項特性另選一種為止。
    - level: 14
      name: "打入地獄 Hurl Through Hell"
      text: |
        每回合一次，你用攻擊檢定命中一個生物時，可以嘗試瞬間傳送目標，讓它穿越下層位面。目標必須成功通過對抗你法術豁免 DC 的魅力豁免，否則它會消失，在一片噩夢般的景象中疾飛而過。目標如果不是邪魔，就受到 8d10 心靈傷害；而且目標陷入失能狀態，直到你的下個回合結束，那時它會回到原本佔據的空間，或最近的未被佔據空間。

        使用這項特性後，你必須完成長休才能再次使用，除非你消耗一個契約魔法法術位（不需要動作）來恢復這項特性的使用次數。
