# yaml-language-server: $schema=../../schema/subclass.schema.json
id: thief
class: rogue
name: 妙手
shortName: 妙手
features:
  - id: rogue-fast-hands
    level: 3
    name: 快手
    actions:
      - mode: bonus
        key: dynamic-bonus-rogue-curated-fast-hands
        legacyKeys: [dynamic-bonus-class-84ttm1]
    text: |
      你可用**附贈**執行下列其中一項：

      - **巧手：**進行敏捷（[[巧手]]）檢定來扒竊，或用盜賊工具開鎖、解除陷阱。
      - **使用物品：**執行使用物件動作，或用魔法動作啟動需要該動作的魔法物品。
  - id: rogue-second-story-work
    level: 3
    name: 高來高去
    actions:
      - mode: movement
        key: dynamic-movement-rogue-curated-second-story-work
    text: |
      你受過訓練，能進入特別難以抵達的地方。

      - **攀援有術：**獲得攀爬速度，數值等於你的速度。
      - **身輕如燕：**可用敏捷代替力量來決定跳躍距離。
srd:
  title: "盜賊子職：妙手 Thief"
  intro: |
    _化身經典冒險者，尋找寶藏_

    你集竊賊、尋寶者與探險家於一身，正是冒險者的最佳寫照。除了提升身手與潛行本領，你還會獲得一些能力，幫助你深入遺跡，並讓你在遺跡裡找到的魔法物品發揮最大的效益。
  features:
    - level: 3
      name: "快手 Fast Hands"
      text: |
        你可以用附贈動作做下列其中一件事。

        _巧手 Sleight of Hand。_ 進行敏捷（巧手）檢定來扒竊，或是用盜賊工具開鎖或解除陷阱。

        _使用物品 Use an Object。_ 執行使用物件動作，或是執行魔法動作來使用需要魔法動作的魔法物品。
    - level: 3
      name: "高來高去 Second-Story Work"
      text: |
        你受過訓練，能進入特別難以抵達的地方，這讓你獲得下列好處。

        _攀援有術 Climber。_ 你獲得攀爬速度，數值等於你的速度。

        _身輕如燕 Jumper。_ 你可以用敏捷而不是力量來決定自己的跳躍距離。
    - level: 9
      name: "神出鬼沒 Supreme Sneak"
      text: |
        你獲得下列靈巧打擊選項。

        _伏擊 Stealth Attack（消耗：1d6）。_ 如果你處於躲藏動作帶來的隱形狀態，而且你在這個回合結束時位於四分之三掩蔽或全掩蔽後方，這次攻擊就不會結束你身上的這個隱形狀態。
    - level: 13
      name: "物盡其用 Use Magic Device"
      text: |
        你學會把魔法物品的用處發揮到極致，這讓你獲得下列好處。

        _同調 Attunement。_ 你可以同時與最多四件魔法物品同調。

        _充能 Charges。_ 每當你使用會消耗充能的魔法物品特性時，擲 1d6。擲出 6 時，你使用這項特性，但不消耗充能。

        _卷軸 Scrolls。_ 你可以使用任何_法術卷軸_，並以智力作為卷軸上法術的施法屬性。如果這個法術是戲法或 1 環法術，你可以穩定施法。如果卷軸所載的法術環階更高，你必須先成功通過智力（奧秘）檢定（DC 10 加上這個法術的環階）。檢定成功時，你從卷軸施放這個法術。檢定失敗時，卷軸瓦解。
    - level: 17
      name: "眼明手快 Thief's Reflexes"
      text: |
        你擅長設下埋伏，也擅長迅速脫離險境。在任何戰鬥的第一輪，你可以進行兩個回合。第一個回合在你原本的先攻順位進行，第二個回合在你的先攻減 10 的順位進行。
