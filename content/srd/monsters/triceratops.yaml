      text: _近戰攻擊檢定：_ +9，觸及5呎。_命中：_ 19（2d12 + 6）穿刺傷害。若目標是巨型或更小的生物，且三角龍在命中前剛直線朝它移動了20呎以上，目標額外受到9（2d8）穿刺傷害，並陷入倒地狀態。
en:
  actions:
    - name: Multiattack
      text: The triceratops makes two Gore attacks.
    - name: Gore
      text: _Melee Attack Roll:_ +9, reach 5 ft. _Hit:_ 19 (2d12 + 6) Piercing damage. If the target is Huge or smaller and the triceratops moved 20+ feet straight toward it immediately before the hit, the target takes an extra 9 (2d8) Piercing damage and has the Prone condition.
