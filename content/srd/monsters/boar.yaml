srd:
  traits:
    - name: 浴血之怒
      text: 野豬處於受創時，其攻擊檢定具有優勢。
  actions:
    - name: 獠牙
      text: _近戰攻擊檢定：_ +3，觸及5呎。_命中：_ 4（1d6 + 1）穿刺傷害。若目標是中型或更小的生物，且野豬在命中前剛直線朝它移動了20呎以上，目標額外受到3（1d6）穿刺傷害，並陷入倒地狀態。
en:
  traits:
    - name: Bloodied Fury
      text: While Bloodied, the boar has Advantage on attack rolls.
  actions:
    - name: Gore
      text: _Melee Attack Roll:_ +3, reach 5 ft. _Hit:_ 4 (1d6 + 1) Piercing damage. If the target is a Medium or smaller creature and the boar moved 20+ feet straight toward it immediately before the hit, the target takes an extra 3 (1d6) Piercing damage and has the Prone condition.
