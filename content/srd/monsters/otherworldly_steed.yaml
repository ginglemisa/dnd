# yaml-language-server: $schema=../../schema/monster.schema.json
id: otherworldly_steed
name: 異界坐騎
nameEn: Otherworldly Steed
site:
  name: 異界坐騎 (Otherworldly Steed) CR:無
  size_type: 大型天界生物、精類或邪魔（你選）
  ac: 10 + 法術環階
  hp: 5 +（10 × 法術環階）
  speed: 60呎, 飛行60呎（四環限定）
  ability: 力18(+4), 敏12(+1), 體14(+2), 智6(-2), 感12(+1), 魅8(-1)
  senses: 被動察覺11
  skills: —
  traits: 生命連結：你因1環以上法術恢復HP時，若在坐騎5呎內，它也恢復等量HP；語言：心靈感應1哩（限與你）；PB=你的PB
  attacks: |-
    異界撞擊：近戰攻擊檢定（加值=你的法術攻擊加值）, 觸及5呎；命中：1d8+法術環階點光耀（天界）/心靈（精類）/黯蝕（邪魔）傷害。
    附贈
    兇惡凝視（邪魔限定；長休後恢復）：60呎內坐騎可見1生物進行感知豁免（DC=你的法術DC）；失敗：恐慌至你下回合結束。
    精類步伐（精類限定；長休後恢復）：坐騎與騎者傳送至坐騎60呎內你選的未佔空間。
    治癒之觸（天界限定；長休後恢復）：坐騎5呎內1生物恢復2d8+法術環階點生命值。
