# yaml-language-server: $schema=../../schema/monster.schema.json
# 異界坐騎不在 SRD 的怪物章節，是尋獲坐騎（find-steed）法術內附的數據塊；AC、HP 與攻擊隨法術環階變化（variable: true），沒有跑團數值。
id: otherworldly_steed
name: 異界坐騎
nameEn: Otherworldly Steed
source: srd
size: large
type: [ celestial, fey, fiend ]
alignment: neutral
cr: none
xp: 0
variable: true
speed: { walk: 60, fly: 60 }
abilities: { str: 18, dex: 12, con: 14, int: 6, wis: 12, cha: 8 }
passivePerception: 11
actions:
  - id: otherworldly-slam
  - id: fell-glare
    mode: bonus
    recovery: long-rest
  - id: fey-step
    mode: bonus
    recovery: long-rest
  - id: healing-touch
    mode: bonus
    recovery: long-rest
site:
  ac: 10 + 法術環階
  hp: 5 +（10 × 法術環階）
  cr: 無
  speedNote: 需以4環以上法術位施放
  traits:
    - name: 生命連結
      text: 你因1環以上法術恢復生命值時，若你在坐騎5呎內，坐騎也恢復等量生命值。
  actions:
    otherworldly-slam: { name: 異界撞擊, text: 近戰攻擊檢定（加值等於你的法術攻擊加值），觸及5呎；命中：1d8＋法術環階點光耀（天界生物）、心靈（精類）或黯蝕（邪魔）傷害。 }
    fell-glare: { name: 兇惡凝視, text: 僅限邪魔。60呎內坐騎看得見的一名生物進行感知豁免（DC等於你的法術豁免DC）；失敗：目標陷入恐慌，直到你的下個回合結束。 }
    fey-step: { name: 精類步伐, text: 僅限精類。坐騎與騎乘者傳送到坐騎60呎內、你選擇的一個未被佔據的空間。 }
    healing-touch: { name: 治癒之觸, text: 僅限天界生物。坐騎5呎內的一名生物恢復2d8＋法術環階點生命值。 }
  languages: 心靈感應1英里（僅限與你）
