# yaml-language-server: $schema=../../schema/monster.schema.json
id: ape
name: 猿猴
nameEn: Ape
source: srd
size: medium
type: beast
alignment: unaligned
cr: "1/2"
xp: 100
ac: 12
initiative: 2
hp: { average: 19, dice: 3d8+6 }
speed: { walk: 30, climb: 30 }
abilities: { str: 16, dex: 14, con: 14, int: 6, wis: 12, cha: 7 }
skills: { 運動: 5, 察覺: 3 }
passivePerception: 13
actions:
  - id: multi
  - id: attack-0
    attack: { kind: melee, hit: 5, reach: 5 }
    damage: [ { type: bludgeoning, dice: 1d4+3 } ]
  - id: attack-1
    recovery: recharge-6
    attack: { kind: ranged, hit: 5, range: [ 25, 50 ] }
    damage: [ { type: bludgeoning, dice: 2d6+3 } ]
site:
  summary: 攀爬、投擲石塊
  actions:
    multi: { name: 多重攻擊, text: 進行兩次拳擊。 }
    attack-0: { name: 拳擊 }
    attack-1: { name: 石塊 }
srd:
  actions:
    - name: 多重攻擊
      text: 猿猴進行兩次拳擊。
    - name: 拳擊
      text: _近戰攻擊檢定：_ +5，觸及5呎。_命中：_ 5（1d4 + 3）鈍擊傷害。
    - name: 石塊（充能6）
      text: _遠程攻擊檢定：_ +5，射程25/50呎。_命中：_ 10（2d6 + 3）鈍擊傷害。
en:
  actions:
    - name: Multiattack
      text: The ape makes two Fist attacks.
    - name: Fist
      text: _Melee Attack Roll:_ +5, reach 5 ft. _Hit:_ 5 (1d4 + 3) Bludgeoning damage.
    - name: Rock (Recharge 6)
      text: _Ranged Attack Roll:_ +5, range 25/50 ft. _Hit:_ 10 (2d6 + 3) Bludgeoning damage.
