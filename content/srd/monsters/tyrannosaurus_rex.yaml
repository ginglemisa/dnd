actions:
  - id: multi
  - id: attack-0
    attack: { kind: melee, hit: 10, reach: 10 }
    damage: [ { type: piercing, dice: 4d12+7 } ]
  - id: attack-1
    attack: { kind: melee, hit: 10, reach: 15 }
