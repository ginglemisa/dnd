site:
  actions:
    multi: { name: 多重攻擊, text: 進行一次咬擊與一次尾擊。 }
    attack-0: { name: 咬擊, text: 命中大型或更小的目標：目標陷入擒抱（掙脫DC17），擒抱期間同時陷入束縛，且不能成為暴龍尾擊的目標。 }
    attack-1: { name: 尾擊, text: 命中巨型或更小的目標：目標倒地。 }
srd:
  actions:
    - name: 多重攻擊
      text: 暴龍進行一次咬擊與一次尾擊。
    - name: 咬擊
      text: _近戰攻擊檢定：_ +10，觸及10呎。_命中：_ 33（4d12 + 7）穿刺傷害。若目標是大型或更小的生物，目標陷入擒抱狀態（掙脫DC 17）。在擒抱期間，目標陷入束縛狀態，且不能成為暴龍尾擊的目標。
    - name: 尾擊
      text: _近戰攻擊檢定：_ +10，觸及15呎。_命中：_ 25（4d8 + 7）鈍擊傷害。若目標是巨型或更小的生物，目標陷入倒地狀態。
en:
  actions:
    - name: Multiattack
      text: The tyrannosaurus makes one Bite attack and one Tail attack.
    - name: Bite
      text: _Melee Attack Roll:_ +10, reach 10 ft. _Hit:_ 33 (4d12 + 7) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 17). While Grappled, the target has the Restrained condition and can't be targeted by the tyrannosaurus's Tail.
    - name: Tail
      text: _Melee Attack Roll:_ +10, reach 15 ft. _Hit:_ 25 (4d8 + 7) Bludgeoning damage. If the target is a Huge or smaller creature, it has the Prone condition.
