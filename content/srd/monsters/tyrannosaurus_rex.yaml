nameEn: Tyrannosaurus Rex
source: srd
size: huge
type: beast
subtype: dinosaur
alignment: unaligned
cr: "8"
xp: 3900
ac: 13
initiative: 3
hp: { average: 136, dice: 13d12+52 }
speed: { walk: 50 }
abilities: { str: 25, dex: 10, con: 19, int: 2, wis: 12, cha: 9 }
saves: { str: 10, wis: 4 }
