# yaml-language-server: $schema=../../schema/monster.schema.json
id: sprite
name: 小妖精
nameEn: Sprite
source: srd
size: tiny
type: fey
alignment: neutral-good
cr: "1/4"
xp: 50
ac: 15
initiative: 4
hp: { average: 10, dice: 4d4 }
speed: { walk: 10, fly: 40 }
abilities: { str: 3, dex: 18, con: 10, int: 14, wis: 13, cha: 11 }
skills: { 察覺: 3, 隱匿: 8 }
passivePerception: 13
actions:
  - id: attack-0
    attack: { kind: melee, hit: 6, reach: 5 }
    damage: [ { type: piercing, dice: 1d4+4 } ]
  - id: attack-1
    attack: { kind: ranged, hit: 6, range: [ 40, 160 ] }
    damage: [ { type: piercing, fixed: 1 } ]
  - id: heart-sight
    save: { ability: cha, dc: 10 }
  - id: invisibility
site:
  actions:
    attack-0: { name: 針劍 }
    attack-1: { name: 魅惑短弓, text: 目標陷入魅惑，直到小妖精的下個回合開始。 }
    heart-sight: { name: 洞悉心靈, text: "5呎內一名可見生物進行{save}（天界生物、邪魔與不死生物自動失敗）；失敗：小妖精得知目標的情緒與陣營。" }
    invisibility: { name: 隱形, text: 對自身施展隱形術，不需要法術成分，以魅力為施法屬性。 }
  languages: 通用語、精靈語、木族語
srd:
  actions:
    - name: 針劍
      text: _近戰攻擊檢定：_ +6，觸及5呎。_命中：_ 6（1d4 + 4）穿刺傷害。
    - name: 魅惑短弓
      text: _遠程攻擊檢定：_ +6，射程40/160呎。_命中：_ 1點穿刺傷害，且目標陷入魅惑狀態，直到小妖精的下個回合開始。
    - name: 洞悉心靈
      text: _魅力豁免：_ DC 10，目標為小妖精看得見、5呎內的一個生物（天界生物、邪魔與不死生物自動豁免失敗）。_失敗：_ 小妖精得知目標的情緒與陣營。
    - name: 隱形
      text: 小妖精對自身施展_隱形術_，不需要法術成分，並以魅力作為施法屬性。
  languages: 通用語、精靈語、木族語
en:
  actions:
    - name: Needle Sword
      text: _Melee Attack Roll:_ +6, reach 5 ft. _Hit:_ 6 (1d4 + 4) Piercing damage.
    - name: Enchanting Bow
      text: _Ranged Attack Roll:_ +6, range 40/160 ft. _Hit:_ 1 Piercing damage, and the target has the Charmed condition until the start of the sprite's next turn.
    - name: Heart Sight
      text: _Charisma Saving Throw:_ DC 10, one creature within 5 feet the sprite can see (Celestials, Fiends, and Undead automatically fail the save). _Failure:_ The sprite knows the target's emotions and alignment.
    - name: Invisibility
      text: The sprite casts _Invisibility_ on itself, requiring no spell components and using Charisma as the spellcasting ability.
  languages: Common, Elvish, Sylvan
