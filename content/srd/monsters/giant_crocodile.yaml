# yaml-language-server: $schema=../../schema/monster.schema.json
id: giant_crocodile
name: 巨鱷
nameEn: Giant Crocodile
source: srd
size: huge
type: beast
alignment: unaligned
cr: "5"
xp: 1800
ac: 14
initiative: -1
hp: { average: 85, dice: 9d12+27 }
speed: { walk: 30, swim: 50 }
abilities: { str: 21, dex: 9, con: 17, int: 2, wis: 10, cha: 7 }
skills: { 隱匿: 5 }
passivePerception: 10
actions:
  - id: multi
  - id: attack-0
    attack: { kind: melee, hit: 8, reach: 5 }
    damage: [ { type: piercing, dice: 3d10+5 } ]
  - id: attack-1
    attack: { kind: melee, hit: 8, reach: 10 }
    damage: [ { type: bludgeoning, dice: 3d8+5 } ]
site:
  traits:
    - name: 憋氣
      text: 可憋氣1小時。
  actions:
    multi: { name: 多重攻擊, text: 進行一次咬擊與一次尾擊。 }
    attack-0: { name: 咬擊, text: 命中大型或更小的目標：目標陷入擒抱（掙脫DC15），擒抱期間同時陷入束縛，且不能成為巨鱷尾擊的目標。 }
    attack-1: { name: 尾擊, text: 命中大型或更小的目標：目標倒地。 }
srd:
  traits:
    - name: 憋氣
      text: 鱷魚能憋氣1小時。
  actions:
    - name: 多重攻擊
      text: 鱷魚進行一次咬擊與一次尾擊。
    - name: 咬擊
      text: _近戰攻擊檢定：_ +8，觸及5呎。_命中：_ 21（3d10 + 5）穿刺傷害。若目標是大型或更小的生物，目標陷入擒抱狀態（掙脫DC 15）。在擒抱期間，目標陷入束縛狀態，且不能成為鱷魚尾擊的目標。
    - name: 尾擊
      text: _近戰攻擊檢定：_ +8，觸及10呎。_命中：_ 18（3d8 + 5）鈍擊傷害。若目標是大型或更小的生物，目標陷入倒地狀態。
en:
  traits:
    - name: Hold Breath
      text: The crocodile can hold its breath for 1 hour.
  actions:
    - name: Multiattack
      text: The crocodile makes one Bite attack and one Tail attack.
    - name: Bite
      text: _Melee Attack Roll:_ +8, reach 5 ft. _Hit:_ 21 (3d10 + 5) Piercing damage. If the target is a Large or smaller creature, it has the Grappled condition (escape DC 15). While Grappled, the target has the Restrained condition and can't be targeted by the crocodile's Tail.
    - name: Tail
      text: _Melee Attack Roll:_ +8, reach 10 ft. _Hit:_ 18 (3d8 + 5) Bludgeoning damage. If the target is a Large or smaller creature, it has the Prone condition.
