en:
  traits:
    - name: Bloodied Fury
      text: The boar has Advantage on melee attack rolls while it is Bloodied.
  actions:
    - name: Gore
      text: _Melee Attack Roll:_ +5, reach 5 ft. _Hit:_ 10 (2d6 + 3) Piercing damage. If the target is a Large or smaller creature and the boar moved 20+ feet straight toward it immediately before the hit, the target takes an extra 7 (2d6) Piercing damage and has the Prone condition.
