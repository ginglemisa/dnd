nameEn: Giant Scorpion
source: srd
size: large
type: beast
alignment: unaligned
cr: "3"
xp: 700
ac: 15
initiative: 1
hp: { average: 52, dice: 7d10+14 }
speed: { walk: 40 }
abilities: { str: 16, dex: 13, con: 15, int: 1, wis: 9, cha: 3 }
senses: { blindsight: 60 }
