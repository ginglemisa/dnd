    attack-0: { name: 咬擊, text: 命中中型或更小的目標：目標倒地。 }
srd:
  traits:
    - name: 群攻
      text: 若狼至少有一名盟友位於某生物5呎內，且該盟友未陷入失能狀態，狼對該生物的攻擊檢定具有優勢。
  actions:
    - name: 咬擊
      text: _近戰攻擊檢定：_ +4，觸及5呎。_命中：_ 5（1d6 + 2）穿刺傷害。若目標是中型或更小的生物，目標陷入倒地狀態。
en:
  traits:
    - name: Pack Tactics
      text: The wolf has Advantage on attack rolls against a creature if at least one of the wolf's allies is within 5 feet of the creature and the ally doesn't have the Incapacitated condition.
  actions:
    - name: Bite
      text: _Melee Attack Roll:_ +4, reach 5 ft. _Hit:_ 5 (1d6 + 2) Piercing damage. If the target is a Medium or smaller creature, it has the Prone condition.
