# yaml-language-server: $schema=../../schema/monster.schema.json
id: brown_bear
name: 棕熊
nameEn: Brown Bear
source: srd
size: large
type: beast
alignment: unaligned
cr: "1"
xp: 200
ac: 11
initiative: 1
hp: { average: 22, dice: 3d10+6 }
speed: { walk: 40, climb: 30 }
abilities: { str: 17, dex: 12, con: 15, int: 2, wis: 13, cha: 7 }
skills: { 察覺: 3 }
senses: { darkvision: 60 }
passivePerception: 13
actions:
  - id: multi
  - id: attack-0
    attack: { kind: melee, hit: 5, reach: 5 }
    damage: [ { type: piercing, dice: 1d8+3 } ]
  - id: attack-1
    attack: { kind: melee, hit: 5, reach: 5 }
    damage: [ { type: slashing, dice: 1d4+3 } ]
site:
  summary: 攀爬、近戰
  actions:
    multi: { name: 多重攻擊, text: 進行一次咬擊與一次爪擊。 }
    attack-0: { name: 咬擊 }
    attack-1: { name: 爪擊, text: 命中大型或更小的目標：目標倒地。 }
srd:
  actions:
    - name: 多重攻擊
      text: 熊進行一次咬擊與一次爪擊。
    - name: 咬擊
      text: _近戰攻擊檢定：_ +5，觸及5呎。_命中：_ 7（1d8 + 3）穿刺傷害。
    - name: 爪擊
      text: _近戰攻擊檢定：_ +5，觸及5呎。_命中：_ 5（1d4 + 3）揮砍傷害。若目標是大型或更小的生物，目標陷入倒地狀態。
en:
  actions:
    - name: Multiattack
      text: The bear makes one Bite attack and one Claw attack.
    - name: Bite
      text: _Melee Attack Roll:_ +5, reach 5 ft. _Hit:_ 7 (1d8 + 3) Piercing damage.
    - name: Claw
      text: _Melee Attack Roll:_ +5, reach 5 ft. _Hit:_ 5 (1d4 + 3) Slashing damage. If the target is a Large or smaller creature, it has the Prone condition.
