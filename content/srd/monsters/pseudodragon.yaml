# yaml-language-server: $schema=../../schema/monster.schema.json
id: pseudodragon
name: 偽龍
nameEn: Pseudodragon
source: srd
size: tiny
type: dragon
alignment: neutral-good
cr: "1/4"
xp: 50
ac: 14
initiative: 2
hp: { average: 10, dice: 3d4+3 }
speed: { walk: 15, fly: 60 }
abilities: { str: 6, dex: 15, con: 13, int: 10, wis: 12, cha: 10 }
skills: { 察覺: 5, 隱匿: 4 }
senses: { blindsight: 10, darkvision: 60 }
passivePerception: 15
actions:
  - id: multi
  - id: attack-0
    attack: { kind: melee, hit: 4, reach: 5 }
    damage: [ { type: piercing, dice: 1d4+2 } ]
  - id: sting
    save: { ability: con, dc: 12 }
    damage: [ { type: poison, dice: 2d4 } ]
site:
  traits:
    - name: 魔法抗性
      text: 對抗法術與其他魔法效應的豁免具有優勢。
  actions:
    multi: { name: 多重攻擊, text: 進行兩次咬擊。 }
    attack-0: { name: 咬擊 }
    sting: { name: 螫刺, text: "5呎內一名可見生物進行{save}；失敗：{damage}，並陷入中毒1小時。失敗5以上：中毒期間同時陷入昏迷；目標受到傷害，或5呎內的生物以一個動作喚醒它時提早結束。" }
  languages: 聽得懂通用語和龍語，但不會說
srd:
  traits:
    - name: 魔法抗性
      text: 偽龍對抗法術與其他魔法效應的豁免具有優勢。
  actions:
    - name: 多重攻擊
      text: 偽龍進行兩次咬擊。
    - name: 咬擊
      text: _近戰攻擊檢定：_ +4，觸及5呎。_命中：_ 4（1d4 + 2）穿刺傷害。
    - name: 螫刺
      text: _體質豁免：_ DC 12，目標為偽龍看得見、5呎內的一個生物。_失敗：_ 5（2d4）毒素傷害，且目標陷入中毒狀態1小時。_失敗5以上：_ 在中毒期間，目標同時陷入昏迷狀態；若目標受到傷害，或其5呎內的一個生物採取一個動作喚醒它，昏迷狀態提早結束。
  languages: 聽得懂通用語和龍語，但不會說話
en:
  traits:
    - name: Magic Resistance
      text: The pseudodragon has Advantage on saving throws against spells and other magical effects.
  actions:
    - name: Multiattack
      text: The pseudodragon makes two Bite attacks.
    - name: Bite
      text: _Melee Attack Roll:_ +4, reach 5 ft. _Hit:_ 4 (1d4 + 2) Piercing damage.
    - name: Sting
      text: _Constitution Saving Throw:_ DC 12, one creature the pseudodragon can see within 5 feet. _Failure:_ 5 (2d4) Poison damage, and the target has the Poisoned condition for 1 hour. _Failure by 5 or More:_ While Poisoned, the target also has the Unconscious condition, which ends early if the target takes damage or a creature within 5 feet of it takes an action to wake it.
  languages: Understands Common and Draconic but can't speak
