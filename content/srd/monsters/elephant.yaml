# yaml-language-server: $schema=../../schema/monster.schema.json
id: elephant
name: 大象
nameEn: Elephant
source: srd
size: huge
type: beast
alignment: unaligned
cr: "4"
xp: 1100
ac: 12
initiative: -1
hp: { average: 76, dice: 8d12+24 }
speed: { walk: 40 }
abilities: { str: 22, dex: 9, con: 17, int: 3, wis: 11, cha: 6 }
passivePerception: 10
actions:
  - id: multi
  - id: attack-0
    attack: { kind: melee, hit: 8, reach: 5 }
    damage: [ { type: piercing, dice: 2d8+6 } ]
  - id: trample
    mode: bonus
    save: { ability: dex, dc: 16, half: true }
    damage: [ { type: bludgeoning, dice: 2d10+6 } ]
site:
  actions:
    multi: { name: 多重攻擊, text: 進行兩次獠牙。 }
    attack-0: { name: 獠牙, text: 先直線朝目標移動20呎以上再命中巨型或更小的目標：目標倒地。 }
    trample: { name: 踐踏, text: "5呎內一名倒地的生物進行{save}；失敗：{damage}，成功：傷害減半。" }
srd:
  actions:
    - name: 多重攻擊
      text: 大象進行兩次獠牙攻擊。
    - name: 獠牙
      text: _近戰攻擊檢定：_ +8，觸及5呎。_命中：_ 15（2d8 + 6）穿刺傷害。若目標是巨型或更小的生物，且大象在命中前剛直線朝它移動了20呎以上，目標陷入倒地狀態。
  bonusActions:
    - name: 踐踏
      text: _敏捷豁免：_ DC 16，一個位於大象5呎內、處於倒地狀態的生物。_失敗：_ 17（2d10 + 6）鈍擊傷害。_成功：_ 傷害減半。
en:
  actions:
    - name: Multiattack
      text: The elephant makes two Gore attacks.
    - name: Gore
      text: _Melee Attack Roll:_ +8, reach 5 ft. _Hit:_ 15 (2d8 + 6) Piercing damage. If the target is a Huge or smaller creature and the elephant moved 20+ feet straight toward it immediately before the hit, the target has the Prone condition.
  bonusActions:
    - name: Trample
      text: _Dexterity Saving Throw:_ DC 16, one creature within 5 feet that has the Prone condition. _Failure:_ 17 (2d10 + 6) Bludgeoning damage. _Success:_ Half damage.
