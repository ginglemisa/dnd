# yaml-language-server: $schema=../../schema/monster.schema.json
id: giant_toad
name: 巨蟾蜍
nameEn: Giant Toad
source: srd
size: large
type: beast
alignment: unaligned
cr: "1"
xp: 200
ac: 11
initiative: 1
hp: { average: 39, dice: 6d10+6 }
speed: { walk: 30, swim: 30 }
abilities: { str: 15, dex: 13, con: 13, int: 2, wis: 10, cha: 3 }
senses: { darkvision: 60 }
passivePerception: 10
actions:
  - id: attack-0
    attack: { kind: melee, hit: 4, reach: 5 }
    damage: [ { type: piercing, dice: 1d6+2 }, { type: poison, dice: 2d4 } ]
  - id: swallow
    damage: [ { type: acid, dice: 3d6, timing: each-turn-end } ]
site:
  summary: 水陸兩棲、吞下目標
  traits:
    - name: 兩棲
      text: 可在空氣和水中呼吸。
    - name: 立定跳躍
      text: 無論有無助跑，跳遠最遠20呎、跳高最高10呎。
  actions:
    attack-0: { name: 咬擊, text: 命中中型或更小的目標：目標陷入擒抱（掙脫DC12）。 }
    swallow: { name: 吞下, text: "吞下一名被巨蟾蜍擒抱的中型或更小目標。目標不再被擒抱，但陷入失明與束縛，且對巨蟾蜍外部的攻擊與效果具有全掩護；巨蟾蜍每個回合結束時，目標受到{damage}。巨蟾蜍一次只能吞下一個目標，吞著目標時不能咬擊。巨蟾蜍死亡時，被吞下的生物不再受束縛，可花費5呎移動力從屍體爬出並倒地。" }
