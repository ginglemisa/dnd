srd:
  actions:
    - name: 蹄擊
      text: _近戰攻擊檢定：_ +6，觸及5呎。_命中：_ 9（2d4 + 4）鈍擊傷害。若目標是大型或更小的生物，且馬在命中前剛直線朝它移動了20呎以上，目標額外受到5（2d4）鈍擊傷害，並陷入倒地狀態。
en:
  actions:
    - name: Hooves
      text: _Melee Attack Roll:_ +6, reach 5 ft. _Hit:_ 9 (2d4 + 4) Bludgeoning damage. If the target is a Large or smaller creature and the horse moved 20+ feet straight toward it immediately before the hit, the target takes an extra 5 (2d4) Bludgeoning damage and has the Prone condition.
