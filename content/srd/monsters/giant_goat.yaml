nameEn: Giant Goat
source: srd
size: large
type: beast
alignment: unaligned
cr: "1/2"
xp: 100
ac: 11
initiative: 1
hp: { average: 19, dice: 3d10+3 }
speed: { walk: 40, climb: 30 }
abilities: { str: 17, dex: 13, con: 12, int: 3, wis: 12, cha: 6 }
saves: { str: 5 }
skills: { 察覺: 3 }
