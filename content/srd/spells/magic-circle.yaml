# yaml-language-server: $schema=../../schema/spell.schema.json
id: magic-circle
name: 防護法陣
nameEn: Magic Circle
source: srd
level: 3
school: abjuration
classes: [ cleric, warlock, wizard ]
castingTime: [ { minutes: 1 } ]
range: { feet: 10 }
components: [ V, S, M ]
duration: { hours: 1 }
upcast: true
site:
  material: 價值至少100 GP的鹽與銀粉（施法時消耗）
  body: |-
    - 以射程內一個你能看見的地面點為中心，創造半徑10呎、高20呎的圓柱形魔法能量區域；圓柱與地板或其他表面交會處會出現發光符文
    - 選擇下列一種或多種生物類型：天界生物、元素生物、精類、邪魔或不死生物；法陣以下列方式影響所選類型的生物：
      - 該生物無法以非魔法方式自願進入圓柱；若它嘗試以傳送或跨位面旅行進入，必須先在魅力豁免成功
      - 該生物對圓柱內的目標進行攻擊檢定具有劣勢
      - 圓柱內的目標無法被該生物附身，也不會因它陷入魅惑或恐慌狀態
    - 每次施放此法術時，你可以讓魔法反向運作：阻止所選類型的生物離開圓柱，並保護圓柱外的目標
    - 使用更高環階法術位：每比3環高一環，持續時間增加1小時
srd:
  material: 鹽與價值100 GP以上的銀粉，法術會將其消耗
  body: |-
    你在射程內一個你能看見的地面點上，創造一個以該點為中心、半徑10呎、高20呎的魔法能量圓柱形區域。圓柱形區域與地板或其他表面相交之處會出現發光的符文。

    從以下生物類型中選擇一種或多種：天界生物、元素生物、精類、邪魔或不死生物。法陣會以下列方式影響所選類型的生物：

    • 該生物不能以非魔法方式自願進入圓柱形區域。若該生物試圖以傳送或跨位面旅行進入，必須先成功通過一次魅力豁免。• 該生物對圓柱形區域內的目標進行攻擊檢定時具有劣勢。• 圓柱形區域內的目標不會被該生物附身，也不會因該生物而陷入魅惑或恐慌狀態。

    每次施放此法術時，你可以讓其魔法反向運作，改為阻止指定類型的生物離開圓柱形區域，並保護區域外的目標。

    _使用更高環階法術位。_ 每高於3環的法術位環階，持續時間增加1小時。
en:
  material: salt and powdered silver worth 100+ GP, which the spell consumes
  body: |-
    You create a 10-foot-radius, 20-foot-tall Cylinder of magical energy centered on a point on the ground that you can see within range. Glowing runes appear wherever the Cylinder intersects with the floor or other surface.

    Choose one or more of the following types of creatures: Celestials, Elementals, Fey, Fiends, or Undead. The circle affects a creature of the chosen type in the following ways:

    • The creature can't willingly enter the Cylinder by nonmagical means. If the creature tries to use teleportation or interplanar travel to do so, it must first succeed on a Charisma saving throw. • The creature has Disadvantage on attack rolls against targets within the Cylinder. • Targets within the Cylinder can't be possessed by or gain the Charmed or Frightened condition from the creature.

    Each time you cast this spell, you can cause its magic to operate in the reverse direction, preventing a creature of the specified type from leaving the Cylinder and protecting targets outside it.

    _Using a Higher-Level Spell Slot._ The duration increases by 1 hour for each spell slot level above 3.
