# yaml-language-server: $schema=../../schema/spell.schema.json
id: moonbeam
name: 月華之光
nameEn: Moonbeam
source: srd
level: 2
school: evocation
classes: [ druid ]
castingTime: [ action ]
range: { feet: 120 }
components: [ V, S, M ]
duration: { minutes: 1 }
concentration: true
upcast: true
site:
  material: 一片月籽藤葉
  outcomes:
    - { kind: damage, formula: 2d10, upcastDice: 1d10, damageType: radiant, autoOnCast: true, context: 柱形區域出現時的區域傷害擲一次；豁免依規則處理 }
  body: |-
    - 一道銀白微光照射在以射程內一點為中心、半徑5呎、高40呎的圓柱形區域
    - 法術結束前，微光光照充滿圓柱形區域；你可以在之後的回合用魔法動作將圓柱移動至多60呎
    - 圓柱出現時，其中每個生物須進行體質豁免：
      - 豁免失敗時，受到2d10光耀傷害；若該生物處於變形狀態（例如受變形術影響），它恢復真實形態，且在離開圓柱前無法變形
      - 豁免成功時，只受到一半傷害
    - 法術區域移入生物空間時、生物進入法術區域時，或生物在區域內結束回合時，也須進行此豁免；每個生物每回合只進行一次此豁免
    - 使用更高環階法術位：每比2環高一環，傷害增加1d10
srd:
  material: 一片月籽葉
  body: |-
    一道淡色的銀白光束照下，形成以射程內一點為中心、半徑5呎、高40呎的圓柱形區域。在法術結束前，微光光照充滿該圓柱形區域，而你可以在之後的回合以魔法動作將該圓柱形區域移動最多60呎。

    當圓柱形區域出現時，其中的每個生物各自進行一次體質豁免。豁免失敗時，生物受到2d10光耀傷害；若該生物處於變形狀態（例如因為_變形術_法術），它會恢復原形，且在離開該圓柱形區域之前無法變形。豁免成功時，生物只受到一半傷害。當法術區域移動到某生物所在的空間、該生物進入法術區域，或在其中結束自己的回合時，該生物也要進行此豁免。每個生物每回合只需進行一次此豁免。

    _使用更高環階法術位。_ 法術位環階每比2環高一環，傷害增加1d10。
en:
  material: a moonseed leaf
  body: |-
    A silvery beam of pale light shines down in a 5-foot-radius, 40-foot-high Cylinder centered on a point within range. Until the spell ends, Dim Light fills the Cylinder, and you can take a Magic action on later turns to move the Cylinder up to 60 feet.

    When the Cylinder appears, each creature in it makes a Constitution saving throw. On a failed save, a creature takes 2d10 Radiant damage, and if the creature is shape-shifted (as a result of the _Polymorph_ spell, for example), it reverts to its true form and can't shape-shift until it leaves the Cylinder. On a successful save, a creature takes half as much damage only. A creature also makes this save when the spell's area moves into its space and when it enters the spell's area or ends its turn there. A creature makes this save only once per turn.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d10 for each spell slot level above 2.
