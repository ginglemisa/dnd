# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: wall-of-fire
source: srd
level: 4
school: evocation
classes: [ druid, sorcerer, wizard ]
ritual: false
concentration: true
castingTime:
  - { unit: action }
range: { type: distance, amount: 120, unit: feet }
components: { v: true, s: true, m: true }
duration: { type: time, amount: 1, unit: minute, upTo: true }
en:
  name: Wall of Fire
  material: a piece of charcoal
  body: |-
    You create a wall of fire on a solid surface within range. You can make the wall up to 60 feet long, 20 feet high, and 1 foot thick, or a ringed wall up to 20 feet in diameter, 20 feet high, and 1 foot thick. The wall is opaque and lasts for the duration.

    When the wall appears, each creature in its area makes a Dexterity saving throw, taking 5d8 Fire damage on a failed save or half as much damage on a successful one.

    One side of the wall, selected by you when you cast this spell, deals 5d8 Fire damage to each creature that ends its turn within 10 feet of that side or inside the wall. A creature takes the same damage when it enters the wall for the first time on a turn or ends its turn there. The other side of the wall deals no damage.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d8 for each spell slot level above 4.
zh:
  name: 火牆術
  material: 一塊木炭
  body: |-
    你在射程內的堅固表面上創造一道火牆。你可以讓牆最長60呎、高20呎、厚1呎，或是創造一道直徑最大20呎、高20呎、厚1呎的環形牆。這道牆不透明，並持續到持續時間結束。

    當牆出現時，其區域內的每個生物進行一次敏捷豁免，豁免失敗時受到5d8火焰傷害，豁免成功時受到一半傷害。

    牆的一側（由你施放法術時選擇）會對在該側10呎內或牆內結束回合的每個生物造成5d8火焰傷害。生物在一個回合內首次進入牆內，或在牆內結束其回合時，同樣受到該傷害。牆的另一側不造成傷害。

    _使用更高環階法術位。_ 法術位的環階每比4高一環，傷害增加1d8。
