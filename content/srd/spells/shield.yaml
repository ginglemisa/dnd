# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: shield
source: srd
level: 1
school: abjuration
classes: [ sorcerer, wizard ]
ritual: false
concentration: false
castingTime:
  - unit: reaction
    note:
      en: which you take when you are hit by an attack roll or targeted by the _Magic Missile_ spell
      zh: 當你被攻擊檢定命中或成為_魔法飛彈_法術的目標時
range: { type: self }
components: { v: true, s: true, m: false }
duration: { type: time, amount: 1, unit: round }
en:
  name: Shield
  body: An imperceptible barrier of magical force protects you. Until the start of your next turn, you have a +5 bonus to AC, including against the triggering attack, and you take no damage from _Magic Missile_.
zh:
  name: 護盾術
  body: 一道無形的魔法力場屏障保護著你。直到你下個回合開始前，你的AC獲得+5加值（包括對引發此法術的那次攻擊），且你不會受到_魔法飛彈_的傷害。
