# yaml-language-server: $schema=../../schema/spell.schema.json
id: true-seeing
name: 真知術
nameEn: True Seeing
source: srd
level: 6
school: divination
classes: [ bard, cleric, sorcerer, warlock, wizard ]
castingTime: [ action ]
range: touch
components: [ V, S, M ]
duration: { hours: 1 }
srd:
  material: 價值25 GP以上的蘑菇粉末，法術會將其消耗
  body: |-
    在持續時間內，你碰觸的自願生物擁有範圍120呎的真實視覺。
en:
  material: mushroom powder worth 25+ GP, which the spell consumes
  body: |-
    For the duration, the willing creature you touch has Truesight with a range of 120 feet.
