# yaml-language-server: $schema=../../schema/spell.schema.json
id: holy-aura
name: 聖潔靈光
nameEn: Holy Aura
source: srd
level: 8
school: abjuration
classes: [ cleric ]
castingTime: [ action ]
range: self
components: [ V, S, M ]
duration: { minutes: 1 }
concentration: true
srd:
  material: 價值1,000+ GP的聖物匣
  body: |-
    在持續時間內，你會散發出30呎發散區域的光環。位於光環內時，你選擇的生物在所有豁免上具有優勢，其他生物對他們的攻擊檢定具有劣勢。此外，當邪魔或不死生物以近戰攻擊檢定擊中受影響的生物時，攻擊者必須成功通過體質豁免，否則會陷入失明狀態，直到其下個回合結束。
en:
  material: a reliquary worth 1,000+ GP
  body: |-
    For the duration, you emit an aura in a 30-foot Emanation. While in the aura, creatures of your choice have Advantage on all saving throws, and other creatures have Disadvantage on attack rolls against them. In addition, when a Fiend or an Undead hits an affected creature with a melee attack roll, the attacker must succeed on a Constitution saving throw or have the Blinded condition until the end of its next turn.
