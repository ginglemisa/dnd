# yaml-language-server: $schema=../../schema/spell.schema.json
id: banishment
name: 放逐術
nameEn: Banishment
source: srd
level: 4
school: abjuration
classes: [ cleric, sorcerer, warlock, wizard ]
castingTime: [ action ]
range: { feet: 30 }
components: [ V, S, M ]
duration: { minutes: 1 }
concentration: true
upcast: true
site:
  material: 一個五芒星
  body: |-
    - 射程內一個你能看見的生物須進行魅力豁免；失敗時在持續時間內被傳送到一個無害的半位面，並在那裡陷入失能狀態
    - 法術結束時，目標重新出現在它離開的空間；若該空間被佔據，則出現在最近的未被佔據空間
    - 若目標是異怪、天界生物、元素生物、精類或邪魔，且法術持續滿1分鐘，目標不會返回，而是被傳送到與其生物類型相關之位面上的隨機地點（由DM選擇）
    - 使用更高環階法術位：每比4環高一環，可額外以一個生物為目標
srd:
  classes: [ cleric, paladin, sorcerer, warlock, wizard ]
  material: 一個五芒星圖形
  body: |-
    你能看見的射程內一個生物必須成功通過魅力豁免，否則會在持續時間內被傳送到一個無害的半位面。身處其中時，目標陷入失能狀態。法術結束時，目標會重新出現在其離開的空間；若該空間已被佔據，則出現在最近的未被佔據空間。

    如果目標是異怪、天界生物、元素生物、精類或邪魔，且法術持續了1分鐘，目標不會返回。目標改為被傳送到與其生物類型相關聯的某個位面上的隨機地點（由DM決定）。

    _使用更高環階法術位。_ 法術位環階每比4高一環，你可以多指定一個生物為目標。
en:
  material: a pentacle
  body: |-
    One creature that you can see within range must succeed on a Charisma saving throw or be transported to a harmless demiplane for the duration. While there, the target has the Incapacitated condition. When the spell ends, the target reappears in the space it left or in the nearest unoccupied space if that space is occupied.

    If the target is an Aberration, a Celestial, an Elemental, a Fey, or a Fiend, the target doesn't return if the spell lasts for 1 minute. The target is instead transported to a random location on a plane (GM's choice) associated with its creature type.

    _Using a Higher-Level Spell Slot._ You can target one additional creature for each spell slot level above 4.
