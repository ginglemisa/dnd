# yaml-language-server: $schema=../../schema/spell.schema.json
id: silence
name: 沉默術
nameEn: Silence
source: srd
level: 2
school: illusion
classes: [ bard, cleric, ranger ]
castingTime: [ action ]
ritual: true
range: { feet: 120 }
components: [ V, S ]
duration: { minutes: 10 }
concentration: true
site:
  body: |-
    - 持續時間內，以射程內你選擇的一點為中心、半徑20呎的球形區域中，不能產生任何聲音，聲音也無法穿過該區域
    - 完全位於球形區域內的生物或物體免疫雷鳴傷害；生物完全位於區域內時陷入耳聾狀態
    - 無法在該區域內施放包含言語成分的法術
srd:
  body: |-
    在持續時間內，以你在射程內選定的一點為中心、半徑20呎的球形區域內無法產生任何聲音，聲音也無法穿過該區域。完全位於該球形區域內的任何生物或物體對雷鳴傷害具有免疫，且生物在完全位於其中時陷入耳聾狀態。在該處無法施放含有言語成分的法術。
en:
  body: |-
    For the duration, no sound can be created within or pass through a 20-foot-radius Sphere centered on a point you choose within range. Any creature or object entirely inside the Sphere has Immunity to Thunder damage, and creatures have the Deafened condition while entirely inside it. Casting a spell that includes a Verbal component is impossible there.
