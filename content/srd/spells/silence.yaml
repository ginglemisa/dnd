# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: silence
source: srd
level: 2
school: illusion
classes: [ bard, cleric, ranger ]
ritual: true
concentration: true
castingTime:
  - { unit: action }
  - { unit: ritual }
range: { type: distance, amount: 120, unit: feet }
components: { v: true, s: true, m: false }
duration: { type: time, amount: 10, unit: minute, upTo: true }
en:
  name: Silence
  body: For the duration, no sound can be created within or pass through a 20-foot-radius Sphere centered on a point you choose within range. Any creature or object entirely inside the Sphere has Immunity to Thunder damage, and creatures have the Deafened condition while entirely inside it. Casting a spell that includes a Verbal component is impossible there.
zh:
  name: 沉默術
  body: 在持續時間內，以你在射程內選定的一點為中心、半徑20呎的球形區域內無法產生任何聲音，聲音也無法穿過該區域。完全位於該球形區域內的任何生物或物體對雷鳴傷害具有免疫，且生物在完全位於其中時陷入耳聾狀態。在該處無法施放含有言語成分的法術。
