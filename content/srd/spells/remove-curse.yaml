# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: remove-curse
source: srd
level: 3
school: abjuration
classes: [ cleric, paladin, warlock, wizard ]
ritual: false
concentration: false
castingTime:
  - { unit: action }
range: { type: touch }
components: { v: true, s: true, m: false }
duration: { type: instantaneous }
en:
  name: Remove Curse
  body: At your touch, all curses affecting one creature or object end. If the object is a cursed magic item, its curse remains, but the spell breaks its owner's Attunement to the object so it can be removed or discarded.
zh:
  name: 移除詛咒
  body: 經由你的觸碰，影響一個生物或物體的所有詛咒都會終止。如果該物體是受詛咒的魔法物品，其詛咒仍然存在，但法術會解除其擁有者與該物品的同調，使其可以被移除或丟棄。
