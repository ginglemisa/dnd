# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: animal-friendship
source: srd
level: 1
school: enchantment
classes: [ bard, druid, ranger ]
ritual: false
concentration: false
castingTime:
  - { unit: action }
range: { type: distance, amount: 30, unit: feet }
components: { v: true, s: true, m: true }
duration: { type: time, amount: 24, unit: hour }
en:
  name: Animal Friendship
  material: a morsel of food
  body: |-
    Target a Beast that you can see within range. The target must succeed on a Wisdom saving throw or have the Charmed condition for the duration. If you or one of your allies deals damage to the target, the spells ends.

    _Using a Higher-Level Spell Slot._ You can target one additional Beast for each spell slot level above 1.
zh:
  name: 化獸為友
  material: 一小塊食物
  body: |-
    以射程內一隻你看得見的野獸為目標。該目標必須成功通過感知豁免，否則在持續時間內陷入魅惑狀態。若你或你的盟友對該目標造成傷害，法術結束。

    _使用更高環階法術位。_ 每比1環高一環，你可以多以一隻野獸為目標。
