# yaml-language-server: $schema=../../schema/spell.schema.json
id: ray-of-sickness
name: 致病射線
nameEn: Ray of Sickness
source: srd
level: 1
school: necromancy
classes: [ sorcerer, wizard ]
castingTime: [ action ]
range: { feet: 60 }
components: [ V, S ]
duration: instantaneous
upcast: true
site:
  outcomes:
    - { kind: damage, attack: spell, formula: 2d8, upcastDice: 1d8, damageType: poison, autoOnCast: true, context: 命中時傷害 }
  body: |-
    - 向射程內一個生物射出綠色射線，對目標進行一次遠程法術攻擊
    - 命中時，目標受到2d8毒素傷害，並陷入中毒狀態，直到你下個回合結束
    - 使用更高環階法術位：每比1環高一環，傷害增加1d8
srd:
  body: |-
    你朝射程內的一隻生物射出一道淡綠色的射線。對該目標進行一次遠程法術攻擊。若命中，目標受到2d8毒素傷害，並陷入中毒狀態，持續到你下個回合結束。

    _使用更高環階法術位。_ 法術位環階每比1環高一環，傷害就增加1d8。
en:
  body: |-
    You shoot a greenish ray at a creature within range. Make a ranged spell attack against the target. On a hit, the target takes 2d8 Poison damage and has the Poisoned condition until the end of your next turn.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d8 for each spell slot level above 1.
