# yaml-language-server: $schema=../../schema/spell.schema.json
id: animal-messenger
name: 動物信使
nameEn: Animal Messenger
source: srd
level: 2
school: enchantment
classes: [ bard, druid, ranger ]
castingTime: [ action ]
ritual: true
range: { feet: 30 }
components: [ V, S, M ]
duration: { hours: 24 }
upcast: true
site:
  material: 一小口食物
  body: |-
    - 射程內一隻你選擇且你能看見的微型野獸須進行魅力豁免；失敗時牠會嘗試為你傳遞訊息（目標的挑戰等級不為0時自動成功）
    - 你指定一個你曾到過的地點，以及符合大致描述的收信者，例如「穿著鎮衛隊制服的人」或「戴尖帽的紅髮矮人」
    - 你同時傳達一則至多二十五個字的訊息
    - 野獸在持續時間內前往指定地點，每24小時約移動25英里；若野獸能飛行則為50英里
    - 野獸抵達後，會模仿你的表達方式，將訊息傳給你描述的生物
    - 若野獸在法術結束前未抵達目的地，訊息遺失，野獸返回你施法的地點
    - 使用更高環階法術位：每比2環高一環，持續時間增加48小時
srd:
  material: 一小塊食物
  body: |-
    你選擇射程內你能看見的一隻微型野獸，它必須通過魅力豁免，否則會嘗試為你傳遞訊息（如果目標的挑戰等級不是0，它會自動成功通過豁免）。你指定一個你曾去過的地點，以及一位符合概略描述的收件者，例如「穿著城鎮衛兵制服的人」或「戴著尖帽的紅髮矮人」。你還要傳達一段最多二十五個字詞的訊息。在持續時間內，該野獸朝指定地點前進，每24小時約行進25英里，若該野獸會飛行則為50英里。

    當野獸抵達時，它會模仿你的傳達方式，把你的訊息傳遞給你所描述的生物。如果野獸在法術結束前未能抵達目的地，訊息就會遺失，野獸會回到你施放法術的地點。

    _使用更高環階法術位。_ 每比2環高一環，法術的持續時間增加48小時。
en:
  material: a morsel of food
  body: |-
    A Tiny Beast of your choice that you can see within range must succeed on a Charisma saving throw, or it attempts to deliver a message for you (if the target's Challenge Rating isn't 0, it automatically succeeds). You specify a location you have visited and a recipient who matches a general description, such as "a person dressed in the uniform of the town guard" or "a red-haired dwarf wearing a pointed hat." You also communicate a message of up to twenty-five words. The Beast travels for the duration toward the specified location, covering about 25 miles per 24 hours or 50 miles if the Beast can fly.

    When the Beast arrives, it delivers your message to the creature that you described, mimicking your communication. If the Beast doesn't reach its destination before the spell ends, the message is lost, and the Beast returns to where you cast the spell.

    _Using a Higher-Level Spell Slot._ The spell's duration increases by 48 hours for each spell slot level above 2.
