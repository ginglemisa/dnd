# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: fire-storm
source: srd
level: 7
school: evocation
classes: [ cleric, druid, sorcerer ]
ritual: false
concentration: false
castingTime:
  - { unit: action }
range: { type: distance, amount: 150, unit: feet }
components: { v: true, s: true, m: false }
duration: { type: instantaneous }
en:
  name: Fire Storm
  body: |-
    A storm of fire appears within range. The area of the storm consists of up to ten 10-foot Cubes, which you arrange as you like. Each Cube must be contiguous with at least one other Cube. Each creature in the area makes a Dexterity saving throw, taking 7d10 Fire damage on a failed save or half as much damage on a successful one.

    Flammable objects in the area that aren't being worn or carried start burning.
zh:
  name: 火焰風暴
  body: |-
    射程內出現一場火焰風暴。風暴的區域由最多十個10呎立方體組成，你可以隨意安排其排列方式。每個立方體必須至少與另一個立方體相連。區域內的每個生物進行一次敏捷豁免，豁免失敗時受到7d10火焰傷害，成功時傷害減半。

    區域內未被穿戴或攜帶的易燃物體開始燃燒。
