# yaml-language-server: $schema=../../schema/spell.schema.json
id: shining-smite
name: 閃耀斬
nameEn: Shining Smite
source: srd
level: 2
school: transmutation
classes: [ paladin ]
castingTime: [ bonus-action ]
range: self
components: [ V ]
duration: { minutes: 1 }
concentration: true
upcast: true
site:
  trigger: 在你以近戰武器或徒手打擊命中一個生物後立即施放
  outcomes:
    - { kind: damage, formula: 2d6, upcastDice: 1d6, damageType: radiant, autoOnCast: true, context: 觸發本法術的命中額外傷害 }
  body: |-
    - 被此次攻擊命中的目標額外受到2d6光耀傷害
    - 法術結束前，目標發出半徑5呎的明亮光照，對它進行的攻擊檢定具有優勢，且它無法從隱形狀態獲益
    - 使用更高環階法術位：每比2環高一環，傷害增加1d6
srd:
  trigger: 你在以近戰武器或徒手打擊擊中生物後立即執行
  body: |-
    被該次打擊命中的目標，會從該次攻擊額外受到2d6光耀傷害。在法術結束前，目標會散發半徑5呎的明亮光照，對它進行的攻擊檢定具有優勢，且它無法從隱形狀態獲益。

    _使用更高環階法術位。_ 法術位環階每比2環高一環，傷害增加1d6。
en:
  trigger: which you take immediately after hitting a creature with a Melee weapon or an Unarmed Strike
  body: |-
    The target hit by the strike takes an extra 2d6 Radiant damage from the attack. Until the spell ends, the target sheds Bright Light in a 5-foot radius, attack rolls against it have Advantage, and it can't benefit from the Invisible condition.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d6 for each spell slot level above 2.
