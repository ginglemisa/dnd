# yaml-language-server: $schema=../../schema/spell.schema.json
id: revivify
name: 回生術
nameEn: Revivify
source: srd
level: 3
school: necromancy
classes: [ cleric, druid ]
castingTime: [ action ]
range: touch
components: [ V, S, M ]
duration: instantaneous
site:
  material: 一顆價值至少300 GP的鑽石（施法時消耗）
  outcomes:
    - { kind: healing, fixed: 1, autoOnCast: true, context: 目標以 1 點生命值復活；不直接修改角色 HP }
  body: |-
    - 觸碰一個在過去1分鐘內死亡的生物，該生物以1點生命值復活
    - 此法術無法使因年老而死的生物復活，也無法恢復任何缺失的身體部位
srd:
  classes: [ cleric, druid, paladin, ranger ]
  material: 價值300 GP以上的鑽石，法術會消耗它
  body: |-
    你觸碰一個在過去1分鐘內死亡的生物。該生物以1點生命值復活。這個法術無法復活死於老邁的生物，也不會恢復任何缺失的身體部位。
en:
  material: a diamond worth 300+ GP, which the spell consumes
  body: |-
    You touch a creature that has died within the last minute. That creature revives with 1 Hit Point. This spell can't revive a creature that has died of old age, nor does it restore any missing body parts.
