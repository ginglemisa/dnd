# yaml-language-server: $schema=../../schema/spell.schema.json
id: water-breathing
name: 水下呼吸
nameEn: Water Breathing
source: srd
level: 3
school: transmutation
classes: [ druid, sorcerer, wizard ]
castingTime: [ action ]
ritual: true
range: { feet: 30 }
components: [ V, S, M ]
duration: { hours: 24 }
site:
  material: 一截短蘆葦
  body: |-
    - 射程內至多十個你選擇的自願生物獲得在水下呼吸的能力，直到法術結束
    - 受影響的生物也保留原本的呼吸方式
srd:
  material: 一根短蘆葦
  body: |-
    此法術使射程內最多十個由你選擇且自願的生物，在法術結束前能夠在水下呼吸。受影響的生物同時仍保有其正常的呼吸方式。
en:
  material: a short reed
  body: |-
    This spell grants up to ten willing creatures of your choice within range the ability to breathe underwater until the spell ends. Affected creatures also retain their normal mode of respiration.
