level: 4
school: illusion
classes: [ bard, sorcerer, wizard ]
castingTime: [ action ]
range: touch
components: [ V, S ]
duration: { minutes: 1 }
concentration: true
site:
  body: |-
    - 你觸碰的一個生物陷入隱形狀態，直到法術結束
