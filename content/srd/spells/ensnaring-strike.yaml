# yaml-language-server: $schema=../../schema/spell.schema.json
id: ensnaring-strike
name: 誘捕打擊
nameEn: Ensnaring Strike
source: srd
level: 1
school: conjuration
classes: [ ranger ]
castingTime: [ bonus-action ]
range: self
components: [ V ]
duration: { minutes: 1 }
concentration: true
upcast: true
site:
  trigger: 在你以武器命中一個生物後立即施放
  outcomes:
    - { kind: damage, formula: 1d6, upcastDice: 1d6, damageType: piercing, autoOnCast: false, context: 目標後續回合開始時 }
  body: |-
    - 命中時，攫取的藤蔓出現在目標身上，目標須進行力量豁免；大型或更大的生物在此豁免具有優勢
    - 豁免失敗時，目標陷入束縛狀態，直到法術結束；豁免成功時，藤蔓枯萎消失，法術結束
    - 處於束縛狀態期間，目標在它每個回合開始時受到1d6穿刺傷害
    - 目標或觸及範圍內能碰到它的生物，可以用一個動作進行力量（運動）檢定對抗你的法術豁免DC；成功時法術結束
    - 使用更高環階法術位：每比1環高一環，傷害增加1d6
srd:
  trigger: 你在以武器命中生物後立即採取
  body: |-
    當你命中目標時，抓握的藤蔓出現在它身上，它進行一次力量豁免。大型或更大的生物在此豁免上具有優勢。豁免失敗時，目標陷入束縛狀態，直到法術結束。豁免成功時，藤蔓枯萎消失，法術結束。

    處於束縛狀態時，目標在其每個回合開始時受到1d6穿刺傷害。目標或位於其觸及範圍內的生物可以採取一個動作，對抗你的法術豁免DC進行一次力量（運動）檢定。成功時，法術結束。

    _使用更高環階法術位。_ 每比1環高一環，傷害增加1d6。
en:
  trigger: which you take immediately after hitting a creature with a weapon
  body: |-
    As you hit the target, grasping vines appear on it, and it makes a Strength saving throw. A Large or larger creature has Advantage on this save. On a failed save, the target has the Restrained condition until the spell ends. On a successful save, the vines shrivel away, and the spell ends.

    While Restrained, the target takes 1d6 Piercing damage at the start of each of its turns. The target or a creature within reach of it can take an action to make a Strength (Athletics) check against your spell save DC. On a success, the spell ends.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d6 for each spell slot level above 1.
