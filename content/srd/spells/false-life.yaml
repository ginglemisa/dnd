# yaml-language-server: $schema=../../schema/spell.schema.json
id: false-life
name: 虛假生命
nameEn: False Life
source: srd
level: 1
school: necromancy
classes: [ sorcerer, wizard ]
castingTime: [ action ]
range: self
components: [ V, S, M ]
duration: instantaneous
upcast: true
site:
  material: 一滴酒精
  outcomes:
    - { kind: temporary-hp, formula: 2d4+4, maximizedFixed: 12, upcastFixed: 5, autoOnCast: true, context: 自動套用臨時生命值，與既有值取較高者，不相加 }
  body: |-
    - 你獲得2d4+4臨時生命值
    - 使用更高環階法術位：每比1環高一環，額外獲得5臨時生命值
srd:
  material: 一滴酒精
  body: |-
    你獲得2d4 + 4臨時生命值。

    _使用更高環階法術位。_ 每比1環高一環，你額外獲得5點臨時生命值。
en:
  material: a drop of alcohol
  body: |-
    You gain 2d4 + 4 Temporary Hit Points.

    _Using a Higher-Level Spell Slot._ You gain 5 additional Temporary Hit Points for each spell slot level above 1.
