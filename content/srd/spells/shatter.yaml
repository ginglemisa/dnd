# yaml-language-server: $schema=../../schema/spell.schema.json
id: shatter
name: 粉碎音波
nameEn: Shatter
source: srd
level: 2
school: evocation
classes: [ bard, sorcerer, wizard ]
castingTime: [ action ]
range: { feet: 60 }
components: [ V, S, M ]
duration: instantaneous
upcast: true
site:
  material: 一片雲母
  outcomes:
    - { kind: damage, formula: 3d8, upcastDice: 1d8, damageType: thunder, autoOnCast: true, context: 區域傷害擲一次；豁免依規則處理 }
  body: |-
    - 射程內你選擇的一點爆發巨響；以該點為中心、半徑10呎的球形區域內，每個生物須進行體質豁免，失敗時受到3d8雷鳴傷害，成功時傷害減半
    - 構裝生物在此豁免具有劣勢
    - 位於法術區域內、未被穿戴或攜帶的非魔法物體也會受到此傷害
    - 使用更高環階法術位：每比2環高一環，傷害增加1d8
srd:
  material: 一小片雲母
  body: |-
    一聲巨響從射程內你選擇的一點爆發。以該點為中心、半徑10呎球形區域內的每個生物各自進行一次體質豁免，豁免失敗時受到3d8雷鳴傷害，豁免成功時只受到一半傷害。構裝生物在此豁免上具有劣勢。

    若法術區域內有未被穿戴或攜帶的非魔法物體，它也會受到該傷害。

    _使用更高環階法術位。_ 法術位環階每比2環高一環，傷害增加1d8。
en:
  material: a chip of mica
  body: |-
    A loud noise erupts from a point of your choice within range. Each creature in a 10-foot-radius Sphere centered there makes a Constitution saving throw, taking 3d8 Thunder damage on a failed save or half as much damage on a successful one. A Construct has Disadvantage on the save.

    A nonmagical object that isn't being worn or carried also takes the damage if it's in the spell's area.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d8 for each spell slot level above 2.
