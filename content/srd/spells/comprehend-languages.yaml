# yaml-language-server: $schema=../../schema/spell.schema.json
id: comprehend-languages
name: 通曉語言
nameEn: Comprehend Languages
source: srd
level: 1
school: divination
classes: [ bard, sorcerer, warlock, wizard ]
castingTime: [ action ]
ritual: true
range: self
components: [ V, S, M ]
duration: { hours: 1 }
site:
  material: 一撮煤灰和鹽
  body: |-
    - 持續時間內，你能理解所聽到或看到以手語表達的任何語言的字面意思
    - 你也能理解看到的任何書面語言，但必須觸碰寫有文字的表面；閱讀一頁文字約需1分鐘
    - 此法術無法解讀符號或秘密訊息
srd:
  material: 一撮煤灰和鹽
  body: |-
    在持續時間內，你理解你所聽到或看到以手語表達的任何語言的字面意思。你也理解你所看到的任何書面語言，但你必須接觸書寫文字的表面。閱讀一頁文字大約需要1分鐘。此法術無法破解符號或密文。
en:
  material: a pinch of soot and salt
  body: |-
    For the duration, you understand the literal meaning of any language that you hear or see signed. You also understand any written language that you see, but you must be touching the surface on which the words are written. It takes about 1 minute to read one page of text. This spell doesn't decode symbols or secret messages.
