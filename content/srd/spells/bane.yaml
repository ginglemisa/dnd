# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: bane
source: srd
level: 1
school: enchantment
classes: [ bard, cleric, warlock ]
ritual: false
concentration: true
castingTime:
  - { unit: action }
range: { type: distance, amount: 30, unit: feet }
components: { v: true, s: true, m: true }
duration: { type: time, amount: 1, unit: minute, upTo: true }
en:
  name: Bane
  material: a drop of blood
  body: |-
    Up to three creatures of your choice that you can see within range must each make a Charisma saving throw. Whenever a target that fails this save makes an attack roll or a saving throw before the spell ends, the target must subtract 1d4 from the attack roll or save.

    _Using a Higher-Level Spell Slot._ You can target one additional creature for each spell slot level above 1.
zh:
  name: 災禍術
  material: 一滴血
  body: |-
    你選擇射程內最多三個你看得見的生物，各自必須進行魅力豁免。在法術結束前，每當豁免失敗的目標進行攻擊檢定或豁免時，該目標必須從該攻擊檢定或豁免中減去1d4。

    _使用更高環階法術位。_ 每比1環高一環，你可以多以一個生物為目標。
