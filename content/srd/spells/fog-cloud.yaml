# yaml-language-server: $schema=../../schema/spell.schema.json
id: fog-cloud
name: 雲霧術
nameEn: Fog Cloud
source: srd
level: 1
school: conjuration
classes: [ druid, ranger, sorcerer, wizard ]
castingTime: [ action ]
range: { feet: 120 }
components: [ V, S ]
duration: { hours: 1 }
concentration: true
upcast: true
site:
  body: |-
    - 在射程內一點為中心，創造半徑20呎的球形霧氣；該區域為重度遮蔽
    - 霧氣持續到法術結束，或直到強風（例如造風術造成的風）將其吹散
    - 使用更高環階法術位：每比1環高一環，霧氣半徑增加20呎
srd:
  body: |-
    你以射程內一點為中心，創造一個半徑20呎的霧氣球形區域。該球形區域為重度遮蔽。它會持續到持續時間結束，或直到強風（例如由_造風術_所產生的風）將其吹散。

    _使用更高環階法術位。_ 法術位環階每比1環高一環，霧氣的半徑增加20呎。
en:
  body: |-
    You create a 20-foot-radius Sphere of fog centered on a point within range. The Sphere is Heavily Obscured. It lasts for the duration or until a strong wind (such as one created by _Gust of Wind_) disperses it.

    _Using a Higher-Level Spell Slot._ The fog's radius increases by 20 feet for each spell slot level above 1.
