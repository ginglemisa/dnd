# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: feather-fall
source: srd
level: 1
school: transmutation
classes: [ bard, sorcerer, wizard ]
ritual: false
concentration: false
castingTime:
  - unit: reaction
    note:
      en: which you take when you or a creature you can see within 60 feet of you falls
      zh: 當你或你60呎內你能看見的生物墜落時
range: { type: distance, amount: 60, unit: feet }
components: { v: true, s: false, m: true }
duration: { type: time, amount: 1, unit: minute }
en:
  name: Feather Fall
  material: a small feather or piece of down
  body: Choose up to five falling creatures within range. A falling creature's rate of descent slows to 60 feet per round until the spell ends. If a creature lands before the spell ends, the creature takes no damage from the fall, and the spell ends for that creature.
zh:
  name: 羽落術
  material: 一根小羽毛或一小塊絨羽
  body: 在射程內選擇最多五個正在墜落的生物。在法術結束前，墜落生物的下降速度減緩為每輪60呎。若生物在法術結束前著地，該生物不會因墜落受到傷害，且法術對該生物結束。
