# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: sanctuary
source: srd
level: 1
school: abjuration
classes: [ cleric ]
ritual: false
concentration: false
castingTime:
  - { unit: bonus-action }
range: { type: distance, amount: 30, unit: feet }
components: { v: true, s: true, m: true }
duration: { type: time, amount: 1, unit: minute }
en:
  name: Sanctuary
  material: a shard of glass from a mirror
  body: You ward a creature within range. Until the spell ends, any creature who targets the warded creature with an attack roll or a damaging spell must succeed on a Wisdom saving throw or either choose a new target or lose the attack or spell. This spell doesn't protect the warded creature from areas of effect. The spell ends if the warded creature makes an attack roll, casts a spell, or deals damage.
zh:
  name: 庇護術
  material: 一片鏡子的玻璃碎片
  body: 你庇護射程內的一個生物。在法術結束前，任何以攻擊檢定或造成傷害的法術指定受庇護生物為目標的生物，必須通過一次感知豁免，否則必須選擇新目標，或失去該次攻擊或法術。此法術無法保護受庇護生物免受範圍效果影響。若受庇護生物進行攻擊檢定、施放法術或造成傷害，法術即結束。
