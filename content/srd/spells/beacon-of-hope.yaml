# yaml-language-server: $schema=../../schema/spell.schema.json
id: beacon-of-hope
name: 希望信標
nameEn: Beacon of Hope
source: srd
level: 3
school: abjuration
classes: [ cleric ]
castingTime: [ action ]
range: { feet: 30 }
components: [ V, S ]
duration: { minutes: 1 }
concentration: true
site:
  body: |-
    - 選擇射程內任意數量的生物
    - 持續時間內，每個目標進行感知豁免與死亡豁免具有優勢，且從任何治療中恢復可能的最大生命值
srd:
  body: |-
    選擇射程內任意數量的生物。在持續時間內，每個目標在感知豁免與死亡豁免上具有優勢，且從任何治療中恢復可能的最大生命值。
en:
  body: |-
    Choose any number of creatures within range. For the duration, each target has Advantage on Wisdom saving throws and Death Saving Throws and regains the maximum number of Hit Points possible from any healing.
