# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: gentle-repose
source: srd
level: 2
school: necromancy
classes: [ cleric, paladin, wizard ]
ritual: true
concentration: false
castingTime:
  - { unit: action }
  - { unit: ritual }
range: { type: touch }
components: { v: true, s: true, m: true }
duration: { type: time, amount: 10, unit: day }
en:
  name: Gentle Repose
  material: 2 Copper Pieces, which the spell consumes
  body: |-
    You touch a corpse or other remains. For the duration, the target is protected from decay and can't become Undead.

    The spell also effectively extends the time limit on raising the target from the dead, since days spent under the influence of this spell don't count against the time limit of spells such as _Raise Dead_.
zh:
  name: 遺體防腐
  material: 2 CP，法術會消耗之
  body: |-
    你接觸一具屍體或其他遺骸。在持續時間內，目標不會腐敗，也不會變成不死生物。

    此法術也實際上延長了讓目標死而復生的時限，因為處於此法術影響下度過的日子，不會計入_死者復活_等法術的時限。
