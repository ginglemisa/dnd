# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: protection-from-evil-and-good
source: srd
level: 1
school: abjuration
classes: [ cleric, druid, paladin, warlock, wizard ]
ritual: false
concentration: true
castingTime:
  - { unit: action }
range: { type: touch }
components: { v: true, s: true, m: true }
duration: { type: time, amount: 10, unit: minute, upTo: true }
en:
  name: Protection from Evil and Good
  material: a flask of Holy Water worth 25+ GP, which the spell consumes
  body: |-
    Until the spell ends, one willing creature you touch is protected against creatures that are Aberrations, Celestials, Elementals, Fey, Fiends, or Undead.

    The protection grants several benefits. Creatures of those types have Disadvantage on attack rolls against the target. The target also can't be possessed by or gain the Charmed or Frightened conditions from them. If the target is already possessed, Charmed, or Frightened by such a creature, the target has Advantage on any new saving throw against the relevant effect.
zh:
  name: 防護善惡
  material: 一瓶價值25+ GP的聖水，法術會將其消耗
  body: |-
    在法術結束前，你觸碰的一隻自願生物受到保護，不受異怪、天界生物、元素生物、精類、邪魔或不死生物的侵擾。

    此保護提供數種益處。這些類型的生物對目標進行攻擊檢定時具有劣勢。目標也不會被它們附身，也不會因它們而陷入魅惑或恐慌狀態。若目標已被這類生物附身，或已因其陷入魅惑或恐慌狀態，則目標對抗相關效應的任何新的豁免都具有優勢。
