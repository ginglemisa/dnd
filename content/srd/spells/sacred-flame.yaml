id: sacred-flame
name: 聖火術
nameEn: Sacred Flame
source: srd
level: 0
school: evocation
classes: [ cleric ]
castingTime: [ action ]
range: { feet: 60 }
components: [ V, S ]
duration: instantaneous
site:
  outcomes:
    - { kind: damage, formula: 1d8, cantripAt5: 2d8, damageType: radiant, autoOnCast: true, context: 豁免依規則處理 }
  body: |-
    - 如火焰般的光輝降臨在射程內一個你能看見的生物身上
    - 目標須進行敏捷豁免；失敗時受到1d8光耀傷害
    - 目標在此豁免中無法從半身掩護或四分之三掩護獲益
    - 戲法升級：5級時傷害提升為2d8
srd:
  body: |-
    如火焰般的光輝降臨在射程內一個你能看見的生物身上。目標必須通過敏捷豁免，否則受到1d8光耀傷害。目標在此次豁免中無法從半掩蔽或四分之三掩蔽獲得任何益處。

    _戲法升級。_ 當你達到5級（2d8）、11級（3d8）與17級（4d8）時，傷害增加1d8。
en:
  body: |-
    Flame-like radiance descends on a creature that you can see within range. The target must succeed on a Dexterity saving throw or take 1d8 Radiant damage. The target gains no benefit from Half Cover or Three-Quarters Cover for this save.

    _Cantrip Upgrade._ The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).
