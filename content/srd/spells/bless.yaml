# yaml-language-server: $schema=../../schema/spell.schema.json
id: bless
name: 祝福術
nameEn: Bless
source: srd
level: 1
school: enchantment
classes: [ cleric, paladin ]
castingTime: [ action ]
range: { feet: 30 }
components: [ V, S, M ]
duration: { minutes: 1 }
concentration: true
upcast: true
site:
  material: 一個價值至少5 GP的聖徽
  body: |-
    - 祝福射程內至多三個生物
    - 法術結束前，目標每次進行攻擊檢定或豁免時，在該檢定結果加上1d4
    - 使用更高環階法術位：每比1環高一環，可額外以一個生物為目標
srd:
  material: 一個價值至少5 GP的聖徽
  body: |-
    你祝福射程內最多三個生物。在法術結束前，每當目標進行攻擊檢定或豁免時，該目標會在該攻擊檢定或豁免上加上1d4。

    _使用更高環階法術位。_ 每比1環高一環，你可以多以一個生物為目標。
en:
  material: a Holy Symbol worth 5+ GP
  body: |-
    You bless up to three creatures within range. Whenever a target makes an attack roll or a saving throw before the spell ends, the target adds 1d4 to the attack roll or save.

    _Using a Higher-Level Spell Slot._ You can target one additional creature for each spell slot level above 1.
