# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: reincarnate
source: srd
level: 5
school: necromancy
classes: [ druid ]
ritual: false
concentration: false
castingTime:
  - { unit: hour, amount: 1 }
range: { type: touch }
components: { v: true, s: true, m: true }
duration: { type: instantaneous }
en:
  name: Reincarnate
  material: rare oils worth 1,000+ GP, which the spell consumes
  body: |-
    You touch a dead Humanoid or a piece of one. If the creature has been dead no longer than 10 days, the spell forms a new body for it and calls the soul to enter that body. Roll 1d10 and consult the table below to determine the body's species, or the GM chooses another playable species.

    | 1d10 | Species | 1d10 | Species |
    | --- | --- | --- | --- |
    | 1 | Roll again. | 6 | Goliath |
    | 2 | Dragonborn | 7 | Halfling |
    | 3 | Dwarf | 8 | Human |
    | 4 | Elf | 9 | Orc |
    | 5 | Gnome | 10 | Tiefling |

    The reincarnated creature makes any choices that a species' description offers, and the creature recalls its former life. It retains the capabilities it had in its original form, except it loses the traits of its previous species and gains the traits of its new one.
zh:
  name: 轉生術
  material: 價值1,000+ GP的稀有油膏，法術會將其消耗
  body: |-
    你觸碰一具已死亡的人型生物或其一部分。如果該生物死亡不超過10天，法術會為它形成一具新的身體，並召喚其靈魂進入該身體。擲1d10並查閱下表來決定身體的種族，或由DM選擇另一個可供玩家使用的種族。

    | 1d10 | 種族 | 1d10 | 種族 |
    | --- | --- | --- | --- |
    | 1 | 重擲。 | 6 | 哥利亞人 |
    | 2 | 龍裔 | 7 | 半身人 |
    | 3 | 矮人 | 8 | 人類 |
    | 4 | 精靈 | 9 | 獸人 |
    | 5 | 侏儒 | 10 | 提夫林 |

    轉生的生物會做出種族描述所提供的任何選擇，並且記得其前世。它保留其原本形態所具有的能力，但會失去先前種族的特性，並獲得新種族的特性。
