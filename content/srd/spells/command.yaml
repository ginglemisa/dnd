# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: command
source: srd
level: 1
school: enchantment
classes: [ bard, cleric, paladin ]
ritual: false
concentration: false
castingTime:
  - { unit: action }
range: { type: distance, amount: 60, unit: feet }
components: { v: true, s: false, m: false }
duration: { type: instantaneous }
en:
  name: Command
  body: |-
    You speak a one-word command to a creature you can see within range. The target must succeed on a Wisdom saving throw or follow the command on its next turn. Choose the command from these options:

    **Approach.** The target moves toward you by the shortest and most direct route, ending its turn if it moves within 5 feet of you.

    **Drop.** The target drops whatever it is holding and then ends its turn.

    **Flee.** The target spends its turn moving away from you by the fastest available means.

    **Grovel.** The target has the Prone condition and then ends its turn.

    **Halt.** On its turn, the target doesn't move and takes no action or Bonus Action.

    _Using a Higher-Level Spell Slot._ You can affect one additional creature for each spell slot level above 1.
zh:
  name: 命令術
  body: |-
    你對射程內一個你看得見的生物下達一個單字命令。目標必須成功通過感知豁免，否則在它的下個回合服從該命令。從以下選項中選擇命令：

    **接近。** 目標以最短且最直接的路線朝你移動，若它移動到你5呎內，則結束它的回合。

    **丟下。** 目標丟下它手上拿著的任何東西，然後結束它的回合。

    **逃離。** 目標在它的回合中以最快的可用方式遠離你。

    **匍匐。** 目標陷入倒地狀態，然後結束它的回合。

    **停止。** 在它的回合中，目標不移動，也不採取動作或附贈動作。

    _使用更高環階法術位。_ 每比1環高一環，你可以多影響一個生物。
