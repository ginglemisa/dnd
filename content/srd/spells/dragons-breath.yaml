# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: dragons-breath
source: srd
level: 2
school: transmutation
classes: [ sorcerer, wizard ]
ritual: false
concentration: true
castingTime:
  - { unit: bonus-action }
range: { type: touch }
components: { v: true, s: true, m: true }
duration: { type: time, amount: 1, unit: minute, upTo: true }
en:
  name: Dragon's Breath
  material: a hot pepper
  body: |-
    You touch one willing creature, and choose Acid, Cold, Fire, Lightning, or Poison. Until the spell ends, the target can take a Magic action to exhale a 15-foot Cone. Each creature in that area makes a Dexterity saving throw, taking 3d6 damage of the chosen type on a failed save or half as much damage on a successful one.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d6 for each spell slot level above 2.
zh:
  name: 龍息術
  material: 一根辣椒
  body: |-
    你接觸一名自願生物，並選擇強酸、冷凍、火焰、閃電或毒素。在法術結束前，目標可以採取魔法動作吐出15呎錐形區域的吐息。該區域內的每個生物各進行一次敏捷豁免，豁免失敗時受到3d6所選類型的傷害，豁免成功時傷害減半。

    _使用更高環階法術位。_ 法術位環階每比2環高一環，傷害增加1d6。
