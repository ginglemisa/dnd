# yaml-language-server: $schema=../../schema/spell.schema.json
id: spare-the-dying
name: 維生術
nameEn: Spare the Dying
source: srd
level: 0
school: necromancy
classes: [ cleric, druid ]
castingTime: [ action ]
range: { feet: 15 }
components: [ V, S ]
duration: instantaneous
site:
  body: |-
    - 選擇射程內一個生命值為0且尚未死亡的生物，該生物變為傷勢穩定
    - 戲法升級：5級時射程提升為30呎
srd:
  body: |-
    選擇射程內一個生命值為0且尚未死亡的生物。該生物陷入穩定狀態。

    _戲法升級。_ 當你達到5級（30呎）、11級（60呎）與17級（120呎）時，射程加倍。
en:
  body: |-
    Choose a creature within range that has 0 Hit Points and isn't dead. The creature becomes Stable.

    _Cantrip Upgrade._ The range doubles when you reach levels 5 (30 feet), 11 (60 feet), and 17 (120 feet).
