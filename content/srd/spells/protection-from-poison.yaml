# yaml-language-server: $schema=../../schema/spell.schema.json
id: protection-from-poison
name: 防護毒素
nameEn: Protection from Poison
source: srd
level: 2
school: abjuration
classes: [ cleric, druid, paladin, ranger ]
castingTime: [ action ]
range: touch
components: [ V, S ]
duration: { hours: 1 }
site:
  body: |-
    - 觸碰一個生物，結束它身上的中毒狀態
    - 持續時間內，目標為避免或結束中毒狀態而進行的豁免具有優勢，並具有毒素傷害抗性
srd:
  body: |-
    你碰觸一個生物，並結束其身上的中毒狀態。在持續時間內，目標在為避免或結束中毒狀態而進行的豁免上具有優勢，並且對毒素傷害具有抗性。
en:
  body: |-
    You touch a creature and end the Poisoned condition on it. For the duration, the target has Advantage on saving throws to avoid or end the Poisoned condition, and it has Resistance to Poison damage.
