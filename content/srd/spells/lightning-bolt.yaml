# yaml-language-server: $schema=../../schema/spell.schema.json
id: lightning-bolt
name: 閃電束
nameEn: Lightning Bolt
source: srd
level: 3
school: evocation
classes: [ sorcerer, wizard ]
castingTime: [ action ]
range: self
components: [ V, S, M ]
duration: instantaneous
upcast: true
site:
  material: 一點毛皮和一根水晶棒
  outcomes:
    - { kind: damage, formula: 8d6, upcastDice: 1d6, damageType: lightning, autoOnCast: true, context: 區域傷害擲一次；豁免依規則處理 }
  body: |-
    - 一道閃電形成長100呎、寬5呎的直線區域，從你身上朝你選擇的方向射出
    - 直線區域內每個生物須進行敏捷豁免；失敗時受到8d6閃電傷害，成功時傷害減半
    - 使用更高環階法術位：每比3環高一環，傷害增加1d6
srd:
  material: 一點毛皮與一根水晶棒
  body: |-
    一道長100呎、寬5呎的直線閃電，從你身上朝你選擇的方向轟出。直線內的每個生物都要進行一次敏捷豁免，豁免失敗時承受8d6閃電傷害，豁免成功則承受一半傷害。

    _使用更高環階法術位。_ 每高於3環的法術位環階，傷害增加1d6。
en:
  material: a bit of fur and a crystal rod
  body: |-
    A stroke of lightning forming a 100-foot-long, 5-foot-wide Line blasts out from you in a direction you choose. Each creature in the Line makes a Dexterity saving throw, taking 8d6 Lightning damage on a failed save or half as much damage on a successful one.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d6 for each spell slot level above 3.
