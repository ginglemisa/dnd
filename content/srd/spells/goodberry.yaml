# yaml-language-server: $schema=../../schema/spell.schema.json
id: goodberry
name: 神莓術
nameEn: Goodberry
source: srd
level: 1
school: conjuration
classes: [ druid, ranger ]
castingTime: [ action ]
range: self
components: [ V, S, M ]
duration: { hours: 24 }
site:
  material: 一枝槲寄生
  outcomes:
    - { kind: healing, fixed: 1, autoOnCast: false, context: 之後吃下一顆漿果時；不在初次施法擲骰 }
  body: |-
    - 十顆漿果出現在你手中，並在持續時間內注入魔法
    - 生物可以用附贈動作吃下一顆漿果；吃下一顆漿果恢復1點生命值，並提供維持一個生物一天所需的營養
    - 法術結束時，未被吃掉的漿果消失
srd:
  material: 一小枝槲寄生
  body: |-
    十顆莓果出現在你手中，並在持續時間內被注入魔法。生物可以用附贈動作吃下一顆莓果。吃下一顆莓果恢復1點生命值，且莓果提供的養分足以讓生物維持一天。

    未被吃掉的莓果會在法術結束時消失。
en:
  material: a sprig of mistletoe
  body: |-
    Ten berries appear in your hand and are infused with magic for the duration. A creature can take a Bonus Action to eat one berry. Eating a berry restores 1 Hit Point, and the berry provides enough nourishment to sustain a creature for one day.

    Uneaten berries disappear when the spell ends.
