# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: enthrall
source: srd
level: 2
school: enchantment
classes: [ bard, warlock ]
ritual: false
concentration: true
castingTime:
  - { unit: action }
range: { type: distance, amount: 60, unit: feet }
components: { v: true, s: true, m: false }
duration: { type: time, amount: 1, unit: minute, upTo: true }
en:
  name: Enthrall
  body: You weave a distracting string of words, causing creatures of your choice that you can see within range to make a Wisdom saving throw. Any creature you or your companions are fighting automatically succeeds on this save. On a failed save, a target has a −10 penalty to Wisdom (Perception) checks and Passive Perception until the spell ends.
zh:
  name: 注目術
  body: 你編織出一串令人分心的言語，使你在射程內看得見、由你選擇的生物各進行一次感知豁免。你或你的同伴正在與之戰鬥的任何生物，自動成功通過此豁免。豁免失敗時，目標在感知（察覺）檢定與被動察覺上具有−10的減值，直到法術結束。
