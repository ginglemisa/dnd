# yaml-language-server: $schema=../../schema/spell.schema.json
id: spiritual-weapon
name: 靈體武器
nameEn: Spiritual Weapon
source: srd
level: 2
school: evocation
classes: [ cleric ]
castingTime: [ bonus-action ]
range: { feet: 60 }
components: [ V, S ]
duration: { minutes: 1 }
concentration: true
upcast: true
site:
  outcomes:
    - { kind: damage, attack: spell, formula: 1d8, abilityModifier: spellcasting, upcastDice: 1d8, damageType: force, autoOnCast: true, context: 施法時可發動的攻擊命中傷害 }
  body: |-
    - 創造一個外形類似你選擇之武器的漂浮幽靈力場，持續到法術結束
    - 力場出現在射程內你選擇的空間，你可以立即對力場5呎內的一個生物進行一次近戰法術攻擊；命中時，目標受到1d8加上你施法屬性調整值的力場傷害
    - 在你之後的回合，可以用附贈動作將力場移動至多20呎，並對其5呎內的一個生物重複此攻擊
    - 使用更高環階法術位：每比2環高一環，傷害增加1d8
srd:
  body: |-
    你創造出一個漂浮的幽靈般力場，外形類似你所選擇的一種武器，並在持續時間內存在。該力場出現在射程內你所選擇的一個空間中，你可以立即對力場5呎內的一名生物進行一次近戰法術攻擊。若命中，目標受到等同於1d8加上你的施法屬性調整值的力場傷害。

    在你之後的回合中，你可以用附贈動作使該力場移動最多20呎，並對其5呎內的一名生物重複進行攻擊。

    _使用更高環階法術位。_ 法術位環階每比2環高一環，傷害增加1d8。
en:
  body: |-
    You create a floating, spectral force that resembles a weapon of your choice and lasts for the duration. The force appears within range in a space of your choice, and you can immediately make one melee spell attack against one creature within 5 feet of the force. On a hit, the target takes Force damage equal to 1d8 plus your spellcasting ability modifier.

    As a Bonus Action on your later turns, you can move the force up to 20 feet and repeat the attack against a creature within 5 feet of it.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d8 for every slot level above 2.
