# yaml-language-server: $schema=../../schema/spell.schema.json
id: grease
name: 油膩術
nameEn: Grease
source: srd
level: 1
school: conjuration
classes: [ sorcerer, wizard ]
castingTime: [ action ]
range: { feet: 60 }
components: [ V, S, M ]
duration: { minutes: 1 }
site:
  material: 一點豬皮或奶油
  body: |-
    - 不可燃的油脂覆蓋以射程內一點為中心、10呎見方區域的地面，使其在持續時間內成為困難地形
    - 油脂出現時，站在區域內的每個生物須進行敏捷豁免；失敗時陷入倒地狀態
    - 進入該區域或在其中結束回合的生物，也須進行同一豁免；失敗時陷入倒地狀態
srd:
  material: 一小塊豬皮或奶油
  body: |-
    不可燃的油脂覆蓋射程內一點為中心的10呎見方地面，並在持續時間內使其成為困難地形。

    當油脂出現時，站在其區域內的每個生物都必須成功通過敏捷豁免，否則陷入倒地狀態。進入該區域或在該區域內結束回合的生物，也必須成功通過該豁免，否則倒地。
en:
  material: a bit of pork rind or butter
  body: |-
    Nonflammable grease covers the ground in a 10-foot square centered on a point within range and turns it into Difficult Terrain for the duration.

    When the grease appears, each creature standing in its area must succeed on a Dexterity saving throw or have the Prone condition. A creature that enters the area or ends its turn there must also succeed on that save or fall Prone.
