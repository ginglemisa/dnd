# yaml-language-server: $schema=../../schema/spell.schema.json
id: nondetection
name: 迴避偵測
nameEn: Nondetection
source: srd
level: 3
school: abjuration
classes: [ bard, wizard ]
castingTime: [ action ]
range: touch
components: [ V, S, M ]
duration: { hours: 8 }
site:
  material: 一撮價值至少25 GP的鑽石粉末（施法時消耗）
  body: |-
    - 持續時間內，你觸碰的目標不受預言法術探知；目標可以是一個自願的生物，或任一方向尺寸不超過10呎的地點或物體
    - 目標無法成為任何預言法術的目標，也無法透過魔法探查感應器被察覺
srd:
  material: 一撮價值25 GP以上的鑽石粉末，法術會將其消耗
  body: |-
    在持續時間內，你使你觸碰的一個目標隱藏於預言系法術之外。目標可以是一個自願的生物，也可以是任一維度都不超過10呎的地點或物體。目標不能被任何預言系法術指定為目標，也不能被魔法占卜感應器察覺。
en:
  material: a pinch of diamond dust worth 25+ GP, which the spell consumes
  body: |-
    For the duration, you hide a target that you touch from Divination spells. The target can be a willing creature, or it can be a place or an object no larger than 10 feet in any dimension. The target can't be targeted by any Divination spell or perceived through magical scrying sensors.
