# yaml-language-server: $schema=../../schema/spell.schema.json
id: shield-of-faith
name: 虔誠護盾
nameEn: Shield of Faith
source: srd
level: 1
school: abjuration
classes: [ cleric, paladin ]
castingTime: [ bonus-action ]
range: { feet: 60 }
components: [ V, S, M ]
duration: { minutes: 10 }
concentration: true
site:
  material: 一卷祈禱卷軸
  body: |-
    - 一道閃爍的力場環繞射程內一個你選擇的生物，使它在持續時間內AC獲得+2加值
srd:
  material: 一卷祈禱經文
  body: |-
    一道閃爍的力場環繞著射程內你選擇的一個生物，在持續時間內使其AC獲得+2加值。
en:
  material: a prayer scroll
  body: |-
    A shimmering field surrounds a creature of your choice within range, granting it a +2 bonus to AC for the duration.
