# yaml-language-server: $schema=../../schema/spell.schema.json
id: entangle
name: 糾纏術
nameEn: Entangle
source: srd
level: 1
school: conjuration
classes: [ druid, ranger ]
castingTime: [ action ]
range: { feet: 90 }
components: [ V, S ]
duration: { minutes: 1 }
concentration: true
site:
  body: |-
    - 射程內一個20呎見方的區域長出攫取植物；持續時間內，這些植物使該區域地面成為困難地形，並在法術結束時消失
    - 施法時位於區域內的每個生物（你除外）須進行力量豁免；失敗時陷入束縛狀態，直到法術結束
    - 被束縛的生物可以用一個動作進行力量（運動）檢定對抗你的法術豁免DC；成功時掙脫植物，不再因其處於束縛狀態
srd:
  body: |-
    抓握的植物從射程內一個20呎見方的地面上長出。在持續時間內，這些植物使該區域的地面成為困難地形。法術結束時它們消失。

    你施放法術時，位於該區域內的每個生物（你除外）必須通過一次力量豁免，否則陷入束縛狀態，直到法術結束。處於束縛狀態的生物可以採取一個動作，對抗你的法術豁免DC進行一次力量（運動）檢定。成功時，它掙脫抓握的植物，不再受它們束縛。
en:
  body: |-
    Grasping plants sprout from the ground in a 20-foot square within range. For the duration, these plants turn the ground in the area into Difficult Terrain. They disappear when the spell ends.

    Each creature (other than you) in the area when you cast the spell must succeed on a Strength saving throw or have the Restrained condition until the spell ends. A Restrained creature can take an action to make a Strength (Athletics) check against your spell save DC. On a success, it frees itself from the grasping plants and is no longer Restrained by them.
