# yaml-language-server: $schema=../../schema/spell.schema.json
id: prayer-of-healing
name: 治療禱言
nameEn: Prayer of Healing
source: srd
level: 2
school: abjuration
classes: [ cleric, paladin ]
castingTime: [ { minutes: 10 } ]
range: { feet: 30 }
components: [ V ]
duration: instantaneous
upcast: true
site:
  outcomes:
    - { kind: healing, formula: 2d8, upcastDice: 1d8, modifierTags: [ restores-hit-points, can-restore-other-creature-hit-points ], autoOnCast: true, context: 每名目標的治療量擲一次；不直接修改角色 HP }
  body: |-
    - 至多五個你選擇、且在整個施法期間都待在射程內的生物，獲得短休的益處，並恢復2d8生命值
    - 生物完成長休前，無法再次受此法術影響
    - 使用更高環階法術位：每比2環高一環，治療量增加1d8
srd:
  body: |-
    在整個施法期間都停留在射程內、由你選擇的至多五個生物，獲得短休的益處，並且恢復2d8生命值。生物在完成一次長休之前，無法再次受到此法術影響。

    _使用更高環階法術位。_ 法術位環階每比2環高一環，治療量增加1d8。
en:
  body: |-
    Up to five creatures of your choice who remain within range for the spell's entire casting gain the benefits of a Short Rest and also regain 2d8 Hit Points. A creature can't be affected by this spell again until that creature finishes a Long Rest.

    _Using a Higher-Level Spell Slot._ The healing increases by 1d8 for each spell slot level above 2.
