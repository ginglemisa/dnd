spellId: power-word-kill
source: srd
level: 9
school: enchantment
classes: [ bard, sorcerer, warlock, wizard ]
ritual: false
concentration: false
castingTime:
  - { unit: action }
range: { type: distance, amount: 60, unit: feet }
components: { v: true, s: false, m: false }
