# yaml-language-server: $schema=../../schema/spell.schema.json
id: secret-chest
name: 祕藏箱
nameEn: Secret Chest
source: srd
level: 4
school: conjuration
classes: [ wizard ]
castingTime: [ action ]
range: touch
components: [ V, S, M ]
duration: until-dispelled
site:
  material: 一個3呎×2呎×2呎、以價值至少5,000 GP的珍稀材料製成的箱子，以及一個以相同材料製成、價值至少50 GP的微型箱子複製品
  body: |-
    - 將一個箱子及其所有內容物藏到以太位面；你必須觸碰作為此法術材料成分的箱子與微型複製品
    - 箱子至多可容納12立方呎（3呎×2呎×2呎）的非活體物質
    - 箱子位於以太位面時，你可以用魔法動作觸碰複製品召回箱子，箱子出現在你5呎內地面上一個未被佔據的空間
    - 你可以用魔法動作觸碰箱子與複製品，將箱子送回以太位面
    - 60天後，每天結束時有累積5%的機率使法術結束
    - 你再次施放此法術，或微型複製箱被摧毀時，法術也會結束；若法術結束時大箱子在以太位面，它會留在那裡，等待你或其他人找到
srd:
  material: 一個以價值5,000+ GP的稀有材料製成、尺寸為3呎乘2呎乘2呎的箱子，以及一個以相同材料製成、價值50+ GP的微型箱子複製品
  body: |-
    你將一個箱子及其所有內容物藏到以太位面。你必須接觸作為此法術材料成分的箱子與迷你複製品。箱子最多可容納12立方呎的非生物材料（3呎乘2呎乘2呎）。

    當箱子在以太位面時，你可以進行一個魔法動作並接觸複製品，將箱子召回。箱子會出現在你身周5呎內地面上一個未被佔據的空間。你也可以進行一個魔法動作，接觸箱子與複製品，把箱子送回以太位面。

    60天之後，每天結束時有累計5%的機率使法術結束。如果你再次施放此法術，或微型複製箱被摧毀，法術也會結束。如果法術結束時較大的箱子仍在以太位面，箱子會留在那裡，等待你或其他人去發現。
en:
  material: a chest, 3 feet by 2 feet by 2 feet, constructed from rare materials worth 5,000+ GP, and a Tiny replica of the chest made from the same materials worth 50+ GP
  body: |-
    You hide a chest and all its contents on the Ethereal Plane. You must touch the chest and the miniature replica that serve as Material components for the spell. The chest can contain up to 12 cubic feet of nonliving material (3 feet by 2 feet by 2 feet).

    While the chest remains on the Ethereal Plane, you can take a Magic action and touch the replica to recall the chest. It appears in an unoccupied space on the ground within 5 feet of you. You can send the chest back to the Ethereal Plane by taking a Magic action to touch the chest and the replica.

    After 60 days, there is a cumulative 5 percent chance at the end of each day that the spell ends. The spell also ends if you cast this spell again or if the Tiny replica chest is destroyed. If the spell ends and the larger chest is on the Ethereal Plane, the chest remains there for you or someone else to find.
