# yaml-language-server: $schema=../../schema/spell.schema.json
id: shocking-grasp
name: 電爪
nameEn: Shocking Grasp
source: srd
level: 0
school: evocation
classes: [ sorcerer, wizard ]
castingTime: [ action ]
range: touch
components: [ V, S ]
duration: instantaneous
site:
  outcomes:
    - { kind: damage, attack: spell, formula: 1d8, cantripAt5: 2d8, damageType: lightning, autoOnCast: true, context: 命中時傷害 }
  body: |-
    - 對你試圖觸碰的一個生物進行一次近戰法術攻擊
    - 命中時，目標受到1d8閃電傷害，且在它下個回合開始前無法進行藉機攻擊
    - 戲法升級：5級時傷害提升為2d8
srd:
  body: |-
    閃電從你身上竄向你嘗試觸碰的一個生物。對目標進行一次近戰法術攻擊。命中時，目標受到1d8閃電傷害，且在其下個回合開始前不能進行藉機攻擊。

    _戲法升級。_ 當你達到5級（2d8）、11級（3d8）與17級（4d8）時，傷害增加1d8。
en:
  body: |-
    Lightning springs from you to a creature that you try to touch. Make a melee spell attack against the target. On a hit, the target takes 1d8 Lightning damage, and it can't make Opportunity Attacks until the start of its next turn.

    _Cantrip Upgrade._ The damage increases by 1d8 when you reach levels 5 (2d8), 11 (3d8), and 17 (4d8).
