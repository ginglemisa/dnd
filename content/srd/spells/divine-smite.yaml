# yaml-language-server: $schema=../../schema/spell.schema.json
id: divine-smite
name: 至聖斬
nameEn: Divine Smite
source: srd
level: 1
school: evocation
classes: [ paladin ]
castingTime: [ bonus-action ]
range: self
components: [ V ]
duration: instantaneous
upcast: true
site:
  trigger: 在你以近戰武器或徒手打擊命中目標後立即施放
  outcomes:
    - { kind: damage, formula: 2d8, upcastDice: 1d8, damageType: radiant, autoOnCast: true, context: 觸發本法術的命中額外傷害；特定目標額外 1d8 依術文手動處理 }
  body: |-
    - 目標從該次攻擊額外受到2d8光耀傷害
    - 若目標是邪魔或不死生物，傷害再增加1d8
    - 使用更高環階法術位：每比1環高一環，傷害增加1d8
srd:
  trigger: 你在以近戰武器或徒手打擊命中目標後立即採取
  body: |-
    目標因該次攻擊額外受到2d8光耀傷害。若目標是邪魔或不死生物，傷害再增加1d8。

    _使用更高環階法術位。_ 每比1環高一環，傷害增加1d8。
en:
  trigger: which you take immediately after hitting a target with a Melee weapon or an Unarmed Strike
  body: |-
    The target takes an extra 2d8 Radiant damage from the attack. The damage increases by 1d8 if the target is a Fiend or an Undead.

    _Using a Higher-Level Spell Slot._ The damage increases by 1d8 for each spell slot level above 1.
