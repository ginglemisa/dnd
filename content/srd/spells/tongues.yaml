# yaml-language-server: $schema=../../schema/spell.schema.json
spellId: tongues
source: srd
level: 3
school: divination
classes: [ bard, cleric, sorcerer, warlock, wizard ]
ritual: false
concentration: false
castingTime:
  - { unit: action }
range: { type: touch }
components: { v: true, s: false, m: true }
duration: { type: time, amount: 1, unit: hour }
en:
  name: Tongues
  material: a miniature ziggurat
  body: This spell grants the creature you touch the ability to understand any spoken or signed language that it hears or sees. Moreover, when the target communicates by speaking or signing, any creature that knows at least one language can understand it if that creature can hear the speech or see the signing.
zh:
  name: 巧言術
  material: 一座迷你的階梯式金字塔
  body: 此法術使你觸碰的生物能夠理解它所聽見或看見的任何口語或手語。此外，當目標以口說或手語溝通時，任何至少懂得一種語言的生物，只要能聽見其話語或看見其手語，就能理解它。
