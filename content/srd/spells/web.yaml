# yaml-language-server: $schema=../../schema/spell.schema.json
id: web
name: 蛛網術
nameEn: Web
source: srd
level: 2
school: conjuration
classes: [ sorcerer, wizard ]
castingTime: [ action ]
range: { feet: 60 }
components: [ V, S, M ]
duration: { hours: 1 }
concentration: true
site:
  material: 一點蜘蛛網
  outcomes:
    - { kind: damage, formula: 2d4, damageType: fire, autoOnCast: false, context: 之後在燃燒蛛網中開始回合時 }
  body: |-
    - 在射程內一點召喚一團黏稠蛛網，在持續時間內填滿邊長20呎的立方體
    - 蛛網為困難地形，蛛網內的區域為輕度遮蔽
    - 若蛛網沒有固定在兩個堅固物體之間（例如牆壁或樹木），也沒有鋪在地板、牆壁或天花板上，蛛網會塌陷，法術在你下個回合開始時結束；鋪在平面上的蛛網厚度為5呎
    - 生物在一個回合中首次進入蛛網或在其中開始回合時，須進行敏捷豁免；失敗時在蛛網中陷入束縛狀態，直到它離開蛛網或掙脫
    - 被蛛網束縛的生物可以用一個動作進行力量（運動）檢定對抗你的法術豁免DC；成功時不再被束縛
    - 蛛網可燃：任何邊長5呎的立方體蛛網接觸火焰後會在1輪內燒盡，在火中開始回合的生物受到2d4火焰傷害
srd:
  material: 一小團蜘蛛網
  body: |-
    你在射程內的一點召喚出一團黏稠的蛛網。在持續時間內，蛛網填滿該處一個20呎立方體。蛛網屬於困難地形，且其中的區域為輕度遮蔽。

    若蛛網沒有固定在兩個堅固物體之間（例如牆壁或樹木），也沒有鋪覆在地板、牆壁或天花板上，蛛網就會自行塌陷，法術在你的下個回合開始時結束。鋪覆在平坦表面上的蛛網深度為5呎。

    當生物在一個回合中首次進入蛛網，或在蛛網中開始其回合時，必須成功通過一次敏捷豁免，否則在身處蛛網中或掙脫之前陷入束縛狀態。

    被蛛網束縛的生物可以用一個動作進行一次力量（運動）檢定，對抗你的法術豁免DC。若成功，它就不再受到束縛。

    蛛網是易燃的。任何暴露於火焰的5呎立方體蛛網會在1輪內燒盡，並對在火焰中開始其回合的任何生物造成2d4火焰傷害。
en:
  material: a bit of spiderweb
  body: |-
    You conjure a mass of sticky webbing at a point within range. The webs fill a 20-foot Cube there for the duration. The webs are Difficult Terrain, and the area within them is Lightly Obscured.

    If the webs aren't anchored between two solid masses (such as walls or trees) or layered across a floor, wall, or ceiling, the web collapses on itself, and the spell ends at the start of your next turn. Webs layered over a flat surface have a depth of 5 feet.

    The first time a creature enters the webs on a turn or starts its turn there, it must succeed on a Dexterity saving throw or have the Restrained condition while in the webs or until it breaks free.

    A creature Restrained by the webs can take an action to make a Strength (Athletics) check against your spell save DC. If it succeeds, it is no longer Restrained.

    The webs are flammable. Any 5-foot Cube of webs exposed to fire burns away in 1 round, dealing 2d4 Fire damage to any creature that starts its turn in the fire.
