description: |
  你不太習慣依靠別人。獨自生活久了，受傷生病得自行處理，草藥與醫術也就逐漸無師自通。你可能有自己的信仰，也可能只是花了很多時間思考生死、處世之類的哲學。你不太在意別人怎麼過日子，也很習慣照自己的方式做事。
